<script>
const D={"name": "頑張っているのに評価されない人が見落としている1点", "file": "011_頑張っているのに評価されない人が見落としている1点", "dur": 960.3833125, "segs": [], "subs": [{"t": 0.0, "x": "水曜の夕方、評価面談の案内が届きます。"}, {"t": 3.7333333333333334, "x": "届いた案内を見て、この一年を思い返します。"}, {"t": 7.366666666666666, "x": "思い返せば、忙しくない月はありませんでした。"}, {"t": 10.8, "x": "ありませんでしたが、書く欄は数行しかありません。"}, {"t": 14.35, "x": "数行に収めようとすると、そこで手が止まります。"}, {"t": 17.866666666666667, "x": "止まるのは、書くことが無いからではありません。"}, {"t": 20.816666666666666, "x": "ありすぎて、どれも小さく見えてしまうからです。"}, {"t": 24.216666666666665, "x": "見えてしまう小ささは、外にはもっと伝わりません。"}, {"t": 27.75, "x": "伝わらないまま面談の日が来て、評価が渡されます。"}, {"t": 31.5, "x": "渡された数字が、思っていたより低いことがあります。"}, {"t": 35.1, "x": "低いと感じた側は、見てもらえていないと考えます。"}, {"t": 38.733333333333334, "x": "考える一方で、評価する側にも言い分があります。"}, {"t": 42.6, "x": "その人が何をしたのかを、思い出せないでいます。"}, {"t": 45.93333333333333, "x": "思い出せないのは、関心が無いからとは限りません。"}, {"t": 49.45, "x": "限られた記憶には、結果の方が残りやすいだけです。"}, {"t": 53.233333333333334, "x": "残らなかった手間は、無かったものとして\n扱われます。"}, {"t": 56.766666666666666, "x": "扱われた側は、努力を否定された気持ちになります。"}, {"t": 60.45, "x": "その気持ちのまま、次の一年も同じ働き方を続けます。"}, {"t": 64.68333333333334, "x": "続けた先で、また似た数字が返ってきます。"}, {"t": 67.86666666666666, "x": "今日は、この繰り返しがどこで生まれるのかを見ます。"}, {"t": 71.28333333333333, "x": "見てしまえば、直すのは働き方ではないと\n分かります。"}, {"t": 75.03333333333333, "x": "変えるのは、働いた跡をどこに残すかだけです。"}, {"t": 78.28333333333333, "x": "まず、働いた量がどこに残るのかを見ます。"}, {"t": 81.56666666666666, "x": "残る場所は、たいてい本人の中だけです。"}, {"t": 84.71666666666667, "x": "朝いちばんに片づけた差し戻しがあります。"}, {"t": 87.48333333333333, "x": "差し戻しを直した三十分を、誰も見ていません。"}, {"t": 91.38333333333334, "x": "見ていない時間は、翌日には本人も忘れます。"}, {"t": 95.01666666666667, "x": "忘れた分は、記録のどこにも出てきません。"}, {"t": 98.05, "x": "出てこないものを、評価する側は数えられません。"}, {"t": 101.5, "x": "数えられないので、印象は結果の方から作られます。"}, {"t": 105.31666666666666, "x": "作られた印象は、あとから覆しにくい\n場合があります。"}, {"t": 109.38333333333334, "x": "一方で、働いた側の実感は量で積み上がっています。"}, {"t": 113.4, "x": "積み上がった実感と、外から見える量は別物です。"}, {"t": 117.2, "x": "別物なので、二つの評価はそろわないことがあります。"}, {"t": 120.98333333333333, "x": "そろわない状態を、不公平だと感じることがあります。"}, {"t": 124.73333333333333, "x": "感じるのは自然ですが、そこで\n止まると何も動きません。"}, {"t": 128.63333333333333, "x": "動かないまま一年が過ぎ、また同じ面談が来ます。"}, {"t": 132.28333333333333, "x": "来た時に出せるのは、覚えている分だけです。"}, {"t": 135.33333333333334, "x": "覚えている分は、一年のうちのごく一部です。"}, {"t": 138.76666666666668, "x": "一部しか出せなければ、評価も\n一部に対して付きます。"}, {"t": 142.56666666666666, "x": "だから最初に要るのは、量を\n増やす工夫ではありません。"}, {"t": 146.28333333333333, "x": "二つ目は、評価する側が読んでいるものです。"}, {"t": 149.5, "x": "読んでいるのは、結果につながった道すじです。"}, {"t": 152.7, "x": "売上が伸びた時、何がその前に起きていたか。"}, {"t": 156.2, "x": "納期が守られた時、誰がどこを押さえていたか。"}, {"t": 159.9, "x": "止まらなかった時、どこで手が入っていたか。"}, {"t": 163.0, "x": "そういう線がつながると、評価の欄が埋まります。"}, {"t": 166.45, "x": "埋まらないのは、線の途中が見えていない時です。"}, {"t": 169.76666666666668, "x": "見えていない途中には、たいてい誰かの\n手間があります。"}, {"t": 173.28333333333333, "x": "手間があっても、出さなければ線は切れたままです。"}, {"t": 176.71666666666667, "x": "切れた線の先にある結果は、別の人の欄に載ります。"}, {"t": 180.51666666666668, "x": "載せた側に、横取りをしたつもりはありません。"}, {"t": 183.7, "x": "つもりが無くても、記録に残った方が採用されます。"}, {"t": 187.43333333333334, "x": "採用されるのは、正しさよりも残っている方です。"}, {"t": 191.06666666666666, "x": "残す作業は、手柄を主張することとは違います。"}, {"t": 194.68333333333334, "x": "違うのは、主語が自分ではなく仕事になる点です。"}, {"t": 198.3, "x": "仕事の側から書けば、誰の役に\n立ったかが線になります。"}, {"t": 202.43333333333334, "x": "線になった仕事は、次の判断の\n材料として使われます。"}, {"t": 206.51666666666668, "x": "使われた分だけ、その人の名前は残っていきます。"}, {"t": 210.28333333333333, "x": "残った名前が、次の機会を連れてくることがあります。"}, {"t": 214.0, "x": "三つ目は、まとめる時に起きることです。"}, {"t": 216.73333333333332, "x": "一年を一行にまとめると、中身はほとんど消えます。"}, {"t": 220.55, "x": "消えるのは、細かい仕事からになりやすいです。"}, {"t": 223.76666666666668, "x": "順番に消えて、最後は大きな案件だけが残ります。"}, {"t": 227.65, "x": "残った案件は、たいてい一人の手柄ではありません。"}, {"t": 231.35, "x": "ありませんが、書ける欄は一つしかありません。"}, {"t": 234.51666666666668, "x": "一つの欄に入れるために、多くが切り捨てられます。"}, {"t": 237.91666666666666, "x": "切り捨てた側も、惜しいとは思っています。"}, {"t": 240.88333333333333, "x": "思っていても、書き方が分からないままです。"}, {"t": 243.95, "x": "分からないので、頑張りましたという言葉で\n埋めます。"}, {"t": 247.3, "x": "埋めた言葉は、読む側には何も渡しません。"}, {"t": 250.51666666666668, "x": "渡らない言葉を並べても、評価は動きにくいです。"}, {"t": 254.06666666666666, "x": "動かすには、一行に入れる中身を選び直します。"}, {"t": 257.6666666666667, "x": "選ぶ基準は、量よりも変わったことの方です。"}, {"t": 260.96666666666664, "x": "何が前と変わったのかは、短く書けます。"}, {"t": 264.05, "x": "書けた変化は、読む側の頭に絵として残ります。"}, {"t": 267.6666666666667, "x": "残る絵があると、面談の話はそこから始まります。"}, {"t": 271.45, "x": "始まってしまえば、細かい仕事も後から足せます。"}, {"t": 275.01666666666665, "x": "足せる場を作れるかどうかが、最初の分かれ目です。"}, {"t": 278.46666666666664, "x": "四つ目は、いちばん言いにくい部分です。"}, {"t": 281.4166666666667, "x": "言いにくいのは、誰の何が楽になったかです。"}, {"t": 284.6166666666667, "x": "自分の仕事が、他人の時間をどれだけ削ったか。"}, {"t": 288.1666666666667, "x": "削った時間は、削られた側にしか見えません。"}, {"t": 291.53333333333336, "x": "見えている側は、わざわざ口に出しません。"}, {"t": 294.53333333333336, "x": "出さないまま、その手間は当たり前になります。"}, {"t": 297.6333333333333, "x": "当たり前になったものは、評価の対象から外れます。"}, {"t": 301.26666666666665, "x": "外れた後に同じ仕事を続けても、数字は動きません。"}, {"t": 305.23333333333335, "x": "動かない理由を、力不足だと\n考えてしまう場合があります。"}, {"t": 309.48333333333335, "x": "考える前に、確かめられることが一つあります。"}, {"t": 312.95, "x": "助かったと言ってくれた人がいたかどうかです。"}, {"t": 315.6333333333333, "x": "いたのなら、その一言は記録として使えます。"}, {"t": 318.81666666666666, "x": "使える一言は、自分で書いた\n説明より強く働くことがあります。"}, {"t": 323.48333333333335, "x": "働くのは、外から出た言葉だからです。"}, {"t": 326.4, "x": "言葉をもらう機会は、日常の中に何度もあります。"}, {"t": 330.03333333333336, "x": "あるのに、その場で流してしまうことが多いです。"}, {"t": 333.3, "x": "流さずに一行だけ残す習慣が、一年後に効きます。"}, {"t": 337.51666666666665, "x": "効いてくるのは、面談の準備をする日です。"}, {"t": 340.55, "x": "その日に、思い出す作業がほとんど要らなくなります。"}, {"t": 344.0833333333333, "x": "五つ目は、その一行の中身です。"}, {"t": 346.73333333333335, "x": "中身は、助けた相手が言ったそのままで構いません。"}, {"t": 350.26666666666665, "x": "資料の作り直しが減って助かった、という一言。"}, {"t": 354.03333333333336, "x": "問い合わせの対応が早くて助かった、という一言。"}, {"t": 357.8333333333333, "x": "先に気づいたので止まらずに済んだ、という一言。"}, {"t": 361.3, "x": "そういう言葉は、本人の感想よりも具体的です。"}, {"t": 365.01666666666665, "x": "具体的なものは、読む側が場面を\n思い浮かべられます。"}, {"t": 368.8333333333333, "x": "思い浮かべられた場面は、評価の\n根拠になりやすいです。"}, {"t": 372.73333333333335, "x": "なりやすい理由は、確かめられる\n相手がいるからです。"}, {"t": 376.26666666666665, "x": "いる相手の名前まで残っていれば、なお強くなります。"}, {"t": 379.9, "x": "強い記録は、自分を大きく見せる\n道具ではありません。"}, {"t": 383.73333333333335, "x": "起きたことを、そのまま置いておくだけのものです。"}, {"t": 386.8, "x": "置いておくだけなので、書く側の負担も軽いです。"}, {"t": 390.1333333333333, "x": "軽い作業でも、一年分たまれば厚みが出ます。"}, {"t": 393.68333333333334, "x": "出た厚みは、面談の三十分では読み切れません。"}, {"t": 397.4, "x": "読み切れない量があること自体が、材料になります。"}, {"t": 400.95, "x": "材料が多い人は、話の焦点を選べる側に回ります。"}, {"t": 405.2, "x": "選べる側と思い出す側では、話の密度が違います。"}, {"t": 409.15, "x": "違う密度のまま、同じ時間を使うことになります。"}, {"t": 412.78333333333336, "x": "六つ目は、見えにくい仕事の性質です。"}, {"t": 415.8, "x": "性質として、うまくいっている間は姿が見えません。"}, {"t": 419.65, "x": "締切の前に、確認を回している人がいます。"}, {"t": 423.18333333333334, "x": "回しているので、抜けが先に見つかります。"}, {"t": 426.1166666666667, "x": "見つかった抜けは、事故になる前に消えます。"}, {"t": 429.1, "x": "消えた事故は、誰の記憶にも残りません。"}, {"t": 432.18333333333334, "x": "残らないので、その人の仕事も数えられません。"}, {"t": 435.53333333333336, "x": "在宅の日に済ませた確認なら、なおさら残りません。"}, {"t": 439.21666666666664, "x": "残らない仕事が続く間、職場は平穏に見えます。"}, {"t": 443.1333333333333, "x": "平穏が当たり前になると、人を減らす話が出ます。"}, {"t": 446.75, "x": "出た話の通りに減らすと、翌月から抜けが増えます。"}, {"t": 450.65, "x": "増えてはじめて、何をしていたかが見えてきます。"}, {"t": 453.95, "x": "見えた時には、その人はもういないことがあります。"}, {"t": 457.23333333333335, "x": "いない状態で分かる評価は、本人には届きません。"}, {"t": 460.9, "x": "届かないのは、仕組みとして惜しいところです。"}, {"t": 463.93333333333334, "x": "惜しいと言うだけでは、次の一年も同じです。"}, {"t": 467.23333333333335, "x": "同じにしないために、止めた数を書いておきます。"}, {"t": 470.45, "x": "止めたものは、起きなかった出来事です。"}, {"t": 473.18333333333334, "x": "起きなかったことも、数として残せます。"}, {"t": 475.98333333333335, "x": "七つ目は、思い出す作業の限界です。"}, {"t": 479.05, "x": "限界は、時間がたつほどはっきりしてきます。"}, {"t": 482.35, "x": "半年前の水曜に何をしていたかは、まず出ません。"}, {"t": 486.0833333333333, "x": "出てこないのは、記憶力の問題とは限りません。"}, {"t": 489.48333333333335, "x": "限らないのは、そもそも残す形が無かったからです。"}, {"t": 493.1, "x": "無かった形を、期末に作っても間に合いません。"}, {"t": 496.5, "x": "間に合わせようとして、大きな案件だけを並べます。"}, {"t": 500.15, "x": "並べた結果は、去年とよく似た紙になります。"}, {"t": 503.48333333333335, "x": "似た紙を毎年出すと、変化が無いように読まれます。"}, {"t": 507.0, "x": "読まれると、伸びが止まったと\n受け取られること function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

function mark(pane,i){
  const el=document.getElementById(pane);

  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');

}

  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

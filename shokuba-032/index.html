<script>
const D={"name": "年下の上司を持った部下から届いた5つの相談", "file": "032_年下の上司を持った部下から届いた5つの相談", "dur": 1026.4833125, "segs": [], "subs": [{"t": 0.0, "x": "年下の上司に、どこまで合わせればいいのか\n分かりません。"}, {"t": 3.8, "x": "春から、五つ年下の人が係の長になりました。"}, {"t": 7.366666666666666, "x": "仕事のできる人で、そこに不満はありません。"}, {"t": 10.616666666666667, "x": "気になっているのは、仕事を振られる時の口調です。"}, {"t": 14.0, "x": "通りがかりに、これ今日中に\n頼める、と軽く言われます。"}, {"t": 18.15, "x": "若手に頼む時と、まったく同じ言い方です。"}, {"t": 21.633333333333333, "x": "こちらはいつも敬語で返しています。"}, {"t": 23.95, "x": "その差を感じるたびに、年上として\n軽く見られている気がします。"}, {"t": 28.266666666666666, "x": "気にしすぎだとも思います。"}, {"t": 30.033333333333335, "x": "それでも、もやもやが消えません。"}, {"t": 32.516666666666666, "x": "ここまでが一通目の相談です。"}, {"t": 34.68333333333333, "x": "今日はこうした相談を五つ取り上げます。"}, {"t": 37.233333333333334, "x": "一通ずつ読み上げてから考えていきます。"}, {"t": 39.93333333333333, "x": "どの相談も少しずつ場面が違います。"}, {"t": 42.6, "x": "相談は架空のものです。"}, {"t": 44.38333333333333, "x": "よくある悩みを一つの文にまとめました。"}, {"t": 46.983333333333334, "x": "五通とも、年下の上司のもとで\n働く部下から届いています。"}, {"t": 51.266666666666666, "x": "以前、年上の部下に悩む上司の相談を\n取り上げました。"}, {"t": 55.56666666666667, "x": "今日はその反対の席に座っている人たちの話です。"}, {"t": 59.03333333333333, "x": "相談の場面は口調から始まります。"}, {"t": 61.516666666666666, "x": "客先での名刺、メールの直し、\n判断の行方と続きます。"}, {"t": 66.13333333333334, "x": "最後は職場の外で言われた一言です。"}, {"t": 68.78333333333333, "x": "どれも大きな事件ではありません。"}, {"t": 70.9, "x": "毎日の小さな場面です。"}, {"t": 72.83333333333333, "x": "五通の底には、同じ問いが一つ流れています。"}, {"t": 76.26666666666667, "x": "役の順は立てたい。"}, {"t": 77.66666666666667, "x": "けれど積んできた経験まで下に置きたくない。"}, {"t": 80.38333333333334, "x": "その二つをどこで分ければいいのか、という\n問いです。"}, {"t": 83.86666666666666, "x": "上司の側にも言いにくい事情があります。"}, {"t": 86.46666666666667, "x": "年上の部下に遠慮すると、周りから\n指示が弱く見えやすいのです。"}, {"t": 91.06666666666666, "x": "かといって強く出れば、経験を\n軽く見ていると取られます。"}, {"t": 94.88333333333334, "x": "上司もまた、線を探している側です。"}, {"t": 97.85, "x": "今日は正解を一つに決めることはしません。"}, {"t": 100.6, "x": "ありそうな答えを二つ外して、\n三つ目の考え方を探します。"}, {"t": 105.01666666666667, "x": "立てる所と、譲らない所。"}, {"t": 107.3, "x": "その線の引き方を見ていきます。"}, {"t": 109.4, "x": "評価の仕組みや役職の決まりの正しさには\n触れません。"}, {"t": 112.8, "x": "一通目の相談に戻ります。"}, {"t": 114.78333333333333, "x": "口調の差が、年の扱いの差に\n見えてしまうという悩みでした。"}, {"t": 118.95, "x": "ではこちらも\n口調を崩して合わせればいいのでしょうか。"}, {"t": 122.13333333333334, "x": "くだけた言葉どうしなら差は消えます。"}, {"t": 124.46666666666667, "x": "話しやすくなる場面もあるでしょう。"}, {"t": 126.68333333333334, "x": "ただ周りの目には別の形で映ることがあります。"}, {"t": 129.75, "x": "上司と部下のやり取りが、同僚どうしの\n会話に見えてくるのです。"}, {"t": 133.93333333333334, "x": "そう見えると、上司の指示が軽く届きやすくなります。"}, {"t": 137.58333333333334, "x": "年下の上司が一番気にしているのは、\nそこかもしれません。"}, {"t": 141.53333333333333, "x": "合わせるつもりが、相手の立場を削ってしまう形です。"}, {"t": 145.35, "x": "これは答えになりにくいです。"}, {"t": 147.21666666666667, "x": "では口調を改めてほしいと伝えるのはどうでしょうか。"}, {"t": 150.55, "x": "はっきり言えば伝わるのは確かです。"}, {"t": 152.85, "x": "けれど上司の口調は、だれに対しても同じでした。"}, {"t": 156.33333333333334, "x": "若手にも同じ言い方で頼んでいます。"}, {"t": 158.76666666666668, "x": "そこへ自分にだけ変えてほしいと\n頼むと、どう聞こえるでしょう。"}, {"t": 162.78333333333333, "x": "年上として特別に扱ってほしい、という\n願いに聞こえやすいのです。"}, {"t": 167.63333333333333, "x": "年の順を役の順より前に出す\n頼み方になってしまいます。"}, {"t": 171.35, "x": "これも遠回りです。"}, {"t": 172.75, "x": "頼みの中身より年の話が前に出てしまうからです。"}, {"t": 176.1, "x": "では三つ目です。"}, {"t": 177.4, "x": "口調はそのままにして、受け方の形を\n自分で整えます。"}, {"t": 181.5, "x": "軽く頼まれても、受ける時に\n二つだけ確かめ返します。"}, {"t": 185.38333333333333, "x": "いつまでに、どんな形で出せばいいか。"}, {"t": 188.13333333333333, "x": "その二つです。"}, {"t": 189.31666666666666, "x": "たとえば、夕方五時までに一覧の\n形で出します、と返します。"}, {"t": 194.3, "x": "振り方がくだけていても構いません。"}, {"t": 196.51666666666668, "x": "受け方がきちんとしていれば、\nやり取り全体が仕事の形に戻ります。"}, {"t": 201.13333333333333, "x": "周りから見ても、指示を受けた部下の姿に見えます。"}, {"t": 204.7, "x": "確かめ返すのは、ほんの数秒で済みます。"}, {"t": 207.75, "x": "期限と形が決まれば、仕事の重さもはっきりします。"}, {"t": 211.55, "x": "重さが見えれば、口調の軽さは\n気になりにくくなります。"}, {"t": 215.8, "x": "上司にとっても助かる返し方です。"}, {"t": 218.25, "x": "頼んだ中身が伝わったと、その場で分かるからです。"}, {"t": 221.71666666666667, "x": "ここが役の順を立てる所です。"}, {"t": 223.86666666666667, "x": "一方で、敬語を自分から崩す必要はありません。"}, {"t": 227.6, "x": "敬語は自分が積んできた働き方の一部です。"}, {"t": 230.68333333333334, "x": "それを守るのは、譲らなくていい所だと考えられます。"}, {"t": 234.46666666666667, "x": "上司の側から見た景色もあります。"}, {"t": 236.78333333333333, "x": "年下の上司は、くだけた口調を\nわざと選んでいることがあります。"}, {"t": 241.05, "x": "上から言っているように聞こえたくない、という\n気づかいです。"}, {"t": 244.8, "x": "年上の部下に緊張を見せたくない事情もあるでしょう。"}, {"t": 248.21666666666667, "x": "年上に指示を出すのは、上司にとっても\n慣れない仕事です。"}, {"t": 252.21666666666667, "x": "軽い言い方は照れ隠しのこともあります。"}, {"t": 254.65, "x": "つまり軽い口調は、軽く見ている印とは限りません。"}, {"t": 258.3833333333333, "x": "距離を縮めようとした跡である場合もあります。"}, {"t": 261.25, "x": "部下が気にしていたのは言葉の柔らかさでした。"}, {"t": 264.06666666666666, "x": "上司が気にしていたのは言葉の重さです。"}, {"t": 266.7, "x": "同じ一言を、別の物差しで測っていたことになります。"}, {"t": 270.51666666666665, "x": "振り方は相手のもの、受け方は自分のもの。"}, {"t": 273.68333333333334, "x": "そう分けておくと、口調の差は\n少し気になりにくくなります。"}, {"t": 277.53333333333336, "x": "二通目は客先での出来事です。"}, {"t": 279.78333333333336, "x": "相談の中身はこうです。"}, {"t": 281.6, "x": "先週は上司と二人で取引先を訪ねました。"}, {"t": 284.75, "x": "先方の担当者は、以前からよく知っている人です。"}, {"t": 288.48333333333335, "x": "顔を見たとたん、つい自分から\n名刺を出してしまいました。"}, {"t": 292.28333333333336, "x": "上司はその後ろで、少し間を\n置いてから名刺を出しました。"}, {"t": 296.43333333333334, "x": "帰り道の上司は、いつもより口数が\n少なかったように思います。"}, {"t": 300.96666666666664, "x": "次からどう振る舞えばいいのか分からなくなりました。"}, {"t": 303.93333333333334, "x": "ここまでが二通目です。"}, {"t": 305.5, "x": "では次からは一歩下がって\n黙っていればいいのでしょうか。"}, {"t": 308.9166666666667, "x": "後ろに控えていれば順番を間違えることはありません。"}, {"t": 312.31666666666666, "x": "けれど先方は、相談者の顔をよく知っています。"}, {"t": 315.85, "x": "その人が黙ったままだと、かえって場が\nぎこちなくなります。"}, {"t": 319.76666666666665, "x": "聞きたいことがあっても、先方は\nだれに聞けばいいか迷います。"}, {"t": 323.8, "x": "長く付き合ってきた経験も、\nその場では使われずに終わります。"}, {"t": 327.98333333333335, "x": "黙ることは、立てることと同じではなさそうです。"}, {"t": 331.3333333333333, "x": "これも答えになりにくいです。"}, {"t": 333.1666666666667, "x": "では逆に、先方との付き合いが\n長い方が前に出るのは自然でしょうか。"}, {"t": 338.03333333333336, "x": "これにも危うさがあります。"}, {"t": 339.75, "x": "先方は窓口の役をよく見ています。"}, {"t": 342.35, "x": "だれが決める人なのかを、名刺の順や\n座る位置から読み取ります。"}, {"t": 346.73333333333335, "x": "そこで部下が前に立ち続けるとどうなるでしょう。"}, {"t": 349.56666666666666, "x": "先方の質問が、上司を飛ばして\n届くようになりやすいのです。"}, {"t": 353.9166666666667, "x": "上司の立場が客先の前で揺らいでしまいます。"}, {"t": 356.95, "x": "帰った後の打ち合わせにも、その揺れは残ります。"}, {"t": 360.4166666666667, "x": "では三つ目です。"}, {"t": 361.71666666666664, "x": "客先では、入口の順番と中身の順番を\n分けて考えます。"}, {"t": 366.23333333333335, "x": "名刺を出す順、紹介の順、最初のあいさつ。"}, {"t": 370.15, "x": "ここは上司に先を渡します。"}, {"t": 372.21666666666664, "x": "入口は、先方が役の順を確かめる場所だからです。"}, {"t": 376.05, "x": "一方で、昔からの経緯や細かい\n事情の説明は自分が受け持ちます。"}, {"t": 381.01666666666665, "x": "中身の場面では、経験のある方が\n前に出た方が話は早く進みます。"}, {"t": 386.18333333333334, "x": "分け方は訪問の前に一言で決めておけます。"}, {"t": 389.2, "x": "行きの道で、最初の紹介はお願いします、と\n上司に伝えるのです。"}, {"t": 394.3, "x": "細かい経緯は振ってもらえれば\n話します、と添えます。"}, {"t": 398.1166666666667, "x": "これで二人の立ち位置が前もってそろいます。"}, {"t": 400.81666666666666, "x": "先方の前で迷う時間も減ります。"}, {"t": 403.26666666666665, "x": "上司が紹介を終えたら、そこからが自分の出番です。"}, {"t": 407.0, "x": "中身の話は遠慮せずに受け持って構いません。"}, {"t": 410.0833333333333, "x": "経験を使う場所は、入口の後ろに\nちゃんと残っています。"}, {"t": 414.18333333333334, "x": "先週の名刺については、短く一言で\n済ませるのがよさそうです。"}, {"t": 418.76666666666665, "x": "先日は先に出てしまいました、と伝えます。"}, {"t": 421.93333333333334, "x": "長い弁解は付けません。"}, {"t": 423.7, "x": "一言で済ませた方が上司も受け取りやすいはずです。"}, {"t": 427.01666666666665, "x": "上司の側にも言い出しにくい気持ちがあります。"}, {"t": 429.8333333333333, "x": "客先で年上の部下が前に出ると、\n先方の目がそちらへ向きます。"}, {"t": 434.3333333333333, "x": "そのたびに、自分がここにいる意味を\n考えてしまうことがあります。"}, {"t": 438.6166666666667, "x": "けれど下がってほしいとは、なかなか言えません。"}, {"t": 441.81666666666666, "x": "部下の顔の広さが仕事の役に\n立っているのも分かっているからです。"}, {"t": 445.76666666666665, "x": "帰り道の口数の少なさは、責める気持ちとは\n限りません。"}, {"t": 449.81666666666666, "x": "言い方を探していた沈黙だったのかもしれません。"}, {"t": 452.81666666666666, "x": "入口は上司に、中身は自分に。"}, {"t": 455.51666666666665, "x": "客先での線は、その二つの間に引けます。"}, {"t": 458.8333333333333, "x": "三通目はメールの相談です。"}, {"t": 461.0, "x": "取引先へ出すメールを、上司に\n確認してもらいました。"}, {"t": 464.85, "x": "戻ってきた下書きは、あちこち直されていました。"}, {"t": 468.21666666666664, "x": "件名の付け方、あいさつの長さ、\n結びの言葉まで変わっていました。"}, {"t": 473.1, "x": "この書き方で長く仕事をしてきました。"}, {"t": 475.51666666666665, "x": "それを年下の人に、一から直されたように\n感じました。"}, {"t": 479.4166666666667, "x": "直されたとおりに送りましたが、\n納得はしていません。"}, {"t": 483.21666666666664, "x": "ここまでが三通目です。"}, {"t": 484.8666666666667, "x": "ではこれまでの書き方を説明して\n押し返すのはどうでしょうか。"}, {"t": 488.6333333333333, "x": "経験があるのは確かです。"}, {"t": 490.5, "x": "理由も言えるでしょう。"}, {"t": 491.9, "x": "けれどメールの書き方は、部署で\nそろえたい所でもあります。"}, {"t": 495.8, "x": "先方から見れば、同じ会社から届く文面です。"}, {"t": 499.51666666666665, "x": "人によって形がばらばらだと、読む側が迷います。"}, {"t": 503.23333333333335, "x": "上司はその形をそろえる役目を負っています。"}, {"t": 506.25, "x": "そろえるのは上司の仕事の一つです。"}, {"t": 508.7, "x": "押し返すと、役目そのものに\n逆らう話に聞こえやすくなります。"}, {"t": 513.0833333333334, "x": "では何も言わずに全部直されたとおりにするのは\nどうでしょう。"}, {"t": 516.7666666666667, "x": "波風は立ちません。"}, {"t": 518.2666666666667, "x": "それでも直された文面を見る\nたびに、気持ちは少し沈みます。"}, {"t": 522.5333333333333, "x": "ただ、その中には長年の工夫も\n混ざっていたはずです。"}, {"t": 526.3, "x": "先方の担当者の癖に合わせた書き方。"}, {"t": 529.0666666666667, "x": "季節のあいさつの入れ方。"}, {"t": 530.7666666666667, "x": "そういう工夫まで黙って消えていきます。"}, {"t": 533.3166666666667, "x": "納得しないまま続ければ、小さな不満が積もります。"}, {"t": 537.15, "x": "積もった不満は、別の場面で\n顔を出しやすいものです。"}, {"t": 541.0, "x": "では三つ目です。"}, {"t": 542.3, "x": "直された所を二つに分けて聞いてみます。"}, {"t": 545.0166666666667, "x": "部署でそろえたい決まりなのか。"}, {"t": 546.8833333333333, "x": "それとも上司の好みなのか。"}, {"t": 548.75, "x": "聞き方は短くて構いません。"}, {"t": 550.8, "x": "責める調子にならないことだけ気をつけます。"}, {"t": 553.5, "x": "今後もこの形でそろえた方が\nいいですか、と一度だけ尋ねます。"}, {"t": 557.7833333333333, "x": "決まりだという答えなら、そこは従います。"}, {"t": 560.8166666666667, "x": "件名の形や宛先の並べ方は、\nたいていこちらに入ります。"}, {"t": 565.2333333333333, "x": "ここが役の順を立てる所です。"}, {"t": 567.4, "x": "好みに近い答えなら、自分の\n工夫を一度だけ説明します。"}, {"t": 571.7166666666667, "x": "この担当者にはあいさつを長めにすると\n返事が早いのです、と添えます。"}, {"t": 576.8, "x": "理由が分かれば、上司も残してよいと\n判断しやすくなります。"}, {"t": 581.0, "x": "ここは経験を譲らなくていい所です。"}, {"t": 583.5333333333333, "x": "全部を残してもらう必要はありません。"}, {"t": 586.0666666666667, "x": "一つか二つで十分です。"}, {"t": 587.95, "x": "残った工夫が、部署の書き方に加わることもあります。"}, {"t": 591.6333333333333, "x": "そうなれば経験は部署全体のものになります。"}, {"t": 594.6, "x": "上司の側から見ると、景色は少し違います。"}, {"t": 597.9833333333333, "x": "年上の部下のメールを直すのは、気の重い仕事です。"}, {"t": 601.6666666666666, "x": "それでも直したのは、先方に\n出る文面の責任が上司にあるからです。"}, {"t": 606.5333333333333, "x": "直さなければ、後で上に説明できない\n場面もあります。"}, {"t": 610.4666666666667, "x": "細かさは不信の印というより、\n責任の重さの印だった可能性があります。"}, {"t": 615.8166666666667, "x": "もう一つ、上司は部下の工夫を\n知らなかっただけかもしれません。"}, {"t": 620.0333333333333, "x": "知らない工夫は、ただの癖に見えてしまいます。"}, {"t": 623.3, "x": "直しを仕分けると、従う所と残す所が分かれます。"}, {"t": 627.25, "x": "一枚の下書きの上に、二つの持ち場が並ぶのです。"}, {"t": 630.9666666666667, "x": "四通目は案件の進め方をめぐる相談です。"}, {"t": 634.2, "x": "長く担当してきた案件があります。"}, {"t": 636.6, "x": "経緯は自分が一番よく知っています。"}, {"t": 639.15, "x": "先日はその案件の方針を決める場面がありました。"}, {"t": 642.7166666666667, "x": "前の日に自分の考えを上司に伝えておきました。"}, {"t": 646.0333333333333, "x": "翌朝の朝礼で、上司が方針を発表しました。"}, {"t": 649.8666666666667, "x": "中身は、自分が伝えた考えとほぼ同じでした。"}, {"t": 653.3833333333333, "x": "けれど決めたのは上司という形になっていました。"}, {"t": 656.25, "x": "詳しいのはこちらなのに、判断だけ\n持っていかれたように感じます。"}, {"t": 660.6, "x": "朝礼の後で席に戻っても、すっきりしませんでした。"}, {"t": 664.3166666666667, "x": "ここまでが四通目です。"}, {"t": 666.0, "x": "では判断も自分にさせてほしいと\n頼むのはどうでしょうか。"}, {"t": 669.65, "x": "詳しい人が決めた方が早い。"}, {"t": 671.75, "x": "そう考えるのは自然です。"}, {"t": 673.6833333333333, "x": "ただ、判断は役に付いている仕事です。"}, {"t": 676.7333333333333, "x": "決めた結果の責任を負うのも、その役です。"}, {"t": 679.95, "x": "判断を求めると、役の順そのものを\n入れ替える話になりやすいのです。"}, {"t": 684.8333333333334, "x": "上司にとっては、受けたくても\n受けられない頼みになります。"}, {"t": 688.6333333333333, "x": "では詳しいのだから自分の判断で\n先に進めておくのはどうでしょう。"}, {"t": 692.8666666666667, "x": "結果が良ければ、だれも困らないように見えます。"}, {"t": 696.2666666666667, "x": "けれど上司が知らないまま進むと、\n決めた人と責任を負う人がずれます。"}, {"t": 701.0166666666667, "x": "うまくいかなかった時、上司は経緯を説明できません。"}, {"t": 704.7666666666667, "x": "信頼はそこから一気に崩れやすいものです。"}, {"t": 707.75, "x": "これも答えにはなりにくいです。"}, {"t": 709.6833333333333, "x": "では三つ目です。"}, {"t": 710.9833333333333, "x": "決める前の材料づくりを、はっきり自分の\n持ち場にします。"}, {"t": 715.0333333333333, "x": "考えを一つだけ渡すのはやめて、\n選べる形に並べて渡します。"}, {"t": 719.75, "x": "たとえば案を二つか三つに分けます。"}, {"t": 722.15, "x": "それぞれに見込みと気をつける点を\n一行ずつ添えます。"}, {"t": 725.55, "x": "決めるのは上司です。"}, {"t": 726.9833333333333, "x": "そこは動かしません。"}, {"t": 728.4666666666667, "x": "けれど決める材料の形は、自分の経験で作れます。"}, {"t": 732.3833333333333, "x": "材料の質が上がるほど、判断の中身にも\n経験が入ります。"}, {"t": 736.7333333333333, "x": "上司も決めた理由を説明しやすくなります。"}, {"t": 739.5666666666667, "x": "説明しやすい材料は、次も頼まれやすくなります。"}, {"t": 743.2666666666667, "x": "頼まれるたびに、詳しい人という\n位置がはっきりしていきます。"}, {"t": 747.3166666666667, "x": "決まった後は、朝礼の場でも\n上司の判断として通します。"}, {"t": 751.45, "x": "人前で上司の決定を立てる。"}, {"t": 753.55, "x": "ここが立てる所です。"}, {"t": 755.0333333333333, "x": "材料の中身は自分の名前で出しておく。"}, {"t": 757.8, "x": "ここが譲らない所です。"}, {"t": 759.5333333333333, "x": "上司の側にも、判断を手放せない理由があります。"}, {"t": 763.25, "x": "詳しい部下に任せきりにすると、\n周りにはどう見えるでしょう。"}, {"t": 767.3666666666667, "x": "判断を部下に預けている上司と映りやすいのです。"}, {"t": 770.5666666666667, "x": "年上の部下が相手だと、その見え方は\nさらに強まります。"}, {"t": 774.5666666666667, "x": "判断を自分で持つのは、手柄を\n取るためとは限りません。"}, {"t": 778.5166666666667, "x": "責任を引き受ける姿を、周りに\n見せておく必要があるからです。"}, {"t": 783.35, "x": "部下の経験は材料に、上司の役目は決定に。"}, {"t": 787.0, "x": "二つの持ち場が分かれていれば、\n同じ案件を二人で支えられます。"}, {"t": 791.5166666666667, "x": "最後の相談は、職場の外で言われた一言です。"}, {"t": 795.1666666666666, "x": "先日は前の職場の仲間と久しぶりに会いました。"}, {"t": 798.5, "x": "近況を話すうちに、上司が年下だという\n話になりました。"}, {"t": 802.7333333333333, "x": "年下の下で働いているのか、と笑われました。"}, {"t": 806.1833333333333, "x": "その場は笑って流しました。"}, {"t": 808.0666666666667, "x": "相手に悪気はなかったと思います。"}, {"t": 810.3333333333334, "x": "けれど帰り道、その一言がずっと頭に残りました。"}, {"t": 814.2666666666667, "x": "自分の働き方が、外からは格下げのように\n見えるのかと考えてしまいます。"}, {"t": 819.45, "x": "ここまでが五通目です。"}, {"t": 821.05, "x": "では話に乗って上司のことを\n少し悪く言えば収まるのでしょうか。"}, {"t": 825.2166666666667, "x": "笑い話にしてしまえば場は軽くなります。"}, {"t": 827.8833333333333, "x": "自分を下げずに済む気もします。"}, {"t": 829.9666666666667, "x": "けれど口に出した言葉は、話した\n本人の中にも残ります。"}, {"t": 834.0666666666667, "x": "残った言葉は、翌朝の職場での\n受け止め方を少しずつ曇らせます。"}, {"t": 838.85, "x": "上司の何気ない一言まで、年下のくせにという\n耳で聞こえやすくなるのです。"}, {"t": 843.9166666666666, "x": "これは答えになりにくいです。"}, {"t": 845.7833333333333, "x": "では反対に、上司の良さを熱心に説明して\n言い返すのはどうでしょう。"}, {"t": 850.6833333333333, "x": "守りたい気持ちはまっすぐなものです。"}, {"t": 852.9833333333333, "x": "ただ、強く言い返すほど、気にしていることが\n相手に伝わります。"}, {"t": 857.4833333333333, "x": "相手はもう一度、同じ話題を\n持ち出すかもしれません。"}, {"t": 861.15, "x": "言い返しは、その場の物差しを\n年齢のままにしてしまいます。"}, {"t": 865.2, "x": "これも遠回りになりやすいです。"}, {"t": 867.2833333333333, "x": "では三つ目です。"}, {"t": 868.5833333333334, "x": "年の話を、仕事の話に置き換えて返します。"}, {"t": 872.3, "x": "今は何を任されているのか。"}, {"t": 874.2333333333333, "x": "どんな案件を動かしているのか。"}, {"t": 876.35, "x": "それを一言で話します。"}, {"t": 878.1333333333333, "x": "取引先の大きな案件を任されている。"}, {"t": 880.8333333333334, "x": "新しく来た人の教え役もしている。"}, {"t": 883.2333333333333, "x": "そんな短い話で足ります。"}, {"t": 885.2333333333333, "x": "上司の年齢には、触れても触れなくても構いません。"}, {"t": 888.8333333333334, "x": "話の中心が自分の持ち場に移るからです。"}, {"t": 891.9, "x": "物差しが年齢から仕事に変わると、\n格下げという見え方は成り立ちにくくなります。"}, {"t": 897.35, "x": "外の場で役の順を立てる必要はありません。"}, {"t": 900.25, "x": "けれど役の順を、笑いの種として\n差し出す必要もないのです。"}, {"t": 904.65, "x": "ここで譲らないのは、自分の仕事への誇りです。"}, {"t": 908.1333333333333, "x": "上司の側も、似た一言を受けていることがあります。"}, {"t": 911.6666666666666, "x": "年上の部下を持つのは、上司にとっても\n楽な立場ではありません。"}, {"t": 916.05, "x": "年上を使っているのか、と同じような\n集まりで言われるのです。"}, {"t": 920.1166666666667, "x": "年下の上司もまた、年齢の物差しで\n測られやすい立場にいます。"}, {"t": 924.7, "x": "二人とも、職場の外から同じ物差しを\n当てられているわけです。"}, {"t": 928.9, "x": "そう考えると、翌朝の上司の顔が\n少し違って見えるかもしれません。"}, {"t": 933.7333333333333, "x": "外で聞いた一言を職場に持ち込まない。"}, {"t": 936.3333333333334, "x": "その線は、自分の中に引いておけます。"}, {"t": 939.35, "x": "最後に、反対の立場から届いた一通を読みます。"}, {"t": 943.0666666666667, "x": "年上の部下を持つ、年下の上司からです。"}, {"t": 946.5666666666667, "x": "係に、自分より五つ以上年上の人がいます。"}, {"t": 950.25, "x": "経験はこちらよりずっと長い人です。"}, {"t": 952.8166666666667, "x": "頼みごとをする時は、なるべく軽い口調にしています。"}, {"t": 956.5166666666667, "x": "上から言っているように聞こえたくないからです。"}, {"t": 959.2166666666667, "x": "けれど返ってくる返事は、いつも丁寧な敬語です。"}, {"t": 962.8666666666667, "x": "その丁寧さが、礼なのか壁なのか分かりません。"}, {"t": 966.3, "x": "意見を聞くと、お任せしますと\n返ってくる日もあります。"}, {"t": 969.9666666666667, "x": "任されたのか、距離を置かれたのか。"}, {"t": 972.4833333333333, "x": "そこで迷ってしまいます。"}, {"t": 974.1666666666666, "x": "本当は経験の話を、もっと聞いてみたいのです。"}, {"t": 977.9666666666667, "x": "ただ聞き方を間違えると、\n試しているように取られそうで迷います。"}, {"t": 982.4, "x": "ここまでが逆側から届いた一通です。"}, {"t": 985.0666666666667, "x": "この一通には、今日は答えを出しません。"}, {"t": 988.05, "x": "今日の五通の横に、そっと並べておきます。"}, {"t": 991.25, "x": "並べるだけで見えてくるものがあります。"}, {"t": 993.5333333333333, "x": "並べてみると、一通目の相談と\n向かい合っているのが分かります。"}, {"t": 997.7666666666667, "x": "部下は、くだけた口調に軽さを感じていました。"}, {"t": 1001.0166666666667, "x": "上司は、丁寧な敬語に壁を感じていました。"}, {"t": 1004.5333333333333, "x": "どちらの言葉づかいも、相手を\n気づかって選ばれたものでした。"}, {"t": 1008.4666666666667, "x": "気づかいの形が違うと、こうして\n逆向きに届くことがあります。"}, {"t": 1012.6333333333333, "x": "立てる所と譲らない所は、片方だけで\n決まるものではないのかもしれません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

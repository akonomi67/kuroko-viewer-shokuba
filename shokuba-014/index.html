<script>
const D={"name": "仲が良すぎる上司と部下がある日崩れる理由", "file": "014_仲が良すぎる上司と部下がある日崩れる理由", "dur": 934.16665625, "segs": [], "subs": [{"t": 0.0, "x": "金曜の夜、部署の歓迎会が開かれています。"}, {"t": 3.4, "x": "開かれた席で、上司と部下が隣り合わせに座ります。"}, {"t": 7.2, "x": "座って話すうちに、話題は仕事から外れていきます。"}, {"t": 11.1, "x": "外れた先に出るのは、休みの日の過ごし方です。"}, {"t": 14.55, "x": "過ごし方が似ていると、距離は一気に縮みます。"}, {"t": 17.966666666666665, "x": "縮んだ距離のまま、二人は月曜を迎えます。"}, {"t": 21.333333333333332, "x": "迎えた朝から、呼び方が少しだけ変わります。"}, {"t": 24.683333333333334, "x": "変わった呼び方に、どちらも嫌な感じは持ちません。"}, {"t": 28.283333333333335, "x": "持たないまま、軽口のやり取りが増えていきます。"}, {"t": 31.65, "x": "増えた軽口の中に、仕事の指摘が混ざり始めます。"}, {"t": 35.43333333333333, "x": "混ざった指摘は、その場では笑って流されます。"}, {"t": 38.7, "x": "流されるので、言う側は伝わったと受け取ります。"}, {"t": 42.1, "x": "受け取ったまま、半年ほどが過ぎていきます。"}, {"t": 45.25, "x": "過ぎた先にあるのは、評価を決める季節です。"}, {"t": 48.53333333333333, "x": "季節が来ると、二人の間に別の役が顔を出します。"}, {"t": 52.333333333333336, "x": "出てきた役は、笑って流せる相手ではありません。"}, {"t": 55.766666666666666, "x": "ありませんが、それまでの話し方は戻せません。"}, {"t": 59.11666666666667, "x": "戻せないまま渡された一言で、関係が止まります。"}, {"t": 62.78333333333333, "x": "止まった後も、二人は何が起きたか分かりません。"}, {"t": 66.13333333333334, "x": "分からない理由は、仲の良さの中に隠れています。"}, {"t": 69.66666666666667, "x": "隠れているものを、今日は一つずつ外に出します。"}, {"t": 72.93333333333334, "x": "出してしまえば、崩れる場所は先に見つかります。"}, {"t": 76.25, "x": "まず、近い二人の間に何が乗っているかを見ます。"}, {"t": 80.0, "x": "乗っているのは、気の合う相手という関係です。"}, {"t": 83.16666666666667, "x": "関係の下には、仕事の上下がもう一枚あります。"}, {"t": 86.86666666666666, "x": "あるのに、話している間は上の一枚しか見えません。"}, {"t": 90.48333333333333, "x": "見えない一枚は、消えたわけではありません。"}, {"t": 93.6, "x": "消えていないので、必要になれば表へ出てきます。"}, {"t": 96.91666666666667, "x": "出てくるのは、評価や配置が動く時です。"}, {"t": 100.0, "x": "動く時の一枚は、それまでと違う顔をしています。"}, {"t": 103.63333333333334, "x": "顔が変わったように見えて、驚くのは受け取る側です。"}, {"t": 107.31666666666666, "x": "受け取る側は、友人の顔しか見ていませんでした。"}, {"t": 110.75, "x": "見ていないのは、隠されていたからではありません。"}, {"t": 113.9, "x": "けれども、隠れていたのと結果は同じになります。"}, {"t": 117.26666666666667, "x": "同じになるのは、切り替えの合図が無いからです。"}, {"t": 120.45, "x": "合図の無い関係を、二枚重ねと呼んでおきます。"}, {"t": 123.93333333333334, "x": "二枚重ねは、悪い状態を指す言葉ではありません。"}, {"t": 127.66666666666667, "x": "多くの職場で、ふつうに起きていることです。"}, {"t": 130.66666666666666, "x": "起きること自体より、扱い方の方が\n問題になりやすいです。"}, {"t": 134.83333333333334, "x": "扱い方を決めている二人は、あまり見かけません。"}, {"t": 138.25, "x": "決めていない理由は、次の話とつながっています。"}, {"t": 141.75, "x": "二つ目は、言える範囲がどう広がるかです。"}, {"t": 144.96666666666667, "x": "広がり方は、たいていゆっくりしています。"}, {"t": 147.95, "x": "最初に出るのは、遅刻を軽くいじる一言です。"}, {"t": 151.35, "x": "一言が流れると、資料の作り方にも口が出ます。"}, {"t": 155.06666666666666, "x": "口が出るようになると、進め方にも手が伸びます。"}, {"t": 158.33333333333334, "x": "伸びた言葉は、どれも笑いながら渡されています。"}, {"t": 161.71666666666667, "x": "渡す側は、角の立たない言い方を選んでいます。"}, {"t": 165.11666666666667, "x": "選んだ言い方が、受ける側には別の形で届きます。"}, {"t": 168.96666666666667, "x": "届いた側は、笑うか黙るかのどちらかを選びます。"}, {"t": 172.51666666666668, "x": "笑って返せば、言う側は許されたと読みます。"}, {"t": 175.88333333333333, "x": "読んだ通りに、次の一言はもう少し踏み込みます。"}, {"t": 179.45, "x": "踏み込んだ分だけ、話せる範囲は確かに広がります。"}, {"t": 183.28333333333333, "x": "広がった範囲には、評価に近い話も入ってきます。"}, {"t": 187.13333333333333, "x": "入った話は、冗談の形のまま相手に残ります。"}, {"t": 190.96666666666667, "x": "残った言葉は、後から意味だけが取り出されます。"}, {"t": 194.31666666666666, "x": "取り出された意味は、包みより重いことがあります。"}, {"t": 197.56666666666666, "x": "重さの差に、言った側はほとんど気づきません。"}, {"t": 200.83333333333334, "x": "気づかないのは、本人の記憶が軽いからです。"}, {"t": 204.03333333333333, "x": "軽い記憶と重い記憶の差が、次の話の土台です。"}, {"t": 207.86666666666667, "x": "三つ目は、言われた側の逃げ場の話です。"}, {"t": 211.0, "x": "逃げ場は、その場では減ったように見えません。"}, {"t": 214.03333333333333, "x": "見えないのは、笑って返せば終わるからです。"}, {"t": 217.05, "x": "終わったはずの一言が、数日たつと戻ります。"}, {"t": 220.31666666666666, "x": "戻ってくるのは、似た場面に出くわした時です。"}, {"t": 223.46666666666667, "x": "出くわすたびに、あの時の言葉が頭に浮かびます。"}, {"t": 226.96666666666667, "x": "浮かんだ言葉を、本人は誰にも相談できません。"}, {"t": 230.46666666666667, "x": "できないのは、仲の良さを周りも知っているからです。"}, {"t": 233.93333333333334, "x": "知られていると、相談は告げ口の形になります。"}, {"t": 237.5, "x": "形を気にして黙る時間が、数ヶ月ぶん積もります。"}, {"t": 241.3, "x": "積もったものは、外からは何も見えません。"}, {"t": 244.26666666666668, "x": "見えないまま、返事だけが少しずつ短くなります。"}, {"t": 247.8, "x": "短くなった返事に、言う側は\n気づかないことがあります。"}, {"t": 251.58333333333334, "x": "関係は変わっていないと、思っているからです。"}, {"t": 254.78333333333333, "x": "思っている間も、逃げ場は静かに減り続けます。"}, {"t": 258.23333333333335, "x": "減った先で、ある日ひとつの言葉が入ります。"}, {"t": 261.48333333333335, "x": "入った言葉が特別に強いとは限りません。"}, {"t": 264.4166666666667, "x": "限らないのに、そこで受け止めきれなくなります。"}, {"t": 267.55, "x": "なるのは、その一言だけの重さではないからです。"}, {"t": 270.9166666666667, "x": "四つ目は、話の性質が変わる瞬間です。"}, {"t": 274.3, "x": "瞬間は、たいてい席のそばで起きます。"}, {"t": 277.3833333333333, "x": "起きるのは、いつもの立ち話の続きの中です。"}, {"t": 280.6333333333333, "x": "中で出るのは、来期の話や配置の話です。"}, {"t": 284.0, "x": "話すうちに、上司の口調が少しだけ変わります。"}, {"t": 287.4, "x": "変わった口調のまま、評価に触れる言葉が出ます。"}, {"t": 290.8, "x": "出た言葉を、部下は友人の話として聞いています。"}, {"t": 294.45, "x": "聞いたつもりでいると、受け取り方が\nずれやすいです。"}, {"t": 297.9166666666667, "x": "ずれた分だけ、その日の記憶も食い違います。"}, {"t": 301.28333333333336, "x": "食い違っても、どちらも確かめようとはしません。"}, {"t": 304.6666666666667, "x": "しないのは、確かめる場が無いからです。"}, {"t": 307.45, "x": "場を作ると、関係が固くなりそうに思えます。"}, {"t": 310.81666666666666, "x": "思えるので、二人ともそのまま流してしまいます。"}, {"t": 314.1666666666667, "x": "流したものが、評価の場でもう一度出てきます。"}, {"t": 317.43333333333334, "x": "出てきた時、部下は初めて聞いた話だと感じます。"}, {"t": 321.01666666666665, "x": "一方で上司は、前に伝えたと覚えています。"}, {"t": 324.45, "x": "覚えている中身は、立ち話で出したあの言葉です。"}, {"t": 327.93333333333334, "x": "渡った場所は同じでも、置かれた棚が違いました。"}, {"t": 331.3, "x": "違う棚に入った話を、片づけ間違いと呼びます。"}, {"t": 335.05, "x": "五つ目は、評価の季節に起きることです。"}, {"t": 338.01666666666665, "x": "季節というのは、目標設定や考課の時期です。"}, {"t": 341.46666666666664, "x": "時期が近づくと、職場の空気は少し変わります。"}, {"t": 345.0, "x": "変わるのは、上の立場にいる人の予定からです。"}, {"t": 348.4, "x": "予定に面談が並ぶと、話し方が仕事へ寄ります。"}, {"t": 352.2, "x": "寄った話し方を、近い部下ほど敏感に受け取ります。"}, {"t": 355.95, "x": "受け取った側は、急に線を引かれたと感じます。"}, {"t": 359.4166666666667, "x": "感じるのは、理由の説明が無いからです。"}, {"t": 362.45, "x": "無いのは、引いた自覚が薄いからです。"}, {"t": 365.18333333333334, "x": "薄いまま、面談の席に二人は座ります。"}, {"t": 368.5, "x": "座った席で出る言葉は、いつもの\n調子ではありません。"}, {"t": 372.18333333333334, "x": "調子が違うと分かっても、切り替えは急に感じます。"}, {"t": 375.93333333333334, "x": "急に感じた変化が、そのまま不信に\n見えることがあります。"}, {"t": 379.98333333333335, "x": "見えるのは、事前の合図が一つも無いからです。"}, {"t": 383.23333333333335, "x": "合図を季節の直前に作っても、たいてい遅いです。"}, {"t": 387.06666666666666, "x": "遅いのは、関係の形が先に動いてしまうからです。"}, {"t": 390.8666666666667, "x": "動いた形に、中身が追いつくまで時間がかかります。"}, {"t": 394.56666666666666, "x": "かかる間に、部下は別の解釈を作り始めます。"}, {"t": 398.21666666666664, "x": "作られた解釈は、後から直すのが難しくなります。"}, {"t": 402.05, "x": "六つ目は、悪い知らせの届き方です。"}, {"t": 404.9166666666667, "x": "近い相手には、何でも言えると思われています。"}, {"t": 408.21666666666664, "x": "実際には、逆のことが起きる場合があります。"}, {"t": 411.6166666666667, "x": "起きるのは、悪い知らせが止まる現象です。"}, {"t": 414.73333333333335, "x": "遠慮しているからでしょうか。"}, {"t": 416.5, "x": "それも少しはありますが、それだけではありません。"}, {"t": 419.8666666666667, "x": "怒られるのが怖いからでしょうか。"}, {"t": 421.9166666666667, "x": "怖さなら、遠い上司の方がよほど大きいはずです。"}, {"t": 425.6, "x": "はずなのに、近い相手ほど言いにくくなります。"}, {"t": 428.71666666666664, "x": "なるのは、失うものが二つあるからです。"}, {"t": 431.75, "x": "一つは、仕事の上での評価です。"}, {"t": 434.51666666666665, "x": "もう一つは、気の合う相手としての関係です。"}, {"t": 437.81666666666666, "x": "関係まで失うかもしれないと、口は重くなります。"}, {"t": 441.45, "x": "重くなった口は、事実を後ろへ送り始めます。"}, {"t": 444.96666666666664, "x": "送られた事実は、手が打てる時期を過ぎて届きます。"}, {"t": 448.51666666666665, "x": "届いた時、上司は隠されたと感じることがあります。"}, {"t": 452.2, "x": "感じた側は、信頼していたのにと口にします。"}, {"t": 456.06666666666666, "x": "その言葉が、部下には二重の責めに聞こえます。"}, {"t": 459.4, "x": "聞こえた時点で、悪い知らせはもっと止まります。"}, {"t": 462.8, "x": "七つ目は、周りから見えている景色です。"}, {"t": 465.78333333333336, "x": "景色の中で、二人だけが自分たちを見ていません。"}, {"t": 469.26666666666665, "x": "見ているのは、同じ部署の他の人たちです。"}, {"t": 472.25, "x": "目に映るのは、よく一緒にいる二人です。"}, {"t": 475.23333333333335, "x": "二人が笑っている時間が、他より長く見えます。"}, {"t": 478.7, "x": "長く見える時間は、実際の長さとは限りません。"}, {"t": 482.43333333333334, "x": "限らないのに、印象だけは確かに残ります。"}, {"t": 485.68333333333334, "x": "残った印象は、仕事の割り振りに重ねて読まれます。"}, {"t": 489.5, "x": "読まれ方は、良い方にも悪い方にも転びやすいです。"}, {"t": 493.28333333333336, "x": "悪い方に転ぶと、えこひいきという言葉が出ます。"}, {"t": 496.76666666666665, "x": "出た言葉は、本人たちには直接届きません。"}, {"t": 500.1666666666667, "x": "届かないので、二人は何も知らずに過ごします。"}, {"t" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

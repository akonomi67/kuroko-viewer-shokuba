<title>若手を注意できなくなった上司が代わりにやっていること</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}

<script>
const D={"name": "若手を注意できなくなった上司が代わりにやっていること", "file": "020_若手を注意できなくなった上司が代わりにやっていること", "dur": 1055.4, "segs": [], "subs": [{"t": 0.0, "x": "一日のうちに、気になる場面は何度も通り過ぎます。"}, {"t": 3.7333333333333334, "x": "通り過ぎた数だけ、言おうとして\n止めた言葉があります。"}, {"t": 7.516666666666667, "x": "言葉は口の中まで来て、そこで消えることがあります。"}, {"t": 11.1, "x": "消えた回数は、どこにも記録として残っていません。"}, {"t": 14.666666666666666, "x": "記録が無いので、言わなかった側も数えていません。"}, {"t": 18.283333333333335, "x": "数えていないものは、無かったことと同じに見えます。"}, {"t": 21.683333333333334, "x": "見えないまま、一週間で何十回も積み重なります。"}, {"t": 25.55, "x": "積み重なった分は、その人の作業として増えます。"}, {"t": 29.133333333333333, "x": "増えた作業の中身は、たいてい他の誰かの直しです。"}, {"t": 32.916666666666664, "x": "直しを引き受けた人は、そのことを誰にも言いません。"}, {"t": 36.53333333333333, "x": "言わない理由は、恩着せがましく聞こえるからです。"}, {"t": 39.95, "x": "聞こえ方を気にするうちに、また一日が終わります。"}, {"t": 43.46666666666667, "x": "終わった日の夜に、量とは合わない疲れが残ります。"}, {"t": 47.06666666666667, "x": "残った疲れは、こなした仕事の数から来ていません。"}, {"t": 50.63333333333333, "x": "来ているのは、言わずに済ませた回数の方からです。"}, {"t": 54.11666666666667, "x": "回数を数え始めると、自分でも驚くことがあります。"}, {"t": 57.983333333333334, "x": "驚くほどの数が、毎日音もなく流れています。"}, {"t": 61.65, "x": "流れていく間、直されている側は何も知りません。"}, {"t": 65.36666666666666, "x": "知らないので、今のやり方で問題は無いと考えます。"}, {"t": 69.2, "x": "考えたまま半年が過ぎ、直す機会は遠ざかります。"}, {"t": 73.11666666666666, "x": "遠ざかった後で困るのは、たいてい両方の側です。"}, {"t": 76.78333333333333, "x": "今日は、言えなくなった側の中で起きることを見ます。"}, {"t": 80.45, "x": "見るのは、どちらが悪いのかという話ではありません。"}, {"t": 83.96666666666667, "x": "話すのは、飲み込まれた言葉の行き先だけです。"}, {"t": 87.18333333333334, "x": "まず、注意が静かに消えていく入口から見ます。"}, {"t": 90.81666666666666, "x": "入口にあるのは、言い方を探している短い時間です。"}, {"t": 94.71666666666667, "x": "相手が新人なら、なおさら言葉を選びます。"}, {"t": 97.98333333333333, "x": "選んでいる間に、直したい箇所は\n小さく見えてきます。"}, {"t": 101.76666666666667, "x": "小さく見えたものは、自分で\n直せる大きさに変わります。"}, {"t": 105.7, "x": "直してしまえば、その場の用事はそれで終わります。"}, {"t": 109.2, "x": "終わらせた理由は、相手への優しさなのでしょうか。"}, {"t": 112.75, "x": "優しさだと決めてしまうと、話はそこで止まります。"}, {"t": 116.36666666666666, "x": "止まらないのは、優しさだけでは\n説明がつかないからです。"}, {"t": 120.21666666666667, "x": "では、単純に忙しさが理由なのでしょうか。"}, {"t": 123.55, "x": "忙しさもありますが、それだけでもなさそうです。"}, {"t": 126.98333333333333, "x": "手が空いている日にも、同じことが\n起きる場合があります。"}, {"t": 130.61666666666667, "x": "起きているのは、頭の中の速さの比べ算です。"}, {"t": 134.1, "x": "言葉を選ぶ時間と、自分で直す時間を比べています。"}, {"t": 138.15, "x": "比べた結果、直すほうが短いという答えが出ます。"}, {"t": 141.96666666666667, "x": "出た答えは、その日のうちは正しく働きます。"}, {"t": 145.31666666666666, "x": "働いた分だけ、締切の前の慌ただしさは減ります。"}, {"t": 149.3, "x": "減っていくのは、目に見える混乱のほうだけです。"}, {"t": 152.56666666666666, "x": "見えないほうでは、別のものが増え始めています。"}, {"t": 155.93333333333334, "x": "増えているものが何なのかを、次で見ていきます。"}, {"t": 159.15, "x": "二つ目は、飲み込まれた言葉が向かう先の話です。"}, {"t": 162.71666666666667, "x": "先にあるのは、言った側ではなく作業のほうです。"}, {"t": 166.23333333333332, "x": "誤字の直しが、自分の手元に回ってきます。"}, {"t": 169.41666666666666, "x": "体裁の整え直しも、自分の時間で済ませます。"}, {"t": 173.05, "x": "抜けていた確認も、気づいた側がその場で埋めます。"}, {"t": 176.58333333333334, "x": "そういう小さな作業が、一日のうちに何度も増えます。"}, {"t": 180.63333333333333, "x": "一方で、渡した側の手元の仕事は減っていきます。"}, {"t": 184.45, "x": "減ったことに、渡した本人が気づく機会はありません。"}, {"t": 188.13333333333333, "x": "ありませんが、結果としてその人の手は空きます。"}, {"t": 191.53333333333333, "x": "空いた手のところへ、次の仕事がまた入ってきます。"}, {"t": 195.13333333333333, "x": "入ってきた仕事も、同じ形で\n戻ってくることがあります。"}, {"t": 198.91666666666666, "x": "戻るたびに、巻き取る側の一日は\n短くなることがあります。"}, {"t": 203.0, "x": "短くなった一日を、忙しさのせいだと考えます。"}, {"t": 206.68333333333334, "x": "考えの中では、注意と作業は別の話に見えます。"}, {"t": 210.65, "x": "見えていますが、実際には入れ替わっています。"}, {"t": 213.73333333333332, "x": "入れ替わりとは、言うべき言葉を\n作業で払う状態です。"}, {"t": 217.58333333333334, "x": "払った作業は、終わった時点でその場から消えます。"}, {"t": 221.18333333333334, "x": "消えてしまうので、払った回数もどこにも残りません。"}, {"t": 224.75, "x": "残らないものは、後から説明することができません。"}, {"t": 228.28333333333333, "x": "説明できない部分が、次の話へつながります。"}, {"t": 231.85, "x": "三つ目は、巻き取った作業がどこに残るのかです。"}, {"t": 235.26666666666668, "x": "残るのは、仕上がった側の成果物だけです。"}, {"t": 238.5, "x": "誰がどこを直したかは、そこには書かれていません。"}, {"t": 241.88333333333333, "x": "何回直したのかも、書いておく欄がありません。"}, {"t": 245.26666666666668, "x": "誰が言わずに済ませたかは、なおさら残りません。"}, {"t": 248.56666666666666, "x": "残らないので、外から見える景色は静かなままです。"}, {"t": 252.26666666666668, "x": "静かな職場は、うまく回っていると読まれやすいです。"}, {"t": 255.96666666666667, "x": "読まれた通りに、次の年の人の配置も決まります。"}, {"t": 259.53333333333336, "x": "決まった配置では、直している人の\n手は数に入りません。"}, {"t": 263.3666666666667, "x": "入らなかった手は、どこかで\n足りなくなる場合があります。"}, {"t": 267.0, "x": "足りなくなった日に、ようやくその量が見えてきます。"}, {"t": 270.3, "x": "見えた頃には、直す相手はもう何人かに\n増えています。"}, {"t": 274.1, "x": "増えた分を、また誰かが黙って引き受け続けます。"}, {"t": 277.6333333333333, "x": "引き受けた人が評価の場で話せることは、\n多くありません。"}, {"t": 281.53333333333336, "x": "多くないのは、結果しか欄に載らないからです。"}, {"t": 284.73333333333335, "x": "載らない部分に、この回の中身はほとんど入ります。"}, {"t": 288.3, "x": "入っているのは、見えない手間とは\n少し違うものです。"}, {"t": 291.9, "x": "違うのは、言わないという選択が元にあるからです。"}, {"t": 295.51666666666665, "x": "選択の結果として、作業が増えている形です。"}, {"t": 299.1166666666667, "x": "形が分かると、言われない側の景色も見えてきます。"}, {"t": 302.8333333333333, "x": "四つ目は、何も言われない側に見えている景色です。"}, {"t": 306.4166666666667, "x": "景色を見るために、一つの場面を置いてみます。"}, {"t": 309.6666666666667, "x": "研修を終えた新人が、配属されて\n三週間目に入ります。"}, {"t": 314.06666666666666, "x": "三週間の間に、資料を何本か出しています。"}, {"t": 317.75, "x": "出した資料に、直しの依頼は一度も来ていません。"}, {"t": 321.06666666666666, "x": "来ていないので、本人はすべて通ったと\n受け取ります。"}, {"t": 324.5833333333333, "x": "受け取った側の中では、その書き方が\n基準になります。"}, {"t": 328.28333333333336, "x": "基準になった形を、次の資料でも繰り返します。"}, {"t": 331.9, "x": "実際には、出した先で毎回誰かが\n直しを入れています。"}, {"t": 335.9166666666667, "x": "入った直しは、本人の目には一度も触れていません。"}, {"t": 339.65, "x": "触れないまま、同じ書き方だけが積み上がります。"}, {"t": 342.95, "x": "積み上がる速さは、思っているよりずっと速いです。"}, {"t": 346.51666666666665, "x": "速い理由は、途中で止める人が誰もいないからです。"}, {"t": 350.23333333333335, "x": "誰もいない状態を、本人は順調なのだと\n読み取ります。"}, {"t": 354.21666666666664, "x": "読み違いの元は、\n本人の側にあるわけではありません。"}, {"t": 358.03333333333336, "x": "ありませんが、直る機会だけは\n本人から遠ざかります。"}, {"t": 361.9, "x": "遠ざかった距離は、月が変わるごとに広がります。"}, {"t": 365.26666666666665, "x": "広がる前に出るはずの合図が、\nこの場面にはありません。"}, {"t": 369.1, "x": "出ていない合図を、静かな合格と呼んでおきます。"}, {"t": 372.51666666666665, "x": "静かな合格は、あとになって高くつくことがあります。"}, {"t": 376.26666666666665, "x": "五つ目は、静かな合格が続いた先の話です。"}, {"t": 379.93333333333334, "x": "続いた分だけ、そのやり方はその人の型になります。"}, {"t": 383.8, "x": "型になってしまうと、手順を\n見直す理由が消えやすいです。"}, {"t": 387.96666666666664, "x": "消えた理由の代わりに残るのは、慣れた速さです。"}, {"t": 391.3833333333333, "x": "速くなった作業は、本人の自信にもなります。"}, {"t": 394.8333333333333, "x": "一方で、受け取る側の手間はまったく変わりません。"}, {"t": 398.3666666666667, "x": "変わらない手間を、毎回誰かが\n引き受け続けています。"}, {"t": 402.1166666666667, "x": "引き受けている人も、そろそろ言おうと思っています。"}, {"t": 405.53333333333336, "x": "思ってはいても、今さらという感じが先に立ちます。"}, {"t": 409.15, "x": "先に立ってしまうのは、時間が経ちすぎたからです。"}, {"t": 412.6666666666667, "x": "経った時間の長さが、言い出しにくさに変わります。"}, {"t": 416.15, "x": "変わった後は、言う理由を組み立てる作業が\n増えます。"}, {"t": 419.9, "x": "増えた作業を前にして、また今度でいいと考えます。"}, {"t": 423.6166666666667, "x": "考えるたびに、その今度はさらに遠くなります。"}, {"t": 427.01666666666665, "x": "遠くなる仕組みは、悪気のあるなしとは\n関係ありません。"}, {"t": 430.78333333333336, "x": "関係が無いので、誰かを責めても\n流れは止まりません。"}, {"t": 434.71666666666664, "x": "止められる場所があるとすれば、早い段階だけです。"}, {"t": 438.1166666666667, "x": "早い段階とは、まだ回数が少ないうちのことです。"}, {"t": 441.78333333333336, "x": "少ないうちなら、直す話は驚くほど軽く終わります。"}, {"t": 445.8, "x": "軽く終わる時期がいつまで続くのかを、次で見ます。"}, {"t": 449.3, "x": "六つ目は、時間の経ち方そのものを追いかけます。"}, {"t": 452.7, "x": "追いかける区切りは、一週間と三ヶ月と一年です。"}, {"t": 456.53333333333336, "x": "最初の一週間なら、直す話はまだ軽いままです。"}, {"t": 460.4, "x": "軽いのは、まだその人の型になっていないからです。"}, {"t": 463.71666666666664, "x": "なっていない段階なら、書き方を\n足すだけで済みます。"}, {"t": 467.25, "x": "済んでしまえば、言われた本人も特に気にしません。"}, {"t": 470.9166666666667, "x": "気にしない程度で終わるのが、この時期の特徴です。"}, {"t": 474.35, "x": "三ヶ月が過ぎると、同じ話の重さが変わってきます。"}, {"t": 478.25, "x": "変わるのは、それで通してきた実績ができるからです。"}, {"t": 481.9, "x": "実績のある形を直す時には、\n説明が要る場合があります。"}, {"t": 486.21666666666664, "x": "要る説明の量が、そのまま言う側の負担になります。"}, {"t": 489.8666666666667, "x": "負担が増えた分だけ、言わない選択が近くなります。"}, {"t": 493.76666666666665, "x": "近づいたまま、さらに一年が過ぎることもあります。"}, {"t": 497.3333333333333, "x": "過ぎた頃には、その人は誰かに教える側へ回ります。"}, {"t": 501.25, "x": "回った先で、同じ書き方が次の人へ渡ります。"}, {"t": 504.85, "x": "渡った形は、もう一人だけの癖ではなくなっています。"}, {"t": 508.53333333333336, "x": "なくなった時点で、直す相手は職場全体になります。"}, {"t": 512.3166666666667, "x": "全体を直す話には、打ち合わせが\n何度も必要になります。"}, {"t": 516.7333333333333, "x": "要した時間の元をたどると、\n最初の一週間に戻ります。"}, {"t": 520.7666666666667, "x": "戻った場所で、なぜ言えなかったのかを次に見ます。"}, {"t": 524.3333333333334, "x": "七つ目は、言わなかった側が抱えている理由です。"}, {"t": 528.0, "x": "理由を聞かれても、\nはっきり答えられないことがあります。"}, {"t": 531.6, "x": "単純に、嫌われたくないからなのでしょうか。"}, {"t": 534.6333333333333, "x": "それもありますが、それだけではなさそうです。"}, {"t": 537.75, "x": "評判を気にしない人も、同じように\n飲み込んでいます。"}, {"t": 541.35, "x": "では、相手の反応が怖いということなのでしょうか。"}, {"t": 545.0, "x": "怖さも一部ですが、全部の説明にはなりません。"}, {"t": 548.6, "x": "何も言い返さない相手にも、\n言えない場面はあります。"}, {"t": 552.3166666666667, "x": "三つ目に残っているのは、言葉の置き場所の\n問題です。"}, {"t": 556.0, "x": "置き場所とは、その話をどこで出すかということです。"}, {"t": 559.5, "x": "会議の場では、人数が多すぎて\n細かい話は出せません。"}, {"t": 563.5833333333334, "x": "席に戻った後では、話を出す時期を逃しています。"}, {"t": 567.35, "x": "逃した後でわざわざ呼び出すと、大ごとに見えます。"}, {"t": 570.8666666666667, "x": "見え方が重くなると、相手も身構えることがあります。"}, {"t": 574.5, "x": "身構えられた状態では、伝わる中身の量が減ります。"}, {"t": 578.2166666666667, "x": "減ると分かっているので、出せる場所が無くなります。"}, {"t": 581.6666666666666, "x": "無くなった結果として、その言葉は行き場を失います。"}, {"t": 585.3833333333333, "x": "失った言葉が、少しずつ作業の形に変わります。"}, {"t": 589.1666666666666, "x": "変わっていく流れは、気持ちの弱さとは別の話です。"}, {"t": 592.9166666666666, "x": "別の話である以上、直し方のほうも別になります。"}, {"t": 596.8333333333334, "x": "八つ目は、二人ではなく職場の側にあるものです。"}, {"t": 600.3666666666667, "x": "あるのは、言葉の強さの読み取り方の幅です。"}, {"t": 603.6166666666667, "x": "まったく同じ一言が、人によって重さを変えます。"}, {"t": 607.2166666666667, "x": "同じ声の大きさが、その日の\n調子で別に響くことがあります。"}, {"t": 611.5, "x": "同じ場所であっても、人数が\n変われば意味が動きます。"}, {"t": 615.1, "x": "そういう幅を、言う側は前もって読み切れません。"}, {"t": 618.7333333333333, "x": "一方で、受け取る側にも読み\n切れない部分があります。"}, {"t": 622.4833333333333, "x": "何も言われないことが、放置に見える日もあります。"}, {"t": 625.8166666666667, "x": "短く言われたことが、冷たく感じられる日もあります。"}, {"t": 629.5, "x": "どちらの日になるかは、事前には\n誰にも分かりません。"}, {"t": 633.0, "x": "分からないまま、二人は同じ場面に\n立たされています。"}, {"t": 636.6333333333333, "x": "立っている場所が同じでも、\n見えている幅は違います。"}, {"t": 640.35, "x": "違う幅を、片方の努力だけで\nそろえるのは難しいです。"}, {"t": 644.45, "x": "難しいので、言う側だけを責めても\n先へは進みません。"}, {"t": 648.4666666666667, "x": "進まないのは、受け取る側を責めた場合も同じです。"}, {"t": 652.0833333333334, "x": "同じ結果になるなら、責める作業のほうは省けます。"}, {"t": 655.7166666666667, "x": "省いた分は、話し方の形をそろえるほうへ回せます。"}, {"t": 659.7333333333333, "x": "そろえる形は、後ろのほうで一つだけ取り上げます。"}, {"t": 663.4333333333333, "x": "その前に、言葉が減った職場で起きることを見ます。"}, {"t": 667.0666666666667, "x": "起きることは、注意の回数だけの話ではありません。"}, {"t": 670.7666666666667, "x": "九つ目は、言葉が減っていった後の景色です。"}, {"t": 674.1333333333333, "x": "景色を見るために、会議室の場面を一つ置きます。"}, {"t": 677.8666666666667, "x": "十人ほどが集まり、進み具合を確かめています。"}, {"t": 681.5333333333333, "x": "一人が、期限よりかなり早く仕上げた件を\n報告します。"}, {"t": 685.5333333333333, "x": "聞いた上の側は、分かりましたとだけ短く返します。"}, {"t": 689.2833333333333, "x": "返した言葉はそれだけで、すぐ次の議題へ移ります。"}, {"t": 693.0833333333334, "x": "移った後、その件に触れる人はもう誰もいません。"}, {"t": 696.6166666666667, "x": "触れなかったのは、関心が無いからではありません。"}, {"t": 699.9333333333333, "x": "強い言い方を避ける習慣が、\n言葉全体を短くしています。"}, {"t": 704.3333333333334, "x": "短くなった言葉は、良いほうにも同じように働きます。"}, {"t": 708.1833333333333, "x": "働いた結果、褒める言い方のほうも出にくくなります。"}, {"t": 711.9666666666667, "x": "出にくいので、うまくいった件も記録に残りません。"}, {"t": 715.5, "x": "残らないと、次に頑張る理由が\n薄くなることがあります。"}, {"t": 719.3, "x": "薄くなった分だけ、会議は事務の\n報告だけになります。"}, {"t": 723.1666666666666, "x": "事務だけの報告に、人は身を入れにくくなります。"}, {"t": 726.5666666666667, "x": "入れにくい場が続くと、自分から出す発言も減ります。"}, {"t": 730.3833333333333, "x": "減った発言を、やる気が落ちたのだと\n読むことがあります。"}, {"t": 734.2333333333333, "x": "読み方がずれると、直す場所のほうもずれていきます。"}, {"t": 737.8333333333334, "x": "この静けさのことを、言葉の節約と呼んでおきます。"}, {"t": 741.3666666666667, "x": "節約が続いた先で何が残るのかを、次で追います。"}, {"t": 745.2333333333333, "x": "十個目は、節約が続いた後の時間の流れです。"}, {"t": 748.95, "x": "流れを、その日と二ヶ月後と半年後に分けて見ます。"}, {"t": 752.7333333333333, "x": "その日のうちは、何も起きていないように見えます。"}, {"t": 756.0333333333333, "x": "見えるのは、静かで落ち着いた職場のほうです。"}, {"t": 759.3, "x": "落ち着きの中で、雑談の数だけが少しずつ減ります。"}, {"t": 763.05, "x": "減った雑談は、その時点では\n誰の目にも留まりません。"}, {"t": 766.8333333333334, "x": "留まらないまま、二ヶ月ほどの時間が過ぎます。"}, {"t": 770.0333333333333, "x": "過ぎた頃には、質問の数が目に見えて減っています。"}, {"t": 773.8166666666667, "x": "減ったのは、気軽に聞ける空気が\n薄くなったからです。"}, {"t": 777.3666666666667, "x": "薄くなった空気の中では、確認は後回しになります。"}, {"t": 781.2666666666667, "x": "後回しになった確認が、納期の直前に出てきます。"}, {"t": 785.0833333333334, "x": "出てきた時には、もう直すための時間が足りません。"}, {"t": 788.55, "x": "足りない中で、結局また誰かがまとめて巻き取ります。"}, {"t": 792.15, "x": "巻き取った人は、そのことをやはり何も言いません。"}, {"t": 795.55, "x": "言わない日が続くほど、二人の\n距離は開くことがあります。"}, {"t": 799.3, "x": "開いた距離は、仲の良し悪しとは別のものです。"}, {"t": 802.6333333333333, "x": "別のものなので、飲み会を開いたところで\n縮みません。"}, {"t": 806.3166666666667, "x": "縮まないのは、話す中身が戻っていないからです。"}, {"t": 809.7333333333333, "x": "戻すために要るのは、強い言い方ではありません。"}, {"t": 813.0166666666667, "x": "要るものが何なのかを、次で一つだけ取り上げます。"}, {"t": 816.4166666666666, "x": "十一個目は、飲み込まずに出す形の話です。"}, {"t": 819.8166666666667, "x": "形はひとつで、起きた事実を短く置くだけです。"}, {"t": 823.4166666666666, "x": "どこが違っていたのかを、まず一行で言います。"}, {"t": 826.8166666666667, "x": "何にどう直したのかを、続けてもう一行足します。"}, {"t": 830.35, "x": "次はどうするかを、最後に一行だけ置きます。"}, {"t": 833.75, "x": "三行のどこにも、その人の性格は入っていません。"}, {"t": 837.5666666666667, "x": "一方で、よくある言い方には性格のほうが入ります。"}, {"t": 841.5, "x": "気が利かない、という言い方がそこに入ります。"}, {"t": 844.6833333333333, "x": "やる気が見えない、という言い方も入ってきます。"}, {"t": 847.9, "x": "向いていない、という言葉まで出ることがあります。"}, {"t": 851.0333333333333, "x": "そういう言葉は、直すべき場所を指していません。"}, {"t": 854.3666666666667, "x": "場所を指さない言葉は、受け取る側にも\n動かせません。"}, {"t": 858.0833333333334, "x": "動かせない話は、重いだけで終わる場合があります。"}, {"t": 861.75, "x": "終わらせないために、事実だけを置く形が効きます。"}, {"t": 865.2666666666667, "x": "効くのは、直す場所がその場ですぐ分かるからです。"}, {"t": 868.6666666666666, "x": "分かる形なら、言う側の準備も軽くなります。"}, {"t": 872.0666666666667, "x": "軽くなれば、その日のうちに出すことができます。"}, {"t": 875.2666666666667, "x": "出せる日が続くうちに、巻き取る作業は減ります。"}, {"t": 878.6833333333333, "x": "減った作業の分だけ、自分の時間が戻ってきます。"}, {"t": 882.5333333333333, "x": "戻ってきた時間をどう使うかを、最後に見ます。"}, {"t": 885.9333333333333, "x": "最後に、言わなかった側の中をもう一度見ます。"}, {"t": 889.5166666666667, "x": "中に溜まるのは、増えた作業だけではありません。"}, {"t": 892.8166666666667, "x": "言おうとして止めた言葉も、そのまま残っています。"}, {"t": 896.1833333333333, "x": "残った言葉は、時間がたつにつれて形を変えます。"}, {"t": 899.8833333333333, "x": "変わった形は、たいてい諦めに近いものになります。"}, {"t": 903.6166666666667, "x": "近いものが増えると、相手に期待する量が減ります。"}, {"t": 907.1833333333333, "x": "減った期待は、言葉にしなくても\n相手に伝わることがあります。"}, {"t": 911.2, "x": "伝わった側は、見放されたように感じてしまいます。"}, {"t": 914.8333333333334, "x": "感じた分だけ、その人が聞きに来る回数も減ります。"}, {"t": 918.7, "x": "減った回数が、また巻き取る作業を増やします。"}, {"t": 922.15, "x": "増え続ける輪を、どこかで切る必要があります。"}, {"t": 925.4166666666666, "x": "切りやすい場所は、たいてい最初の一回目です。"}, {"t": 928.7666666666667, "x": "一回目を短く出せた人は、二回目は軽くなります。"}, {"t": 932.5, "x": "軽くなるのは、相手がもう身構えなくなるからです。"}, {"t": 935.9833333333333, "x": "身構えない相手には、事実がそのまま届きます。"}, {"t": 939.4166666666666, "x": "届いた事実は、その場で直しの手順に変わります。"}, {"t": 942.9833333333333, "x": "変わった手順は、そのまま次に来る人へも渡せます。"}, {"t": 946.7, "x": "渡せる形が残れば、巻き取る回数は自然に減ります。"}, {"t": 950.7166666666667, "x": "減った回数の分だけ、飲み込む言葉のほうも\n減ります。"}, {"t": 954.5666666666667, "x": "減った先の景色を、立場を入れ替えて見ていきます。"}, {"t": 958.1666666666666, "x": "ここまでは、言えなくなった側から順に見てきました。"}, {"t": 961.6833333333333, "x": "見てきた中身を、今度は反対の側へ置き直します。"}, {"t": 965.4333333333333, "x": "置き直す場面は、四つ目で出した三週間目の日です。"}, {"t": 969.35, "x": "三週間目の新人は、資料を出して\n自分の席に戻ります。"}, {"t": 973.75, "x": "戻った後、何の連絡も来ないまま一日が終わります。"}, {"t": 977.5833333333334, "x": "終わった日を、本人は良い日のほうとして数えます。"}, {"t": 981.1166666666667, "x": "数えた日が重なるほど、その安心は厚くなります。"}, {"t": 984.8, "x": "厚くなった安心は、半年後に\n一度だけ大きく崩れます。"}, {"t": 988.9333333333333, "x": "崩れるのは、はじめて直しを\n指摘された日のことです。"}, {"t": 992.3833333333333, "x": "その日に出るのは、なぜ今なのかという気持ちです。"}, {"t": 995.65, "x": "気持ちの中身は、言えなかった側とよく似ています。"}, {"t": 999.1166666666667, "x": "似ているのは、どちらも時期を逃しているからです。"}, {"t": 1002.3666666666667, "x": "逃した時期を、二人とも同じ場所で作っています。"}, {"t": 1005.7833333333333, "x": "作った場所は、最初の資料が\n返ってこなかった日です。"}, {"t": 1009.5666666666667, "x": "日をさかのぼれば、動かせた手は\n両方の側にあります。"}, {"t": 1013.4, "x": "上の側は、直した箇所を一行返すことができました。"}, {"t": 1017.1666666666666, "x": "下の側は、直しが無いかを一言だけ聞けました。"}, {"t": 1020.6, "x": "どちらの椅子に座っても、出てくる動きは同じ形です。"}, {"t": 1024.6166666666666, "x": "同じ形とは、起きた事実を短く行き来させることです。"}, {"t": 1028.5833333333333, "x": "行き来が一度でも起きれば、飲み込む量は減ります。"}, {"t": 1031.95, "x": "減った分は、やはり成果の欄には載らないままです。"}, {"t": 1035.6666666666667, "x": "載らなくても、半年後の重さは確かに変わります。"}, {"t": 1039.1833333333334, "x": "変わり方は小さいので、その日には気づけません。"}, {"t": 1042.6333333333334, "x": "今日の話は、上の側でも下の側でも使えます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

<script>
const D={"name": "上司の愚痴に相づちを打った部下が半年後に失ったもの", "file": "025_上司の愚痴に相づちを打った部下が半年後に失ったもの", "dur": 1025.4, "segs": [], "subs": [{"t": 0.0, "x": "半年後の面談で、部下は思ってもいなかった\n一言を聞かされます。"}, {"t": 4.516666666666667, "x": "上司は評価の紙を前にして言葉を選びました。"}, {"t": 7.65, "x": "少し言いにくそうな様子です。"}, {"t": 9.683333333333334, "x": "選ばれた言葉は仕事の出来の話ではありません。"}, {"t": 12.733333333333333, "x": "立ち位置についての話でした。"}, {"t": 14.733333333333333, "x": "部下には、その一言がどこから来たのか\n見当がつきません。"}, {"t": 18.6, "x": "始まりは、たった一回の相づちでした。"}, {"t": 21.566666666666666, "x": "異動して二週目の昼休みに打ったものです。"}, {"t": 24.416666666666668, "x": "この話は職場でよくある流れを\n一つにまとめたものです。"}, {"t": 28.016666666666666, "x": "登場するのは二人です。"}, {"t": 29.666666666666668, "x": "ある上司と、その下に異動してきた部下です。"}, {"t": 32.766666666666666, "x": "話の中にだけ出てくる人がもう一人います。"}, {"t": 35.6, "x": "別の部署で働く、名前の出た相手です。"}, {"t": 38.766666666666666, "x": "その人は最後まで話の輪の外にいます。"}, {"t": 41.583333333333336, "x": "輪の外にいる人の話を、輪の中で聞く。"}, {"t": 44.61666666666667, "x": "その聞いた側に何が起きるのでしょうか。"}, {"t": 47.2, "x": "今日追うのは、悪口を言う側ではありません。"}, {"t": 50.38333333333333, "x": "聞く側に回った半年です。"}, {"t": 52.4, "x": "誰が悪いかを裁く話にはしません。"}, {"t": 54.96666666666667, "x": "そのかわり時間に沿って道筋を並べます。"}, {"t": 57.833333333333336, "x": "相づち一つが立場に変わっていく道筋です。"}, {"t": 60.78333333333333, "x": "では、半年前の昼休みに戻ります。"}, {"t": 63.81666666666667, "x": "異動して二週目の部下は、まだ職場の\n地図を覚えきれていません。"}, {"t": 68.1, "x": "誰がどの仕事を持っているのか分かりません。"}, {"t": 70.78333333333333, "x": "誰と誰が話しやすいのかも分かりません。"}, {"t": 73.38333333333334, "x": "地図が無いうちは、何を言っても\n角が立ちそうに感じるものです。"}, {"t": 77.55, "x": "だから部下は、なるべく静かに素直にふるまいます。"}, {"t": 81.0, "x": "その日の昼休み。"}, {"t": 82.4, "x": "休憩室には上司と部下の二人だけでした。"}, {"t": 85.11666666666666, "x": "上司は弁当を広げます。"}, {"t": 87.03333333333333, "x": "そして午前中の打ち合わせの話を始めます。"}, {"t": 90.18333333333334, "x": "始まりはただの仕事の報告のような口ぶりでした。"}, {"t": 93.43333333333334, "x": "口ぶりが変わったのは、別の\n部署の名前が出たあたりからです。"}, {"t": 97.43333333333334, "x": "あの部署はいつも返事が遅い、という話でした。"}, {"t": 100.95, "x": "遅い理由として名前が一つ挙がります。"}, {"t": 103.56666666666666, "x": "ある人の名前です。"}, {"t": 104.96666666666667, "x": "部下がまだ一度も話したことのない相手でした。"}, {"t": 107.75, "x": "話したことが無いのです。"}, {"t": 109.4, "x": "だから、本当かどうかを確かめる手立てもありません。"}, {"t": 112.9, "x": "手立てが無いまま、話は五分ほど続きました。"}, {"t": 116.23333333333333, "x": "上司の声は大きくありません。"}, {"t": 118.3, "x": "むしろ疲れているように聞こえます。"}, {"t": 120.48333333333333, "x": "責めたいというより、誰かに\nこぼしたい話だったのかもしれません。"}, {"t": 124.95, "x": "部下は箸を止めて、何度か小さくうなずきました。"}, {"t": 128.36666666666667, "x": "うなずいたのは、賛成したからではありません。"}, {"t": 131.4, "x": "新しい職場で、上司の話を遮る理由が\n見つからなかったからです。"}, {"t": 136.31666666666666, "x": "遮らずに聞くのは、異動したての\n人の自然な身の守り方です。"}, {"t": 140.71666666666667, "x": "ただ、この時の部下の頭からは\n一つのことが抜けていました。"}, {"t": 144.61666666666667, "x": "この場に、名前の出た本人がいないということです。"}, {"t": 148.03333333333333, "x": "いない人の話にうなずく。"}, {"t": 149.8, "x": "すると、その相づちは本人のいない所で\n数に入ります。"}, {"t": 153.85, "x": "数に入るかどうかは、うなずいた側には\n決められません。"}, {"t": 157.6, "x": "決めるのは話した側です。"}, {"t": 159.36666666666667, "x": "そして、あとで話を伝え聞く周りのほうです。"}, {"t": 162.76666666666668, "x": "昼休みが終わる頃です。"}, {"t": 164.55, "x": "上司は少しすっきりした顔で席に戻りました。"}, {"t": 167.61666666666667, "x": "部下の机には書類が一枚載っていました。"}, {"t": 170.35, "x": "その部署へ送る予定のものです。"}, {"t": 172.51666666666668, "x": "翌週の昼休み。"}, {"t": 174.01666666666668, "x": "上司は同じ部署の話をもう一度始めました。"}, {"t": 177.11666666666667, "x": "二回目の話は一回目より遠慮が少し減っています。"}, {"t": 180.65, "x": "理由は前の週にあります。"}, {"t": 182.6, "x": "部下がうなずいてくれたことです。"}, {"t": 184.48333333333332, "x": "話を最後まで聞いてくれた相手。"}, {"t": 186.8, "x": "人はその相手を、同じ考えの\n人として覚えやすいと言われます。"}, {"t": 191.15, "x": "覚えるのは中身ではありません。"}, {"t": 193.13333333333333, "x": "聞いてくれた時の空気のほうです。"}, {"t": 195.28333333333333, "x": "空気ごと覚えた相手には、次の\n話も持っていきやすくなります。"}, {"t": 199.53333333333333, "x": "こうして部下は、ある棚に置かれました。"}, {"t": 202.2, "x": "上司の中の、分かってくれる人の棚です。"}, {"t": 205.28333333333333, "x": "部下はそのことをまだ知りません。"}, {"t": 207.31666666666666, "x": "二回目も三回目も、部下は軽く\nうなずいただけでした。"}, {"t": 211.03333333333333, "x": "本人の感覚では一回一回が別々の小さな相づちです。"}, {"t": 215.2, "x": "話す側から見ると、同じ答えが\n三回続いたことになります。"}, {"t": 219.4, "x": "三回続いた答えは、もう相手の\n意見のように聞こえ始めます。"}, {"t": 223.8, "x": "さらに二人の昼休みを見ている人もいます。"}, {"t": 226.63333333333333, "x": "休憩室の入り口を同僚が通りかかります。"}, {"t": 229.55, "x": "話の中身までは聞いていません。"}, {"t": 231.78333333333333, "x": "それでも、形は目に残ります。"}, {"t": 234.33333333333334, "x": "上司と新人が、いつも二人で話している形です。"}, {"t": 238.01666666666668, "x": "形だけが残ると、周りはそこから\n二人の関係を読み取ろうとします。"}, {"t": 242.81666666666666, "x": "読み取られた関係は本人に確かめられません。"}, {"t": 245.8, "x": "そのまま職場の中に置かれます。"}, {"t": 247.95, "x": "こうして一回目のうなずきに、\n少しずつ意味が足されていきました。"}, {"t": 252.11666666666667, "x": "足された意味は、うなずいた\n本人には見えにくいものです。"}, {"t": 255.88333333333333, "x": "印が自分の背中の側に貼られているからです。"}, {"t": 259.06666666666666, "x": "ここでは、この印を相づちの名札と呼んでおきます。"}, {"t": 262.71666666666664, "x": "名札を少しずつ書き足すのは、\n話した側と見ていた周りです。"}, {"t": 266.8333333333333, "x": "そこには、どちら側のひとかという一行が\n入っています。"}, {"t": 270.7, "x": "部下が自分で選んだ覚えのない一行です。"}, {"t": 273.56666666666666, "x": "その名札が一ヶ月後に一度だけ、\n形になって返ってきます。"}, {"t": 277.9, "x": "異動して一ヶ月がたちました。"}, {"t": 279.8666666666667, "x": "部下は例の部署に仕事の連絡を\n入れることになります。"}, {"t": 283.1166666666667, "x": "相手は、あの昼休みに名前の挙がった人です。"}, {"t": 286.5833333333333, "x": "部下は社内のチャットで資料の\n確認をていねいにお願いしました。"}, {"t": 290.46666666666664, "x": "返ってきたのは、確認しますの一言だけでした。"}, {"t": 293.9166666666667, "x": "忙しい日なら誰でも短く返すことはあります。"}, {"t": 297.05, "x": "引っかかったのは別の返信でした。"}, {"t": 299.31666666666666, "x": "同じ日に、別の同僚が送った連絡への返信です。"}, {"t": 303.2, "x": "そちらには、絵文字のついた\n長めの返事が届いていたのです。"}, {"t": 307.25, "x": "自分の書き方に失礼があったのか。"}, {"t": 309.6, "x": "部下は何度も読み返しました。"}, {"t": 311.5833333333333, "x": "それでも言葉づかいに問題は見当たりません。"}, {"t": 314.3666666666667, "x": "その後のやり取りも短い返信が続きました。"}, {"t": 317.31666666666666, "x": "本当の理由は最後まではっきりしません。"}, {"t": 320.1166666666667, "x": "ただ、職場の話は思っているより\n遠くまで伝わりやすいと言われます。"}, {"t": 324.8, "x": "上司が別の打ち合わせでこぼしたのかもしれません。"}, {"t": 327.8666666666667, "x": "うちの新人も困っていた、と。"}, {"t": 330.3833333333333, "x": "休憩室の二人を見かけた誰かが、\n様子を話したのかもしれません。"}, {"t": 334.8666666666667, "x": "どちらの道を通ったのか。"}, {"t": 336.6166666666667, "x": "いずれにしても、部下が言った言葉は\n一つもありません。"}, {"t": 340.1333333333333, "x": "伝わったのはうなずいていたという形のほうです。"}, {"t": 343.06666666666666, "x": "伝わるのが形だけだと、どうなるか。"}, {"t": 345.78333333333336, "x": "受け取った側は、そこに好きな中身を入れられます。"}, {"t": 349.1, "x": "相手から見れば、自分の悪口を\n一緒に聞いていた人です。"}, {"t": 353.18333333333334, "x": "話したこともない相手から先に\n距離を取られてしまったわけです。"}, {"t": 356.8666666666667, "x": "ここで起きたのは一つの現象です。"}, {"t": 359.18333333333334, "x": "相づちが、本人より先に相手の所へ届くのです。"}, {"t": 362.96666666666664, "x": "本人が名乗る前に、名札のほうが\n自己紹介を済ませてしまいます。"}, {"t": 367.5833333333333, "x": "済まされた自己紹介は、あとから\n訂正するのがむずかしいものです。"}, {"t": 372.1166666666667, "x": "訂正するには、あの昼休みの\n話を自分から持ち出すしかありません。"}, {"t": 376.81666666666666, "x": "持ち出せば今度は、上司の話を\n外に漏らした人になってしまいます。"}, {"t": 381.4, "x": "部下はどちらも選べません。"}, {"t": 383.18333333333334, "x": "短い返信を受け取り続けました。"}, {"t": 385.51666666666665, "x": "距離は相手の側でも同じように育っていきました。"}, {"t": 388.55, "x": "二ヶ月目に入りました。"}, {"t": 390.2, "x": "部下の机に届く頼まれごとの中身が変わってきます。"}, {"t": 393.5, "x": "上司からは例の部署とのやり取りを\n任せたいと言われます。"}, {"t": 396.95, "x": "理由は、あの部署の事情を\nよく分かっているからというものでした。"}, {"t": 401.15, "x": "実際には、部下はその部署のことを\nほとんど知りません。"}, {"t": 404.81666666666666, "x": "知っているのは、昼休みに上司から\n聞いた話の分だけです。"}, {"t": 409.01666666666665, "x": "その分だけで、事情に詳しい\n人として扱われ始めたわけです。"}, {"t": 413.48333333333335, "x": "同じ頃、上司と考えの近い同僚からも\n相談が来るようになりました。"}, {"t": 418.21666666666664, "x": "相談の多くは、あの部署への不満の伝え方です。"}, {"t": 421.9166666666667, "x": "どう伝えたらいいか、というものでした。"}, {"t": 424.6333333333333, "x": "反対に、例の部署に近い人たちもいます。"}, {"t": 427.85, "x": "そちらからは、雑談の声がかからなくなります。"}, {"t": 431.1666666666667, "x": "始業前に交わしていたあいさつも\n少しずつ短くなりました。"}, {"t": 434.9166666666667, "x": "頼まれごとも相談も片側からだけ\n届く形になっていきます。"}, {"t": 438.81666666666666, "x": "部下はいつのまにか、選んだつもりのない\n役を受け持っていました。"}, {"t": 442.9, "x": "片側の声をもう片側へ運ぶ役です。"}, {"t": 445.75, "x": "ここでは、この役を片側の窓口と呼んでおきます。"}, {"t": 449.46666666666664, "x": "窓口は両側から人が来るから窓口として成り立ちます。"}, {"t": 453.1333333333333, "x": "片側からしか人が来ないとどうなるか。"}, {"t": 455.5833333333333, "x": "一方の声を\n代わりに届ける場所になりやすいものです。"}, {"t": 458.98333333333335, "x": "そうなると、届けた声の中身まで変わります。"}, {"t": 462.25, "x": "届けた人のもの、として受け取られるのです。"}, {"t": 465.15, "x": "部下は用件を伝えているだけのつもりでした。"} 例の部署の人が、部下ではなく\n自分を見て返事をしたからです。"}, {"t": 711.05, "x": "現象はもう一つあります。"}, {"t": 712.9166666666666, "x": "聞き役が話し手の荷物を一緒に背負わされるのです。"}, {"t": 716.2833333333333, "x": "せおわせた側に悪気はありません。"}, {"t": 718.55, "x": "だから気づくきっかけもなかなか来ません。"}, {"t": 720.9166666666666, "x": "きっかけが来たのは半年後、\n評価の欄を書く時でした。"}, {"t": 724.6666666666666, "x": "半年後。"}, {"t": 725.6166666666667, "x": "部下は面談室で上司と向かい合っていました。"}, {"t": 728.4, "x": "面談の前に、上司は声を集めています。"}, {"t": 731.6666666666666, "x": "いくつかの部署から、部下についての声です。"}, {"t": 734.6666666666666, "x": "その中に、例の部署から届いた\n短い一文がありました。"}, {"t": 738.7166666666667, "x": "部署の間に立つ時は、もう少しどちらにも\n寄らない姿勢を望む。"}, {"t": 743.0166666666667, "x": "そういう中身です。"}, {"t": 744.4166666666666, "x": "上司はその一文をどう書くか、かなり迷ったようです。"}, {"t": 748.25, "x": "原因の一部が自分の昼休みの\n話にあると薄々感じていたからです。"}, {"t": 752.95, "x": "結局、評価の欄に残ったのは一言です。"}, {"t": 756.25, "x": "調整の場面で中立さを期待するというものでした。"}, {"t": 759.5833333333334, "x": "冒頭の面談で部下が聞かされたのはこの一言です。"}, {"t": 762.8333333333334, "x": "仕事の中身について、厳しいことは\n何も書かれていませんでした。"}, {"t": 767.2166666666667, "x": "提案の質も締め切りの守り方も、\nむしろよく書かれていたほどです。"}, {"t": 771.6, "x": "それでも立ち位置についての\n一言だけが評価の紙に残りました。"}, {"t": 775.5, "x": "部下が半年で失ったものは、\n仕事の成果ではありません。"}, {"t": 779.5333333333333, "x": "自分の意見を、自分の意見として\n聞いてもらえる立場です。"}, {"t": 783.5666666666667, "x": "その立場は目に見える形で\n取り上げられたわけではありませんでした。"}, {"t": 787.6333333333333, "x": "一回ずつの相づちの中で少しずつ\n削られていったものです。"}, {"t": 791.3833333333333, "x": "その間、部下は何一つ悪口を口にしていません。"}, {"t": 795.0666666666667, "x": "言ってはいません。"}, {"t": 796.25, "x": "それでも言っていた人と同じ場所に\n立っていたことになります。"}, {"t": 799.6, "x": "ここでは、これを立ち位置の記録と呼んでおきます。"}, {"t": 802.9, "x": "立ち位置の記録は、本人の言葉では書かれません。"}, {"t": 806.3666666666667, "x": "周りの見え方のほうで、書かれていきます。"}, {"t": 809.3666666666667, "x": "書かれた記録は、あとに残る\n場面で表に出やすいものです。"}, {"t": 813.4333333333333, "x": "たとえば、評価や配置です。"}, {"t": 815.7833333333333, "x": "表に出た時にはもう遅いのです。"}, {"t": 817.9833333333333, "x": "どの相づちが始まりだったのか、\n指でさすことができません。"}, {"t": 821.9166666666666, "x": "面談の最後に上司は少し黙りました。"}, {"t": 824.6333333333333, "x": "それから昼休みの件を謝りかけました。"}, {"t": 827.4, "x": "でも言いかけた言葉を飲み込みます。"}, {"t": 829.55, "x": "上司は次の半期の目標の話へ移りました。"}, {"t": 832.7666666666667, "x": "二人の間にはまだ名前のついていない\n気まずさが残りました。"}, {"t": 836.4833333333333, "x": "では、あの昼休みに部下には\n別の返し方があったのでしょうか。"}, {"t": 840.8833333333333, "x": "あの昼休みに部下が取れた返し方を\n三つ並べてみます。"}, {"t": 844.4833333333333, "x": "一つ目は、うなずいて同調する返しです。"}, {"t": 847.6666666666666, "x": "今回の話のとおりです。"}, {"t": 849.4833333333333, "x": "同調は、その場の空気を一番やわらかく保ちます。"}, {"t": 853.2833333333333, "x": "そのかわり、相づちの名札が\n少しずつ背中に貼られていきます。"}, {"t": 857.5666666666667, "x": "二つ目は、それは違うのではと否定する返しです。"}, {"t": 861.1666666666666, "x": "否定すると、名前の出た相手を\nかばう側に立つことになりやすいものです。"}, {"t": 865.85, "x": "かばう側に立てば今度は、上司との\n間に別の名札が貼られます。"}, {"t": 870.2833333333333, "x": "上司を否定する。"}, {"t": 871.5833333333334, "x": "それは、異動して二週目の部下にとって、\nとても重い一歩です。"}, {"t": 876.35, "x": "三つ目が、話の中の事実だけを聞き返す返しです。"}, {"t": 880.2833333333333, "x": "返事が遅いのはどの件なのか。"}, {"t": 882.3833333333333, "x": "仕事の中身を確かめます。"}, {"t": 884.35, "x": "いつから止まっているのかも聞きます。"}, {"t": 886.4333333333333, "x": "誰の手元で止まっているのかも聞きます。"}, {"t": 888.8333333333334, "x": "聞き返された上司は、気持ちの話から離れます。"}, {"t": 892.4, "x": "そして、段取りの話へ戻りやすくなります。"}, {"t": 895.6166666666667, "x": "段取りの話になれば、相手を\n責める言葉は自然と減っていきます。"}, {"t": 900.15, "x": "減った分だけ、部下のうなずきが\n悪口の数に入ることもなくなります。"}, {"t": 904.7833333333333, "x": "事実を聞き返す返しは、上司の味方になりません。"}, {"t": 908.4666666666667, "x": "相手の味方にも、なりません。"}, {"t": 910.7833333333333, "x": "なるのは目の前の仕事の味方です。"}, {"t": 913.1166666666667, "x": "もう一つ添えるなら、上司の\n疲れにだけは触れてかまいません。"}, {"t": 917.1, "x": "大変な午前だったことだけを\n気持ちとして受け取るやり方です。"}, {"t": 920.7666666666667, "x": "気持ちを受け取ることと、話の中身に賛成すること。"}, {"t": 924.4333333333333, "x": "この二つは別のものとして扱えます。"}, {"t": 926.9, "x": "もちろんこの返し方で何もかもが\nうまく収まるとは限りません。"}, {"t": 930.8, "x": "聞き返されたことを少し物足りなく\n感じる上司もいるでしょう。"}, {"t": 934.5166666666667, "x": "それでも物足りなさは、名札より\nあとから取り返しやすいものです。"}, {"t": 938.8, "x": "ここでは、この返し方を事実の\n聞き返しと呼んでおきます。"}, {"t": 942.8166666666667, "x": "同調でも否定でもない三つ目の席がここにあります。"}, {"t": 946.0666666666667, "x": "その席に座ると、相づちはもうどちらかの\n立場には変わりません。"}, {"t": 950.5166666666667, "x": "一年後の夕方です。"}, {"t": 952.2166666666667, "x": "オンライン会議が終わりました。"}, {"t": 954.1, "x": "画面には上司と部下の二人だけが残っています。"}, {"t": 957.1333333333333, "x": "上司はカメラを切る前に、ため息をつきました。"}, {"t": 960.55, "x": "そして、別のチームの話を始めます。"}, {"t": 963.5666666666667, "x": "あのチームはまた資料の返事を\nよこさない、という不満でした。"}, {"t": 967.6666666666666, "x": "半年前の部下なら、ここで小さく\nうなずいていたはずです。"}, {"t": 971.65, "x": "今の部下は少しだけまを置きました。"}, {"t": 973.9166666666666, "x": "そして、その資料をいつどの宛先に\n送ったのかを聞き返しました。"}, {"t": 978.4666666666667, "x": "上司は手元のメールを開いて、\n送った日付を探し始めます。"}, {"t": 982.85, "x": "探しているうちに上司自身が気づきました。"}, {"t": 985.6166666666667, "x": "宛先が一人抜けていたのです。"}, {"t": 987.6166666666667, "x": "上司は苦笑いをしました。"}, {"t": 989.55, "x": "もう一度送り直すと言います。"}, {"t": 991.5833333333334, "x": "不満の話はそこで段取りの話に変わって終わります。"}, {"t": 995.1, "x": "部下はうなずきも否定もしませんでした。"}, {"t": 997.4666666666667, "x": "資料の件名を一緒に確かめただけでした。"}, {"t": 1000.3833333333333, "x": "次の週。"}, {"t": 1001.2833333333333, "x": "そのチームの人から部下あてに\n直接チャットが届きます。"}, {"t": 1004.7, "x": "資料の件は助かりました、という\n短いけれど温かい一文でした。"}, {"t": 1009.5, "x": "相づちを打たなかった、あの夕方の画面。"}, {"t": 1012.6833333333333, "x": "それが、知らないところで一つの\n名札を外していました。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

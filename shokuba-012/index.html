<title>叱ると伸びる人と叱ると止まる人</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;
  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 26px;box-shadow:0 2px 14px rgba(0,0,0,.10)}
#now{margin:0;text-align:center;white-space:pre-wrap;word-break:break-word;font-weight:700;
  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);
  font-size:12px;padding:3px 9px;border-radius:20px;line-height:1.6;letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}

.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:48px;flex:none;padding-top:2px}
.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}
  .bar button{padding:9px 11px;font-size:14px}.stage{padding:42px 14px 22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
const D={"name": "叱ると伸びる人と叱ると止まる人", "file": "012_叱ると伸びる人と叱ると止まる人", "dur": 935.1, "segs": [], "subs": [{"t": 0.0, "x": "まず、上司の側の頭の中から見ます。"}, {"t": 3.1666666666666665, "x": "見ているのは、午前の会議が終わった直後です。"}, {"t": 6.433333333333334, "x": "直後の席で、さっきの指摘を思い返しています。"}, {"t": 10.1, "x": "思い返しても、強く言った覚えはありません。"}, {"t": 13.283333333333333, "x": "ありませんし、中身も間違っていないはずです。"}, {"t": 16.566666666666666, "x": "はずなのに、相手の返事は短くなっていました。"}, {"t": 19.933333333333334, "x": "短くなった理由が、うまくつかめずにいます。"}, {"t": 23.15, "x": "いるうちに、次の打ち合わせの時間が来ます。"}, {"t": 26.25, "x": "来たので、その違和感はそこに置かれます。"}, {"t": 29.25, "x": "ここから、部下の側の頭の中に移ります。"}, {"t": 32.46666666666667, "x": "移った先には、会議の中身が残っていません。"}, {"t": 35.93333333333333, "x": "残っているのは、周りに七人いたことだけです。"}, {"t": 39.266666666666666, "x": "実際には、指摘そのものは短いものでした。"}, {"t": 42.61666666666667, "x": "短くても、その場の視線は全部そちらを向きます。"}, {"t": 46.25, "x": "向いた瞬間から、言われた中身は耳に入りません。"}, {"t": 49.93333333333333, "x": "入らないまま、その日の残りが過ぎていきます。"}, {"t": 53.233333333333334, "x": "過ぎた後に残るのは、恥ずかしさの方だけです。"}, {"t": 56.583333333333336, "x": "この二つは、同じ日の同じ五分間の話です。"}, {"t": 60.06666666666667, "x": "同じ五分を、片方は言葉の強さで測っています。"}, {"t": 63.8, "x": "測っているもう片方は、その場の人数を数えています。"}, {"t": 67.76666666666667, "x": "数えているものが違えば、話はかみ合いません。"}, {"t": 71.16666666666667, "x": "今日は、このかみ合わなさの正体を見ていきます。"}, {"t": 74.46666666666667, "x": "最初に、言う側が置いている前提を見ます。"}, {"t": 77.8, "x": "前提は、同じ強さで\n言えば公平になるというものです。"}, {"t": 81.78333333333333, "x": "公平にしたいという気持ちは、まっすぐなものです。"}, {"t": 85.18333333333334, "x": "まっすぐなので、相手で変えるのは\n不公平に見えます。"}, {"t": 88.83333333333333, "x": "見えるからこそ、言い方をそろえようとします。"}, {"t": 91.98333333333333, "x": "そろえているのは、たしかに言葉の側です。"}, {"t": 94.93333333333334, "x": "言葉の側がそろっても、受け取る条件は違います。"}, {"t": 98.63333333333334, "x": "違うのは、その時どこに立っていたかです。"}, {"t": 101.56666666666666, "x": "自分の席で聞いた人と、会議室で聞いた人がいます。"}, {"t": 105.41666666666667, "x": "廊下ですれ違いざまに言われた人もいます。"}, {"t": 108.06666666666666, "x": "同じ一言でも、この三つは別の出来事になります。"}, {"t": 111.73333333333333, "x": "別の出来事になるので、返る反応もそろいません。"}, {"t": 115.36666666666666, "x": "そろわない反応を見て、言う側は相性の話にします。"}, {"t": 119.43333333333334, "x": "相性の話にすると、そこで考えるのが\n止まりやすいです。"}, {"t": 123.5, "x": "止まった先で、同じやり方が次の人にも使われます。"}, {"t": 127.28333333333333, "x": "使われるたびに、当たり外れが生まれやすいです。"}, {"t": 130.58333333333334, "x": "生まれているのは、強さの差ではありません。"}, {"t": 133.45, "x": "差がついているのは、言われた場所の方です。"}, {"t": 136.51666666666668, "x": "場所の話を、もう少し細かく見ていきます。"}, {"t": 139.78333333333333, "x": "二つ目は、受け取る側が何を数えているかです。"}, {"t": 143.26666666666668, "x": "数えているのは、その場に何人いたかという数です。"}, {"t": 146.8, "x": "数そのものは、指摘の中身とは関係がありません。"}, {"t": 150.4, "x": "関係がないのに、受け取りの重さはここで決まります。"}, {"t": 153.96666666666667, "x": "決まる理由は、聞かれたという事実が残るからです。"}, {"t": 157.48333333333332, "x": "残った事実は、あとから消す手段がありません。"}, {"t": 160.83333333333334, "x": "ありませんし、本人の努力でも動かせません。"}, {"t": 164.15, "x": "動かせないものを抱えたまま、自分の席に戻ります。"}, {"t": 167.86666666666667, "x": "戻った後は、周りをうかがう時間が\n生まれやすいです。"}, {"t": 171.63333333333333, "x": "生まれた時間は、仕事の時間から引かれています。"}, {"t": 175.05, "x": "引かれた分は、誰の記録にも出てきません。"}, {"t": 178.18333333333334, "x": "出てこないので、言った側の目には映りません。"}, {"t": 181.4, "x": "映らない側からは、なぜ落ち込むのかが\n分かりません。"}, {"t": 184.96666666666667, "x": "分からないまま、気にしすぎだと片づけられます。"}, {"t": 188.11666666666667, "x": "片づけられた側は、次から返事を短くしやすいです。"}, {"t": 192.05, "x": "短い返事は、反省しているようにも見えます。"}, {"t": 195.3, "x": "見えるので、話はそこで終わってしまいます。"}, {"t": 198.35, "x": "終わった話の中に、直すべき中身は残りません。"}, {"t": 201.91666666666666, "x": "残らない原因は、人数の方にありました。"}, {"t": 205.11666666666667, "x": "三つ目は、人数が中で何をしているかです。"}, {"t": 208.35, "x": "人の目が増えると、頭の働く先が移ります。"}, {"t": 211.83333333333334, "x": "移った先は、指摘の中身の方ではありません。"}, {"t": 215.25, "x": "どう見られているか、という方に向きます。"}, {"t": 218.2, "x": "向いている間、耳は音だけを拾っています。"}, {"t": 221.38333333333333, "x": "拾えないまま終われば、直す手がかりも残りません。"}, {"t": 224.8, "x": "残らないので、同じことが二度目に起きやすいです。"}, {"t": 228.21666666666667, "x": "二度目が起きると、言う側は聞いていないと考えます。"}, {"t": 231.88333333333333, "x": "考えた通りに、次はもっと強く言うことになります。"}, {"t": 235.58333333333334, "x": "強くなった分だけ、周りの視線も集まります。"}, {"t": 239.15, "x": "集まった視線が、また中身を遠ざけます。"}, {"t": 242.28333333333333, "x": "遠ざけ合うこの形は、どちらの意図とも違います。"}, {"t": 245.73333333333332, "x": "違うのに、繰り返すほど深くなっていきます。"}, {"t": 248.88333333333333, "x": "深くなる前に、外せる条件が一つあります。"}, {"t": 252.25, "x": "一つとは、人の数を先に減らすことです。"}, {"t": 255.28333333333333, "x": "減らす方法は、場所を変えるだけで足ります。"}, {"t": 258.31666666666666, "x": "足りるのに、その手間は惜しまれることがあります。"}, {"t": 261.4, "x": "惜しまれるのは、たいてい急いでいる時です。"}, {"t": 264.3833333333333, "x": "急いでいる時の三十秒を、次に見ます。"}, {"t": 267.45, "x": "四つ目は、言われた直後に起きることです。"}, {"t": 270.51666666666665, "x": "直後の三十秒は、内容を置く場所が決まる時間です。"}, {"t": 274.5, "x": "決まる先は、作業の棚か自分の棚かに分かれます。"}, {"t": 278.1666666666667, "x": "作業の棚に入れば、翌日には手順として使えます。"}, {"t": 282.23333333333335, "x": "自分の棚に入ると、評価の記憶として残ります。"}, {"t": 285.9166666666667, "x": "残った記憶は、仕事のやり方を変えてくれません。"}, {"t": 289.48333333333335, "x": "変えてくれないのに、気持ちだけが重くなります。"}, {"t": 292.55, "x": "重さの分だけ、次の一歩が遅くなりやすいです。"}, {"t": 296.15, "x": "遅くなった動きを、言う側は効いていないと読みます。"}, {"t": 299.75, "x": "読み違えたまま、次の指摘がまた強くなります。"}, {"t": 303.25, "x": "この三十秒に、どちらが手を入れられるでしょうか。"}, {"t": 306.71666666666664, "x": "入れられるのは、たいてい言った側の方です。"}, {"t": 309.7, "x": "言った側が一行を足すだけで、置き場所は\n変わります。"}, {"t": 313.48333333333335, "x": "変わるのは、足された一行が向きを示すからです。"}, {"t": 316.96666666666664, "x": "示された向きの通りに、受け取る側は棚を選びます。"}, {"t": 320.78333333333336, "x": "選べた人は、翌朝から手を動かせます。"}, {"t": 323.9166666666667, "x": "動かせた分が、そのまま次の結果になります。"}, {"t": 327.21666666666664, "x": "結果が出れば、指摘そのものの見え方も変わります。"}, {"t": 330.75, "x": "この分かれ目を、二人の側から順に見ます。"}, {"t": 333.8, "x": "五つ目は、伸びる側の聞き方です。"}, {"t": 336.45, "x": "聞き方の特徴は、注意を作業の話に寄せる点です。"}, {"t": 340.45, "x": "寄せると、直す対象が手順の中に見つかります。"}, {"t": 343.96666666666664, "x": "見つかれば、直す手はその日のうちに動きます。"}, {"t": 347.18333333333334, "x": "動いた手は、翌日には別の結果を出します。"}, {"t": 350.56666666666666, "x": "出た結果を見て、言った側も\n言い方をゆるめやすいです。"}, {"t": 354.43333333333334, "x": "ゆるんだ分、二人の間の空気も軽くなります。"}, {"t": 357.98333333333335, "x": "軽くなると、次の指摘は早い段階で出てきます。"}, {"t": 361.48333333333335, "x": "早い段階の指摘は、直す量も小さくて済みます。"}, {"t": 365.23333333333335, "x": "済むので、また同じ流れが回っていきます。"}, {"t": 368.3, "x": "この回り方は、性格の強さとは別のものです。"}, {"t": 371.9, "x": "別だと分かるのは、同じ人でも\n場面で変わるからです。"}, {"t": 375.56666666666666, "x": "変わる例は、画面越しの打ち合わせに出てきます。"}, {"t": 378.8833333333333, "x": "オンラインの会議で名指しされると、\n同じ人でも固まりやすいです。"}, {"t": 383.1, "x": "固まるのは、他の参加者の顔が\n並んで見えるからです。"}, {"t": 386.85, "x": "見えている状態では、作業の棚は開きにくくなります。"}, {"t": 390.6333333333333, "x": "開きにくい時に、無理に聞かせても入りません。"}, {"t": 393.93333333333334, "x": "入らない前提で、場を選び直すこともできます。"}, {"t": 397.5, "x": "選び直せない時に何が起きるかを、次に見ます。"}, {"t": 400.9166666666667, "x": "六つ目は、止まってしまう側の聞き方です。"}, {"t": 404.03333333333336, "x": "聞き方の違いは、受け取る時の主語にあります。"}, {"t": 407.3666666666667, "x": "主語が作業ではなく、自分の方になってしまいます。"}, {"t": 411.15, "x": "なってしまうと、直す対象が見つかりません。"}, {"t": 414.3, "x": "見つからないので、手の打ちようがなくなります。"}, {"t": 417.3, "x": "なくなった状態で残るのは、申し訳なさだけです。"}, {"t": 420.85, "x": "申し訳なさは、次の行動を細かくしていきます。"}, {"t": 424.45, "x": "細かくなると、確認の回数だけが増えます。"}, {"t": 427.78333333333336, "x": "増えた確認は、外からは自信の無さに\n映りやすいです。"}, {"t": 431.76666666666665, "x": "映った通りに、任せる範囲がしぼられていきます。"}, {"t": 435.25, "x": "しぼられた範囲では、経験の量も増えません。"}, {"t": 438.6666666666667, "x": "増えないまま、できないという評価が固まります。"}, {"t": 442.0, "x": "固まった評価は、本人の力と\nずれていることがあります。"}, {"t": 446.01666666666665, "x": "ずれている時でも、外からは同じ形に見えます。"}, {"t": 449.46666666666664, "x": "見えている形だけで判断すると、\n読み違えやすいです。"}, {"t": 453.35, "x": "読み違いを減らすには、主語を戻す作業が要ります。"}, {"t": 456.96666666666664, "x": "要るのは、長い面談の時間ではありません。"}, {"t": 460.0, "x": "短い一行で足りることが、分かってきています。"}, {"t": 463.3666666666667, "x": "その一行の中身を、次に見ます。"}, {"t": 466.1166666666667, "x": "七つ目は、その一行が何をしているかです。"}, {"t": 469.3666666666667, "x": "していることは、話の対象をはっきりさせることです。"}, {"t": 473.06666666666666, "x": "対象が手順だと分かれば、人の話にはなりません。"}, {"t": 476.75, "x": "なりませんが、黙っていると伝わりません。"}, {"t": 479.71666666666664, "x": "伝えるには、直す場所を先に置きます。"}, {"t": 482.5833333333333, "x": "置いた上で、できていた部分も一つ添えます。"}, {"t": 485.71666666666664, "x": "添えた部分があると、全部の否定にはなりません。"}, {"t": 489.1666666666667, "x": "ならない形にしておくと、耳が閉じずに済みます。"}, {"t": 492.68333333333334, "x": "済んだ状態で、はじめて中身が入っていきます。"}, {"t": 496.0833333333333, "x": "入る量は、言葉の強さでは増えません。"}, {"t": 499.15, "x": "増えるのは、対象がはっきりしている時です。"}, {"t": 502.283333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

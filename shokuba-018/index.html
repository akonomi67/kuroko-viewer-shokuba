<style>

<script>
const D={"name": "能力は同じなのに片方だけ相談される理由", "file": "018_能力は同じなのに片方だけ相談される理由", "dur": 1052.4333125, "segs": [], "subs": [{"t": 0.0, "x": "火曜の朝、朝礼が終わったところです。"}, {"t": 2.9833333333333334, "x": "終わった直後の廊下には、少しだけ人が滞ります。"}, {"t": 6.733333333333333, "x": "滞る流れの中で、一人がふっと足を止めます。"}, {"t": 10.3, "x": "止めた先にあるのは、同じ課の誰かの席です。"}, {"t": 13.483333333333333, "x": "席にいる人へ、相談してもいいですかと\n声がかかります。"}, {"t": 17.583333333333332, "x": "声をかけられた側は、画面から目を上げます。"}, {"t": 20.8, "x": "上げてから、椅子ごと体を相手の方へ向け直します。"}, {"t": 24.516666666666666, "x": "向け直したまま、最後まで口を\nはさまずに聞いています。"}, {"t": 28.366666666666667, "x": "聞き終えてから、短い質問をひとつだけ返します。"}, {"t": 31.983333333333334, "x": "返された側は、そこでしばらく黙って考え込みます。"}, {"t": 35.666666666666664, "x": "考え込んだ末に、自分で答えの方を言い始めます。"}, {"t": 39.583333333333336, "x": "言い始めた答えに、相手は相づちだけを\n返しています。"}, {"t": 43.46666666666667, "x": "返ってきた相づちで、その相談は静かに終わります。"}, {"t": 47.3, "x": "終わった後、相談した側は軽い顔で\n自分の席へ戻ります。"}, {"t": 51.583333333333336, "x": "戻る途中の通路には、もう一人の席も並んでいます。"}, {"t": 55.333333333333336, "x": "並んでいる席の主も、同じ年数と\n同じ力を持っています。"}, {"t": 59.583333333333336, "x": "持っているのに、そこで足を\n止める人はとても少ないです。"}, {"t": 63.3, "x": "少ない理由を、能力の差だけでは説明しきれません。"}, {"t": 67.15, "x": "説明しきれないのは、\n差が別のところにあるからです。"}, {"t": 70.8, "x": "別のところとは、話の受け方と終わらせ方の癖です。"}, {"t": 74.6, "x": "今日は、この二つの癖がどこで\n分かれるのかを見ていきます。"}, {"t": 78.45, "x": "見てしまえば、直せる場所は\n一つだけだと分かります。"}, {"t": 81.96666666666667, "x": "まず、相談が集まる人の共通点から探していきます。"}, {"t": 86.18333333333334, "x": "探して最初に出てくるのは、\nたいてい答えの速さです。"}, {"t": 89.98333333333333, "x": "速く正しく返せるから集まる、という見方があります。"}, {"t": 93.81666666666666, "x": "この見方は、実際に確かめてみると\n当たっていません。"}, {"t": 97.53333333333333, "x": "では、知識の量が多いからなのでしょうか。"}, {"t": 100.61666666666666, "x": "量の多い人ほど集まるのなら、\n順番はもっと単純になります。"}, {"t": 105.05, "x": "単純にならないのは、量だけでは\n決まらないからです。"}, {"t": 108.56666666666666, "x": "では、面倒見のよさが効いているのでしょうか。"}, {"t": 111.83333333333333, "x": "よさの度合いだけなら、この二人はそう変わりません。"}, {"t": 115.25, "x": "変わらないのに、片方にだけ足が向かっています。"}, {"t": 118.61666666666666, "x": "向かう先を決めているのは、\n話を受けた後の数十秒です。"}, {"t": 122.75, "x": "数十秒のうちに、集まる人は\n自分の答えを出しません。"}, {"t": 126.88333333333334, "x": "出さないまま、相手の話が終わるのを\n静かに待っています。"}, {"t": 130.83333333333334, "x": "待っている間に、相談した側は\n考えを並べ直しています。"}, {"t": 135.18333333333334, "x": "並べ直した頭で、自分の答えへ近づいていきます。"}, {"t": 139.0, "x": "近づいて出てきた答えは、外から\n渡された案より強いです。"}, {"t": 143.13333333333333, "x": "強いので、そのまま持ち帰って動ける場合があります。"}, {"t": 146.88333333333333, "x": "動けた経験が、次にまた同じ人へ\n足を向かわせています。"}, {"t": 151.05, "x": "向かわせているのは、答えの\n速さの方ではありません。"}, {"t": 154.6, "x": "二つ目は、途中で出される答えが何をするかです。"}, {"t": 158.16666666666666, "x": "答えというものは、話を前に進める道具に見えます。"}, {"t": 162.06666666666666, "x": "見えますが、途中で出た答えは話をそこで止めます。"}, {"t": 165.75, "x": "止まるのは、相談がだいたい三つの\n段を踏むからです。"}, {"t": 169.41666666666666, "x": "一つ目の段は、起きたことを\nそのまま並べて話す段です。"}, {"t": 173.43333333333334, "x": "二つ目の段は、自分がどう困っているのかを\n言う段です。"}, {"t": 177.35, "x": "三つ目の段が、何を決めたいのかに\nたどり着く段になります。"}, {"t": 181.23333333333332, "x": "三つ目まで行く前に答えが出ると、\n話は一段目で閉じます。"}, {"t": 185.36666666666667, "x": "閉じた相談は、本当に聞きたかった場所まで\n届きません。"}, {"t": 189.26666666666668, "x": "届かないまま、相談した側は\n礼を言って席へ戻ります。"}, {"t": 193.28333333333333, "x": "戻った席では、困りごとがそのまま残っています。"}, {"t": 196.86666666666667, "x": "残っているのに、もう一度は\n言い出しにくくなっています。"}, {"t": 200.46666666666667, "x": "にくいのは、一度答えをもらった\n形になっているからです。"}, {"t": 204.31666666666666, "x": "形になっているので、次は別の\n人のところへ足が向きます。"}, {"t": 208.31666666666666, "x": "一方で、答えを出さずに待った側は\n何も足していません。"}, {"t": 212.23333333333332, "x": "足していないように見えて、\n三つの段を最後まで通しています。"}, {"t": 216.31666666666666, "x": "通した相談では、本人が決めたい一点まで\n表に出てきます。"}, {"t": 220.6, "x": "出てしまえば、あとはその人が自分で片づけます。"}, {"t": 224.13333333333333, "x": "片づけられた実感が、静かに評判を作っていきます。"}, {"t": 228.15, "x": "三つ目は、途中で終わった相談の\nその後についてです。"}, {"t": 231.95, "x": "その後は、時間を置いてから形になって出てきます。"}, {"t": 235.58333333333334, "x": "出てくるまでの間、目に見える変化はありません。"}, {"t": 238.96666666666667, "x": "ありませんが、相談した側の\n中では順番が入れ替わります。"}, {"t": 243.16666666666666, "x": "入れ替わった順番は、次に困った\n時にそのまま効いてきます。"}, {"t": 247.26666666666668, "x": "効いた結果として、最初に思い浮かぶ\n顔が変わることがあります。"}, {"t": 251.51666666666668, "x": "変わったことは、一週間では気づけない大きさです。"}, {"t": 255.15, "x": "一ヶ月たつと、席へ来る回数に差が出てきます。"}, {"t": 258.73333333333335, "x": "出てきた差を、来られなくなった本人は\nまだ見ていません。"}, {"t": 262.45, "x": "見えないのは、来なかった人の\n数を数えられないからです。"}, {"t": 266.2, "x": "数えられないものは、直す材料にもなってくれません。"}, {"t": 269.7, "x": "なってくれないので、同じ返し方が\nそのまま続いていきます。"}, {"t": 273.71666666666664, "x": "半年ほどたつ頃には、耳に入ってくる話の\n量が変わります。"}, {"t": 278.03333333333336, "x": "変わった量は、仕事の進めやすさに効いてきます。"}, {"t": 281.51666666666665, "x": "効いてくるのは、困りごとが\n早い段階で届いているからです。"}, {"t": 285.5, "x": "届いている人は、問題がまだ小さいうちに\n手を打てます。"}, {"t": 289.4, "x": "打てなかった人は、大きくなってから\n知らされる側に回ります。"}, {"t": 293.3833333333333, "x": "知らされた時には、選べる手が減っています。"}, {"t": 296.51666666666665, "x": "減った理由は、力の差ではなく届く早さの\n差の方です。"}, {"t": 300.65, "x": "四つ目は、最後まで聞く人が何をしているのかです。"}, {"t": 304.28333333333336, "x": "していることは、助言を足すことではありません。"}, {"t": 307.43333333333334, "x": "相づちを打って、続きを黙って\n待っている場合が多いです。"}, {"t": 311.3833333333333, "x": "多いのに、相談した側は助けてもらったと\n感じやすいです。"}, {"t": 315.48333333333335, "x": "感じる理由は、声に出して話すという\n作業の側にあります。"}, {"t": 319.6666666666667, "x": "人は声に出すと、頭の中の考えが\n順番に並び始めます。"}, {"t": 324.15, "x": "並んだ考えは、頭の中にあった時より短くなります。"}, {"t": 328.2, "x": "短くなった困りごとは、自分で\n扱える大きさに見えてきます。"}, {"t": 332.55, "x": "見えてきた時点で、\n答えはもうほとんど手元にあります。"}, {"t": 336.21666666666664, "x": "手元にあるものを、外から渡す必要はありません。"}, {"t": 339.78333333333336, "x": "一方で、何かを足そうとする人は最後まで待てません。"}, {"t": 343.71666666666664, "x": "待てないのは、役に立ちたい\n気持ちが強くあるからです。"}, {"t": 347.31666666666666, "x": "強くあるからこそ、話の途中で\n自分の経験談が出てきます。"}, {"t": 351.7, "x": "出てきた経験談は、相手が話していた件とは\n別の話です。"}, {"t": 356.1, "x": "別の話が入ってくると、並びかけていた\n考えは崩れます。"}, {"t": 360.4166666666667, "x": "崩れた側は、その場でもう一度\n組み直すことができません。"}, {"t": 364.3, "x": "直せないまま、そうですねと言って話を切り上げます。"}, {"t": 368.03333333333336, "x": "切り上げた後に残るのは、聞いてもらえなかった\n感じです。"}, {"t": 371.8333333333333, "x": "その感じの方だけは、本人がはっきり覚えて帰ります。"}, {"t": 375.8, "x": "五つ目は、実際に起きている\n場面の方から見ていきます。"}, {"t": 379.6666666666667, "x": "給湯室の前で、片方がもう片方の\n相手を呼び止めます。"}, {"t": 383.8666666666667, "x": "呼び止めた用件は、進め方を\n決めかねている一件です。"}, {"t": 387.85, "x": "一件の中身を、起きた順に並べて話し始めます。"}, {"t": 391.53333333333336, "x": "始まった話は、何度も行ったり来たりしています。"}, {"t": 394.9, "x": "行ったり来たりする間、聞いている側は\n口を出しません。"}, {"t": 398.73333333333335, "x": "出さずに、そうでしたか、と短く受けているだけです。"}, {"t": 402.68333333333334, "x": "受けてもらえた側は、話しながら\n順番を直していきます。"}, {"t": 406.51666666666665, "x": "直していくうちに、引っかかっていた\n一点だけが残ります。"}, {"t": 410.3833333333333, "x": "残った一点を、相談した本人が\n声に出して言い当てることがあります。"}, {"t": 415.1166666666667, "x": "言い当てた時点で、その相談は\n半分終わったことになります。"}, {"t": 419.23333333333335, "x": "なった後は、それをどう伝えるかという\n相談に変わります。"}, {"t": 423.1333333333333, "x": "変わってからなら、聞いている側も一言だけ足せます。"}, {"t": 426.68333333333334, "x": "足された一言は、本人が出した結論を\n押す形になります。"}, {"t": 430.78333333333336, "x": "押された結論は、自分で決めたものとして\n手元に残ります。"}, {"t": 434.81666666666666, "x": "残るものが自分の決定なら、\n次の動き出しも速くなります。"}, {"t": 439.06666666666666, "x": "この流れを、ここでは引き出しの\n整理と呼んでおきます。"}, {"t": 442.6666666666667, "x": "整理を手伝った人は、中身を一つも足していません。"}, {"t": 446.3, "x": "足さずに終われる人が、次も\nまた呼び止められています。"}, {"t": 449.81666666666666, "x": "六つ目は、手が離せない時に\n出てくる一言目の話です。"}, {"t": 453.8, "x": "一言目には、その人の癖が濃く出てしまいます。"}, {"t": 457.18333333333334, "x": "出やすいのは、結論から言ってほしいという\n催促の形です。"}, {"t": 461.35, "x": "催促そのものは、悪いものではありません。"}, {"t": 464.4166666666667, "x": "ありませんが、相談の場面には\n向かないことがあります。"}, {"t": 468.1, "x": "向かないのは、まだ結論の無い\n状態で来ているからです。"}, {"t": 471.76666666666665, "x": "結論の無い人に結論を求めると、\n話は途中で作られます。"}, {"t": 476.15, "x": "作られた結論は、本当の困りごとと\nずれる場合があります。"}, {"t": 480.25, "x": "ずれたまま答えを返せば、返した答えも\nずれたままです。"}, {"t": 484.1333333333333, "x": "返された側は、\nその場では分かりましたと言っておきます。"}, {"t": 487.8333333333333, "x": "言いながら、役に立たなかったことは\n本人も分かっています。"}, {"t": 491.75, "x": "分かった人は、次に困った時に\n相手を変える場合があります。"}, {"t": 495.8833333333333, "x": "一方で、忙しい時ほど先に長さを区切る人がいます。"}, {"t": 500.03333333333336, "x": "五分だけ聞きます、と最初に置いてしまう形です。"}, {"t": 503.78333333333336, "x": "置かれた側は、その五分に何を\n入れるかを自分で選べます。"}, {"t": 507.8333333333333, "x": "選んで話した五分は、中身の\nとても濃い五分になります。"}, {"t": 511.73333333333335, "x": "濃くなるのは、終わりの位置が\n先に見えているからです。"}, {"t": 515.2, "x": "見えている五分なら、聞く側も途中で気が散りません。"}, {"t": 518.8666666666667, "x": "散らずに届いた五分が、次の\n一件を連れてきてくれます。"}, {"t": 522.8, "x": "七つ目は、返事をしている時の\n体の向きについてです。"}, {"t": 526.6, "x": "体の向きは、言葉の中身よりも先に相手へ届きます。"}, {"t": 530.5166666666667, "x": "声をかけられて、手を止めないまま\n答える人がいます。"}, {"t": 534.0, "x": "答えの中身は正しく、どこも間違ってはいません。"}, {"t": 537.5166666666667, "x": "間違っていないのに、相談した側の顔は晴れません。"}, {"t": 541.2166666666667, "x": "晴れないのは、ついでに扱われたと\n感じているからです。"}, {"t": 544.9333333333333, "x": "感じさせているのは、答えの\n中身ではなく姿勢の方です。"}, {"t": 548.8333333333334, "x": "姿勢は、キーボードの音だけでも伝わります。"}, {"t": 551.9666666666667, "x": "伝わった音は、話している側の言葉を短くさせます。"}, {"t": 555.9, "x": "短くなった相談からは、肝心の背景が落ちていきます。"}, {"t": 559.95, "x": "落ちた背景の分だけ、答えの精度も下がります。"}, {"t": 563.5833333333334, "x": "下がった答えを、相手は薄い答えとして\n持ち帰ります。"}, {"t": 567.4, "x": "同じことは、文字だけのやり取りの\n中でも起きています。"}, {"t": 570.8833333333333, "x": "チャットで届いた相談に、了解とだけ返す場合です。"}, {"t": 574.6333333333333, "x": "返された一語は、読んだという\n意味しか運んでくれません。"}, {"t": 578.4166666666666, "x": "運ばない一語が続くと、相談は\n軽い雑談に化けていきます。"}, {"t": 582.7666666666667, "x": "化けた雑談は、やがて別のグループの方へ\n移っていきます。"}, {"t": 586.8, "x": "この落差を、ここではついで扱いと呼んでおきます。"}, {"t": 590.3166666666667, "x": "ついで扱いは、本人にだけ見えていません。"}, {"t": 593.5333333333333, "x": "八つ目は、その三秒がどう積み上がるかという話です。"}, {"t": 597.5166666666667, "x": "一回きりの三秒は、誰の一日も変えたりしません。"}, {"t": 601.4666666666667, "x": "変えないので、わざわざ指摘される\n機会もありません。"}, {"t": 604.9, "x": "指摘が来ないまま、同じ三秒が\n毎日繰り返されていきます。"}, {"t": 609.1666666666666, "x": "繰り返しは、週に五回、月にすれば\n二十回になります。"}, {"t": 613.4666666666667, "x": "二十回のうち、相手は一度も文句を言ってはきません。"}, {"t": 617.3833333333333, "x": "言わない代わりに、声をかけてくる間隔が\n延びていきます。"}, {"t": 621.15, "x": "延びた間隔は、目に見える形では\nどこにも表れません。"}, {"t": 625.0833333333334, "x": "表れないので、本人は何も起きていないと\n思っています。"}, {"t": 628.9666666666667, "x": "思っている間に、相談の方は\n別の席へ流れていきます。"}, {"t": 633.1333333333333, "x": "流れた先では、同じ話が丁寧に扱われています。"}, {"t": 637.1333333333333, "x": "扱われた側は、そちらを窓口として覚えてしまいます。"}, {"t": 641.1, "x": "覚えられた人のところへ、情報も\n先に入るようになります。"}, {"t": 645.35, "x": "入らなくなった人は、いつも後から知る側に回ります。"}, {"t": 649.1666666666666, "x": "回った先で、話が違うと感じる場面が増えます。"}, {"t": 653.0, "x": "増えた場面を、外されていると\n読んでしまうことがあります。"}, {"t": 656.7666666666667, "x": "読み違えてしまうと、直す場所を探し当てられません。"}, {"t": 660.4833333333333, "x": "当てるべき場所は、その三秒の\n使い方だけのはずです。"}, {"t": 664.2833333333333, "x": "三秒はごく短いですが、毎日あると\n景色まで変えます。"}, {"t": 668.5666666666667, "x": "九つ目は、自分では気づけない癖そのものの話です。"}, {"t": 672.55, "x": "癖の中でも、口ぐせは見えにくい部類です。"}, {"t": 675.8166666666667, "x": "見えにくいのは、耳のある位置が違うからでしょうか。"}, {"t": 679.2166666666667, "x": "位置の問題だけなら、録音すれば片が付きます。"}, {"t": 682.7, "x": "片が付かないのは、意味の受け取り方まで\n違うからです。"}, {"t": 686.3833333333333, "x": "たとえば、それはこうすればいい、という\n一言があります。"}, {"t": 690.6333333333333, "x": "言っている側は、助けのつもりで\nその言葉を出しています。"}, {"t": 694.35, "x": "つもりの通りに受け取る相手も、実際にいます。"}, {"t": 697.6833333333333, "x": "一方で、話を切られたと感じてしまう人も必ずいます。"}, {"t": 701.85, "x": "同じ一言が、二つの違う意味で届いてしまう形です。"}, {"t": 705.75, "x": "届き方の差は、言った側から\n確かめるすべがありません。"}, {"t": 709.6, "x": "確かめられないまま、人は良い意味の方を\n採用します。"}, {"t": 713.35, "x": "採用した本人は、悪い方の意味があることを\n知りません。"}, {"t": 717.4166666666666, "x": "知らないので、同じ一言を何年でも\n使い続けていきます。"}, {"t": 721.55, "x": "使い続けた年数の分だけ、二人の\n差は広がっていくことがあります。"}, {"t": 726.2, "x": "広がった差は、本人の目には\n運の違いのように見えます。"}, {"t": 730.05, "x": "運に見えている限り、直すべき対象は\n見つかりません。"}, {"t": 733.8333333333334, "x": "見つけるには、\n外の誰かに教えてもらうしかありません。"}, {"t": 737.4666666666667, "x": "教えてもらう方法は、思っているより簡単です。"}, {"t": 741.0333333333333, "x": "十個目は、その簡単な方法の中身についてです。"}, {"t": 744.7333333333333, "x": "中身は、近くにいる人へ一度だけ\n聞いてみることです。"}, {"t": 748.3666666666667, "x": "自分の返し方はどう見えているか、と\n尋ねる形になります。"}, {"t": 752.5833333333334, "x": "尋ねる相手は、年上でも年下でも構いません。"}, {"t": 756.1833333333333, "x": "構わないのは、\n見え方を聞かせてもらうだけだからです。"}, {"t": 759.7666666666667, "x": "それだけなので、評価をしてもらう必要はありません。"}, {"t": 763.3333333333334, "x": "ありませんが、聞き方の側には\n少しだけこつがあります。"}, {"t": 767.1333333333333, "x": "こつは、良かったところを先に聞かないという点です。"}, {"t": 770.6333333333333, "x": "先に聞くと、相手は良い話だけで話を終わらせます。"}, {"t": 774.65, "x": "終わらせずに済むのは、場面を限って尋ねた時です。"}, {"t": 778.2833333333333, "x": "昨日のあの相談の時、どう見えましたかと限ります。"}, {"t": 781.9333333333333, "x": "限られた質問には、具体的な答えが返ります。"}, {"t": 785.4166666666666, "x": "返ってきた答えは、たいてい一行で終わります。"}, {"t": 788.85, "x": "一行だけでも、自分の中からは出てこない一行です。"}, {"t": 792.8, "x": "出てこない一行が、直すべき場所を指してくれます。"}, {"t": 796.3666666666667, "x": "一方で、誰にも聞かない人は\n推測だけで直そうとします。"}, {"t": 800.7, "x": "推測で直すと、合っていた癖の方まで\n消してしまいます。"}, {"t": 804.6333333333333, "x": "消してしまえば、うまくいった部分も無くなります。"}, {"t": 807.9333333333333, "x": "無くさないために、確かめるのは一度きりで足ります。"}, {"t": 811.3666666666667, "x": "十一個目は、相談が集まった先で\n起きることの話です。"}, {"t": 815.5, "x": "起きるのは、その人のところへの\n情報の集まり方の変化です。"}, {"t": 819.7166666666667, "x": "相談には、まだどこにも表に\n出ていない話が混ざります。"}, {"t": 823.6833333333333, "x": "混ざるのは、誰かが困っている段階の話だからです。"}, {"t": 827.5, "x": "その段階の話は、資料にも記録にも\n残されていません。"}, {"t": 831.6333333333333, "x": "残されていない話を、先に知ることになる\n人が出てきます。"}, {"t": 835.6166666666667, "x": "出てきたその人は、手を打つ順番を自分で選べます。"}, {"t": 839.3333333333334, "x": "選べる人は、慌てて動くことになる場面が減ります。"}, {"t": 843.0, "x": "減った分だけ、周りからは落ち着いて見えています。"}, {"t": 846.7166666666667, "x": "一方で、届かない人は表に出てきた話から知ります。"}, {"t": 850.7, "x": "表に出てきた話は、もう形がほとんど決まっています。"}, {"t": 854.5166666666667, "x": "決まった話に、後から口を出していくのは\n重い動きです。"}, {"t": 858.4333333333333, "x": "重い動きが続くと、遅い人だという\n評価がつくことがあります。"}, {"t": 862.7333333333333, "x": "ついた評価は、能力の話として扱われやすいです。"}, {"t": 866.6666666666666, "x": "扱われてしまいますが、元にあるのは\n届く順番の差です。"}, {"t": 870.7, "x": "その順番は、朝礼で並ぶ場所とは\n何の関係もありません。"}, {"t": 875.0333333333333, "x": "関係があるのは、日々の受け方を\n重ねてきた分だけです。"}, {"t": 878.8833333333333, "x": "重ねてきた人のところへ、話は先に集まっていきます。"}, {"t": 883.0166666666667, "x": "集まる場所は、肩書きの高さでは決まっていません。"}, {"t": 886.5333333333333, "x": "最後に、二人の差がどこにあったのかをまとめます。"}, {"t": 889.95, "x": "差は、知識でも段取りのうまさでもありませんでした。"}, {"t": 893.55, "x": "ありませんでしたが、出てくる\n結果ははっきり分かれます。"}, {"t": 897.3666666666667, "x": "分かれ目は、話の終わらせ方という\n一点に置かれています。"}, {"t": 901.35, "x": "終わらせ方には、大きく分けて二つの形があります。"}, {"t": 905.0666666666667, "x": "一つは、こちらの答えを渡して終わらせる形です。"}, {"t": 908.7333333333333, "x": "この形は、その場では感謝されることがあります。"}, {"t": 912.1666666666666, "x": "されますが、次の相談まで連れてきてはくれません。"}, {"t": 915.75, "x": "もう一つは、相手の結論の方で終わらせる\n形になります。"}, {"t": 919.8666666666667, "x": "この形は、その場では何もしていないように見えます。"}, {"t": 923.4666666666667, "x": "見えますが、話した相手の中には長く残り続けます。"}, {"t": 927.25, "x": "残った分だけ、二度目や三度目が\n持ち込まれてきます。"}, {"t": 930.9666666666667, "x": "持ち込まれた回数は、そのまま信頼の\n形になっていきます。"}, {"t": 935.1, "x": "形になった信頼は、数字の欄には\n一行も出てきません。"}, {"t": 939.1333333333333, "x": "出てこないものを、周りの人は人柄と呼んでいます。"}, {"t": 942.8, "x": "呼ばれているものの中身は、\n受け方と終わらせ方の癖です。"}, {"t": 946.7666666666667, "x": "癖は、生まれつき決まっているものではありません。"}, {"t": 949.95, "x": "ものではないので、後からいくらでも\n入れ替えられます。"}, {"t": 953.3166666666667, "x": "入れ替えるのは、話の最後の三十秒だけで足ります。"}, {"t": 957.0333333333333, "x": "最後に、今日出てきた一語を並べ直しておきます。"}, {"t": 960.5166666666667, "x": "一語とは、相談に乗る、という短い言い方です。"}, {"t": 964.5333333333333, "x": "乗るという言葉を、片方は答えを\n出すことだと読みます。"}, {"t": 968.3666666666667, "x": "読んだ人は、早くて正しい答えの方を探し始めます。"}, {"t": 972.3166666666667, "x": "探すのは、相手のために時間を惜しまない姿勢です。"}, {"t": 976.05, "x": "もう片方は、最後まで置いてもらうことだと\n読んでいます。"}, {"t": 979.7666666666667, "x": "読んだ人は、答えより先に相手の\n話を最後まで通します。"}, {"t": 984.0666666666667, "x": "通すのは、答えは本人の中にあるという\n考え方からです。"}, {"t": 988.2, "x": "どちらの読み方も、それ自体が間違ってはいません。"}, {"t": 991.6833333333333, "x": "間違っていないので、どちらが\n正しいかは決められません。"}, {"t": 995.4, "x": "決められませんが、相手への\n届き方までは同じになりません。"}, {"t": 999.3333333333334, "x": "同じでない場所は、朝礼が終わった後の\n数分に現れます。"}, {"t": 1003.5, "x": "現れるのは、席へ戻る途中で\n交わされる立ち話の中です。"}, {"t": 1007.6833333333333, "x": "その数分のうちに、誰の前で\n足が止まるかが決まります。"}, {"t": 1011.8833333333333, "x": "決まる場所を見ておくだけで、\n二つの意味は見分けられます。"}, {"t": 1015.6333333333333, "x": "見分けた上で、次に足す言葉を\n一つだけ決めておきます。"}, {"t": 1019.4666666666667, "x": "決めておくのは、ほかには、という短い一言です。"}, {"t": 1023.2333333333333, "x": "ほかには、と足すだけで、相手の\n話はもう一段続きます。"}, {"t": 1027.7, "x": "続いた先に、その人自身の結論が\n出てくることがあります。"}, {"t": 1031.8333333333333, "x": "出てきた結論は、こちらが渡した案より長く残ります。"}, {"t": 1035.7333333333333, "x": "残る側に立ちたいのなら、足すのは一語で足ります。"}, {"t": 1039.2166666666667, "x": "一語を置く場所は、答えを言いたくなった、\nその手前です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

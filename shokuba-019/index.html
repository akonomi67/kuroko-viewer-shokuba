<script>
const D={"name": "教え方がうまい人が手順より先に渡しているもの", "file": "019_教え方がうまい人が手順より先に渡しているもの", "dur": 1080.96665625, "segs": [], "subs": [{"t": 0.0, "x": "四月の水曜日、新しく入った人の三日目です。"}, {"t": 3.8333333333333335, "x": "三日目の午前に、教える側が手順書を開きます。"}, {"t": 7.65, "x": "開いた手順書には、作業の順番が並んでいます。"}, {"t": 11.316666666666666, "x": "並んだ順番を、上から一つずつ説明していきます。"}, {"t": 15.116666666666667, "x": "説明しながら、教える側はこう考えています。"}, {"t": 18.783333333333335, "x": "考えているのは、抜けなく渡し切ることです。"}, {"t": 21.883333333333333, "x": "渡し切れば、あとは同じ手が動くと見ています。"}, {"t": 25.133333333333333, "x": "見ている先には、一人で回せる\nようになった姿があります。"}, {"t": 29.05, "x": "その姿を早く作りたいので、説明の速さが上がります。"}, {"t": 33.28333333333333, "x": "上がった速さのまま、午前が終わります。"}, {"t": 36.31666666666667, "x": "終わった午前を、教わる側はこう受け取っています。"}, {"t": 39.81666666666667, "x": "受け取ったのは、覚えきれない量の手順です。"}, {"t": 42.916666666666664, "x": "手順は分かりましたが、なぜそうするかは残りません。"}, {"t": 46.6, "x": "残らないまま、午後に似た作業が回ってきます。"}, {"t": 49.95, "x": "回ってきた作業は、朝の手順と少しだけ違います。"}, {"t": 53.733333333333334, "x": "違う部分をどう扱うかは、どこにも書いてありません。"}, {"t": 57.38333333333333, "x": "書いていないので、そこで手が止まってしまいます。"}, {"t": 60.516666666666666, "x": "止まったまま聞きに行くのは、気が引けます。"}, {"t": 63.31666666666667, "x": "引けた分だけ、確認は後ろに延びていきます。"}, {"t": 66.76666666666667, "x": "延びた先で、朝の説明はもう遠くなっています。"}, {"t": 70.33333333333333, "x": "遠くなった二つの景色は、同じ日の\n同じ午前の話です。"}, {"t": 74.43333333333334, "x": "同じ場面を見ていても、持ち帰るものは別々です。"}, {"t": 78.03333333333333, "x": "別々になる分かれ目は、教え方の\n丁寧さではありません。"}, {"t": 82.16666666666667, "x": "丁寧さよりも、何を先に渡したかで\n決まることがあります。"}, {"t": 86.18333333333334, "x": "今日は、その順番のところだけを見ていきます。"}, {"t": 89.45, "x": "まず、手順だけを渡した時に何が起きるかを見ます。"}, {"t": 93.33333333333333, "x": "起きるのは、書いてある通りの\n日は静かに回ることです。"}, {"t": 97.06666666666666, "x": "回っている間は、教えた側も\n安心して見ていられます。"}, {"t": 101.13333333333334, "x": "見ていられるのは、例外がまだ来ていないからです。"}, {"t": 104.36666666666666, "x": "例外は、たいてい数日のうちにやってきます。"}, {"t": 107.61666666666666, "x": "先方からの依頼が、いつもの形と少し違って届きます。"}, {"t": 111.71666666666667, "x": "届いた形が違うと、手順のどの行にも\n当てはまりません。"}, {"t": 115.86666666666666, "x": "当てはまらない時、新しく入った人の手は止まります。"}, {"t": 119.61666666666666, "x": "止まった理由は、覚えが悪いからとは限りません。"}, {"t": 123.15, "x": "限らないのは、止まる場所が\n手順の外にあるからです。"}, {"t": 126.75, "x": "外にあるものは、何度読み返しても出てきません。"}, {"t": 130.08333333333334, "x": "出てこないので、同じ資料を三回開くことになります。"}, {"t": 133.83333333333334, "x": "開き直している間、教えた側は\n順調だと考えています。"}, {"t": 138.21666666666667, "x": "考えたまま昼が過ぎ、夕方に遅れが表へ出ます。"}, {"t": 141.98333333333332, "x": "出てきた遅れを見て、伝え方の\n細かさを疑い始めます。"}, {"t": 146.0, "x": "疑う先が細かさに向くと、次の\n説明はもっと長くなります。"}, {"t": 150.43333333333334, "x": "長くなった説明は、覚える量だけを増やします。"}, {"t": 154.03333333333333, "x": "増えた量は、例外の日には役に立ちません。"}, {"t": 157.18333333333334, "x": "立たないものを足し続けると、\n教える時間だけが伸びます。"}, {"t": 160.95, "x": "伸びた時間の割に、一人で回せる日は近づきません。"}, {"t": 164.63333333333333, "x": "二つ目は、教える側の頭の中にあるものです。"}, {"t": 168.23333333333332, "x": "頭の中には、手順のほかに判断の\n基準が入っています。"}, {"t": 172.28333333333333, "x": "入っているのは、どこまでなら\n自分で決めてよいかの線です。"}, {"t": 176.15, "x": "線を引く感覚は、何年もかけて体に入ったものです。"}, {"t": 180.2, "x": "入ってしまったものは、意識に上がってきません。"}, {"t": 183.35, "x": "上がってこないので、説明の中には出てきません。"}, {"t": 186.65, "x": "出てこない基準は、渡されていないのと同じです。"}, {"t": 190.06666666666666, "x": "同じ状態のまま、手順だけが正しく引き継がれます。"}, {"t": 193.76666666666668, "x": "引き継がれた手順は、判断の\n要らない日には動きます。"}, {"t": 197.48333333333332, "x": "動いている間、抜けている部分は誰にも見えません。"}, {"t": 201.03333333333333, "x": "見えないまま、教える側は渡し終えたと思います。"}, {"t": 204.71666666666667, "x": "思っているので、次の質問が来ると意外に感じます。"}, {"t": 208.36666666666667, "x": "感じた意外さは、そんなことも、という言葉に出ます。"}, {"t": 212.3, "x": "出た言葉は、聞く回数をそのまま減らします。"}, {"t": 215.55, "x": "減った回数の分、基準はますます渡りません。"}, {"t": 219.0, "x": "渡らない基準は、失敗を通してしか身につきません。"}, {"t": 222.73333333333332, "x": "つくまでの間、同じ種類のやり直しが続きます。"}, {"t": 226.3, "x": "続いたやり直しは、二人の時間を等しく削ります。"}, {"t": 229.96666666666667, "x": "削られた時間は、どちらの記録にも残りません。"}, {"t": 233.31666666666666, "x": "残らないので、何が原因だったかも\n分からなくなります。"}, {"t": 237.06666666666666, "x": "分からない状態が、次の新しい人にも\n繰り返されます。"}, {"t": 241.1, "x": "三つ目は、渡し忘れに気づけない仕組みの話です。"}, {"t": 244.73333333333332, "x": "仕組みとして、渡したかどうかは\n記憶で確かめられません。"}, {"t": 248.51666666666668, "x": "確かめられないのは、基準に形が無いからです。"}, {"t": 251.83333333333334, "x": "形の無いものは、手順書の目次にも並びません。"}, {"t": 255.25, "x": "並ばないので、教える側の確認の対象から外れます。"}, {"t": 259.3833333333333, "x": "外れたものは、抜けても警告が出ません。"}, {"t": 262.25, "x": "出ないまま、研修の予定表は最後まで進みます。"}, {"t": 266.0833333333333, "x": "進んだ予定表には、全部の項目に印がついています。"}, {"t": 270.3, "x": "ついた印を見ると、教え終えた実感が出ます。"}, {"t": 273.8666666666667, "x": "実感があるうちに、次の週から任せる話が始まります。"}, {"t": 278.06666666666666, "x": "始まった時点で、確かめられるのは手順だけです。"}, {"t": 281.56666666666666, "x": "だけを確かめて合格にすると、\n例外の日に差が出ます。"}, {"t": 285.51666666666665, "x": "出た差を、飲み込みの差として読むことがあります。"}, {"t": 288.76666666666665, "x": "読み違えると、足すのは説明の量になります。"}, {"t": 292.18333333333334, "x": "量を足しても、抜けているのは量ではありません。"}, {"t": 295.9, "x": "無いものを増やしても、穴はそのまま残ります。"}, {"t": 299.1666666666667, "x": "残った穴は、半年後の引き継ぎでもう一度開きます。"}, {"t": 303.01666666666665, "x": "開いた時、原因が最初の三日にあったとは\n気づきにくいです。"}, {"t": 307.3666666666667, "x": "気づきにくいので、同じ形の研修がまた組まれます。"}, {"t": 311.05, "x": "組まれるたびに、渡し忘れだけが\n静かに受け継がれます。"}, {"t": 314.76666666666665, "x": "四つ目は、覚える速さの正体です。"}, {"t": 317.75, "x": "正体は、生まれ持った能力の差なのでしょうか。"}, {"t": 321.1666666666667, "x": "差だけでは、説明がつかない場合があります。"}, {"t": 324.43333333333334, "x": "つかないのは、渡された順番が\n人によって違うからです。"}, {"t": 328.3333333333333, "x": "違う順番で受け取ると、同じ中身でも\n定着が変わります。"}, {"t": 332.4166666666667, "x": "変わるのは、最初に置かれたものが\n基準になるからです。"}, {"t": 336.01666666666665, "x": "基準が作業の順だけなら、次の\n情報もそこに並びます。"}, {"t": 340.0833333333333, "x": "並んだ情報は、増えるほど探しにくくなります。"}, {"t": 343.53333333333336, "x": "探しにくい状態では、思い出す時間が\n毎回かかります。"}, {"t": 347.65, "x": "かかる時間は、手が止まる時間として外に見えます。"}, {"t": 351.31666666666666, "x": "見えた時間だけで、覚えが遅いと\n判断されることがあります。"}, {"t": 355.3833333333333, "x": "判断された側は、量を増やして追いつこうとします。"}, {"t": 359.1333333333333, "x": "追いつこうとするほど、頭の中の棚は混みます。"}, {"t": 362.51666666666665, "x": "混んだ棚からは、必要なものが出てきません。"}, {"t": 365.5833333333333, "x": "出てこない経験が続くと、質問の\n前に自信が削れます。"}, {"t": 369.8666666666667, "x": "削れた自信は、確認の回数をさらに減らします。"}, {"t": 373.6166666666667, "x": "減った確認は、ずれたまま進む作業を増やします。"}, {"t": 377.3333333333333, "x": "増えた分は、最後にまとめて直すことになります。"}, {"t": 380.81666666666666, "x": "直す場面だけを見ると、本人の不注意に見えます。"}, {"t": 384.53333333333336, "x": "見えている形と、起きていることは\n違う場合があります。"}, {"t": 388.1666666666667, "x": "違いを生んでいるのは、最初に何を置いたかです。"}, {"t": 391.51666666666665, "x": "五つ目は、全体像から始める教え方です。"}, {"t": 394.96666666666664, "x": "始め方としては、親切な部類に入ります。"}, {"t": 398.26666666666665, "x": "入りますが、聞く側の受け取りは別のことがあります。"}, {"t": 401.95, "x": "あるのは、話が大きすぎて手が動かない状態です。"}, {"t": 405.6, "x": "状態として、どこから触ればよいかが決まりません。"}, {"t": 409.1166666666667, "x": "決まらないまま、部署全体の流れを聞かされます。"}, {"t": 412.48333333333335, "x": "聞かされた流れは、頭の中で絵になりません。"}, {"t": 415.75, "x": "ならないのは、まだ一度も手を\n動かしていないからです。"}, {"t": 419.2, "x": "動かしていない人にとって、\n全体像は地図になりません。"}, {"t": 423.03333333333336, "x": "地図として使えるのは、歩いた道がある人だけです。"}, {"t": 426.55, "x": "人によっては、全体から入るほうが\n合う場合もあります。"}, {"t": 430.48333333333335, "x": "その場合を除くと、たいていは先に一手が要ります。"}, {"t": 434.15, "x": "一手があれば、その周りから絵が広がっていきます。"}, {"t": 437.7, "x": "広がった絵に、あとから全体像を重ねられます。"}, {"t": 441.1166666666667, "x": "重ねる順番を逆にすると、最初の\n三日が空回りします。"}, {"t": 445.43333333333334, "x": "空回りした三日は、取り返すのに一週間かかります。"}, {"t": 449.4, "x": "かかっている間も、大事な話ほど流れていきます。"}, {"t": 453.0833333333333, "x": "流れた話を、教える側は伝えたと数えています。"}, {"t": 456.8833333333333, "x": "数えた分と受け取った分の差は、ここでも開きます。"}, {"t": 460.55, "x": "開いた差は、最初の一手を置くだけで\n縮むことがあります。"}, {"t": 464.3833333333333, "x": "六つ目は、一手を渡した後に起きることです。"}, {"t": 467.5833333333333, "x": "起きるのは、聞く側の質問が具体に変わることです。"}, {"t": 471.18333333333334, "x": "変わった質問は、答える側の手間も減らします。"}, {"t": 474.6, "x": "減るのは、何が分からないかがはっきりするからです。"}, {"t": 478.01666666666665, "x": "はっきりすれば、答えは一行で足りることがあります。"}, {"t": 481.6333333333333, "x": "足りる答えが続くと、聞くこと自体が軽くなります。"}, {"t": 485.1166666666667, "x": "軽くなった分、確認の回数は自然に増えます。"}, {"t": 488.8833333333333, "x": "増えた確認は、ずれを小さいうちに消します。"}, {"t": 492.21666666666664, "x": "消えた分だけ、やり直しの山が低くなります。"}, {"t": 495.6166666666667, "x": "低い山なら、教える時間も短く済みます。"}, {"t": 499.06666666666666, "x": "済んだ時間は、次の一手を渡す時間に回せます。"}, {"t": 502.85, "x": "回せるようになると、教え方は階段の形になります。"}, {"t": 506.73333333333335, "x": "階段の一段目は、戻せる小さな作業が向いています。"}, {"t": 510.71666666666664, "x": "向いているのは、結果がその日のうちに\n見えるものです。"}, {"t": 514.2333333333333, "x": "見えた結果は、次に進む足がかりになります。"}, {"t": 517.5333333333333, "x": "足がかりが一つできると、周りを\n自分で拾い始めます。"}, {"t": 521.6333333333333, "x": "拾い始めた人は、手順書の抜けにも気づきます。"}, {"t": 525.0166666666667, "x": "気づいた抜けを直すと、次の新しい人が助かります。"}, {"t": 528.8166666666667, "x": "助かった分は、教える側の時間として返ってきます。"}, {"t": 532.7666666666667, "x": "返ってくるまで待てるかどうかが、\n分かれ目になります。"}, {"t": 536.2833333333333, "x": "七つ目は、理由を一度だけ足す話です。"}, {"t": 539.3333333333334, "x": "足すのは、その作業が何のためにあるかの一行です。"}, {"t": 543.0666666666667, "x": "一行があると、似た場面で応用が利きます。"}, {"t": 546.4166666666666, "x": "利くので、二度目の質問が出なくなります。"}, {"t": 549.3666666666667, "x": "出なくなる分、教える時間は前より短くなります。"}, {"t": 553.2333333333333, "x": "短くなるのに、足す側は長くなると感じがちです。"}, {"t": 556.8833333333333, "x": "感じるのは、その場の説明が\n一行だけ伸びるからです。"}, {"t": 560.7166666666667, "x": "伸びるのが惜しくて、忙しい日ほど省きたくなります。"}, {"t": 564.3666666666667, "x": "省いた日の作業は、その日のうちは\n静かに終わります。"}, {"t": 568.1166666666667, "x": "終わるので、省いた影響はその場では見えません。"}, {"t": 571.6, "x": "見えない影響は、翌週の似た場面で出てきます。"}, {"t": 575.05, "x": "出てきた時、教える側は前に伝えたと考えます。"}, {"t": 578.8333333333334, "x": "考えていても、渡っていたのは手順だけでした。"}, {"t": 582.2166666666667, "x": "手順だけを持っている人には、\n応用の入口が見えません。"}, {"t": 586.2833333333333, "x": "見えない入口の前で、毎回同じ質問が生まれます。"}, {"t": 590.2166666666667, "x": "生まれた質問に短く答えるほど、理由は届きません。"}, {"t": 594.15, "x": "届かないまま、三度目の質問がやってきます。"}, {"t": 597.4166666666666, "x": "やってきた時に足す一行は、初回より重くなります。"}, {"t": 601.2, "x": "重くなる前に置いておくと、聞く側も楽になります。"}, {"t": 604.7666666666667, "x": "楽になった分、二人の会話は次の話へ進みます。"}, {"t": 608.8333333333334, "x": "八つ目は、同じ質問が何度も出る場面です。"}, {"t": 612.2666666666667, "x": "場面としては、記憶力の問題に見えてしまいます。"}, {"t": 615.8666666666667, "x": "問題は、本当にそこにあるのでしょうか。"}, {"t": 618.85, "x": "そこでない場合、原因は渡し方の側にあります。"}, {"t": 622.5666666666667, "x": "側にあるのは、理由が渡っていないという状態です。"}, {"t": 626.2333333333333, "x": "状態が続くと、覚え方は丸暗記の形になります。"}, {"t": 630.1, "x": "丸暗記は、少し形が変わると使えなくなります。"}, {"t": 633.6666666666666, "x": "使えなくなるたびに、同じ入口から質問が出ます。"}, {"t": 637.25, "x": "出た質問が同じに見えるのは、\n入口が同じだからです。"}, {"t": 641.1833333333333, "x": "同じ入口をふさぐには、手順を\n繰り返しても足りません。"}, {"t": 645.1666666666666, "x": "足りないのは、その手順が守っているものの\n説明です。"}, {"t": 648.8833333333333, "x": "説明が一度入ると、質問は別の入口から出てきます。"}, {"t": 653.0833333333334, "x": "出てくる場所が変われば、前に進んでいる合図です。"}, {"t": 656.7, "x": "合図を見落とすと、伸びていないと\n読んでしまいます。"}, {"t": 660.1166666666667, "x": "読み違えた側は、任せる範囲を広げなくなります。"}, {"t": 663.7833333333333, "x": "広がらない範囲の中では、経験も増えません。"}, {"t": 667.2333333333333, "x": "増えないまま、配属から三ヶ月が過ぎていきます。"}, {"t": 670.85, "x": "過ぎた頃にも、同じ質問はまだ残っています。"}, {"t": 674.2666666666667, "x": "残っている理由を、性格の話にしてしまう\n場合もあります。"}, {"t": 678.4333333333333, "x": "してしまうと、直せる場所が見えなくなります。"}, {"t": 681.5833333333334, "x": "見えるようにするには、質問の入口を並べてみます。"}, {"t": 685.3333333333334, "x": "九つ目は、手順書に書けない部分の話です。"}, {"t": 688.8333333333334, "x": "話として出てくるのは、例外の\n扱いと相手の事情です。"}, {"t": 692.9333333333333, "x": "事情は案件ごとに違うので、一つの文になりません。"}, {"t": 696.7666666666667, "x": "ならないものを無理に書くと、\n条件が枝分かれします。"}, {"t": 700.4333333333333, "x": "枝分かれした書類は、読む時間のほうが\n長くなります。"}, {"t": 704.15, "x": "長くなった書類は、結局あまり読まれません。"}, {"t": 707.4166666666666, "x": "読まれない資料を作る時間は、\nけっこうな量になります。"}, {"t": 711.3166666666667, "x": "量の割に、例外の日はその場で\n口頭で聞くことになります。"}, {"t": 715.4, "x": "聞かれる側は、同じ説明を何度も繰り返します。"}, {"t": 719.0333333333333, "x": "繰り返しているのに、記録はどこにも増えません。"}, {"t": 722.25, "x": "増えないまま、担当が替わると最初からやり直します。"}, {"t": 726.0333333333333, "x": "やり直しを減らすには、書く対象を変えてみます。"}, {"t": 729.45, "x": "変える先は、手順よりも決め方のほうです。"}, {"t": 732.6, "x": "決め方なら、条件が違っても同じ形で使えます。"}, {"t": 736.35, "x": "使える形が一つあると、枝分かれは要らなくなります。"}, {"t": 740.15, "x": "要らなくなった分、書類は短く保てます。"}, {"t": 743.5166666666667, "x": "短い書類は、実際に読まれる確率が上がります。"}, {"t": 747.1833333333333, "x": "上がった分だけ、口頭の説明は減っていきます。"}, {"t": 750.8, "x": "減った説明の時間は、別の仕事に戻ってきます。"}, {"t": 754.4666666666667, "x": "戻ってくる量は、最初に思うより\n大きいことがあります。"}, {"t": 758.3333333333334, "x": "十個目は、線を先に見せておくという渡し方です。"}, {"t": 762.1333333333333, "x": "渡し方として、どこまでなら戻せるかを伝えます。"}, {"t": 765.6166666666667, "x": "伝えるのは、取り返しのつく範囲の輪郭です。"}, {"t": 768.9166666666666, "x": "輪郭が分かると、その内側では手が動かせます。"}, {"t": 772.5666666666667, "x": "動かせる範囲があると、試す回数が増えます。"}, {"t": 776.1333333333333, "x": "増えた回数は、そのまま経験の量になります。"}, {"t": 779.5666666666667, "x": "量が増えるほど、判断の速さも上がっていきます。"}, {"t": 783.05, "x": "上がるまでの間、外に出す前に\n一度見る約束をします。"}, {"t": 787.1, "x": "約束が一つあると、任せる側の不安も下がります。"}, {"t": 791.0, "x": "下がった不安の分、口を出す回数が減ります。"}, {"t": 794.5333333333333, "x": "減った口出しは、聞く側の集中を戻します。"}, {"t": 797.9333333333333, "x": "戻った集中は、細かい指摘より\nよく効くことがあります。"}, {"t": 801.8666666666667, "x": "効いているのは、失敗の扱いが\n先に決まっているからです。"}, {"t": 805.7833333333333, "x": "決まっていない職場では、失敗の重さが読めません。"}, {"t": 809.3833333333333, "x": "読めない重さの前では、誰でも手が止まります。"}, {"t": 812.7833333333333, "x": "止まっている間、仕事は一つも進みません。"}, {"t": 816.0166666666667, "x": "進まない時間を、慎重さとして見る場合もあります。"}, {"t": 819.65, "x": "ある一方で、線を見せない側にも事情はあります。"}, {"t": 823.3166666666667, "x": "事情として、自分が受けた教わり方が残っています。"}, {"t": 827.1166666666667, "x": "残っている形をそのまま渡すと、線の話は抜けます。"}, {"t": 831.0666666666667, "x": "抜けた分を足すのは、そう難しくありません。"}, {"t": 834.2833333333333, "x": "十一個目は、教わる側から見た景色です。"}, {"t": 837.5333333333333, "x": "景色の中では、どこまで決めてよいかが分かりません。"}, {"t": 840.9666666666667, "x": "分からないまま動くと、越権だと言われる\n心配があります。"}, {"t": 845.05, "x": "心配があると、確認を挟む回数が増えます。"}, {"t": 848.75, "x": "増えた確認を、指示待ちだと\n受け取られることもあります。"}, {"t": 852.3666666666667, "x": "受け取られた側は、動いても\n止まっても言われる形になります。"}, {"t": 856.3666666666667, "x": "形が続くと、目立たない選び方をするようになります。"}, {"t": 860.2666666666667, "x": "なった結果、経験の幅は広がらなくなります。"}, {"t": 863.9, "x": "広がらない幅のまま、一年目が終わることがあります。"}, {"t": 867.7, "x": "終わった時、本人にも理由が説明できません。"}, {"t": 871.1166666666667, "x": "説明できないものは、相談の議題にも上がりません。"}, {"t": 874.7166666666667, "x": "上がらない話は、両側とも気づかないまま残ります。"}, {"t": 878.4666666666667, "x": "残っているものを出すには、\n一度だけ聞き方を変えます。"}, {"t": 882.15, "x": "変えるのは、どこで迷ったかを尋ねる形です。"}, {"t": 885.3333333333334, "x": "尋ねられた側は、手順よりも判断の話を出します。"}, {"t": 889.1666666666666, "x": "出てきた話に、\n渡し忘れが混ざっていることがあります。"}, {"t": 892.9666666666667, "x": "混ざっていたものを、その場で一行にして返します。"}, {"t": 896.5333333333333, "x": "返した一行は、次の同じ場面で使われます。"}, {"t": 900.0333333333333, "x": "使われた分だけ、聞く回数は静かに減ります。"}, {"t": 903.5833333333334, "x": "減り方は、教える時間の短さとして表に出ます。"}, {"t": 907.4166666666666, "x": "最後に、先に渡すものの中身をまとめます。"}, {"t": 910.7833333333333, "x": "中身は、作業の順番そのものではありません。"}, {"t": 914.0833333333334, "x": "無いのは、順番なら手順書でも渡せるからです。"}, {"t": 917.5166666666667, "x": "渡せないのは、迷った時にどう決めるかの部分です。"}, {"t": 921.0833333333334, "x": "部分として小さく見えますが、効き方が違います。"}, {"t": 924.6333333333333, "x": "違うのは、例外の日にだけ働くからです。"}, {"t": 927.8166666666667, "x": "働く日が来なければ、渡した意味は見えません。"}, {"t": 931.1666666666666, "x": "見えないので、忙しい研修では後回しにされます。"}, {"t": 934.9833333333333, "x": "後回しにされた分は、現場に出てから返ってきます。"}, {"t": 938.7333333333333, "x": "返り方は、質問の回数や手戻りの形を取ります。"}, {"t": 942.7333333333333, "x": "取られた時間は、教える側にも同じだけ乗ります。"}, {"t": 946.3333333333334, "x": "乗る前に渡しておくと、二人分の時間が空きます。"}, {"t": 949.9666666666667, "x": "空いた時間は、次の人を迎える準備に使えます。"}, {"t": 953.5333333333333, "x": "使える職場では、教える負担が年ごとに軽くなります。"}, {"t": 957.5166666666667, "x": "軽くなるのは、渡すものが積み上がっていくからです。"}, {"t": 960.95, "x": "積み上がるのは、手順ではなく決め方の記録です。"}, {"t": 964.4, "x": "記録は完璧でなくても、一行ずつで構いません。"}, {"t": 968.0, "x": "構わないのは、使いながら直していけるからです。"}, {"t": 971.25, "x": "直した形が、次の新しい人へ渡っていきます。"}, {"t": 974.9333333333333, "x": "渡った先で、また少しずつ足されていきます。"}, {"t": 978.1166666666667, "x": "足され続けた決め方が、その職場の\n教え方になります。"}, {"t": 981.9333333333333, "x": "教え方の話は、その週のうちには表に出ません。"}, {"t": 985.7666666666667, "x": "出てくるのは、三ヶ月ほど経ってからです。"}, {"t": 988.6666666666666, "x": "手順だけを渡された人は、決まった形の\n仕事は回せます。"}, {"t": 992.8666666666667, "x": "回せるので、まわりからは育ったように見えます。"}, {"t": 996.2, "x": "見えている間に、少しずつ例外が増えていきます。"}, {"t": 999.8, "x": "増えた例外のたびに、確認が教える側へ戻ります。"}, {"t": 1003.65, "x": "戻る回数が減らないので、任せ\nきれない状態が続きます。"}, {"t": 1007.75, "x": "続いた状態を、本人の伸び悩みとして語り始めます。"}, {"t": 1011.7, "x": "語られた側は、自信を少しずつ削られていきます。"}, {"t": 1015.3333333333334, "x": "削られた分、聞く回数はさらに減っていきます。"}, {"t": 1018.85, "x": "減った先で、静かなやり直しが積み上がります。"}, {"t": 1022.25, "x": "積み上がった頃には、最初の\n三日は誰も覚えていません。"}, {"t": 1026.2, "x": "覚えていないので、原因は性格や\n相性の話になります。"}, {"t": 1030.45, "x": "なった話からは、直せる場所が出てきません。"}, {"t": 1033.6833333333334, "x": "出てこないまま、次の新しい人が配属されます。"}, {"t": 1037.3166666666666, "x": "一方で、決め方を先に渡した職場は少し違います。"}, {"t": 1041.3166666666666, "x": "違うのは、三ヶ月目に質問の中身が変わることです。"}, {"t": 1045.1666666666667, "x": "変わった質問は、手順よりも判断に寄っていきます。"}, {"t": 1048.8833333333334, "x": "寄っていくほど、任せられる範囲は広がります。"}, {"t": 1052.1666666666667, "x": "広がった範囲の中で、本人が手順書を直し始めます。"}, {"t": 1056.2166666666667, "x": "直された手順書は、次の人の三日目を軽くします。"}, {"t": 1060.0166666666667, "x": "二つの三ヶ月後は、どちらも\n珍しい景色ではありません。"}, {"t": 1064.0833333333333, "x": "どちらを選んでも、教える側の\n力量の差ではありません。"}, {"t": 1068.0333333333333, "x": "差が出ているのは、最初に何を\n渡したかという一点です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

<script>
const D={"name": "残業している人が評価される職場で何が起きているか", "file": "017_残業している人が評価される職場で何が起きているか", "dur": 937.8833125, "segs": [], "subs": [{"t": 0.0, "x": "残業が多い人ほど評価される職場があります。"}, {"t": 3.1666666666666665, "x": "あるとしても、そこに悪意があるとは限りません。"}, {"t": 6.4, "x": "限らないのは、物差しの側に理由があるからです。"}, {"t": 9.883333333333333, "x": "理由は三つに分けて、はじめに出しておきます。"}, {"t": 13.116666666666667, "x": "一つ目は、外から見えるのが居た\n時間だけという点です。"}, {"t": 16.933333333333334, "x": "二つ目は、早く終えた人が空いて\n見えるという点です。"}, {"t": 20.616666666666667, "x": "三つ目は、空いて見えた人に次の仕事が回る点です。"}, {"t": 24.516666666666666, "x": "回った仕事で、その人の時間はまた埋まります。"}, {"t": 27.916666666666668, "x": "埋まった時間は、成果としては数えられません。"}, {"t": 31.216666666666665, "x": "数えられないので、評価の並びは動きません。"}, {"t": 34.46666666666667, "x": "動かないまま何年か過ぎると、逆転が起きます。"}, {"t": 38.016666666666666, "x": "起きた逆転に、気づく人はほとんどいません。"}, {"t": 41.166666666666664, "x": "いないのは、誰かが悪さをしたからではありません。"}, {"t": 44.6, "x": "ないからこそ、止まる場所も見つかりません。"}, {"t": 47.56666666666667, "x": "ここで、定時を過ぎたフロアを思い浮かべます。"}, {"t": 50.766666666666666, "x": "浮かべた先には、明かりの残った席があります。"}, {"t": 54.083333333333336, "x": "席に残っている人は、熱心だと受け取られます。"}, {"t": 57.5, "x": "受け取られる一方で、帰った席は何も語りません。"}, {"t": 61.21666666666667, "x": "語らない席の側に、今日の話の中心があります。"}, {"t": 64.88333333333334, "x": "中心にあるのは、努力の量ではありません。"}, {"t": 68.51666666666667, "x": "何を物差しにして測っているか、という一点です。"}, {"t": 72.2, "x": "その一点を、順番に取り出していきます。"}, {"t": 75.28333333333333, "x": "まず、努力が何によって数えられているかを見ます。"}, {"t": 79.03333333333333, "x": "数える側が、手を抜いているわけではありません。"}, {"t": 82.3, "x": "ありませんが、外から見えるものには限りがあります。"}, {"t": 85.85, "x": "これは、本人の熱意の差の話なのでしょうか。"}, {"t": 89.15, "x": "そうではありません。"}, {"t": 90.46666666666667, "x": "熱意は外側から見えません。"}, {"t": 92.55, "x": "では、出している成果の量の差でしょうか。"}, {"t": 95.55, "x": "これも違います。"}, {"t": 96.75, "x": "成果が出るのは、たいてい後です。"}, {"t": 99.33333333333333, "x": "後になるものは、その日の評価には間に合いません。"}, {"t": 102.75, "x": "間に合うのは、その日のうちに目に入るものだけです。"}, {"t": 106.13333333333334, "x": "目に入るのは、席にいる姿と、\n遅くまで点く明かりです。"}, {"t": 110.3, "x": "そして、返信が夜遅くに届いたという事実です。"}, {"t": 113.9, "x": "そういうものだけが、その日の印象を作ります。"}, {"t": 117.31666666666666, "x": "作られた印象は、翌日になれば少し薄れます。"}, {"t": 121.01666666666667, "x": "薄れながらも、積み重なると輪郭を持ちます。"}, {"t": 124.3, "x": "輪郭を持ったものが、半年後に\n評価の言葉になります。"}, {"t": 128.16666666666666, "x": "言葉になる時、根拠は思い出せなくなっています。"}, {"t": 131.58333333333334, "x": "なっているので、本人にも説明がつきにくいです。"}, {"t": 135.08333333333334, "x": "つきにくいまま、頑張っている人だ、が残ります。"}, {"t": 138.78333333333333, "x": "残ったのは努力の記録ではなく、居た時間の\n記憶です。"}, {"t": 142.6, "x": "二つ目は、早く終えた人に起きることです。"}, {"t": 145.65, "x": "起きるのは、評価そのものではなく見え方の\n変化です。"}, {"t": 149.28333333333333, "x": "変化の一つは、机の上が片づいて見えることです。"}, {"t": 152.91666666666666, "x": "もう一つは、締切の前に手が空いて見えることです。"}, {"t": 156.53333333333333, "x": "さらに、定時に立ち上がる姿が目立つことです。"}, {"t": 159.9, "x": "目立つ三つは、どれも中身の話ではありません。"}, {"t": 163.35, "x": "一方で、遅くまで残った人はどう見えるでしょうか。"}, {"t": 167.06666666666666, "x": "手元に仕事を多く抱えた人、として見えます。"}, {"t": 170.45, "x": "多くを任されている人、としても見えます。"}, {"t": 173.53333333333333, "x": "そこから抜けられない人、としても見えます。"}, {"t": 176.53333333333333, "x": "三つとも、忙しさの原因までは含んでいません。"}, {"t": 180.05, "x": "含まないまま、忙しさだけが正しく伝わります。"}, {"t": 183.56666666666666, "x": "伝わった側は、そこに責任の重さを読み取ります。"}, {"t": 187.16666666666666, "x": "読み取った重さは、評価の言葉に乗りやすいです。"}, {"t": 190.68333333333334, "x": "乗せた側に、時間を褒めたつもりはありません。"}, {"t": 193.91666666666666, "x": "ありませんが、結果として時間が褒められています。"}, {"t": 197.4, "x": "褒められた時間は、次の人の目標になります。"}, {"t": 200.78333333333333, "x": "目標になった時間は、減らしにくくなります。"}, {"t": 204.0, "x": "減らしにくい職場では、早さは長所になりません。"}, {"t": 207.51666666666668, "x": "三つ目は、空いて見えた後に起きることです。"}, {"t": 210.58333333333334, "x": "水曜の午後、急ぎの差し込みが一件入ります。"}, {"t": 214.1, "x": "入った仕事を、誰に頼むかが決まります。"}, {"t": 217.41666666666666, "x": "決め方そのものは、たいてい難しくありません。"}, {"t": 220.66666666666666, "x": "手が空いていそうな人に、声がかかります。"}, {"t": 223.56666666666666, "x": "かかった先は、朝から予定通りに進めていた人です。"}, {"t": 227.4, "x": "進めていた人は、余裕があるように見えていました。"}, {"t": 230.91666666666666, "x": "見えていただけで、実際の余白は多くありません。"}, {"t": 234.35, "x": "多くない余白に、新しい一件が乗ります。"}, {"t": 237.58333333333334, "x": "乗った分だけ、その日の退社は遅くなります。"}, {"t": 240.91666666666666, "x": "遅くなった理由は、本人の段取りではありません。"}, {"t": 244.4, "x": "ありませんが、外からは同じ残業に見えます。"}, {"t": 247.8, "x": "見え方が同じなら、扱いも同じになります。"}, {"t": 250.91666666666666, "x": "同じ扱いのまま、この循環は何度も回ります。"}, {"t": 254.51666666666668, "x": "回るうちに、速い人の手元だけが厚くなります。"}, {"t": 257.93333333333334, "x": "厚くなった手元は、誰の記録にも残りません。"}, {"t": 261.31666666666666, "x": "残らないこの回り方に、名前をつけておきます。"}, {"t": 264.8, "x": "速さへの、静かな上乗せと呼んでおきます。"}, {"t": 268.03333333333336, "x": "上乗せは、罰として渡されたものではありません。"}, {"t": 271.35, "x": "四つ目は、仕事を回す側から見た景色です。"}, {"t": 274.8, "x": "回す側が考えているのは、まず期限の順です。"}, {"t": 278.3833333333333, "x": "次に、いますぐ手が動かせそうな人の顔です。"}, {"t": 281.71666666666664, "x": "最後に、任せて安心できるかどうかです。"}, {"t": 284.8666666666667, "x": "三つとも、その日を乗り切るために必要な判断です。"}, {"t": 288.55, "x": "一方で、受けた側が数えているのは別のものです。"}, {"t": 292.26666666666665, "x": "一つは、今週これで何件目かという回数です。"}, {"t": 295.9166666666667, "x": "一つは、自分だけに来ていないかという偏りです。"}, {"t": 299.43333333333334, "x": "一つは、この先も同じ形が続くのかという不安です。"}, {"t": 303.35, "x": "三つとも、その日だけでは終わらない話です。"}, {"t": 306.5, "x": "終わらない話と、その日の判断がすれ違います。"}, {"t": 310.01666666666665, "x": "すれ違いは、どちらかの誤りではありません。"}, {"t": 313.2, "x": "見ている時間の幅が、そもそも違っています。"}, {"t": 316.46666666666664, "x": "違う幅のまま続けると、信頼の方が先に減ります。"}, {"t": 320.3666666666667, "x": "減った信頼は、頼みごとの重さを変えます。"}, {"t": 323.6166666666667, "x": "変わった重さは、受け取りにくさとして表に出ます。"}, {"t": 327.1333333333333, "x": "出たものを、やる気の低下と読むことがあります。"}, {"t": 330.46666666666664, "x": "読み違えたまま、次の一件がまた同じ人へ行きます。"}, {"t": 334.4, "x": "行き先が固定されると、量の差は見えなくなります。"}, {"t": 337.9166666666667, "x": "五つ目は、姿が持っている情報量の話です。"}, {"t": 341.55, "x": "夜のフロアには、残る人が少なくなっています。"}, {"t": 344.8, "x": "少ない中では、席に残る人がよく見えます。"}, {"t": 348.1666666666667, "x": "通りかかった人が、その姿を一度だけ見ます。"}, {"t": 351.55, "x": "見かけた人は、頑張っていると受け取ります。"}, {"t": 354.53333333333336, "x": "受け取ったことを、本人に言うとは限りません。"}, {"t": 357.68333333333334, "x": "限りませんが、印象としては確かに残ります。"}, {"t": 361.2, "x": "残った印象は、何日かすると誰かに伝わります。"}, {"t": 364.8333333333333, "x": "伝わる時には、仕事の中身の方が落ちています。"}, {"t": 368.3833333333333, "x": "落ちたまま、遅くまでいた事実だけが動きます。"}, {"t": 371.7, "x": "動いた事実は、途中で評価の言葉に変わります。"}, {"t": 375.3, "x": "変わった言葉は、元の場面には戻りません。"}, {"t": 378.43333333333334, "x": "戻らないのは、伝わる速さが違うからです。"}, {"t": 381.56666666666666, "x": "違う速さの中では、姿の方が先に着きます。"}, {"t": 385.23333333333335, "x": "着いた姿には、そうなった理由が付いていません。"}, {"t": 388.6333333333333, "x": "付いていないので、外からは誰にも直せません。"}, {"t": 391.9, "x": "直せないまま、その人の評価は上がります。"}, {"t": 395.05, "x": "上がった本人が、得をしたとは限りません。"}, {"t": 398.25, "x": "限らないのは、働き方まで固定されるからです。"}, {"t": 401.6166666666667, "x": "六つ目は、同じ一日を時間の流れで追ってみます。"}, {"t": 405.28333333333336, "x": "追う相手は、定時で帰った人の一日です。"}, {"t": 408.53333333333336, "x": "その日の夕方、その人は作業を終えています。"}, {"t": 411.93333333333334, "x": "終えた分は、共有の場所に置かれています。"}, {"t": 415.18333333333334, "x": "置かれたことに、その時は誰も気づきません。"}, {"t": 418.25, "x": "気づくのは、翌朝それを使う人だけです。"}, {"t": 421.3666666666667, "x": "使った人は、助かったと一度だけ心の中で思います。"}, {"t": 425.26666666666665, "x": "思ったことを、口に出す人は多くありません。"}, {"t": 428.3666666666667, "x": "多くないので、そこで記録はいったん途切れます。"}, {"t": 431.5833333333333, "x": "途切れた先で、そのまま数日が過ぎていきます。"}, {"t": 434.98333333333335, "x": "過ぎた頃には、誰が作ったかも薄れています。"}, {"t": 438.45, "x": "薄れたまま、その資料は普通に使われ続けます。"}, {"t": 442.0833333333333, "x": "続いた数ヶ月の間に、評価の時期が来ます。"}, {"t": 445.56666666666666, "x": "来た時に思い出されるのは、夜の光景の方です。"}, {"t": 449.0833333333333, "x": "光景が強いのは、繰り返し目に入ったからです。"}, {"t": 452.56666666666666, "x": "入らなかったものは、回数がゼロのままです。"}, {"t": 455.8333333333333, "x": "ゼロの回数は、印象としては存在しません。"}, {"t": 459.3666666666667, "x": "しないものを、評価の場で持ち出すのは難しいです。"}, {"t": 463.03333333333336, "x": "難しさの正体は、記憶ではなく回数の差です。"}, {"t": 466.65, "x": "七つ目は、出社と在宅が混ざった時の話です。"}, {"t": 470.3333333333333, "x": "在宅の日に見えているのは、いくつかの印だけです。"}, {"t": 473.85, "x": "一つは、チャットの印が点いているかどうかです。"}, {"t": 477.25, "x": "一つは、返信がおよそ何分で返ってくるかです。"}, {"t": 480.93333333333334, "x": "一つは、夜に更新の通知が出るかどうかです。"}, {"t": 484.45, "x": "三つとも、仕事の中身とは別のものです。"}, {"t": 487.53333333333336, "x": "一方で、出社している人は姿ごと見えています。"}, {"t": 491.18333333333334, "x": "見えている分、印には頼らずに済みます。"}, {"t": 494.4, "x": "済む人と済まない人が、同じ一つの\n物差しで並びます。"}, {"t": 498.26666666666665, "x": "並んだ時、在宅の側は印を増やそうとします。"}, {"t": 502.1, "x": "増やそう const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

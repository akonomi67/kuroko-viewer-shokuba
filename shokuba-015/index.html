<script>
const D={"name": "飲み会に来ない部下を上司はどう見ているか", "file": "015_飲み会に来ない部下を上司はどう見ているか", "dur": 1061.15, "segs": [], "subs": [{"t": 0.0, "x": "金曜の夕方に、歓迎会の案内が席まで回ってきます。"}, {"t": 4.25, "x": "回ってきた案内に、返事が一つだけ戻ってきません。"}, {"t": 7.9, "x": "戻らないまま当日になり、長机の席が一つ空きます。"}, {"t": 12.15, "x": "空いた席の方を、誘った側は何度か見ています。"}, {"t": 15.683333333333334, "x": "見ているのは、来なかったこと自体ではありません。"}, {"t": 18.766666666666666, "x": "気になっているのは、理由が\n分からないことの方です。"}, {"t": 22.183333333333334, "x": "分からない時間には、いくつもの考えが浮かびます。"}, {"t": 25.583333333333332, "x": "浮かぶのは、避けられているのかという心配です。"}, {"t": 28.8, "x": "心配は口に出さないまま、翌週の月曜まで残ります。"}, {"t": 33.016666666666666, "x": "残った心配は、仕事の頼み方にも出ることがあります。"}, {"t": 36.916666666666664, "x": "一方で、誘われた側はその夜を\n普通に過ごしています。"}, {"t": 40.983333333333334, "x": "過ごしながら、断ったことを気にしてはいません。"}, {"t": 44.25, "x": "気にしないのは、業務の時間の外の話だからです。"}, {"t": 47.9, "x": "外の時間の使い方まで、説明する義務は感じません。"}, {"t": 51.96666666666667, "x": "感じないので、断りの返事も短いままになります。"}, {"t": 55.583333333333336, "x": "短い返事が、相手にどう映るかまでは\n見えていません。"}, {"t": 59.416666666666664, "x": "見えないまま、次の案内にも\n同じ返事を返しています。"}, {"t": 63.35, "x": "返している間、二人は同じ日の\n同じ出来事を見ています。"}, {"t": 67.4, "x": "見ているのに、拾っているものが違っています。"}, {"t": 70.38333333333334, "x": "違うのは、どちらかの気づかいが\n足りないからではありません。"}, {"t": 74.13333333333334, "x": "今日は、この一つの空席が何を運ぶのかを見ます。"}, {"t": 77.88333333333334, "x": "運ばれた先まで見ると、直せる場所が見えてきます。"}, {"t": 81.41666666666667, "x": "見えてくるのは、誘い方でも断り方でもありません。"}, {"t": 85.05, "x": "動かせるのは、その前後に置く一言の方です。"}, {"t": 88.43333333333334, "x": "まず、誘った側が何を気にしているのかを見ます。"}, {"t": 92.08333333333333, "x": "集まる人数が足りないことが、その理由でしょうか。"}, {"t": 95.65, "x": "足りなくても、その日の会は問題なく進みます。"}, {"t": 99.05, "x": "進むので、頭数の話で引っかかることは\n多くありません。"}, {"t": 103.06666666666666, "x": "では、断られたことが失礼に見えたのでしょうか。"}, {"t": 106.58333333333333, "x": "見えたとしても、その場で怒ることはまずありません。"}, {"t": 109.96666666666667, "x": "ありませんが、あとで思い返す回数は\n増えていきます。"}, {"t": 113.8, "x": "増えるのは、返事に理由が入っていなかった時です。"}, {"t": 117.28333333333333, "x": "入っていない返事は、受け取る側で\n形が決まりません。"}, {"t": 121.11666666666666, "x": "決まらないものは、頭の中に置き場所を作れません。"}, {"t": 124.71666666666667, "x": "作れないまま、ときどき浮かんでくることになります。"}, {"t": 128.01666666666668, "x": "浮かぶたびに、少しずつ意味が足されていきます。"}, {"t": 131.21666666666667, "x": "足された意味は、たいてい良い方へは向きません。"}, {"t": 134.43333333333334, "x": "向かないのは、悪い想像の方が\n形になりやすいからです。"}, {"t": 138.41666666666666, "x": "なりやすい想像は、本人には一度も伝えられません。"}, {"t": 142.13333333333333, "x": "伝えられないので、断った側は\n何も知らずに済みます。"}, {"t": 145.96666666666667, "x": "済んでいる間に、誘う側の中だけで話が進みます。"}, {"t": 150.03333333333333, "x": "進んだ話は、次の声のかけ方に出てきます。"}, {"t": 153.48333333333332, "x": "出てくるのは、来ないこと自体への\n不満ではありません。"}, {"t": 157.0, "x": "引っかかっているのは、理由が\n見えない時間の方です。"}, {"t": 160.53333333333333, "x": "二つ目は、見えない時間の中で起きることです。"}, {"t": 163.83333333333334, "x": "起きるのは、給湯室や廊下での短い立ち話です。"}, {"t": 167.65, "x": "立ち話の中で、来なかった人の\n名前が一度だけ出ます。"}, {"t": 171.48333333333332, "x": "出た名前に、誰かがその場で理由を一つ付けます。"}, {"t": 175.33333333333334, "x": "付いた理由は、その時の思いつきに過ぎません。"}, {"t": 178.7, "x": "過ぎないのに、聞いた人はそのまま覚えて帰ります。"}, {"t": 182.28333333333333, "x": "覚えられた話は、次の立ち話でまた出てきます。"}, {"t": 185.8, "x": "出てくるたびに、話は少しずつ固まっていきます。"}, {"t": 189.25, "x": "固まった頃には、最初の思いつきだと\n誰も思いません。"}, {"t": 193.05, "x": "思われないまま、それが共通の説明になります。"}, {"t": 196.6, "x": "なった説明を、名前を出された本人だけが\n知りません。"}, {"t": 200.5, "x": "知らないので、訂正する機会も回ってきません。"}, {"t": 203.85, "x": "回ってこない間に、席の並び方も少し変わります。"}, {"t": 207.65, "x": "変わった並びは、悪意から出たものではありません。"}, {"t": 211.03333333333333, "x": "ありませんが、外から見れば同じ形に見えます。"}, {"t": 214.48333333333332, "x": "見える形だけが残るのが、この時間の厄介な点です。"}, {"t": 218.35, "x": "厄介なのは、空白を埋めるのが本人ではない点です。"}, {"t": 222.41666666666666, "x": "本人の代わりに、周りが説明を作ってしまいます。"}, {"t": 226.28333333333333, "x": "作られた説明を、ここでは空白の穴埋めと呼びます。"}, {"t": 230.08333333333334, "x": "穴埋めは、理由が一行あるだけで起きにくくなります。"}, {"t": 233.68333333333334, "x": "三つ目は、断る側がどう受け取っているかです。"}, {"t": 237.05, "x": "受け取り方の前提には、時間の線引きがあります。"}, {"t": 240.65, "x": "定時を過ぎた後は、自分で決める時間になります。"}, {"t": 244.21666666666667, "x": "家の用事があり、学びの予定があり、\n体の都合もあります。"}, {"t": 248.88333333333333, "x": "そういう予定に、順位を付ける必要はありません。"}, {"t": 252.41666666666666, "x": "一方で、誘う側は理由の中身を\n知りたいわけではありません。"}, {"t": 256.7, "x": "知りたいのは、避けられていないかどうかだけです。"}, {"t": 259.85, "x": "都合が悪いのか、体調の話か、単に疲れているのか。"}, {"t": 264.1333333333333, "x": "どれでも構わないので、短い形があれば足ります。"}, {"t": 267.65, "x": "足りる形を、義務として求めると話はこじれます。"}, {"t": 271.23333333333335, "x": "こじれるのは、業務ではないことへの\n説明だからです。"}, {"t": 274.9, "x": "だからこそ、言う側も言われる側も気まずくなります。"}, {"t": 278.46666666666664, "x": "気まずさの正体は、礼儀の問題ではありません。"}, {"t": 281.9166666666667, "x": "問題ではなく、境目のあいまいな\n場所に二人が立っています。"}, {"t": 286.1, "x": "立っている場所には、共通する決まりがありません。"}, {"t": 289.51666666666665, "x": "決まりが無いところでは、それぞれの\n当たり前が出ます。"}, {"t": 292.98333333333335, "x": "出た当たり前どうしが、静かにぶつかっています。"}, {"t": 296.31666666666666, "x": "ぶつかっても、音は立たないので気づかれません。"}, {"t": 299.31666666666666, "x": "気づかれない差は、注意し合っても縮みません。"}, {"t": 302.5, "x": "縮むとすれば、義務ではない形の一言の方です。"}, {"t": 306.1, "x": "四つ目は、同じ集まりが持つ重さの違いです。"}, {"t": 309.6166666666667, "x": "違いは、その人の暮らしの形から生まれてきます。"}, {"t": 313.1, "x": "家に帰り着く時間が決まっている人がいます。"}, {"t": 315.8833333333333, "x": "家族の送り迎えを毎日担っている人もいます。"}, {"t": 319.0, "x": "体質や通院の都合で、飲めない人も\n珍しくありません。"}, {"t": 323.06666666666666, "x": "通う距離が長く、終電の時刻が早い人もいます。"}, {"t": 326.85, "x": "そういう事情は、外からはほとんど見えません。"}, {"t": 330.1333333333333, "x": "見えないので、どの人も同じ一回として\n数えられやすいです。"}, {"t": 334.28333333333336, "x": "数えた側に、\n負担の差を軽く見たつもりはありません。"}, {"t": 337.95, "x": "つもりが無くても、重さの差は残ったままです。"}, {"t": 341.1333333333333, "x": "残った差は、回を重ねるほど静かに開きやすいです。"}, {"t": 344.98333333333335, "x": "開いた先で、来られない人の\n顔ぶれが固まることがあります。"}, {"t": 348.98333333333335, "x": "固まった側は、やがて誘われなくなることもあります。"}, {"t": 352.6, "x": "誘われないことが、気楽さとして働く場合もあります。"}, {"t": 356.5, "x": "働く一方で、情報から外れてしまう場合もあります。"}, {"t": 360.51666666666665, "x": "外れた情報は、あとから取り戻しにくいものです。"}, {"t": 364.0, "x": "取り戻しにくいのは、記録に残らない話だからです。"}, {"t": 367.6166666666667, "x": "残らない話が動いているのが、\nこの集まりの特徴です。"}, {"t": 371.56666666666666, "x": "特徴を知らないと、参加は好みの問題に見えます。"}, {"t": 375.2, "x": "見え方が変わると、声のかけ方も変わってきます。"}, {"t": 378.56666666666666, "x": "五つ目は、断りの言葉が重なった時の話です。"}, {"t": 382.21666666666664, "x": "重なる言葉は、たいてい同じ形をしています。"}, {"t": 385.6333333333333, "x": "その日は予定があります、という短い一行です。"}, {"t": 390.0, "x": "一行を受け取った側は、その場では何も思いません。"}, {"t": 393.78333333333336, "x": "思わないまま、了解の返事を返して終わります。"}, {"t": 397.4166666666667, "x": "終わった直後は、どちらの側にも何も起きません。"}, {"t": 400.76666666666665, "x": "起きるのは、同じ一行が三度目に届いた時です。"}, {"t": 404.3, "x": "届いた時に、初めて回数が数えられ始めます。"}, {"t": 407.85, "x": "数え始めた側は、偶然ではないと感じやすいです。"}, {"t": 411.6666666666667, "x": "感じても、確かめる場は用意されていません。"}, {"t": 414.8833333333333, "x": "用意されないまま、何ヶ月かが過ぎていきます。"}, {"t": 418.25, "x": "過ぎた頃には、誘いの声そのものが減ってきます。"}, {"t": 421.76666666666665, "x": "減った声を、本人は静かでよいと\n受け取ることがあります。"}, {"t": 425.6666666666667, "x": "受け取り方は自由ですが、別の変化も起きています。"}, {"t": 429.26666666666665, "x": "起きているのは、日ごろの雑談の量が減ることです。"}, {"t": 432.5833333333333, "x": "減った雑談の中には、仕事の話も混ざっていました。"}, {"t": 436.4166666666667, "x": "混ざっていた分が、少しずつ届かなくなります。"}, {"t": 439.6666666666667, "x": "届かない状態は、たった一日では出来上がりません。"}, {"t": 443.4, "x": "出来上がるのは、同じ一行が積み上がった後です。"}, {"t": 446.93333333333334, "x": "積み上がる前なら、足せる言葉はまだ残っています。"}, {"t": 450.5, "x": "六つ目は、その場でだけ出てくる話です。"}, {"t": 453.43333333333334, "x": "二次会の終わりごろに、来期の話が少し出ます。"}, {"t": 456.8333333333333, "x": "出た話は、まだ決まったことではありません。"}, {"t": 459.81666666666666, "x": "ありませんが、考えている途中の形は見えています。"}, {"t": 463.6, "x": "見えた人は、翌週の会議で少し先を読めます。"}, {"t": 467.1666666666667, "x": "読める人と読めない人が、同じ会議の席に座ります。"}, {"t": 470.9166666666667, "x": "座っている二人の理解は、同じではありません。"}, {"t": 474.25, "x": "違いは、能力の差から来ているものではありません。"}, {"t": 477.68333333333334, "x": "来ているのは、聞いた場所が\n違うという一点だけです。"}, {"t": 481.25, "x": "一点の差でも、発言の速さには出やすいです。"}, {"t": 484.76666666666665, "x": "出た速さが、頼りにされる順番を作っていきます。"}, {"t": 488.55, "x": "作られた順番は、\n悪意で決まったものではありません。"}, {"t": 492.23333333333335, "x": "ありませんが、外から見ると差だけが残ります。"}, {"t": 495.46666666666664, "x": "残る差を、ここでは席順の情報と呼んでおきます。"}, {"t": 499.18333333333334, "x": "席順の情報は、無かったことにはできません。"}, {"t": 502.53333333333336, "x": "できないので、無い前提で動くと読み違えます。"}, {"t": 505.93333333333334, "x": "読み違えないために、出た話は場の外へも出します。"}, {"t": 509.76666666666665, "x": "出し方は、翌朝の短い共有だけで\n足りることが多いです。"}, {"t": 514.1, "x": "足りるのに、やらないまま続く職場も多いです。"}, {"t": 517.2833333333333, "x": "多い理由は、その場にいた人が\n誰も困らないからです。"}, {"t": 521.0833333333334, "x": "七つ目は、その話が翌日どのように働くかです。"}, {"t": 524.8833333333333, "x": "働き方は、はっきりした指示の形を取りません。"}, {"t": 528.4166666666666, "x": "取らないまま、資料の作り方に混ざってきます。"}, {"t": 531.6666666666666, "x": "混ざった前提は、書かれていないので\n確かめられません。"}, {"t": 535.3, "x": "確かめられない前提の上で、仕事が始まります。"}, {"t": 538.8666666666667, "x": "始まった仕事に、後から入る人は\n理由が分かりません。"}, {"t": 542.7, "x": "分からないので、ずれた方向へ進むことがあります。"}, {"t": 546.15, "x": "進んだ分は、やり直しとして自分に返ってきます。"}, {"t": 549.9333333333333, "x": "返ってきた時、原因は本人の理解不足に見えます。"}, {"t": 554.0, "x": "見えるだけで、実際の原因は情報の入口にあります。"}, {"t": 557.95, "x": "入口が二つあることを、上の側は忘れがちです。"}, {"t": 561.5833333333334, "x": "忘れるのは、自分だけが両方を通っているからです。"}, {"t": 565.3, "x": "通っている人には、その差そのものが見えません。"}, {"t": 568.6, "x": "見えない差は、何ヶ月かかけて\n評価に混ざることがあります。"}, {"t": 572.5, "x": "混ざった評価は、あの夜の集まりとは結び付きません。"}, {"t": 576.3166666666667, "x": "結び付かないので、原因は別の場所から探されます。"}, {"t": 580.1, "x": "探された先で、やる気の話にされることがあります。"}, {"t": 583.85, "x": "されてしまうと、直すべき場所を取り違えます。"}, {"t": 587.1666666666666, "x": "取り違えないために、前提は\n文字にして置き直します。"}, {"t": 590.9, "x": "置き直すのは、来なかった\n人のためだけではありません。"}, {"t": 594.3833333333333, "x": "八つ目は、断る側から動かせる部分の話です。"}, {"t": 598.2, "x": "毎回参加することが、答えになるのでしょうか。"}, {"t": 601.5, "x": "答えにはならないので、無理に変えなくて\n構いません。"}, {"t": 604.9166666666666, "x": "では、気にせずに断り続ければよいのでしょうか。"}, {"t": 608.3833333333333, "x": "それも、情報の入口が一つ減ったままになります。"}, {"t": 612.0166666666667, "x": "減ったままにしないために、\n三つ目の道が残っています。"}, {"t": 615.8333333333334, "x": "残っているのは、業務の中に\n入口を作り直す方法です。"}, {"t": 620.1833333333333, "x": "昼の時間に、短い相談を一つ入れておきます。"}, {"t": 623.8666666666667, "x": "会議の後に、二言だけ立ち話をして戻ります。"}, {"t": 627.4333333333333, "x": "週の初めに、進み具合を先に一行送っておきます。"}, {"t": 631.4833333333333, "x": "どれも、業務の時間の中で終わる動きです。"}, {"t": 634.75, "x": "終わる動きなら、休みの日を削らずに続けられます。"}, {"t": 638.4166666666666, "x": "続けていくうちに、雑談の量は少し戻ってきます。"}, {"t": 642.1, "x": "戻った分が、聞き逃していた前提を拾ってくれます。"}, {"t": 645.8833333333333, "x": "拾えるようになれば、参加の有無は軽くなります。"}, {"t": 649.2, "x": "軽くなるのは、情報の入口が二つに増えたからです。"}, {"t": 652.95, "x": "増えたあとは、断りの一行も重く響きません。"}, {"t": 656.5833333333334, "x": "響かない関係を、先に作っておく順番になります。"}, {"t": 660.4, "x": "順番を逆にすると、断りだけが目立ってしまいます。"}, {"t": 664.15, "x": "目立たせないのは、気づかいではなく\n段取りの話です。"}, {"t": 667.7166666666667, "x": "九つ目は、誘う側から動かせるところを見ます。"}, {"t": 671.2333333333333, "x": "動かせるのは、声をかける時の一言の中身だけです。"}, {"t": 674.9333333333333, "x": "都合が合えば来てください、という言い方があります。"}, {"t": 678.3333333333334, "x": "来られる人だけで構いません、という\n言い方もあります。"}, {"t": 682.0, "x": "次の機会もあります、と先に足しておく形もあります。"}, {"t": 686.0, "x": "そういう一言は、断る側の負担をはっきり下げます。"}, {"t": 689.9, "x": "下がるのは、断った後の景色が見えるからです。"}, {"t": 693.3166666666667, "x": "一方で、全員そろうと嬉しい、という\n言い方があります。"}, {"t": 697.75, "x": "言い方そのものは、決して悪いものではありません。"}, {"t": 701.2, "x": "ありませんが、受け取る側では重さが変わります。"}, {"t": 704.65, "x": "変わるのは、その言葉に立場の差が乗るからです。"}, {"t": 707.95, "x": "乗った言葉は、頼みごとではなく求めに近づきます。"}, {"t": 711.5166666666667, "x": "近づいた分だけ、断る側は理由を探し始めます。"}, {"t": 715.5833333333334, "x": "探した理由が、本当かどうかは誰にも分かりません。"}, {"t": 719.3666666666667, "x": "分からない理由が増えると、最初の空白に戻ります。"}, {"t": 723.05, "x": "戻らないための一言は、長い文でなくて構いません。"}, {"t": 726.7333333333333, "x": "構わないので、誘いの文の最後に\n足しておくだけです。"}, {"t": 730.45, "x": "足した一行が、断りの短さを保ってくれます。"}, {"t": 734.0166666666667, "x": "保たれた短さは、気まずさの持ち越しを減らします。"}, {"t": 737.6333333333333, "x": "減らせるのは、声をかける側に回った時だけです。"}, {"t": 741.1, "x": "十個目は、集まりの決め方そのものの話です。"}, {"t": 744.6166666666667, "x": "決め方の前提が全員参加になると、形が変わります。"}, {"t": 748.6333333333333, "x": "変わるのは、断るという行為が持つ意味の方です。"}, {"t": 752.15, "x": "全員が前提なら、欠けた人は例外の側になります。"}, {"t": 756.0, "x": "例外になった人は、説明を求められやすくなります。"}, {"t": 759.75, "x": "求められた説明は、途中で断り\n切れないことが多いです。"}, {"t": 763.9166666666666, "x": "多いので、行きたくない人もその席に着きます。"}, {"t": 767.1333333333333, "x": "着いた席で、話が弾むことは多くありません。"}, {"t": 770.5833333333334, "x": "ありませんが、人数だけはそろって見えます。"}, {"t": 773.6666666666666, "x": "見えている数字は、その場の\n満足とは別の場合があります。"}, {"t": 777.6833333333333, "x": "別のものだと気づけないと、\n次も同じ形で開かれます。"}, {"t": 781.5, "x": "開かれるたびに、来ない自由は少しずつ減ります。"}, {"t": 784.9166666666666, "x": "減った自由は、誰かの悪意で\n削られたのではありません。"}, {"t": 788.8666666666667, "x": "削っているのは、全員という前提の置き方の方です。"}, {"t": 792.7333333333333, "x": "置き方は、会を開く側が先に変えることができます。"}, {"t": 796.5333333333333, "x": "自由参加だと最初に言えば、例外は生まれません。"}, {"t": 800.1, "x": "生まれない場では、来た理由も来ない理由も\n並びます。"}, {"t": 803.55, "x": "並んだ状態なら、どちらにも説明が要りません。"}, {"t": 807.0333333333333, "x": "要らない場は、開く側にとっても軽くなります。"}, {"t": 810.25, "x": "軽い場の方が、次の回も開きやすくなります。"}, {"t": 813.6333333333333, "x": "十一個目は、全部か無しかの間にある選び方です。"}, {"t": 817.4333333333333, "x": "選び方の一つが、一次会だけで先に帰る形です。"}, {"t": 821.3833333333333, "x": "開始の乾杯から、一時間ほどはその席に残ります。"}, {"t": 825.2666666666667, "x": "残っている間に、近くの席の\n人と短い話をしておきます。"}, {"t": 829.6666666666666, "x": "しておいてから、予定を理由に先に帰ります。"}, {"t": 833.0666666666667, "x": "帰る時に、次の機会の話を一言残しておきます。"}, {"t": 837.05, "x": "残った一言が、避けていないことを伝えます。"}, {"t": 840.2333333333333, "x": "伝われば、翌日の空気は変わらずに済みます。"}, {"t": 843.7, "x": "済ませられるのに、この形はあまり選ばれていません。"}, {"t": 847.2666666666667, "x": "選ばれにくいのは、途中で帰る気まずさのためです。"}, {"t": 850.7833333333333, "x": "気まずさは、帰る時の一言でかなり下がります。"}, {"t": 854.1666666666666, "x": "下がった気まずさは、次の回にも持ち越されません。"}, {"t": 857.6333333333333, "x": "持ち越さない人は、参加の回数が\n少なくても平気です。"}, {"t": 861.4666666666667, "x": "平気なのは、顔を合わせた回数の方が残るからです。"}, {"t": 865.25, "x": "残る回数は、その場にいた長さでは決まりません。"}, {"t": 868.85, "x": "決まらないので、短い参加でも\n役目は果たせています。"}, {"t": 872.5, "x": "果たせる形は、体調や家の都合とも両立します。"}, {"t": 876.3666666666667, "x": "両立するなら、最後までいる必要はありません。"}, {"t": 879.7666666666667, "x": "ありませんが、全部断るよりは選べる道が増えます。"}, {"t": 883.55, "x": "増えた道を、ここでは間の席と呼んでおきます。"}, {"t": 886.9666666666667, "x": "最後に、実際に見られているものをまとめておきます。"}, {"t": 890.55, "x": "見られているのは、参加したか\nどうかではありません。"}, {"t": 893.75, "x": "出ているのは、その後に二人の\n間に残る距離の方です。"}, {"t": 897.7, "x": "毎回来ている人でも、距離が遠いことがあります。"}, {"t": 901.1, "x": "一度も来ていない人でも、距離が近いことがあります。"}, {"t": 904.6166666666667, "x": "近さを作っているのは、会の\n席そのものではありません。"}, {"t": 908.4, "x": "作っているのは、日ごろの短いやり取りの方です。"}, {"t": 911.8, "x": "やり取りが足りていれば、欠席は事故になりません。"}, {"t": 915.2166666666667, "x": "なりませんが、足りない時には\n理由が足されていきます。"}, {"t": 918.85, "x": "足された理由は、本人の知らない場所で\n育っていきます。"}, {"t": 922.6166666666667, "x": "育った話を止めるのは、参加の回数ではありません。"}, {"t": 926.4166666666666, "x": "止めるのは、断る時に添える短い一行の方です。"}, {"t": 930.2166666666667, "x": "一行に、細かい事情まで書き込む必要はありません。"}, {"t": 934.1166666666667, "x": "必要なのは、避けていないと分かる形だけです。"}, {"t": 937.3666666666667, "x": "形さえあれば、誘う側の想像はそこで止まります。"}, {"t": 941.2, "x": "止まった想像は、仕事の頼み方にも出てきません。"}, {"t": 944.7333333333333, "x": "出てこなければ、翌日の距離も変わらずに済みます。"}, {"t": 948.3166666666667, "x": "変わらない距離が、この回で\nいちばん大きな部分です。"}, {"t": 951.9333333333333, "x": "大きいのは、席に座っていた\n時間の長さではありません。"}, {"t": 955.8666666666667, "x": "長さではなく、その前後に置いておく言葉の方です。"}, {"t": 959.7, "x": "空いた席の話は、その夜のうちには終わりません。"}, {"t": 963.2166666666667, "x": "終わらないものは、三ヶ月ほどかけて\n形になっていきます。"}, {"t": 966.9833333333333, "x": "何も足さなかった職場の方を、先に見ておきます。"}, {"t": 970.55, "x": "見てみると、断りの一行だけが積み上がっています。"}, {"t": 974.15, "x": "積み上がった頃には、誘いの\n声そのものが届かなくなります。"}, {"t": 978.1333333333333, "x": "届かない人のところには、雑談も\n相談も回ってきません。"}, {"t": 982.1, "x": "回らない場所では、前提のずれだけが\n静かに育ちやすいです。"}, {"t": 986.3833333333333, "x": "育ったずれは、やり直しという形で表に出てきます。"}, {"t": 990.1166666666667, "x": "出てきたやり直しを見て、周りは\n別の理由を探します。"}, {"t": 994.1166666666667, "x": "探した先で、仕事の丁寧さの\n話にされることがあります。"}, {"t": 998.2666666666667, "x": "その時、原因があの案内の一通だとは\n誰も思いません。"}, {"t": 1002.5666666666667, "x": "思われないので、直すべき場所も見つけられません。"}, {"t": 1005.8666666666667, "x": "見つからないまま、距離だけが静かに残っていきます。"}, {"t": 1009.4, "x": "残った距離は、どちらか片方の落ち度ではありません。"}, {"t": 1012.9666666666667, "x": "一方で、一行を足した職場の三ヶ月は少し違います。"}, {"t": 1017.2833333333333, "x": "違うのは、断りが情報を止めなくなるという点です。"}, {"t": 1021.0666666666667, "x": "止まらない情報は、参加の有無そのものを軽くします。"}, {"t": 1024.75, "x": "軽くなった場では、来る人も来ない人も\n同じに並びます。"}, {"t": 1028.5, "x": "並んでいる限り、説明を求める必要は出てきません。"}, {"t": 1032.4166666666667, "x": "出てこない場は、会を開く側の\n負担も軽くしてくれます。"}, {"t": 1036.35, "x": "三ヶ月後にどちらが見えているかは、\n今はまだ分かりません。"}, {"t": 1040.3666666666666, "x": "分からなくても、動かせる場所は\n一つだけ残っています。"}, {"t": 1044.0833333333333, "x": "動かせるのは、誘う時と断る時に\n足しておく一行です。"}, {"t": 1048.1833333333334, "x": "その一行が、\n空いた席を空白のままにしておきません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

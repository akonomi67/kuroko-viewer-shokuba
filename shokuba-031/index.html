<script>
const D={"name": "入社半年で辞めたくなる瞬間ワースト7", "file": "031_入社半年で辞めたくなる瞬間ワースト7", "dur": 1023.9333125, "segs": [], "subs": [{"t": 0.0, "x": "新人が辞めたくなるのは、大きな事件の\n日とは限らないと言われます。"}, {"t": 4.55, "x": "小さな当て外れが重なった日のほうが多いようです。"}, {"t": 7.833333333333333, "x": "厚生労働省の公表があります。"}, {"t": 10.2, "x": "大学を出て就職した人の三割ほどが、\n三年以内に離職しています。"}, {"t": 15.15, "x": "令和五年三月に卒業した人の数字です。"}, {"t": 18.25, "x": "三年と聞くと、遠い話に思えるかもしれません。"}, {"t": 21.95, "x": "けれど気持ちが揺れ始めるのは、\nもっと早い時期のことがあります。"}, {"t": 26.066666666666666, "x": "入社から半年まで。"}, {"t": 27.633333333333333, "x": "まだ仕事の形が見えていないころです。"}, {"t": 30.083333333333332, "x": "今日はそのころの瞬間を、ワースト七つとして\n並べます。"}, {"t": 33.96666666666667, "x": "順番は七位から始めます。"}, {"t": 35.96666666666667, "x": "一位まで一つずつ上がっていきます。"}, {"t": 38.25, "x": "並べる時は二人の新人を横に置きます。"}, {"t": 41.06666666666667, "x": "一人は同じ瞬間を通って職場に残った新人です。"}, {"t": 44.7, "x": "もう一人は辞めることを選んだ新人です。"}, {"t": 47.35, "x": "二人の差は、根性や能力の差とは限りません。"}, {"t": 50.8, "x": "差が出るのは受け取り方のほうです。"}, {"t": 53.016666666666666, "x": "残った新人は、まだ教わっていないことだと\n受け取りがちです。"}, {"t": 57.13333333333333, "x": "辞めた新人は、この職場はこういう所だと\n受け取りがちです。"}, {"t": 61.35, "x": "受け取り方は性格だけで決まるものでもありません。"}, {"t": 64.33333333333333, "x": "その日の上司の一言や周りの空気でも変わります。"}, {"t": 67.6, "x": "だから各順位の終わりには、\n上司の側の景色も添えます。"}, {"t": 71.58333333333333, "x": "その日の上司の目に何が映っていたのか。"}, {"t": 74.21666666666667, "x": "そこまで見ていきます。"}, {"t": 75.68333333333334, "x": "では、第七位からです。"}, {"t": 77.8, "x": "まずは第七位です。"}, {"t": 79.21666666666667, "x": "入社してすぐ、何週間かの研修があります。"}, {"t": 82.71666666666667, "x": "研修では仕事の手順を一つずつ教わります。"}, {"t": 85.85, "x": "書類の回し方や、取引先への連絡の順番などです。"}, {"t": 90.1, "x": "新人はそれをきちんとノートに書き写します。"}, {"t": 93.16666666666667, "x": "書き写したノートを持って配属先の机に着きます。"}, {"t": 96.58333333333333, "x": "着いて三日ほどで、ある場面にぶつかります。"}, {"t": 99.8, "x": "習ったとおりに進めると、そばの\n先輩が首をかしげるのです。"}, {"t": 103.93333333333334, "x": "うちではその順番でやっていない、と言われます。"}, {"t": 107.25, "x": "新人の手元では、研修のノートが開いたままです。"}, {"t": 111.13333333333334, "x": "顔が少し熱くなります。"}, {"t": 112.9, "x": "ここで二人の受け取り方が分かれます。"}, {"t": 115.25, "x": "残った新人は、手順には部署ごとの癖が\nあると考えます。"}, {"t": 119.5, "x": "研修で習ったのは会社全体の\n骨組みだったと気づきます。"}, {"t": 123.21666666666667, "x": "骨組みの上に部署の決まりが乗っている。"}, {"t": 125.63333333333334, "x": "そう整理し直します。"}, {"t": 127.21666666666667, "x": "整理し直すと、ノートを捨てずに済みます。"}, {"t": 130.3, "x": "余白に、この部署ではこうと書き足せばいいからです。"}, {"t": 133.76666666666668, "x": "書き足すたびに、ノートは自分だけの\n手順書になっていきます。"}, {"t": 137.7, "x": "辞めた新人は、習ったことが\n無駄だったと受け取りやすいです。"}, {"t": 141.7, "x": "あの研修は何だったのか。"}, {"t": 143.51666666666668, "x": "そんな気持ちが静かに残ります。"}, {"t": 145.61666666666667, "x": "残った気持ちは、次に教わる\n時の構えに変わっていきます。"}, {"t": 149.68333333333334, "x": "どうせこれも現場では違うのだろう、という構えです。"}, {"t": 153.4, "x": "構えがあると、教わる中身が\n頭に入りにくくなることがあります。"}, {"t": 157.8, "x": "入りにくいので、また違ったという経験が増えます。"}, {"t": 161.43333333333334, "x": "増えた経験が最初の構えを固めていきます。"}, {"t": 164.41666666666666, "x": "上司の側から見ると、この日は\nほとんど記憶に残っていません。"}, {"t": 168.66666666666666, "x": "部署のやり方は上司にとって見慣れた\n景色だからです。"}, {"t": 171.91666666666666, "x": "見慣れすぎていて、研修との違いを\n話す発想が出にくいのです。"}, {"t": 176.31666666666666, "x": "先輩が首をかしげたことにも、\n気づいていない場合があります。"}, {"t": 180.46666666666667, "x": "気づいていれば一言だけ添えられたかもしれません。"}, {"t": 183.43333333333334, "x": "研修の順番も間違いではない。"}, {"t": 185.65, "x": "この部署は少し違うだけだ、と。"}, {"t": 188.2, "x": "その一言がない日は、新人の側で\n答えを探すことになります。"}, {"t": 192.66666666666666, "x": "この当て外れを、二枚重ねのずれと\n名づけておきます。"}, {"t": 196.48333333333332, "x": "研修の一枚と部署の一枚。"}, {"t": 198.61666666666667, "x": "どちらの手順も間違いではありません。"}, {"t": 200.95, "x": "重ね方をだれも口に出していないだけです。"}, {"t": 203.56666666666666, "x": "続いて第六位です。"}, {"t": 205.08333333333334, "x": "配属の初日、朝礼で自己紹介の時間をもらいます。"}, {"t": 209.53333333333333, "x": "前に出て名前と意気込みを短く話します。"}, {"t": 212.45, "x": "話し終えると拍手が起きます。"}, {"t": 214.5, "x": "ここまでは温かい空気です。"}, {"t": 216.41666666666666, "x": "朝礼が終わると、みんな自分の机に戻ります。"}, {"t": 219.96666666666667, "x": "戻ったあと、新人に話しかけてくる人は\nほとんどいません。"}, {"t": 223.9, "x": "初日はまだ、そういうものだと思えます。"}, {"t": 226.88333333333333, "x": "二日目も三日目も、空気はあまり変わりません。"}, {"t": 230.25, "x": "四日目あたりから少しずつ気になり始めます。"}, {"t": 233.13333333333333, "x": "朝礼のあの拍手は何だったのだろうと思い始めます。"}, {"t": 236.51666666666668, "x": "一週目の終わりには、自分は\n浮いているのかと考えます。"}, {"t": 240.38333333333333, "x": "考えても答えは出ません。"}, {"t": 242.2, "x": "残った新人は、この一週間を\nみんなの忙しさとして受け取ります。"}, {"t": 246.88333333333333, "x": "話しかけられないのは嫌われているからではない。"}, {"t": 249.66666666666666, "x": "だれもが自分の仕事で\n手一杯なだけだ、と見ています。"}, {"t": 253.31666666666666, "x": "見ているうちに話しかけやすい時間帯にも気づきます。"}, {"t": 256.55, "x": "昼休みの前や夕方の片づけの時間です。"}, {"t": 259.5833333333333, "x": "その時間に、自分から質問を一つだけ持っていきます。"}, {"t": 263.5, "x": "一つの質問が次の会話のきっかけになっていきます。"}, {"t": 266.9166666666667, "x": "辞めた新人は、同じ一週間を\n別の意味で受け取りがちです。"}, {"t": 271.15, "x": "歓迎されていない印です。"}, {"t": 273.1166666666667, "x": "自己紹介の時の拍手が、形だけのものに\n見えてきます。"}, {"t": 277.46666666666664, "x": "形だけだと思うと、自分から\n近づく理由がなくなります。"}, {"t": 281.48333333333335, "x": "近づかないので、周りも話しかける機会を\nつかめません。"}, {"t": 285.31666666666666, "x": "機会がないまま二週目へと続いていきます。"}, {"t": 288.03333333333336, "x": "上司の側から見ると、この一週間は\n見守りの期間です。"}, {"t": 292.1166666666667, "x": "いきなり話しかけすぎると新人が\n疲れると考えています。"}, {"t": 295.8, "x": "慣れるまでそっとしておこう、という気づかいです。"}, {"t": 299.1333333333333, "x": "周りの社員にも似た気づかいが\n働いていることがあります。"}, {"t": 302.6, "x": "気づかいの静けさと無関心の静けさ。"}, {"t": 305.1166666666667, "x": "外からは同じに見えます。"}, {"t": 306.93333333333334, "x": "同じに見えるので、新人はどちらかを\n自分で選ぶことになります。"}, {"t": 311.21666666666664, "x": "選ぶ材料は、たいてい一週間の中にしかありません。"}, {"t": 315.0, "x": "しかも材料はとても少ないです。"}, {"t": 317.21666666666664, "x": "上司がこの期間の意味を伝えていたらどうでしょう。"}, {"t": 320.2, "x": "選び方は変わりやすいです。"}, {"t": 322.1, "x": "この当て外れは、拍手のあとの空白と呼べそうです。"}, {"t": 325.73333333333335, "x": "空白の長さは同じでも、何で\n埋めるかは人によって違います。"}, {"t": 330.06666666666666, "x": "続いて第五位です。"}, {"t": 331.48333333333335, "x": "配属から数日たった午前中、机の電話が鳴ります。"}, {"t": 335.6166666666667, "x": "周りの先輩は別の電話や作業で\n手がふさがっています。"}, {"t": 339.26666666666665, "x": "そばを通った上司が、出てみてと軽く声をかけます。"}, {"t": 343.06666666666666, "x": "新人はまだ電話の取り方を教わっていません。"}, {"t": 346.18333333333334, "x": "会社の名乗り方も取り次ぎの言い方も手探りです。"}, {"t": 349.28333333333336, "x": "受話器を持ち上げて、とにかく会社名を言います。"}, {"t": 352.75, "x": "相手は取引先の担当者です。"}, {"t": 355.06666666666666, "x": "早口で用件を話し始めます。"}, {"t": 357.45, "x": "名前が聞き取れません。"}, {"t": 358.98333333333335, "x": "聞き返していいのかも分かりません。"}, {"t": 361.1166666666667, "x": "なんとか保留にして、近くの先輩に助けを求めます。"}, {"t": 364.9, "x": "電話が終わったあと、新人の\n手のひらは汗で湿っています。"}, {"t": 368.95, "x": "ほんの短い時間の出来事です。"}, {"t": 371.1166666666667, "x": "残った新人は、これを早めの練習として\n受け取ります。"}, {"t": 375.06666666666666, "x": "一度やってみると、次に何を\n聞けばいいかが分かるからです。"}, {"t": 379.06666666666666, "x": "名乗り方と聞き返し方と取り次ぎ方。"}, {"t": 381.56666666666666, "x": "この三つだと見えてきます。"}, {"t": 383.26666666666665, "x": "見えた三つを、その日のうちに先輩へ聞きに行きます。"}, {"t": 387.03333333333336, "x": "聞いた答えは電話の横にメモとして貼っておきます。"}, {"t": 390.18333333333334, "x": "辞めた新人は、準備もなく放り出された日と\n受け取りがちです。"}, {"t": 394.31666666666666, "x": "恥をかかされたという気持ちが胸の奥に残ります。"}, {"t": 397.48333333333335, "x": "残った気持ちは、電話が鳴るたびに\n呼び起こされます。"}, {"t": 401.0, "x": "鳴るたびに体がこわばります。"}, {"t": 402.95, "x": "受話器に手が伸びにくくなります。"}, {"t": 404.93333333333334, "x": "手が伸びないことを周りに気づかれるのも\n怖くなっていきます。"}, {"t": 408.4166666666667, "x": "上司の側から見ると、この日の\n声かけはごく軽いものです。"}, {"t": 412.4, "x": "電話は出ながら覚えるもの、と\n考える上司も多いようです。"}, {"t": 416.5, "x": "上司自身もそうやって覚えてきた経験があるからです。"}, {"t": 420.01666666666665, "x": "新人を信頼して、\n一歩踏み出させたつもりでもあります。"}, {"t": 424.06666666666666, "x": "ただ、出たあとの手助けまでは\n考えていないことがあります。"}, {"t": 427.98333333333335, "x": "保留のあとで先輩が助けたことも、\n上司は見ていません。"}, {"t": 431.9, "x": "見ていないので、新人がどれほど\n焦ったかも知らないままです。"}, {"t": 435.8833333333333, "x": "知らないまま、翌日も同じように\n声をかけるかもしれません。"}, {"t": 440.1, "x": "上司にとっての軽い一言と、\n新人にとっての重い一回。"}, {"t": 444.21666666666664, "x": "この重さの差を、受話器の温度差と呼んでおきます。"}, {"t": 447.8, "x": "同じ電話でも、持つ手の温度が違うのです。"}, {"t": 450.96666666666664, "x": "続いて第四位です。"}, {"t": 452.5, "x": "別の部署に配属された同期から連絡が届きます。"}, {"t": 455.76666666666665, "x": "近況を話そうと、昼休みに会う約束をします。"}, {"t": 459.45, "x": "会ってみると、同期は配属先の話を\n楽しそうに始めます。"}, {"t": 463.8333333333333, "x": "先輩が丁寧に教えてくれる。"}, {"t": 466.03333333333336, "x": "初日から歓迎会があった。"}, {"t": 468.1166666666667, "x": "もう小さな仕事を任されている。"}, {"t": 470.26666666666665, "x": "そんな話が続きます。"}, {"t": 471.96666666666664, "x": "聞いているうちに、自分の部署と比べてしまいます。"}, {"t": 475.35, "x": "自分のところでは歓迎会の話はまだ出ていません。"}, {"t": 478.75, "x": "任された仕事も、雑務のようなものばかりです。"}, {"t": 482.06666666666666, "x": "机に戻ると、少し気持ちが重くなっています。"}, {"t": 485.43333333333334, "x": "理由ははっきりしません。"}, {"t": 487.18333333333334, "x": "残った新人は、同期の話を一つの参考として\n受け取ります。"}, {"t": 491.7, "x": "部署が違えば迎え方も違うものだと考えます。"}, {"t": 494.8833333333333, "x": "同期の話から、自分の部署でも\n使えそうなことを拾います。"}, {"t": 499.06666666666666, "x": "先輩への質問の仕方やメモの取り方などです。"}, {"t": 502.31666666666666, "x": "拾ったものを試すうちに、比べる気持ちは\n薄れていきます。"}, {"t": 506.21666666666664, "x": "辞めた新人は、同期の話を外れ\nくじの証拠と受け取りがちです。"}, {"t": 510.75, "x": "自分だけがうまくいかない部署に来てしまったと\n感じます。"}, {"t": 514.1166666666667, "x": "その気持ちが、毎日の小さな場面に\n色をつけていきます。"}, {"t": 518.1666666666666, "x": "先輩が忙しそうにしているだけでも\n冷たさに見えてきます。"}, {"t": 521.9166666666666, "x": "同期の話には、たいてい楽しい部分だけが\n入っています。"}, {"t": 525.95, "x": "大変だったことは友人の前では話しにくいからです。"}, {"t": 529.4, "x": "話しにくい部分は聞く側からは見えません。"}, {"t": 532.3166666666667, "x": "見えない分だけ、差は大きく感じられやすいです。"}, {"t": 535.9, "x": "上司の側から見ると、同期どうしの会話は\n見えていません。"}, {"t": 539.9, "x": "見えないところで、新人の物差しが\n一本増えています。"}, {"t": 543.6833333333333, "x": "増えた物差しが部署の出来事を測り直していきます。"}, {"t": 547.0, "x": "上司は、迎え方が他と比べられていると\n気づきにくいです。"}, {"t": 550.9833333333333, "x": "気づいていれば、迎え方の順番を\n一言で伝えられたかもしれません。"}, {"t": 555.5666666666667, "x": "この部署で仕事を任せるのは\n来月から、という予定です。"}, {"t": 559.55, "x": "予定が見えていれば、比べた\n時の重さも少し変わりやすいです。"}, {"t": 563.9666666666667, "x": "この当て外れを、隣の部署の窓と名づけておきます。"}, {"t": 567.7166666666667, "x": "窓の向こうは、いつも少しだけ明るく見えるものです。"}, {"t": 571.2833333333333, "x": "続いて第三位です。"}, {"t": 572.8166666666667, "x": "仕事の途中で分からないことが出てきます。"}, {"t": 575.4833333333333, "x": "教育係の先輩に聞きに行こうと立ち上がります。"}, {"t": 578.7166666666667, "x": "ところが先輩の席は空いています。"}, {"t": 580.95, "x": "打ち合わせに出ているようです。"}, {"t": 582.8166666666667, "x": "三十分後に見ても、まだ戻っていません。"}, {"t": 585.9166666666666, "x": "戻ってきたと思ったら、すぐに電話が入ります。"}, {"t": 589.3166666666667, "x": "電話が終わると、今度は客先へ\n出かける準備を始めます。"}, {"t": 593.5333333333333, "x": "声をかけるきっかけが、一日に\n何度もすり抜けていきます。"}, {"t": 597.5666666666667, "x": "分からないことは机の上に置かれたままになります。"}, {"t": 600.6333333333333, "x": "午後になっても同じです。"}, {"t": 602.2333333333333, "x": "残った新人は、聞くための時間を\n自分で作ろうとします。"}, {"t": 606.4, "x": "聞きたいことをメモにまとめて、\n三つずつ持っていきます。"}, {"t": 609.9666666666667, "x": "始業前や、外出から戻った直後をねらいます。"}, {"t": 613.6, "x": "チャットで一行だけ送ることもあります。"}, {"t": 616.15, "x": "手が空いたら五分ください、という一行です。"}, {"t": 619.5166666666667, "x": "先輩の動き方が分かってくると、\n聞ける時間も見えてきます。"}, {"t": 623.7166666666667, "x": "辞めた新人は、相手にされていない印と\n受け取りやすいです。"}, {"t": 627.9333333333333, "x": "教育係なのに教えてくれない、と感じます。"}, {"t": 631.3833333333333, "x": "感じたことをだれにも言えないまま抱えていきます。"}, {"t": 634.3333333333334, "x": "自分なりに進めて、あとから\n違うと言われることもあります。"}, {"t": 638.2166666666667, "x": "違うと言われても、聞けなかった事情は伝わりません。"}, {"t": 641.8333333333334, "x": "伝わらないので、自分だけが\n責められているように感じます。"}, {"t": 645.7333333333333, "x": "上司の側から見ると、先輩の\n忙しさはよく分かっています。"}, {"t": 650.0, "x": "分かっているからこそ、教育係を\n決めて安心しています。"}, {"t": 654.0, "x": "決めたあとで話す時間があるかまでは見ていません。"}, {"t": 657.05, "x": "先輩の側も、新人がどれだけ\n待っていたかを知りません。"}, {"t": 660.9833333333333, "x": "聞きに来ないので順調だと思っていることもあります。"}, {"t": 664.0833333333334, "x": "三人とも、相手を悪く思っているわけではありません。"}, {"t": 667.9333333333333, "x": "ただ、聞く時間がどこにもないことに\n気づいていないのです。"}, {"t": 671.5666666666667, "x": "この当て外れは、空いた椅子の質問と呼べそうです。"}, {"t": 675.1333333333333, "x": "質問は、椅子が空いているあいだに\n少しずつ重くなります。"}, {"t": 679.0833333333334, "x": "続いて第二位です。"}, {"t": 680.4833333333333, "x": "入社して三ヶ月ほどたったころ、\n初めて一つの仕事を任されます。"}, {"t": 685.0, "x": "取引先に出す資料をまとめてほしい、という\n依頼です。"}, {"t": 688.95, "x": "新人は任されたことがうれしくて取りかかります。"}, {"t": 692.0333333333333, "x": "取りかかると、どこまで作ればいいかが分かりません。"}, {"t": 695.4333333333333, "x": "表を一枚作れば終わりなのか。"}, {"t": 697.6, "x": "説明の文章までつけるのか。"}, {"t": 699.7333333333333, "x": "期限は聞いていますが、仕上がりの形は\n聞いていません。"}, {"t": 703.5666666666667, "x": "迷いながら、思いつく限りのものを足していきます。"}, {"t": 707.0333333333333, "x": "足していくうちに期限が近づいてきます。"}, {"t": 709.4833333333333, "x": "夜遅くまで残る日も出てきます。"}, {"t": 711.6333333333333, "x": "出してみると、上司から要らなかった部分を\n指摘されます。"}, {"t": 715.3166666666667, "x": "次の仕事では、\n反対に足りないと言われることもあります。"}, {"t": 719.1333333333333, "x": "残った新人は、終わりの形は\n聞いてもいいものだと気づきます。"}, {"t": 723.4833333333333, "x": "次からは取りかかる前に一つだけ確かめます。"}, {"t": 726.4, "x": "仕上がりは何枚ぐらいで、だれが\n読むものかという点です。"}, {"t": 730.4666666666667, "x": "確かめた分だけ迷う時間が短くなっていきます。"}, {"t": 733.6333333333333, "x": "浮いた時間で、次の仕事の準備が\nできるようになります。"}, {"t": 737.4333333333333, "x": "辞めた新人は、正解が見えない\n職場だと受け取りがちです。"}, {"t": 741.5833333333334, "x": "足しても言われる。"}, {"t": 742.6833333333333, "x": "削っても言われる。"}, {"t": 743.9333333333333, "x": "そう感じてしまいます。"}, {"t": 745.4833333333333, "x": "感じたまま四ヶ月目へと進んでいきます。"}, {"t": 748.25, "x": "進むうちに、任されること自体が怖くなっていきます。"}, {"t": 751.95, "x": "怖さは、うれしかった最初の\n依頼まで塗り替えていきます。"}, {"t": 755.7833333333333, "x": "上司の側から見ると、終わりの形は\n頭の中にあります。"}, {"t": 759.8666666666667, "x": "何度も同じ資料を見てきました。"}, {"t": 762.0, "x": "だから言わなくても分かると思っています。"}, {"t": 764.4666666666667, "x": "それで依頼の時に形を伝え忘れます。"}, {"t": 767.2166666666667, "x": "伝え忘れたことに、出てきた\n資料を見て初めて気づきます。"}, {"t": 771.3333333333334, "x": "気づいた時には、新人はもう期限まで\n走り終えています。"}, {"t": 775.3, "x": "言い方がきつくなくても、新人には\n重く届きやすいです。"}, {"t": 779.25, "x": "三ヶ月目の新人にとって、初めての\n仕事は特別な一回だからです。"}, {"t": 784.2833333333333, "x": "上司の頭の中にある終わりと、\n新人の手元にある始まり。"}, {"t": 788.4, "x": "この二つの離れ方を、地図のない依頼と\n呼んでおきます。"}, {"t": 792.2666666666667, "x": "地図がなければ、だれが歩いても\n道に迷いやすいものです。"}, {"t": 796.2333333333333, "x": "いよいよ第一位です。"}, {"t": 797.8, "x": "入社前の説明会や面接で、仕事の中身を\n聞いています。"}, {"t": 802.15, "x": "企画を考える。"}, {"t": 803.4333333333333, "x": "お客さんと話す。"}, {"t": 804.7, "x": "新しいものを作る。"}, {"t": 806.2166666666667, "x": "そういう話を聞いて、この会社を選んだ人も多いです。"}, {"t": 810.2333333333333, "x": "ところが入社して半年、毎日の\n作業はかなり違って見えます。"}, {"t": 814.8, "x": "データの入力や書類の確認、\n会議の準備が続いています。"}, {"t": 819.2166666666667, "x": "聞いていた仕事は、まだ遠いところにあるように\n感じます。"}, {"t": 822.9166666666666, "x": "ここで時間が効いてきます。"}, {"t": 824.7, "x": "一週目は、最初はこんなものだと思えます。"}, {"t": 827.8833333333333, "x": "三ヶ月目には、いつになったら\n始まるのだろうと思い始めます。"}, {"t": 832.1333333333333, "x": "半年目には、このまま変わらないのではと\n考えるようになります。"}, {"t": 836.2833333333333, "x": "残った新人は、今の作業を下ごしらえとして\n受け取ります。"}, {"t": 840.4833333333333, "x": "入力しているデータは、いつか\n企画の材料になるかもしれない。"}, {"t": 844.5666666666667, "x": "確認している書類は、お客さんとの\n約束の中身かもしれない。"}, {"t": 848.85, "x": "そうやって、目の前の作業と\n聞いていた仕事を線でつなぎます。"}, {"t": 853.1333333333333, "x": "つなげない時は、この作業が\n何につながるかを上司に尋ねます。"}, {"t": 857.4833333333333, "x": "その答えが、作業の意味を少し変えてくれることが\nあります。"}, {"t": 861.4166666666666, "x": "辞めた新人は、入社前の話が\n違っていたと受け取りがちです。"}, {"t": 865.85, "x": "だまされたとまでは思わなくても、\n期待との差が残ります。"}, {"t": 869.65, "x": "その差が、毎朝の足取りを少しずつ重くしていきます。"}, {"t": 873.7166666666667, "x": "重いまま、ほかの会社ならと\n考える時間が増えていきます。"}, {"t": 877.7666666666667, "x": "その中で、別の道を真剣に探し始めることもあります。"}, {"t": 881.95, "x": "上司の側から見ると、今の作業は大事な土台です。"}, {"t": 885.7833333333333, "x": "土台がないと、聞いていた仕事には\nたどり着けないと知っています。"}, {"t": 889.85, "x": "知っているので、説明しなくても\n伝わると思いがちです。"}, {"t": 893.6166666666667, "x": "上司自身も、若いころは同じ作業を\nこなしてきたからです。"}, {"t": 897.6833333333333, "x": "こなしてきた側には、その作業の行き先が\n見えています。"}, {"t": 901.4666666666667, "x": "見えているものを、新人にも\n見えていると思ってしまうのです。"}, {"t": 905.5, "x": "新人の目には、つながる先がまだ映っていません。"}, {"t": 909.0666666666667, "x": "映っていない先を毎日想像し続けるのは、\nなかなか大変です。"}, {"t": 913.5333333333333, "x": "入社前の説明は、たいてい何年か\n先の仕事を話しています。"}, {"t": 918.0333333333333, "x": "新人はそれを、半年後の自分の姿として\n聞いていることがあります。"}, {"t": 922.8666666666667, "x": "このずれを、説明会の時差と名づけておきます。"}, {"t": 926.2666666666667, "x": "時差は、だれかがうそをついたから\n生まれるものではありません。"}, {"t": 930.2166666666667, "x": "同じ言葉を、違う時間の物差しで\n聞いていただけなのです。"}, {"t": 934.25, "x": "ここまでで、七位から一位までがそろいました。"}, {"t": 937.4, "x": "七つの瞬間を短く振り返ります。"}, {"t": 939.9833333333333, "x": "手順のずれ。"}, {"t": 940.9666666666667, "x": "拍手のあとの空白。"}, {"t": 942.5, "x": "急に任された電話。"}, {"t": 944.0833333333334, "x": "同期の話。"}, {"t": 945.1666666666666, "x": "空いた椅子。"}, {"t": 946.0333333333333, "x": "終わりの見えない仕事。"}, {"t": 947.55, "x": "そして説明会の時差です。"}, {"t": 949.4833333333333, "x": "どれも大きな事件とは呼べないものばかりでした。"}, {"t": 952.4, "x": "一つずつなら耐えられそうです。"}, {"t": 954.4166666666666, "x": "それでも重なると、辞めたくなる気持ちを\n押し上げます。"}, {"t": 958.0, "x": "残った新人も、\n七つを感じなかったわけではありません。"}, {"t": 961.9833333333333, "x": "同じように迷い、落ち込んだ日もあったはずです。"}, {"t": 965.2666666666667, "x": "辞めた新人も、弱かったから辞めたとは限りません。"}, {"t": 968.9833333333333, "x": "早めに見切りをつけて、別の場所で\n力を出している人もいます。"}, {"t": 973.2333333333333, "x": "二人を分けたのは、受け取ったあとの言葉でした。"}, {"t": 976.4833333333333, "x": "残った新人の多くが、心の中で\n口にしていた一言があります。"}, {"t": 981.05, "x": "それは、今のところは、という一言です。"}, {"t": 984.4666666666667, "x": "短い言葉です。"}, {"t": 985.75, "x": "この職場はこういう所だ。"}, {"t": 987.6333333333333, "x": "今のところは。"}, {"t": 988.75, "x": "この仕事は面白くない。"}, {"t": 990.4333333333333, "x": "今のところは。"}, {"t": 991.5333333333333, "x": "そうやって、判断の最後に小さく付け足していました。"}, {"t": 995.2166666666667, "x": "付け足すだけで、判断は閉じずに\n開いたまま残ります。"}, {"t": 998.95, "x": "開いたままの判断は、次の日の\n出来事で書き換えられます。"}, {"t": 1002.8833333333333, "x": "上司の側から見ても、この一言は\n大事な手がかりになります。"}, {"t": 1006.95, "x": "新人の判断が開いているうちに、\n届く言葉があるからです。"}, {"t": 1011.1666666666666, "x": "今日の七つは、どれもその届く前の時間の話でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

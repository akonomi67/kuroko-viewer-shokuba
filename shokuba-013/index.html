<title>会議で発言しない人がいちばん損をしている</title>
<style>

<script>
const D={"name": "会議で発言しない人がいちばん損をしている", "file": "013_会議で発言しない人がいちばん損をしている", "dur": 944.0833125, "segs": [], "subs": [{"t": 0.0, "x": "会議は、一日に何度も開かれています。"}, {"t": 3.1666666666666665, "x": "開かれた時間を、一年ぶんで数えてみます。"}, {"t": 6.466666666666667, "x": "数えると、何百時間という単位になります。"}, {"t": 9.766666666666667, "x": "単位は大きいのに、話す人は限られています。"}, {"t": 13.15, "x": "限られた数人が、ほとんどの時間を使います。"}, {"t": 16.566666666666666, "x": "使われない時間は、黙って座っていた時間です。"}, {"t": 20.083333333333332, "x": "時間そのものは、全員に同じだけ流れています。"}, {"t": 23.6, "x": "流れた後に残るものが、人によって違います。"}, {"t": 26.933333333333334, "x": "違いは、能力の差として説明されることがあります。"}, {"t": 30.583333333333332, "x": "説明されがちですが、実際は単純です。"}, {"t": 33.88333333333333, "x": "単純に、声を出したかどうかで分かれています。"}, {"t": 37.1, "x": "分かれ目を、ひとつの場面で見てみます。"}, {"t": 39.8, "x": "水曜の朝、八人が会議室に集まっています。"}, {"t": 43.55, "x": "集まった目的は、来月の進め方を決めることです。"}, {"t": 47.416666666666664, "x": "決めるための資料は、前日に配られています。"}, {"t": 50.68333333333333, "x": "配られた資料に、気になる点を見つけた人がいます。"}, {"t": 54.25, "x": "見つけた人は、最後の確認の場面まで待ちました。"}, {"t": 57.833333333333336, "x": "待つうちに、ほかにありますかと聞かれます。"}, {"t": 60.63333333333333, "x": "聞かれてから、七秒ほど静かな時間が流れます。"}, {"t": 64.16666666666667, "x": "流れた七秒のあと、会議はそのまま終わりました。"}, {"t": 67.78333333333333, "x": "終わった時点では、誰も損をしていない\nように見えます。"}, {"t": 71.51666666666667, "x": "見えているだけなのかを、今日は\n一つずつ確かめます。"}, {"t": 74.86666666666666, "x": "まず、黙っていた時間がどう残るかを見ます。"}, {"t": 78.4, "x": "残り方は、本人の記憶と場の記録で違います。"}, {"t": 82.01666666666667, "x": "本人の中では、考えた時間として残ります。"}, {"t": 85.55, "x": "考えていたなら、\n何もしていないわけではありません。"}, {"t": 89.06666666666666, "x": "ありませんが、場の側に中身は届いていません。"}, {"t": 92.43333333333334, "x": "届かないものは、無かったものとして扱われます。"}, {"t": 95.7, "x": "扱いが厳しいのは、その人を軽く見るからでしょうか。"}, {"t": 99.43333333333334, "x": "軽く見ているのではなく、見えていないだけです。"}, {"t": 102.56666666666666, "x": "見えていないのは、話す力が\n足りないからでしょうか。"}, {"t": 105.98333333333333, "x": "足りないというより、出す順番を\n取れなかっただけです。"}, {"t": 109.85, "x": "順番を取れた人も取れない人も、\n同じ点に気づきます。"}, {"t": 113.6, "x": "気づいた中身に、大きな差はありません。"}, {"t": 116.38333333333334, "x": "差がつくのは、場に出たかどうかだけです。"}, {"t": 119.15, "x": "出たものは、後から参照できる形になります。"}, {"t": 122.55, "x": "形になった意見は、次の会議でも引き合いに出ます。"}, {"t": 126.23333333333333, "x": "出されない考えは、本人の中に残り続けます。"}, {"t": 129.8, "x": "残り続けたものは、誰の判断にも使われません。"}, {"t": 133.43333333333334, "x": "使われない分は、動いていない\n時間として見られやすいです。"}, {"t": 137.5, "x": "見られ方の違いが、黙ることの最初の損です。"}, {"t": 140.91666666666666, "x": "二つ目は、黙る側の言い分を見ます。"}, {"t": 143.8, "x": "言い分の多くは、賛成だから\n言わないというものです。"}, {"t": 147.36666666666667, "x": "案に不足がなければ、足す言葉はありません。"}, {"t": 150.46666666666667, "x": "進め方に異論がなければ、止める理由もありません。"}, {"t": 154.06666666666666, "x": "時間が押していれば、短く終わるほうが親切です。"}, {"t": 157.85, "x": "そういう理由で、口を閉じたままにします。"}, {"t": 160.95, "x": "一方で、場を回す側の見え方は違います。"}, {"t": 164.35, "x": "回す側には、賛成も反対も同じ静けさです。"}, {"t": 168.03333333333333, "x": "静けさには、まだ読んでいない\n人も混ざる場合があります。"}, {"t": 171.8, "x": "混ざっているので、静けさだけでは\n判断がつきません。"}, {"t": 175.4, "x": "つかないまま進めると、差し戻しが\n出ることがあります。"}, {"t": 179.0, "x": "出た差し戻しの理由を、誰も先に言いません。"}, {"t": 182.58333333333334, "x": "言わない以上、止め損ねたのは全員です。"}, {"t": 185.76666666666668, "x": "全員の責任になると、個人の評価に結びつきません。"}, {"t": 189.7, "x": "結びつかない代わりに、助けた形跡も残りません。"}, {"t": 193.25, "x": "残らないのは、賛成が言葉にならないからです。"}, {"t": 196.58333333333334, "x": "言葉にならない賛成は、数えようがありません。"}, {"t": 199.91666666666666, "x": "数えられるのは、声として出たものだけです。"}, {"t": 202.91666666666666, "x": "出し方は、この後の項目で分けていきます。"}, {"t": 206.15, "x": "三つ目は、会議のあとに残る記憶の話です。"}, {"t": 209.6, "x": "記憶に残るのは、話の中身だけではありません。"}, {"t": 213.0, "x": "一時間の会議が終わって、部屋を出たとします。"}, {"t": 216.33333333333334, "x": "出た直後に覚えているのは、ほんの数点です。"}, {"t": 219.61666666666667, "x": "数点のうちの一つは、誰が口を開いたかです。"}, {"t": 223.36666666666667, "x": "情報としては薄いのに、長く残ります。"}, {"t": 226.45, "x": "残る理由は、声が場面と結びつくからです。"}, {"t": 229.85, "x": "結びついた記憶は、後から引き出しやすいです。"}, {"t": 233.2, "x": "引き出しやすい人は、名前で思い出される側です。"}, {"t": 236.73333333333332, "x": "一方で、中身の細かい部分は数日で薄れます。"}, {"t": 240.51666666666668, "x": "薄れた後に残るのは、誰が関わったかの印象です。"}, {"t": 244.43333333333334, "x": "印象は、正しさとは別のところで働くことがあります。"}, {"t": 248.41666666666666, "x": "働いた印象が、次の仕事の振り分けに使われます。"}, {"t": 252.25, "x": "使われる時、黙った人の名前は挙がりにくいです。"}, {"t": 255.96666666666667, "x": "挙がらないのは、思い出す手がかりが無いからです。"}, {"t": 259.18333333333334, "x": "無いまま時間が経つと、参加そのものが薄れます。"}, {"t": 262.5833333333333, "x": "薄れた参加を、出席と呼ぶことはできます。"}, {"t": 265.76666666666665, "x": "呼べても、関わった記録にはなりにくいです。"}, {"t": 268.8833333333333, "x": "この薄れ方を、声のない出席と呼んでおきます。"}, {"t": 272.35, "x": "四つ目は、時間をかけて出てくる差です。"}, {"t": 275.31666666666666, "x": "差は、会議が終わった時点では見えません。"}, {"t": 278.55, "x": "見えないので、一言足した人も\n得をした気はしません。"}, {"t": 282.15, "x": "しない代わりに、損をした感じもありません。"}, {"t": 285.3333333333333, "x": "ありませんが、数日たつと変化が出ることがあります。"}, {"t": 288.9, "x": "出るのは、あの件はどう思うかと聞かれる場面です。"}, {"t": 292.3833333333333, "x": "聞く側は、意見を持ちそうな人から当たります。"}, {"t": 295.6, "x": "当たる先は、その場で声を出した人になります。"}, {"t": 298.9, "x": "なるのは、中身が良かったからとは限りません。"}, {"t": 302.05, "x": "限らないのに、相談の順番は先に回ってきます。"}, {"t": 305.68333333333334, "x": "回ってきた相談は、情報を先に受け取る機会です。"}, {"t": 309.48333333333335, "x": "機会が重なると、判断の材料が一人だけ増えます。"}, {"t": 313.28333333333336, "x": "増えた材料は、数ヶ月後の提案の質に出てきます。"}, {"t": 317.15, "x": "出てきた質を、周りは力の差として受け取ります。"}, {"t": 320.7, "x": "受け取られた差は、もう一度機会の差に変わります。"}, {"t": 324.0833333333333, "x": "変わった先で、二人の距離はさらに開きます。"}, {"t": 327.3333333333333, "x": "開いた距離の始まりは、会議での一言です。"}, {"t": 330.6, "x": "一言の中身は、当たり障りのないもので構いません。"}, {"t": 334.28333333333336, "x": "構わない理由は、次の項目で見えてきます。"}, {"t": 337.6166666666667, "x": "五つ目は、考えている側の内側を見ます。"}, {"t": 340.98333333333335, "x": "内側では、細かい組み立てが進んでいます。"}, {"t": 344.3, "x": "この案なら確認の手間が減る、という見通しです。"}, {"t": 347.81666666666666, "x": "この順番なら来月の山を越える、という読みです。"}, {"t": 351.51666666666665, "x": "この言い方なら先方も受け入れる、という配慮です。"}, {"t": 355.2, "x": "そこまで組み立ててから、出そうと考えます。"}, {"t": 358.25, "x": "一方で、場に届いているものは何もありません。"}, {"t": 361.56666666666666, "x": "何も無いまま会議は進み、別の案で決まります。"}, {"t": 365.03333333333336, "x": "決まった後に、自分の案のほうが良いと感じます。"}, {"t": 368.55, "x": "感じても、決まったものを覆すのは重くなります。"}, {"t": 372.1666666666667, "x": "重いので、そのまま黙って進めることになります。"}, {"t": 375.48333333333335, "x": "進めながら、納得しない気持ちだけが残ります。"}, {"t": 379.01666666666665, "x": "残った気持ちは、やる気の落ち方として\n外に出ることがあります。"}, {"t": 383.1166666666667, "x": "出た様子を、周りは別の理由で解釈します。"}, {"t": 386.56666666666666, "x": "解釈された理由は、本人の考えと関係ありません。"}, {"t": 390.55, "x": "関係のないところで、評判だけが動きます。"}, {"t": 393.8, "x": "動いた評判の元は、出さなかった一つの案です。"}, {"t": 397.4, "x": "案は、完成してから出す必要はありません。"}, {"t": 400.71666666666664, "x": "出し方の形を、次の項目で見ていきます。"}, {"t": 404.03333333333336, "x": "六つ目は、なぜ口が開かないのかという話です。"}, {"t": 407.51666666666665, "x": "話の前に、よくある説明を二つ外します。"}, {"t": 411.0833333333333, "x": "一つ目は、性格がおとなしいからという説明です。"}, {"t": 414.8333333333333, "x": "分かりやすい説明ですが、これは合いません。"}, {"t": 417.96666666666664, "x": "合わないのは、同じ人が少人数では話すからです。"}, {"t": 421.65, "x": "二つ目は、意見が無いからという説明です。"}, {"t": 424.8666666666667, "x": "これも合わないのは、後で不満が出るからです。"}, {"t": 428.0, "x": "出る以上、意見そのものは持っています。"}, {"t": 430.8833333333333, "x": "持っているのに出ないのは、入る場所の問題です。"}, {"t": 434.15, "x": "問題になるのは、話の切れ目が読めない時です。"}, {"t": 437.55, "x": "読めないまま待つと、話題は次へ進みます。"}, {"t": 440.8, "x": "進んでしまえば、前の話に戻すのは重いです。"}, {"t": 444.48333333333335, "x": "重さを避けて、また次の切れ目を待ちます。"}, {"t": 447.56666666666666, "x": "待つうちに、会議は終わりに近づきます。"}, {"t": 450.55, "x": "近づいた頃には、出す理由のほうが薄れます。"}, {"t": 453.95, "x": "薄れた理由を、本人はやる気の問題だと考えます。"}, {"t": 457.71666666666664, "x": "考えてしまうと、次の会議でも\n同じことが起きやすいです。"}, {"t": 461.8333333333333, "x": "起きるのは、性格ではなく順番の取り方の問題です。"}, {"t": 465.6666666666667, "x": "取り方は、この後の三つで分けていきます。"}, {"t": 468.71666666666664, "x": "七つ目は、会議の中の時間の並びです。"}, {"t": 471.9, "x": "並びには、入りやすい場所と\nそうでない場所があります。"}, {"t": 475.56666666666666, "x": "始まってすぐの三分は、まだ流れが固まりません。"}, {"t": 479.23333333333335, "x": "固まる前なら、短い確認でも浮きません。"}, {"t": 482.48333333333335, "x": "浮かない言葉は、場の空気を止めずに済みます。"}, {"t": 485.7, "x": "済むので、出す側の負担も軽くなりやすいです。"}, {"t": 489.21666666666664, "x": "軽いうちに一度声を出すと、後が変わります。"}, {"t": 492.95, "x": "変わるのは、二回目が出しやすくなる点です。"}, {"t": 495.96666666666664, "x": "逆に、三分を過ぎると流れは強くなります。"}, {"t": 499.4166666666667, "x": "強い流れの中では、話題を戻す形になります。"}, {"t": 503.01666666666665, "x": "戻す形は、反対の合図として受け取られやすいです。"}, {"t": 506.8, "x": "受け取られたくないので、また一手遅れます。"}, {"t": 509.68333333333334, "x": "遅れた分だけ、次に入る場所は狭くなります。"}, {"t": 51 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

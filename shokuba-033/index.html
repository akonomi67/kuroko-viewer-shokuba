<script>
const D={"name": "ランチに誘われなくなった部下の三ヶ月", "file": "033_ランチに誘われなくなった部下の三ヶ月", "dur": 1002.75, "segs": [], "subs": [{"t": 0.0, "x": "三ヶ月後、部下は予定の変更を\nいつも最後に知るようになっていました。"}, {"t": 4.8, "x": "会議の部屋が変わった時もそうでした。"}, {"t": 7.2, "x": "締切が一日早まった時もそうです。"}, {"t": 9.883333333333333, "x": "気づくのは、たいてい周りが動き出してからでした。"}, {"t": 13.15, "x": "慌てて席を立ちます。"}, {"t": 14.7, "x": "資料を抱えて追いかけます。"}, {"t": 16.616666666666667, "x": "そんな朝が、何度も続いていました。"}, {"t": 19.366666666666667, "x": "誰かに意地悪をされたわけではありません。"}, {"t": 21.916666666666668, "x": "部下のほうにも、何かを失敗した覚えはありません。"}, {"t": 25.533333333333335, "x": "始まりは二回の昼の誘いでした。"}, {"t": 27.833333333333332, "x": "忙しさを理由に断ったものです。"}, {"t": 30.233333333333334, "x": "この話は職場でよくある流れを\n一つの話にまとめたものです。"}, {"t": 34.266666666666666, "x": "登場するのは二人です。"}, {"t": 35.916666666666664, "x": "ある上司と、その下に配属された部下です。"}, {"t": 39.06666666666667, "x": "昼に誘ってくれた同僚たちは、\n話の中にだけ出てきます。"}, {"t": 43.083333333333336, "x": "今日は誰が悪いかを決める話にはしません。"}, {"t": 45.983333333333334, "x": "昼を一人で過ごすのが悪いという話でもありません。"}, {"t": 49.3, "x": "追いかけるのは、断った理由が\n届かなかった三ヶ月です。"}, {"t": 53.2, "x": "理由が届かないと、会社の中で\n何が変わっていくのでしょうか。"}, {"t": 57.4, "x": "では、配属二ヶ月目の昼前に戻ります。"}, {"t": 60.666666666666664, "x": "配属されて二ヶ月目のことです。"}, {"t": 62.81666666666667, "x": "部下はようやく仕事の流れが見えてきた頃でした。"}, {"t": 65.86666666666666, "x": "流れが見えると、任される量も増えていきます。"}, {"t": 69.26666666666667, "x": "増えるのは信頼されているしるしでもあります。"}, {"t": 72.13333333333334, "x": "その週、部下は初めて一人で\n受け持つ資料を抱えていました。"}, {"t": 76.33333333333333, "x": "期限は金曜の夕方です。"}, {"t": 78.41666666666667, "x": "月曜の朝から頭の中はそれで一杯でした。"}, {"t": 81.53333333333333, "x": "上司からは、分からなければ\n聞いてよいと言われています。"}, {"t": 85.13333333333334, "x": "けれど、できれば一人で仕上げたいと\n思っていました。"}, {"t": 88.61666666666666, "x": "昼の少し前です。"}, {"t": 90.06666666666666, "x": "隣の席の同僚が声をかけてきました。"}, {"t": 92.73333333333333, "x": "今日はみんなで新しい店に行くので\n一緒にどうか、という誘いです。"}, {"t": 97.35, "x": "部下は画面から目を離しません。"}, {"t": 99.5, "x": "そのまま今日はちょっとと答えました。"}, {"t": 101.73333333333333, "x": "同僚は軽くうなずきます。"}, {"t": 103.56666666666666, "x": "そして三人ほどで出かけていきました。"}, {"t": 105.93333333333334, "x": "部下は机でパンをかじります。"}, {"t": 107.93333333333334, "x": "そして資料の続きを打ちます。"}, {"t": 109.96666666666667, "x": "二日後の水曜です。"}, {"t": 111.51666666666667, "x": "同じ同僚がもう一度声をかけてくれました。"}, {"t": 114.3, "x": "部下はまた頭を下げます。"}, {"t": 116.1, "x": "今日も手が離せないと答えました。"}, {"t": 118.23333333333333, "x": "同僚は小さく笑いました。"}, {"t": 120.16666666666667, "x": "そのまま出ていきます。"}, {"t": 121.65, "x": "部下は少しだけ申し訳なく思いました。"}, {"t": 124.26666666666667, "x": "それでも手は止めません。"}, {"t": 125.83333333333333, "x": "画面の数字を追い続けます。"}, {"t": 127.81666666666666, "x": "二回とも部下に悪気はありません。"}, {"t": 129.95, "x": "金曜が過ぎれば、また一緒に行けばいいと\n思っていました。"}, {"t": 133.81666666666666, "x": "ただ、その気持ちは口から一度も出ていません。"}, {"t": 136.96666666666667, "x": "金曜までという区切りも伝えていません。"}, {"t": 139.51666666666668, "x": "資料の話もしていません。"}, {"t": 141.4, "x": "同僚の耳に残ったのは、今日は\nちょっとという短い言葉だけでした。"}, {"t": 145.93333333333334, "x": "短い断りには、理由が書かれていません。"}, {"t": 149.01666666666668, "x": "聞いた人は、空いた理由を自分で\n埋めることになりがちです。"}, {"t": 152.9, "x": "忙しいのかもしれません。"}, {"t": 154.68333333333334, "x": "一人が好きなのかもしれません。"}, {"t": 156.6, "x": "誘われるのが負担なのかもしれません。"}, {"t": 159.0, "x": "埋める材料が無いと、人は楽な\n答えを選びやすいものです。"}, {"t": 163.01666666666668, "x": "楽な答えとは、これ以上誘わなくてよい答えです。"}, {"t": 166.65, "x": "相手を気づかうつもりで、そっとしておく\n理由になるからです。"}, {"t": 170.5, "x": "部下が資料を出し終えたのは、\n金曜の夜七時過ぎでした。"}, {"t": 174.5, "x": "出し終えて、ほっと肩の力が抜けます。"}, {"t": 177.43333333333334, "x": "昼の誘いのことは思い出しもしません。"}, {"t": 179.88333333333333, "x": "思い出さないのも、無理はなかったのかも\nしれません。"}, {"t": 183.15, "x": "誘いはこの先も来るものだと、\nどこかで思っていたからです。"}, {"t": 187.16666666666666, "x": "ここでは、この二回を理由の\n空いた断りと呼んでおきます。"}, {"t": 191.06666666666666, "x": "断ったこと自体は小さなことです。"}, {"t": 193.43333333333334, "x": "理由の欄が空いていたことが、後で効いてきます。"}, {"t": 196.71666666666667, "x": "翌週の月曜です。"}, {"t": 198.28333333333333, "x": "部下の机に、先週ほどの急ぎの仕事はありません。"}, {"t": 202.03333333333333, "x": "昼が近づくと、隣の同僚たちが立ち上がります。"}, {"t": 205.65, "x": "部下は顔を上げました。"}, {"t": 207.18333333333334, "x": "けれど声はかかりません。"}, {"t": 208.85, "x": "たまたま誘い忘れたのだろうと部下は考えます。"}, {"t": 211.9, "x": "火曜も水曜も同じことが続きました。"}, {"t": 214.45, "x": "同僚たちは小声で店の名前を言い合います。"}, {"t": 217.35, "x": "そして出ていきます。"}, {"t": 218.68333333333334, "x": "部下はコンビニの袋を持って休憩室へ向かいました。"}, {"t": 222.03333333333333, "x": "休憩室で一人で食べる昼は、\n思っていたより気楽でした。"}, {"t": 226.05, "x": "スマホを見ながら、好きな速さで食べられます。"}, {"t": 229.25, "x": "誰にも気を使わずに済みます。"}, {"t": 231.36666666666667, "x": "話題を探す必要もありません。"}, {"t": 233.61666666666667, "x": "気楽だったので、誘いが止まったことを\n深く考えません。"}, {"t": 237.38333333333333, "x": "一週間が過ぎました。"}, {"t": 238.98333333333332, "x": "誘いはまだ来ません。"}, {"t": 240.48333333333332, "x": "止まった誘いには音がありません。"}, {"t": 242.63333333333333, "x": "断る時は、誰かが声をかけて誰かが首を振ります。"}, {"t": 246.7, "x": "誘いが来なくなる時は違います。"}, {"t": 248.93333333333334, "x": "何も起きないまま日が過ぎます。"}, {"t": 250.95, "x": "何も起きないので、気づくきっかけもありません。"}, {"t": 254.08333333333334, "x": "同僚たちのほうでも、何かを\n決めたわけではありませんでした。"}, {"t": 258.2, "x": "二回断られたあと、三回目を\n言い出す理由が無かっただけです。"}, {"t": 262.53333333333336, "x": "もう一度誘って、また断られたら気まずいと感じます。"}, {"t": 266.3833333333333, "x": "しつこい人だと思われるのも避けたいところです。"}, {"t": 269.26666666666665, "x": "相手の昼を邪魔したくない気持ちもあります。"}, {"t": 271.9, "x": "小さなためらいが重なると、\n声は出にくくなるものです。"}, {"t": 275.6333333333333, "x": "誘う人にとって、三回目は一回目より\n重い一言だと言われます。"}, {"t": 280.31666666666666, "x": "重いのは前の二回の答えを覚えているからです。"}, {"t": 283.3833333333333, "x": "覚えている答えは、どちらも短い断りでした。"}, {"t": 286.8, "x": "こうして、どちらも何も決めないまま二週間が\n過ぎました。"}, {"t": 290.6666666666667, "x": "部下は今でも誘われれば行くつもりでいます。"}, {"t": 293.31666666666666, "x": "同僚たちは、誘っても来ない人だと\n思い始めています。"}, {"t": 297.1166666666667, "x": "二人の考えは一度も確かめられません。"}, {"t": 299.75, "x": "そして少しずつ離れていきました。"}, {"t": 301.9166666666667, "x": "ここでは、この変化を音のしない目減りと\n呼んでおきます。"}, {"t": 305.65, "x": "誰も切ろうとしていません。"}, {"t": 307.35, "x": "それなのに一本の線だけが細くなります。"}, {"t": 310.0833333333333, "x": "細くなった線は、どこにつながっていたのでしょう。"}, {"t": 313.3333333333333, "x": "それが分かるのは、もう少し先のことです。"}, {"t": 316.3, "x": "断ってから一ヶ月ほどたった頃です。"}, {"t": 318.8333333333333, "x": "部署の連絡用のチャットに小さな変化がありました。"}, {"t": 322.0833333333333, "x": "仕事のやり取りは今まで通り流れています。"}, {"t": 324.96666666666664, "x": "変わったのは、仕事の合間に\n交わされる軽い一言のほうでした。"}, {"t": 329.1166666666667, "x": "少し前まで、昼の店の話もここで交わされていました。"}, {"t": 333.03333333333336, "x": "今日はあの店が空いているという\n短いメッセージです。"}, {"t": 336.26666666666665, "x": "それがいつの間にか流れなくなっていました。"}, {"t": 338.8, "x": "ある日の午後です。"}, {"t": 339.98333333333335, "x": "隣の席の同僚の画面がちらりと目に入りました。"}, {"t": 343.28333333333336, "x": "見えたのは、部下の知らないグループの名前でした。"}, {"t": 346.4166666666667, "x": "昼の店を決めるために、同僚たちが\n作ったグループのようです。"}, {"t": 350.65, "x": "並んだ名前の中に、部下の名前だけがありません。"}, {"t": 354.06666666666666, "x": "部下は見なかったことにしました。"}, {"t": 355.95, "x": "そして自分の画面に目を戻します。"}, {"t": 358.3333333333333, "x": "胸の奥が少しだけ冷えたような気がしました。"}, {"t": 361.1166666666667, "x": "いつからあったのかは分かりません。"}, {"t": 363.1333333333333, "x": "聞いてみる気持ちにもなれませんでした。"}, {"t": 365.4, "x": "ただ、同僚たちに悪気があったとは言い切れません。"}, {"t": 368.81666666666666, "x": "昼に行く人だけで作れば、行かない人に\n通知が鳴りません。"}, {"t": 372.85, "x": "むしろ気づかいだったのかもしれません。"}, {"t": 375.03333333333336, "x": "誘わない理由はちゃんと用意されていました。"}, {"t": 377.8333333333333, "x": "部下は昼に来ない人だと、\nもう思われていたからです。"}, {"t": 381.45, "x": "グループの中身は、最初は店の名前と\nスタンプだけだったはずです。"}, {"t": 385.81666666666666, "x": "けれど雑談の場所は、\n雑談だけでは終わりにくいものです。"}, {"t": 389.73333333333335, "x": "午後の打ち合わせがずれるらしいという話が\n流れます。"}, {"t": 393.0833333333333, "x": "上司が明日は朝から外に出るそうだという\n話も流れます。"}, {"t": 396.9, "x": "半分は仕事の話です。"}, {"t": 398.8333333333333, "x": "それが軽い一言に混ざって流れ始めるのです。"}, {"t": 401.78333333333336, "x": "正式な連絡になる前の話は、\n気楽な場所から先に出ていくと言われます。"}, {"t": 406.95, "x": "部下がいないのは、昼の店を決める場所です。"}, {"t": 410.03333333333336, "x": "同時に、連絡になる前の話が\n最初に通る場所でもありました。"}, {"t": 414.43333333333334, "x": "ここでは、この場所を雑談の通り道と呼んでおきます。"}, {"t": 418.1666666666667, "x": "部下が閉じたつもりだったのは、\n昼の一時間だけでした。"}, {"t": 421.76666666666665, "x": "本当に閉じていたのは、もう少し広い\n通り道だったのです。"}, {"t": 425.8, "x": "二ヶ月目に入ると、通り道の\n外にいることが仕事に出始めます。"}, {"t": 430.3, "x": "最初は会議の部屋が変わった日でした。"}, {"t": 432.8, "x": "いつもの会議室に入ると、中には誰もいません。"}, {"t": 436.31666666666666, "x": "少しして、隣の部屋から笑い声が聞こえてきました。"}, {"t": 440.03333333333336, "x": "部屋の変更は昼のうちに人づてで回っていたようです。"}, {"t": 443.51666666666665, "x": "正式なメールが届いたのは、\n会議が始まる五分前でした。"}, {"t": 447.76666666666665, "x": "部下は資料を抱えて、隣の部屋へ急ぎました。"}, {"t": 451.25, "x": "扉を開けると、何人かが顔を上げます。"}, {"t": 454.3, "x": "空いていたのは、入口に近い端の席でした。"}, {"t": 457.53333333333336, "x": "次は、取引先へ出す見積の期限が\n一日早まった時です。"}, {"t": 462.03333333333336, "x": "同僚たちは前の日の昼には知っていました。"}, {"t": 464.81666666666666, "x": "部下が知ったのは当日の朝の朝礼でした。"}, {"t": 467.7, "x": "どうにか間に合いました。"}, {"t": 469.18333333333334, "x": "けれど、その日は昼を食べる余裕もありません。"}, {"t": 472.5, "x": "こうした出来事は、一つずつなら小さなことです。"}, {"t": 475.8, "x": "誰かが部下を外そうとしたわけでもありません。"}, {"t": 478.7, "x": "意地悪をした人はどこにもいないのです。"}, {"t": 481.1166666666667, "x": "正式な連絡は、遅れても必ず届いています。"}, {"t": 484.75, "x": "けれど早く知る人と遅く知る\n人の差は、毎回同じ向きに開きます。"}, {"t": 489.4166666666667, "x": "遅く知る人は、いつも急いで合わせることになります。"}, {"t": 492.9, "x": "急いで合わせる姿は、周りからは\n段取りの悪い人に見えがちです。"}, {"t": 497.45, "x": "本人の力とは関係ありません。"}, {"t": 499.8666666666667, "x": "知る順番が評判を作ってしまうのです。"}, {"t": 502.68333333333334, "x": "部下は、自分だけ知らされていないのではと\n考え始めました。"}, {"t": 506.8, "x": "考え始めると、\n周りに確かめることもしにくくなります。"}, {"t": 510.71666666666664, "x": "確かめれば、知らないことを\n打ち明けることになるからです。"}, {"t": 514.3833333333333, "x": "部下は聞きませんでした。"}, {"t": 515.9666666666667, "x": "かわりに予定表を何度も見直します。"}, {"t": 518.5, "x": "朝に一回見ます。"}, {"t": 519.9333333333333, "x": "昼にもう一回見ます。"}, {"t": 521.55, "x": "帰る前にも見ます。"}, {"t": 523.0, "x": "予定表に書かれるのは、決まったことだけです。"}, {"t": 526.15, "x": "決まる前のずれは載りません。"}, {"t": 527.9833333333333, "x": "変わりそうだという気配も載りません。"}, {"t": 530.2333333333333, "x": "気配を拾えるのは、決まる前の\n話が通る場所にいる人です。"}, {"t": 534.5333333333333, "x": "こういう時、まず誰に聞くのが楽でしょうか。"}, {"t": 537.7666666666667, "x": "部下には、気軽に聞ける相手が\nもう思い浮かびませんでした。"}, {"t": 541.6166666666667, "x": "ここでは、この状態を最後尾の知らせと\n呼んでおきます。"}, {"t": 545.5, "x": "外されてはいません。"}, {"t": 546.9166666666666, "x": "ただ、いつも列の最後に知らせが届くのです。"}, {"t": 550.2, "x": "ここで、上司のほうから同じ三ヶ月を見てみます。"}, {"t": 553.7666666666667, "x": "上司は部下が昼の誘いを断っていることを\n早くから知っていました。"}, {"t": 557.9166666666666, "x": "同僚の一人が、それとなく話していたからです。"}, {"t": 561.2166666666667, "x": "最近の若い人は昼くらい一人でいたいのかも\nしれない、という話でした。"}, {"t": 566.2333333333333, "x": "上司はそれを聞いて少しほっとしました。"}, {"t": 568.8166666666667, "x": "上司が若い頃は、昼も夜も先輩に\n連れ回されていました。"}, {"t": 573.0833333333334, "x": "楽しい日もありました。"}, {"t": 574.5666666666667, "x": "気が重い日もありました。"}, {"t": 576.1666666666666, "x": "同じことを今の部下に求めれば、\n負担になると感じていたのです。"}, {"t": 580.3666666666667, "x": "誘いを無理に勧めない。"}, {"t": 582.0666666666667, "x": "一人の昼を大事にさせる。"}, {"t": 583.8666666666667, "x": "上司にとって、それは部下を\n守る気づかいのつもりでした。"}, {"t": 587.7333333333333, "x": "上司から見た部下は、仕事が\n丁寧で口数の少ない人です。"}, {"t": 592.0, "x": "昼は休憩室で静かに過ごします。"}, {"t": 594.5, "x": "定時になると早めに帰ります。"}, {"t": 596.5666666666667, "x": "その姿は、一人で落ち着きたい\n人の姿として筋が通って見えました。"}, {"t": 601.3833333333333, "x": "筋が通っていたので、上司は\n本人に確かめませんでした。"}, {"t": 605.4833333333333, "x": "確かめると、かえって気を使わせると思ったのです。"}, {"t": 609.1166666666667, "x": "昼の話を持ち出すこと自体が、\n押しつけに聞こえる気もしました。"}, {"t": 613.35, "x": "会議の部屋の件も見積の期限の\n件も、上司は耳にしていました。"}, {"t": 618.0333333333333, "x": "ただ上司はそれを、一人で抱えたがる\n人だからだと受け取ります。"}, {"t": 622.3, "x": "困っていれば、きっと言ってくるはずだと考えました。"}, {"t": 625.75, "x": "言ってこないのは、自分の進め方が\nあるからだと思ったのです。"}, {"t": 629.8833333333333, "x": "上司にも手一杯の事情がありました。"}, {"t": 632.3, "x": "会議が続きます。"}, {"t": 633.6666666666666, "x": "夜まで席に戻れない日もあります。"}, {"t": 635.8833333333333, "x": "期末に向けて、上から求められる\n数字が増えていた時期です。"}, {"t": 639.9833333333333, "x": "部下一人一人の昼まで目を配る\n余裕は、正直ありませんでした。"}, {"t": 644.4333333333333, "x": "放っておこうとしたのではありません。"}, {"t": 646.6666666666666, "x": "そっとしておくほうを選んだのです。"}, {"t": 648.7833333333333, "x": "けれど外から見ると、二つはよく似ています。"}, {"t": 651.9, "x": "そっとしておく気づかいと、気づかずにいることです。"}, {"t": 655.15, "x": "部下から見れば、上司も同僚も\n黙って遠くにいる人たちでした。"}, {"t": 659.3833333333333, "x": "上司から見れば、部下は自分で\n距離を選んだ人でした。"}, {"t": 663.1166666666667, "x": "同じ距離を、二人はまったく別の\n理由で受け取っていたのです。"}, {"t": 667.2666666666667, "x": "ここでは、この受け取り違いを\n善意の空席と呼んでおきます。"}, {"t": 671.35, "x": "誰も奪っていない席が、気づかいのせいで\n空いたままになるのです。"}, {"t": 675.5166666666667, "x": "断ってから三ヶ月がたちました。"}, {"t": 677.7333333333333, "x": "部署に新しい人が配属されます。"}, {"t": 680.15, "x": "その人の歓迎会が、金曜の夜に\n開かれることになりました。"}, {"t": 684.4, "x": "部下がそれを知ったのは、歓迎会の翌週の月曜です。"}, {"t": 688.3666666666667, "x": "休憩室で、同僚たちが楽しかった店の話を\nしていたのです。"}, {"t": 692.8166666666667, "x": "部下は湯のみを持つ手を止めました。"}, {"t": 694.9166666666666, "x": "新しい人の名前も、そこで初めて知りました。"}, {"t": 698.3, "x": "話の輪に入る言葉が見つかりません。"}, {"t": 700.8166666666667, "x": "聞いていると、声かけは順に\n回されていたようでした。"}, {"t": 704.4, "x": "幹事が何人かに伝えます。"}, {"t": 706.3166666666667, "x": "伝えられた人が、また隣の人に伝えます。"}, {"t": 709.4333333333333, "x": "その順番が、部下の一つ手前で止まっていたのです。"}, {"t": 713.0166666666667, "x": "止めた同僚にも、はっきりした\n理由はありませんでした。"}, {"t": 716.6, "x": "あの人はたぶん来ないだろうと思っただけです。"}, {"t": 719.3166666666667, "x": "昼にも来ないのだから、夜は\nもっと来ないだろうと考えました。"}, {"t": 723.35, "x": "来ない人に声をかけるのは、\nかえって負担かもしれないとも思いました。"}, {"t": 727.8666666666667, "x": "三ヶ月前の今日はちょっとという一言が、\nここまで届いていたのです。"}, {"t": 732.4666666666667, "x": "上司は歓迎会の席で、部下が\nいないことに気づいていました。"}, {"t": 736.5166666666667, "x": "気づいたうえで、来ない人なのだと\n受け取っていました。"}, {"t": 739.8833333333333, "x": "部下に来てほしくないと思っていた人は、\n誰もいません。"}, {"t": 743.5833333333334, "x": "ただ、誘えば来たかもしれないと\n考えた人もいなかったのです。"}, {"t": 747.6166666666667, "x": "その日の午後、部下はなかなか仕事に\n手がつきませんでした。"}, {"t": 751.4, "x": "歓迎会に出られなかったことは、まだ我慢できます。"}, {"t": 754.8833333333333, "x": "知らされなかったことのほうが、ずっとこたえました。"}, {"t": 758.15, "x": "けれど振り返ると、思い当たる所があります。"}, {"t": 761.35, "x": "昼の誘いを断った、あの二回です。"}, {"t": 764.2833333333333, "x": "断ったのは昼の一時間だけのはずでした。"}, {"t": 767.1, "x": "それが三ヶ月かけて、夜の席の\n声かけまで届いていたのです。"}, {"t": 771.4833333333333, "x": "声かけは、人から人へつながる\n細い糸のようなものです。"}, {"t": 775.3, "x": "一度切れた所から先には、何も流れなくなります。"}, {"t": 778.9666666666667, "x": "切れたことには誰も気づきません。"}, {"t": 781.0166666666667, "x": "切れた先にいる本人も後から知るだけです。"}, {"t": 783.8333333333334, "x": "ここでは、この切れ目を声かけの終点と\n呼んでおきます。"}, {"t": 787.6166666666667, "x": "終点を作ったのは、誰か一人の判断ではありません。"}, {"t": 791.6333333333333, "x": "理由の空いた断りを、周りが\n少しずつ同じ向きに読んだ結果です。"}, {"t": 796.4833333333333, "x": "では三ヶ月前の昼前に何があれば、\n流れは変わったのでしょうか。"}, {"t": 801.1833333333333, "x": "誘いに乗ればよかったという\n答えは、ここでは選びません。"}, {"t": 805.0, "x": "忙しい日に断るのは、当たり前のことだからです。"}, {"t": 808.5833333333334, "x": "昼を一人で過ごしたい日があっても、\nまったく構いません。"}, {"t": 812.45, "x": "変えられたかもしれないのは、断る言葉の長さです。"}, {"t": 816.05, "x": "長さといっても、ほんの一言ぶんです。"}, {"t": 818.8833333333333, "x": "今日はちょっとで終わる断りには、次がありません。"}, {"t": 822.3, "x": "聞いた人は、次も断られるかもしれないと考えます。"}, {"t": 826.0166666666667, "x": "そして誘いを控えがちになります。"}, {"t": 828.2333333333333, "x": "では、断りのあとに次の約束が\n一つ添えられていたらどうでしょう。"}, {"t": 832.7333333333333, "x": "たとえば、金曜までは資料に\n追われているという一言です。"}, {"t": 836.7333333333333, "x": "そのあとに、来週ならぜひ行きたいと添えます。"}, {"t": 840.0666666666667, "x": "この中には、断った理由と次の日付が入っています。"}, {"t": 843.9333333333333, "x": "理由があれば、聞いた人が自分で\n理由を埋めずに済みます。"}, {"t": 848.0166666666667, "x": "日付があれば、三回目の誘いを出す口実が残ります。"}, {"t": 852.0166666666667, "x": "口実があると、誘う人は声を出しやすくなります。"}, {"t": 855.6833333333333, "x": "誘う人は、断られたのではなく\n延ばされたと受け取りやすくなります。"}, {"t": 860.1, "x": "延ばされた誘いは、来週になれば\n自然に戻ってきます。"}, {"t": 863.9833333333333, "x": "誘われた人のほうから、来週の水曜を\n出す形もあります。"}, {"t": 868.2666666666667, "x": "誘われる側から日付を出すと、\n誘う人の重さが少し軽くなるからです。"}, {"t": 873.2666666666667, "x": "もちろん、この一言で何もかも\nうまくいくとは限りません。"}, {"t": 877.2, "x": "来週になっても、誘いが戻らないこともあるでしょう。"}, {"t": 880.7, "x": "それでも理由の空いた断りよりは、\n扉が開いたままになりやすいものです。"}, {"t": 885.55, "x": "上司のほうにも、同じことが言えます。"}, {"t": 888.2833333333333, "x": "一人が好きな人に見えても、\n本人がそう言ったとは限りません。"}, {"t": 892.4666666666667, "x": "時々、昼はどうしているのかを\n軽く聞いてみる手があります。"}, {"t": 896.3666666666667, "x": "それだけで、受け取り違いがほどけることもあります。"}, {"t": 899.8, "x": "誘うかどうかを決めるのは、\nそのあとでも遅くありません。"}, {"t": 903.5333333333333, "x": "ここでは、この形を扉を残す断りと呼んでおきます。"}, {"t": 907.5, "x": "断る中身は同じです。"}, {"t": 909.2333333333333, "x": "それでも次の約束が一つあると、\n通り道は閉じにくくなります。"}, {"t": 913.75, "x": "昼の一時間を断ることと、会社の\n通り道から外れることは別の話です。"}, {"t": 919.0666666666667, "x": "二つを別のままにしておくのは、\n断る時の一言の長さなのかもしれません。"}, {"t": 924.05, "x": "それから半年ほどたった、ある木曜の昼前です。"}, {"t": 927.8, "x": "部下はまた締切の近い資料を抱えていました。"}, {"t": 930.8333333333334, "x": "春に配属された後輩が、遠慮がちに声を\nかけてきます。"}, {"t": 934.8833333333333, "x": "新しくできた店に、みんなで行くという誘いでした。"}, {"t": 938.4666666666667, "x": "部下は手を止めて、画面から顔を上げます。"}, {"t": 941.5666666666667, "x": "夕方までに出す資料があるので、\n今日は行けないと伝えました。"}, {"t": 945.5666666666667, "x": "すぐに、来週の火曜なら空いているとも伝えます。"}, {"t": 949.0333333333333, "x": "その日にぜひ連れていってほしいと言い添えました。"}, {"t": 951.8833333333333, "x": "後輩は少しほっとした顔でうなずきます。"}, {"t": 954.6166666666667, "x": "火曜ですね、と小さく繰り返して席に戻りました。"}, {"t": 958.3333333333334, "x": "その日の午後です。"}, {"t": 959.6166666666667, "x": "部署のチャットに後輩からメッセージが届きました。"}, {"t": 962.6666666666666, "x": "火曜の昼の店の候補が三つ、短く並んでいます。"}, {"t": 966.65, "x": "その下に、もう一行だけ添えられていました。"}, {"t": 969.9166666666666, "x": "明日の打ち合わせは会議室が\n三階に変わるそうです、という一行です。"}, {"t": 975.1, "x": "正式なメールが届いたのは、\nそれから二時間後のことでした。"}, {"t": 979.1333333333333, "x": "部下は慌てずに済みました。"}, {"t": 980.9, "x": "部下はその一行を見て、半年前の\n休憩室を少しだけ思い出します。"}, {"t": 985.95, "x": "断ったのは、あの時と同じ昼の一時間です。"}, {"t": 989.4166666666666, "x": "違ったのは、断りのあとに火曜という\n一語を置いたことだけでした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

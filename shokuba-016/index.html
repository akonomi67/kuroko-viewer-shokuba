<script>
const D={"name": "辞める人が辞めると言う前に見せていること", "file": "016_辞める人が辞めると言う前に見せていること", "dur": 930.81665625, "segs": [], "subs": [{"t": 0.0, "x": "辞めますという一言は、一年に\n何度か職場に落ちます。"}, {"t": 3.95, "x": "落ちた瞬間は、たいてい誰に\nとっても突然に見えます。"}, {"t": 7.9, "x": "突然に見えるのは、そこだけを数えているからです。"}, {"t": 11.383333333333333, "x": "数えていない場所で、話はもっと前から\n進んでいます。"}, {"t": 15.283333333333333, "x": "進んでいた期間は、一ヶ月では\n済まないことがあります。"}, {"t": 19.216666666666665, "x": "済まない方が多いのに、外からは\n一日の出来事になります。"}, {"t": 23.316666666666666, "x": "出来事の形になる頃、本人の\n中では何度も往復が終わっています。"}, {"t": 28.05, "x": "終わっていた往復の数を、周りは\n一度も見ていません。"}, {"t": 31.766666666666666, "x": "見ていない分だけ、辞める側と\n残る側の景色は離れます。"}, {"t": 36.016666666666666, "x": "離れた景色のまま、引き止める言葉が出てきます。"}, {"t": 39.38333333333333, "x": "出てきた言葉が届かないのは、\nやる気の話にすり替わるからです。"}, {"t": 43.63333333333333, "x": "すり替わると、何が起きていたのかが\n記録に残りません。"}, {"t": 47.46666666666667, "x": "残らないので、次の人が抜ける\n時も同じ順番をたどります。"}, {"t": 51.61666666666667, "x": "たどった回数だけ、職場は同じ驚き方を\n繰り返します。"}, {"t": 55.86666666666667, "x": "繰り返しているのは、\n兆しが無かったからではありません。"}, {"t": 59.5, "x": "兆しはあって、別の意味で読まれていただけです。"}, {"t": 62.766666666666666, "x": "読まれ方がずれる場所を、今日は\n順番に見ていきます。"}, {"t": 66.36666666666666, "x": "見ていくと、態度の変化として\n片づけていたものが別の形になります。"}, {"t": 71.03333333333333, "x": "形が変われば、声のかけ方も変わってきます。"}, {"t": 74.3, "x": "まず、辞める話がどこで始まるのかを見ます。"}, {"t": 77.81666666666666, "x": "始まりは、退職の申し出だと思われがちです。"}, {"t": 81.2, "x": "思われがちですが、そこはもう終わりの側です。"}, {"t": 84.51666666666667, "x": "終わりの側から数えると、順番が逆になります。"}, {"t": 88.03333333333333, "x": "逆のまま、原因を探しにいく人が多いです。"}, {"t": 91.65, "x": "待遇が理由でしょうか。"}, {"t": 93.33333333333333, "x": "待遇だけで決める人は、思ったより多くありません。"}, {"t": 96.9, "x": "では、人間関係でしょうか。"}, {"t": 99.31666666666666, "x": "これも、最後のひと押しになることはあります。"}, {"t": 102.35, "x": "ありますが、始まりの位置とは限りません。"}, {"t": 105.26666666666667, "x": "始まりは、もっと静かな場所にあることが多いです。"}, {"t": 108.76666666666667, "x": "静かな場所とは、この先の予定を思い描く時間です。"}, {"t": 112.7, "x": "時間の中で、半年後の自分を置いてみます。"}, {"t": 116.0, "x": "置いてみて、その席に自分がいないと\n感じる日があります。"}, {"t": 119.83333333333333, "x": "感じた日から、本人の中では話が動き始めます。"}, {"t": 123.63333333333334, "x": "動き始めた話は、口に出るまで誰にも見えません。"}, {"t": 127.33333333333333, "x": "見えないまま、相談も引き止めも\n間に合わなくなります。"}, {"t": 130.91666666666666, "x": "間に合わない状態で出てくるのが、あの一言です。"}, {"t": 134.28333333333333, "x": "一言が出た時点で、中の話はもう終わっています。"}, {"t": 138.03333333333333, "x": "二つ目は、決めた後に起きる変化です。"}, {"t": 140.95, "x": "変化は、荒れる方向には出にくいです。"}, {"t": 143.91666666666666, "x": "出にくいどころか、むしろ静かになります。"}, {"t": 146.7, "x": "静かになるのは、揉めずに出たいからです。"}, {"t": 149.53333333333333, "x": "出るまでの期間を、短く穏やかに終えたいと\n考えます。"}, {"t": 153.4, "x": "考える人は、角の立つ言い方を避け始めます。"}, {"t": 156.88333333333333, "x": "避けるので、会議での反対意見が減っていきます。"}, {"t": 160.48333333333332, "x": "減ったのを見て、丸くなったと受け取る人がいます。"}, {"t": 163.91666666666666, "x": "受け取り方としては、自然なところです。"}, {"t": 166.76666666666668, "x": "自然ですが、中身は逆のことがあります。"}, {"t": 169.91666666666666, "x": "逆というのは、関心が外れているという意味です。"}, {"t": 173.36666666666667, "x": "外れた関心は、態度の穏やかさとして表に出ます。"}, {"t": 177.2, "x": "出た穏やかさを、成長と読む職場もあります。"}, {"t": 180.58333333333334, "x": "読んだまま半年が過ぎ、内示の\n時期に申し出が届きます。"}, {"t": 184.63333333333333, "x": "届いた側は、急に変わったと感じることが多いです。"}, {"t": 188.36666666666667, "x": "感じるだけで、変化は何ヶ月も前から出ていました。"}, {"t": 192.03333333333333, "x": "出ていた変化は、悪い形をしていませんでした。"}, {"t": 195.5, "x": "していないので、誰も引っかからなかっただけです。"}, {"t": 198.98333333333332, "x": "引っかからない人ほど、読み落とされやすくなります。"}, {"t": 202.38333333333333, "x": "三つ目は、席で交わされる短いやり取りです。"}, {"t": 205.63333333333333, "x": "やり取りは、来期の担当を決める時に出てきます。"}, {"t": 209.05, "x": "出てきた時、来年の話にだけ\n返事が薄くなる人がいます。"}, {"t": 213.26666666666668, "x": "薄い返事は、その場では聞き流されます。"}, {"t": 216.28333333333333, "x": "流された後で、担当は別の人に渡ります。"}, {"t": 219.63333333333333, "x": "渡した側は、忙しいのだろうと考えます。"}, {"t": 222.9, "x": "考えた通りに、その日はそのまま終わります。"}, {"t": 226.2, "x": "終わった日の中身は、二人で違っています。"}, {"t": 229.15, "x": "頼んだ側は、断られたとは思っていません。"}, {"t": 232.36666666666667, "x": "受けなかった側は、断ったつもりでいます。"}, {"t": 235.35, "x": "つもりの差が生まれるのは、先の長さが違うからです。"}, {"t": 238.96666666666667, "x": "長さが違うと、同じ依頼が別の重さになります。"}, {"t": 242.6, "x": "重さの変わる境目は、半年より先かどうかです。"}, {"t": 246.25, "x": "先の話だけを外す動きを、静かな線引きと\n呼んでおきます。"}, {"t": 250.65, "x": "線引きは、悪意とは関係なく起きます。"}, {"t": 253.81666666666666, "x": "起きているのに、記録にはどこにも残りません。"}, {"t": 256.81666666666666, "x": "残らないので、後から振り返る材料になりません。"}, {"t": 260.31666666666666, "x": "材料が無いと、抜けた理由は性格の話になります。"}, {"t": 264.15, "x": "性格の話に落ちると、次の人にも\n同じ線が引かれます。"}, {"t": 268.3, "x": "四つ目は、言葉の主語の話です。"}, {"t": 271.05, "x": "主語は、本人が気づかないうちに入れ替わります。"}, {"t": 274.4166666666667, "x": "うちの方針という言い方が、少しずつ減ります。"}, {"t": 277.8333333333333, "x": "減った代わりに、その部署ではという\n言い方が増えます。"}, {"t": 281.5, "x": "増えた言い方は、外から見る位置に立っています。"}, {"t": 284.76666666666665, "x": "立つ位置が変わると、評価の言葉も変わります。"}, {"t": 288.01666666666665, "x": "変わった言葉は、批判の形を\n取らないことが多いです。"}, {"t": 291.85, "x": "多いのは、もう争う必要が無いからです。"}, {"t": 295.0, "x": "必要が無い人は、冷静で公平な意見を言います。"}, {"t": 298.73333333333335, "x": "言われた側は、視野が広くなったと感じます。"}, {"t": 301.9166666666667, "x": "感じるのは間違いではありませんが、半分だけです。"}, {"t": 305.55, "x": "半分は、距離が取れたことによる落ち着きです。"}, {"t": 308.76666666666665, "x": "落ち着きの理由を、成長と読むか距離と読むか。"}, {"t": 312.01666666666665, "x": "読み分ける材料は、主語のほうに出ています。"}, {"t": 315.18333333333334, "x": "出ているのに、聞かれるのは中身ばかりです。"}, {"t": 318.06666666666666, "x": "聞き流された主語は、記憶に残りません。"}, {"t": 321.01666666666665, "x": "残らないので、後から兆しを思い出せません。"}, {"t": 324.25, "x": "思い出せない側は、何も無かったと言います。"}, {"t": 327.3333333333333, "x": "言われた本人は、ずっと出していたつもりでいます。"}, {"t": 330.68333333333334, "x": "五つ目は、休みの取り方に出る変化です。"}, {"t": 333.78333333333336, "x": "変化は、日数そのものには出にくいです。"}, {"t": 336.78333333333336, "x": "出にくいのに、取り方の形だけが変わります。"}, {"t": 339.93333333333334, "x": "まとめて取っていた有給が、一日ずつに割れます。"}, {"t": 343.5833333333333, "x": "割れた一日は、週の半ばに置かれることがあります。"}, {"t": 347.1166666666667, "x": "置かれた日の理由は、用事とだけ書かれます。"}, {"t": 350.1666666666667, "x": "書かれた通りに、周りは深く考えません。"}, {"t": 353.35, "x": "考えないまま、定時で帰る日が少しずつ増えます。"}, {"t": 357.03333333333336, "x": "増えた分を、働き方を見直したのだと\n読む人がいます。"}, {"t": 360.96666666666664, "x": "読み方としては、今の職場では自然です。"}, {"t": 364.1666666666667, "x": "自然ですが、別の読み方もできます。"}, {"t": 367.0, "x": "できるのは、先の予定が入っている場合です。"}, {"t": 370.23333333333335, "x": "入っている予定は、\n平日の昼にしか置けないことがあります。"}, {"t": 374.28333333333336, "x": "あることを知っていても、踏み込むのは\n難しいところです。"}, {"t": 377.96666666666664, "x": "難しいのは、休みの理由まで\n尋ねる場面ではないからです。"}, {"t": 382.1333333333333, "x": "ないので、ここは探りを入れる話ではありません。"}, {"t": 385.5, "x": "ありませんが、変化として起きていることは確かです。"}, {"t": 389.03333333333336, "x": "確かなものを、やる気の増減として\n数えないだけで足ります。"}, {"t": 393.1333333333333, "x": "足りる距離を保つ方が、後の話はしやすくなります。"}, {"t": 396.8666666666667, "x": "六つ目は、残る側の読み方です。"}, {"t": 399.48333333333335, "x": "読み方は、たいてい一つの言葉にまとまります。"}, {"t": 402.78333333333336, "x": "まとまった言葉が、やる気が落ちたという説明です。"}, {"t": 406.35, "x": "説明としては、短くて分かりやすいものです。"}, {"t": 409.7, "x": "分かりやすい分、そこで考えが止まります。"}, {"t": 412.8833333333333, "x": "止まった先で、声のかけ方が決まります。"}, {"t": 415.78333333333336, "x": "決まったかけ方は、励ましの形になりやすいです。"}, {"t": 419.28333333333336, "x": "なりやすいのは、\n落ちたものを上げようとするからです。"}, {"t": 422.76666666666665, "x": "上げようとする言葉は、前を向かせる中身になります。"}, {"t": 426.43333333333334, "x": "中身は正しくても、位置が合っていません。"}, {"t": 429.4, "x": "合わないのは、相手が下を向いていないからです。"}, {"t": 432.6333333333333, "x": "向いていないどころか、もう別の方を見ています。"}, {"t": 435.9166666666667, "x": "見ている方向へ、励ましは届きません。"}, {"t": 438.98333333333335, "x": "届かない言葉が続くと、相手は返事を短くします。"}, {"t": 442.8666666666667, "x": "短くなった返事は、さらにやる気の話に見えます。"}, {"t": 446.48333333333335, "x": "見えた分だけ、励ましは強くなっていきます。"}, {"t": 449.73333333333335, "x": "強くなるほど、二人の距離は開いていきます。"}, {"t": 452.8333333333333, "x": "開いた距離は、辞める日まで縮まりません。"}, {"t": 455.8333333333333, "x": "縮まらないまま、申し出の日を迎えます。"}, {"t": 458.8666666666667, "x": "七つ目は、かけた言葉が空振りする理由です。"}, {"t": 462.26666666666665, "x": "空振りは、言い方が悪いから起きるのでしょうか。"}, {"t": 465.6333333333333, "x": "言い方を直しても、結果はあまり変わりません。"}, {"t": 468.9166666666667, "x": "では、タイミングが遅いからでしょうか。"}, {"t": 471.76666666666665, "x": "早く声をかけても、答えは同じことが多いです。"}, {"t": 475.31666666666666, "x": "多いのは、前提がずれたままだからです。"}, {"t": 478.28333333333336, "x": "ずれた前提とは、まだ迷っていると\n考えている点です。"}, {"t": 482.1666666666667, "x": "考えている側は、説得すれば戻ると思っています。"}, {"t": 485.95, "x": "思って出した条件は、待遇の話になりがちです。"}, {"t": 489.75, "x": "なりがちですが、始まりが待遇でなければ\n効きません。"}, {"t": 493.3, "x": "効か const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

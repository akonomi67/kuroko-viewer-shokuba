<script>
const D={"name": "職場で言ってはいけない悪気のない一言7選", "file": "030_職場で言ってはいけない悪気のない一言7選", "dur": 994.35, "segs": [], "subs": [{"t": 0.0, "x": "職場の雑談では一日に何十もの\n短い言葉が行き交います。"}, {"t": 4.1, "x": "朝礼の前の数分や、席を立つ時です。"}, {"t": 7.4, "x": "給湯室ですれ違う時もそうです。"}, {"t": 9.85, "x": "そのほとんどは言った端から消えていきます。"}, {"t": 12.5, "x": "その中に、消えない言葉がときどき混ざります。"}, {"t": 15.75, "x": "言った側はその日のうちに忘れます。"}, {"t": 18.15, "x": "言われた側だけが覚えている一言です。"}, {"t": 20.716666666666665, "x": "覚えている期間は数日とは限りません。"}, {"t": 23.4, "x": "半年や一年たってから、\nふと戻ってくることもあります。"}, {"t": 27.183333333333334, "x": "戻ってくる一言の多くは、きつい言葉ではありません。"}, {"t": 30.9, "x": "むしろ褒めたつもりの言葉です。"}, {"t": 32.86666666666667, "x": "気にかけたつもりの言葉であることも多いです。"}, {"t": 35.6, "x": "悪気がないぶん、言った側が振り返らないからです。"}, {"t": 39.18333333333333, "x": "振り返らない言葉は繰り返されやすいです。"}, {"t": 41.983333333333334, "x": "同じ相手に何度でも届きます。"}, {"t": 44.0, "x": "繰り返された回数だけ、言われた側の\n中で重みが増していきます。"}, {"t": 48.583333333333336, "x": "今日はそういう悪気のない一言を七つ並べます。"}, {"t": 51.68333333333333, "x": "五つは上司から部下への一言です。"}, {"t": 54.03333333333333, "x": "残る二つは部下から上司への一言です。"}, {"t": 56.766666666666666, "x": "言葉は上から下にだけ流れるものではないからです。"}, {"t": 59.88333333333333, "x": "下から上へ向かう言葉も、同じように\n長く残ることがあります。"}, {"t": 64.1, "x": "それぞれ言った側のつもりを見ていきます。"}, {"t": 66.66666666666667, "x": "言われた側に残るものも並べて見ます。"}, {"t": 69.13333333333334, "x": "最後に言い換えの形を一つずつ置きます。"}, {"t": 71.98333333333333, "x": "先に断っておきます。"}, {"t": 73.66666666666667, "x": "どれも、言ったらすぐ問題になる話ではありません。"}, {"t": 77.23333333333333, "x": "受け取り方は相手との距離や\nその日の空気でも変わります。"}, {"t": 80.68333333333334, "x": "変わるからこそ、言った側には\n重さが測りにくいのです。"}, {"t": 84.56666666666666, "x": "言った側に悪気はありません。"}, {"t": 86.58333333333333, "x": "だから言われた側も、やめてほしいとは\n言い出しにくいものです。"}, {"t": 90.53333333333333, "x": "言い出せずに一言が残ります。"}, {"t": 92.6, "x": "それが関係の奥で静かに効いてきます。"}, {"t": 95.21666666666667, "x": "その重さを、七つの場面で少しずつ量っていきます。"}, {"t": 99.06666666666666, "x": "最初は部下から上司へ向けた一言です。"}, {"t": 101.75, "x": "新しい上司が来たとします。"}, {"t": 103.71666666666667, "x": "自分より十歳ほど年下の上司です。"}, {"t": 106.4, "x": "着任の週に休憩室で隣り合わせになります。"}, {"t": 109.58333333333333, "x": "年上の部下が、話の糸口を探して声をかけます。"}, {"t": 113.56666666666666, "x": "お若いのにしっかりしていますね、という一言です。"}, {"t": 117.13333333333334, "x": "言った側のつもりは、はっきりした褒め言葉です。"}, {"t": 120.55, "x": "新しい上司を立てたい気持ちもあります。"}, {"t": 123.11666666666666, "x": "早く打ち解けたいとも思っています。"}, {"t": 125.4, "x": "ただ、受け取る側の耳には前半が\n先に届きやすいです。"}, {"t": 129.55, "x": "お若いのに、という部分です。"}, {"t": 131.85, "x": "ここには一つの前提があります。"}, {"t": 134.05, "x": "若いと普通はしっかりしていない、という前提です。"}, {"t": 137.75, "x": "前提に気づくと、褒め言葉は年の話に変わります。"}, {"t": 141.56666666666666, "x": "残るのは、ここでは年で見られているという感覚です。"}, {"t": 145.23333333333332, "x": "年下で上に立った人には、覚えのある感覚です。"}, {"t": 148.91666666666666, "x": "何度も味わっていることが多いです。"}, {"t": 151.25, "x": "着任の挨拶でも取引先の前でも、\n年の話が先に出てきます。"}, {"t": 156.1, "x": "そのたびに、仕事の中身より\n年齢を見られている気がします。"}, {"t": 160.26666666666668, "x": "そこへ部下からも同じ言葉が来ます。"}, {"t": 162.58333333333334, "x": "すると逃げ場が一つ減ります。"}, {"t": 164.51666666666668, "x": "部下に言われると返しにくいからです。"}, {"t": 166.78333333333333, "x": "笑って受け流すほかありません。"}, {"t": 168.81666666666666, "x": "逃げ場が減った分だけ、上司は\n肩に力が入りやすくなります。"}, {"t": 173.25, "x": "力の入った振る舞いは、周りから\n若いのに固いと見られます。"}, {"t": 177.53333333333333, "x": "見られ方がまた年の話になります。"}, {"t": 179.88333333333333, "x": "小さな輪が回り始めるのです。"}, {"t": 182.03333333333333, "x": "この輪を年の枕詞と呼んでおきます。"}, {"t": 184.63333333333333, "x": "枕詞は本題の前に付く言葉です。"}, {"t": 187.36666666666667, "x": "付くだけで本題の色を変えてしまいます。"}, {"t": 189.88333333333333, "x": "付けた側は飾りのつもりです。"}, {"t": 191.86666666666667, "x": "聞く側には、飾りの方が本題に\n聞こえる場合があります。"}, {"t": 195.85, "x": "言い換えるなら、年の部分を外します。"}, {"t": 198.73333333333332, "x": "見たものだけを言います。"}, {"t": 200.3, "x": "先日の会議の進め方が分かりやすかったです、という\n形です。"}, {"t": 205.03333333333333, "x": "言われた側には感触が残ります。"}, {"t": 207.38333333333333, "x": "年ではなく仕事を見てもらえた、という感触です。"}, {"t": 210.9, "x": "すると次の会話も、仕事の話から始めやすくなります。"}, {"t": 214.93333333333334, "x": "年の話が出ない会話が続きます。"}, {"t": 217.35, "x": "すると上司の肩の力も、少しずつ\n抜けていきやすいです。"}, {"t": 221.36666666666667, "x": "二つ目は上司から部下への一言です。"}, {"t": 223.86666666666667, "x": "担当が替わって二週間ほどの頃です。"}, {"t": 226.45, "x": "上司が書類を受け取りながら言います。"}, {"t": 228.86666666666667, "x": "前の担当の人はもう少し早く出してくれていたね、と。"}, {"t": 232.88333333333333, "x": "言った側のつもりは目安を伝えることです。"}, {"t": 235.71666666666667, "x": "責める気はありません。"}, {"t": 237.13333333333333, "x": "このくらいで回っていた、という情報として\n渡しています。"}, {"t": 241.01666666666668, "x": "言われた側はたいてい、すみませんと返します。"}, {"t": 244.41666666666666, "x": "声は普通なので、上司は伝わったと\n受け取りやすいです。"}, {"t": 248.31666666666666, "x": "上司は目安を一つ伝えただけです。"}, {"t": 250.81666666666666, "x": "すぐ次の仕事へ移ります。"}, {"t": 252.78333333333333, "x": "ところが言われた側の中で動いているのは、\n目安ではありません。"}, {"t": 256.93333333333334, "x": "自分は前の人と並べて測られている、という\n感覚の方です。"}, {"t": 261.3333333333333, "x": "その感覚は、一ヶ月後の方がはっきりしてきます。"}, {"t": 265.1333333333333, "x": "作業のたびに、\n前の人を思い浮かべるようになります。"}, {"t": 268.8333333333333, "x": "前の人ならどうしたかと考えます。"}, {"t": 271.1166666666667, "x": "前の人より遅くないかと考えながら手を動かします。"}, {"t": 274.55, "x": "考える分だけ手は遅くなります。"}, {"t": 276.81666666666666, "x": "遅くなった分だけ、比べられる不安が増えます。"}, {"t": 280.26666666666665, "x": "比べられる感覚は手を縮こまらせやすいです。"}, {"t": 283.3, "x": "本人の力とは関係ありません。"}, {"t": 285.71666666666664, "x": "不安が増えると、質問も減りやすいです。"}, {"t": 288.8666666666667, "x": "聞くと、前の人は聞かなかったのにと\n思われそうだからです。"}, {"t": 292.85, "x": "聞かずに進めた仕事は、やり直しが増えます。"}, {"t": 296.15, "x": "上司からは、やはり前の人より\n時間がかかると見えます。"}, {"t": 300.03333333333336, "x": "最初の一言が、一ヶ月かけて\n本当になってしまう形です。"}, {"t": 304.5, "x": "この形を比べる物差しの置き忘れと呼んでおきます。"}, {"t": 307.9166666666667, "x": "その物差しは、言った側の手元からは消えています。"}, {"t": 311.5833333333333, "x": "でも、言われた側の机の上には残り続けます。"}, {"t": 315.3, "x": "言い換えるなら、人ではなく日付で目安を伝えます。"}, {"t": 318.9, "x": "この書類は毎月十日ごろに出ていると\n助かります、という形です。"}, {"t": 323.6, "x": "日付で渡された目安には、比べる相手がいません。"}, {"t": 327.2, "x": "それなら、言われた側は自分の\n歩幅で近づいていけます。"}, {"t": 331.18333333333334, "x": "比べる相手のいない職場では、\n質問も出やすくなると言われます。"}, {"t": 335.46666666666664, "x": "三つ目も上司から部下への一言です。"}, {"t": 337.9166666666667, "x": "月曜の朝礼が終わったあとです。"}, {"t": 340.18333333333334, "x": "席に戻る途中で、上司が声をかけます。"}, {"t": 343.45, "x": "週末は何をしていたの、という問いかけです。"}, {"t": 346.71666666666664, "x": "言った側のつもりは相手を気にかけることです。"}, {"t": 349.6, "x": "仕事の話ばかりでは距離が縮まりません。"}, {"t": 352.45, "x": "だから仕事の外から入ろうとしています。"}, {"t": 355.03333333333336, "x": "入り口としてはよくある自然な問いかけです。"}, {"t": 357.78333333333336, "x": "ただ、毎週となると受け取り方が変わってきます。"}, {"t": 361.1666666666667, "x": "一回目は気にかけてもらえたと感じやすいです。"}, {"t": 364.1166666666667, "x": "三回目あたりからは、別の気持ちが混ざります。"}, {"t": 367.46666666666664, "x": "答えを用意しておかなければ、という気持ちです。"}, {"t": 370.78333333333336, "x": "特に何もしていない週は、\n何もしていないと言いにくくなります。"}, {"t": 374.8833333333333, "x": "休みの使い方まで見られている気がするからです。"}, {"t": 377.9166666666667, "x": "すると休みの日が、月曜に話す\n材料を探す日に変わり始めます。"}, {"t": 382.6333333333333, "x": "話したくない事情を抱えている\n人にとっては、なおさらです。"}, {"t": 386.56666666666666, "x": "職場で言わずにおきたい週もあります。"}, {"t": 389.0, "x": "家の用事や体の具合などです。"}, {"t": 391.25, "x": "そういう週に同じ問いが来ます。"}, {"t": 393.3833333333333, "x": "すると毎回、ぼかし方を考えることになります。"}, {"t": 396.75, "x": "そんな月曜が続くと、週の始まり\nそのものが少し重くなります。"}, {"t": 401.25, "x": "この重さを週明けの申告と呼んでおきます。"}, {"t": 404.1333333333333, "x": "問いかけた側は雑談のつもりです。"}, {"t": 406.4, "x": "でも答える側には、申告に近い\n手間がかかるという意味です。"}, {"t": 410.5833333333333, "x": "毎週同じ問いになるのには、わけがあるかも\nしれません。"}, {"t": 414.25, "x": "ほかに入り口が見つからないのです。"}, {"t": 416.43333333333334, "x": "上司の側も、雑談に慣れていない場合があるのです。"}, {"t": 420.06666666666666, "x": "言い換えるなら、問いの向きを自分の側に変えます。"}, {"t": 423.43333333333334, "x": "こちらの話を一つだけ置きます。"}, {"t": 425.7, "x": "週末に近所の店へ行ってきました、という形です。"}, {"t": 429.48333333333335, "x": "相手はその話に乗ってもかまいません。"}, {"t": 431.98333333333335, "x": "うなずくだけでも済みます。"}, {"t": 433.6, "x": "相手の話を聞き、自分の話もします。"}, {"t": 436.9, "x": "その往復が雑談の自然な形とも言われます。"}, {"t": 440.1166666666667, "x": "答えるかどうかを相手が選べます。"}, {"t": 442.3, "x": "それなら雑談は雑談のままでいられます。"}, {"t": 445.03333333333336, "x": "四つ目は見た目に触れる一言です。"}, {"t": 447.3666666666667, "x": "久しぶりに部下と顔を合わせます。"}, {"t": 449.55, "x": "上司が軽い調子で声をかけます。"}, {"t": 451.93333333333334, "x": "少しやせたんじゃない、といった言葉です。"}, {"t": 454.85, "x": "ちょっとふっくらしたね、の形もあります。"}, {"t": 457.7, "x": "言った側のつもりは、相手を\nよく見ているというしるしです。"}, {"t": 461.65, "x": "変化に気づくのは関心があるからだ、という\n感覚で言っています。"}, {"t": 465.93333333333334, "x": "声の調子も軽いです。"}, {"t": 467.56666666666666, "x": "深い意味はありません。"}, {"t": 469.06666666666666, "x": "軽く言えば相手も軽く受け取るだろう、と\n考えています。"}, {"t": 472.95, "x": "ところが体の変化には、事情が\nついていることがあります。"}, {"t": 476.78333333333336, "x": "本人にしか分からない事情です。"}, {"t": 479.01666666666665, "x": "体調を崩している最中かもしれません。"}, {"t": 481.6333333333333, "x": "家のことで眠れない日が続いているのかも\nしれません。"}, {"t": 484.71666666666664, "x": "本人が気にしている部分かもしれません。"}, {"t": 487.26666666666665, "x": "触れてほしくないのです。"}, {"t": 488.8, "x": "言われた直後は笑って流すことが多いです。"}, {"t": 491.6333333333333, "x": "軽く言われたものを重く返すと、\n場が気まずくなるからです。"}, {"t": 495.53333333333336, "x": "ところが一ヶ月ほどたつと、\nその一言が別の形で出てきます。"}, {"t": 499.8666666666667, "x": "人前に出る日の朝は、鏡の前で\nその言葉を思い出します。"}, {"t": 504.15, "x": "席を立つ時や上司の近くを通る時もそうです。"}, {"t": 507.3833333333333, "x": "また何か言われるかと身構えます。"}, {"t": 509.53333333333336, "x": "身構える時間は、言った側には\n一秒も見えていません。"}, {"t": 513.4833333333333, "x": "触れた側は一度きりのつもりです。"}, {"t": 515.6666666666666, "x": "でも言われた側の中では、何度も\n繰り返されることがあります。"}, {"t": 519.7333333333333, "x": "見えないまま、言われた側の\n毎日にだけ小さな手間が積もっていきます。"}, {"t": 524.4166666666666, "x": "この積もり方を見た目の置き土産と呼んでおきます。"}, {"t": 527.4666666666667, "x": "受け取り方は人によって違います。"}, {"t": 529.6833333333333, "x": "まったく気にしない人もいます。"}, {"t": 531.5666666666667, "x": "ただ、気にするかどうかは言う前には分かりません。"}, {"t": 534.8333333333334, "x": "それなら、体の話は最初から選ばない方が安全です。"}, {"t": 539.0333333333333, "x": "言う側にとっても同じです。"}, {"t": 540.8666666666667, "x": "言い換えるなら、体ではなく様子をたずねます。"}, {"t": 544.1166666666667, "x": "最近忙しさはどうですか、という形です。"}, {"t": 547.6, "x": "この問いなら、体のことを話すか\nどうかは相手が決められます。"}, {"t": 551.65, "x": "相手に決める余地があります。"}, {"t": 553.5, "x": "すると話したくなった時に、\n話してもらえる場合があります。"}, {"t": 557.4333333333333, "x": "五つ目は家族の話に踏み込む一言です。"}, {"t": 560.3, "x": "給湯室でお茶をいれている時です。"}, {"t": 562.6333333333333, "x": "上司が何気なくたずねます。"}, {"t": 564.5, "x": "そろそろ家族が増える予定はあるの、という問いです。"}, {"t": 568.0833333333334, "x": "親御さんはお元気、という形をとることもあります。"}, {"t": 571.7333333333333, "x": "言った側のつもりは相手の暮らしを気づかうことです。"}, {"t": 574.9666666666667, "x": "仕事の段取りを考えておきたい、という\n事情もあります。"}, {"t": 578.95, "x": "先々の休みや働き方の変わり目を、\n早めに知っておきたいのです。"}, {"t": 583.6166666666667, "x": "上司の立場ならうなずける事情です。"}, {"t": 586.0333333333333, "x": "人の出入りや休みのかさなりを先に読めます。"}, {"t": 588.8666666666667, "x": "そうすれば職場全体が回りやすくなるのも確かです。"}, {"t": 592.2833333333333, "x": "ただ、言われた側に残るのは\n段取りの話ではありません。"}, {"t": 596.3, "x": "家族のことを仕事の都合で測られた、という\n感触です。"}, {"t": 600.25, "x": "家族の予定には、本人が決め\nきれないことも含まれています。"}, {"t": 604.3333333333334, "x": "思うようにならないこともあります。"}, {"t": 606.4, "x": "それを雑談の流れで聞かれると、答えに詰まります。"}, {"t": 610.0, "x": "詰まったところを笑ってごまかします。"}, {"t": 612.25, "x": "言った側は一瞬だけ、まずかったかなと思います。"}, {"t": 616.1166666666667, "x": "でも、たいていはすぐ次の話題に移ります。"}, {"t": 619.3666666666667, "x": "聞いた側にとっては一度の問いです。"}, {"t": 621.7, "x": "答えに詰まった側には、長い\n一瞬だった場合があります。"}, {"t": 625.7, "x": "言われた側は、なぜ今それを\n聞かれたのかを考え続けます。"}, {"t": 629.75, "x": "その考えが、評価や配置に関わるのではという方へ\n向かうこともあります。"}, {"t": 634.8, "x": "そうなると、上司との雑談そのものを\n避けたくなります。"}, {"t": 638.45, "x": "この避け方を家の話の戸締まりと呼んでおきます。"}, {"t": 641.55, "x": "一度かけた鍵は、仕事の相談まで\n閉ざしてしまうことがあります。"}, {"t": 645.8833333333333, "x": "言い換えるなら、知りたいことを\n仕事の言葉で聞きます。"}, {"t": 649.45, "x": "働き方で気になることが出てきたらいつでも\n言ってください、という形です。"}, {"t": 654.15, "x": "話すかどうかも、いつ話すかも\n相手に預けておく言い方です。"}, {"t": 658.3166666666667, "x": "預けられた側は、話す時期を自分で選べます。"}, {"t": 661.7333333333333, "x": "だから雑談の時間を怖がらずに済みます。"}, {"t": 664.5666666666667, "x": "六つ目は、ふたたび部下から上司への一言です。"}, {"t": 667.8333333333334, "x": "課長が替わって一ヶ月ほどの頃です。"}, {"t": 670.2833333333333, "x": "書類の確認を頼まれた部下が、自席で言います。"}, {"t": 673.8166666666667, "x": "前の課長はここは任せてくれていたんですけどね、と。"}, {"t": 677.6166666666667, "x": "言った側のつもりはやり方を伝えることです。"}, {"t": 680.4833333333333, "x": "前はこう回っていました。"}, {"t": 682.2166666666667, "x": "同じ形にすると早いですよ、と知らせたいのです。"}, {"t": 685.75, "x": "新しい上司を困らせる気はまったくありません。"}, {"t": 688.8166666666667, "x": "むしろ慣れない職場で戸惑う上司を、\n手伝っているつもりでいます。"}, {"t": 693.0333333333333, "x": "前の課長とはうまく回っていました。"}, {"t": 695.3333333333334, "x": "その形を壊したくない気持ちもあります。"}, {"t": 697.9666666666667, "x": "ところが言われた上司に残るのは、\n手伝いの方ではないことがあります。"}, {"t": 702.4333333333333, "x": "自分は前の人と並べて見られている、という\n感覚です。"}, {"t": 706.3833333333333, "x": "二つ目の一言と同じ形の比べ方です。"}, {"t": 709.25, "x": "あの時は上司が部下に向けていました。"}, {"t": 711.6, "x": "立場が逆になっても、比べられた側に\n残るものは変わりません。"}, {"t": 715.9166666666666, "x": "上司の場合は、そこにもう一つ重なります。"}, {"t": 719.05, "x": "自分のやり方を持ち込むのが怖くなります。"}, {"t": 721.8166666666667, "x": "前の方がよかったと言われるのでは、という\n迷いです。"}, {"t": 725.4333333333333, "x": "迷った上司は、方針を出すのを遅らせがちです。"}, {"t": 729.0, "x": "逆に、急いで変えようとすることもあります。"}, {"t": 732.1666666666666, "x": "遅らせれば頼りなく見えます。"}, {"t": 734.1166666666667, "x": "急げば強引に見えます。"}, {"t": 735.9166666666666, "x": "どちらに転んでも同じです。"}, {"t": 737.75, "x": "部下には前の課長がよかったと見えやすくなります。"}, {"t": 740.7833333333333, "x": "最初の一言が、部下の中でも\n答えを固めてしまう形です。"}, {"t": 745.0333333333333, "x": "この形を前任の椅子と呼んでおきます。"}, {"t": 747.6333333333333, "x": "誰も座っていない椅子があります。"}, {"t": 749.8333333333334, "x": "それが新しい人の隣にずっと置かれているのです。"}, {"t": 753.0833333333334, "x": "椅子があるうちは、新しい上司の\n判断が前任と並べて量られやすいです。"}, {"t": 758.35, "x": "言い換えるなら、人の名前ではなくやり方\nそのものを話します。"}, {"t": 762.4166666666666, "x": "この確認はこれまで担当の判断で\n進めていました、という形です。"}, {"t": 767.15, "x": "やり方だけなら、上司が自分で選べます。"}, {"t": 770.25, "x": "続けるか変えるかを決められるのです。"}, {"t": 772.45, "x": "選べる余地があると、上司は\n前任と比べられずに済みます。"}, {"t": 776.5, "x": "そうなれば、部下からの提案も届きやすくなります。"}, {"t": 779.9666666666667, "x": "名前が出ない分、部下の工夫として\n受け取ってもらえる場合もあります。"}, {"t": 784.4833333333333, "x": "七つ目はいちばん褒め言葉に近い一言です。"}, {"t": 787.4333333333333, "x": "上司が資料を持って席に来ます。"}, {"t": 789.6666666666666, "x": "新しい仕事を頼みながら言います。"}, {"t": 792.1166666666667, "x": "期待しているからよろしくね、と。"}, {"t": 794.6166666666667, "x": "言った側のつもりは背中を押すことです。"}, {"t": 797.25, "x": "ただ頼むだけでは味気ないものです。"}, {"t": 799.4666666666667, "x": "だから信頼している気持ちを\n言葉にして渡しています。"}, {"t": 802.8333333333334, "x": "一度だけなら、言われた側も\nうれしく受け取りやすいです。"}, {"t": 806.6666666666666, "x": "期待されていると分かります。"}, {"t": 808.45, "x": "仕事に向かう気持ちも上がりやすいです。"}, {"t": 810.95, "x": "重くなりやすい場合があります。"}, {"t": 812.9833333333333, "x": "頼みごとのたびに同じ言葉が付いてくる場合です。"}, {"t": 816.05, "x": "三回四回と続くと、言われた側は\n言葉の向きを読み替え始めます。"}, {"t": 820.95, "x": "期待しているからの後ろに、だから\n断らないでねが聞こえてくる 666666667, "x": "ずれた場所に触れられた記憶は、\n言われた側に長く残ります。"}, {"t": 958.1666666666666, "x": "一方で言った側は、自分が何を\n言ったかを知らないままでいます。"}, {"t": 962.55, "x": "知らないまま一言が積み重なります。"}, {"t": 964.9833333333333, "x": "それが職場の空気を少しずつ決めていきます。"}, {"t": 967.9666666666667, "x": "言い換えのどれも、相手を知ろうとする\n気持ちまで手放すものではありません。"}, {"t": 972.5833333333334, "x": "手放さずに触れる場所だけを、\n仕事の側に寄せています。"}, {"t": 976.4333333333333, "x": "悪気のない一言は、悪気がないからこそ\n言い換えがよく効きます。"}, {"t": 980.65, "x": "言い換えた一言は、言われた側の\n記憶に仕事の話として残ります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

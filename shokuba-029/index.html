<script>
const D={"name": "テレワークの上司と部下あるある12選", "file": "029_テレワークの上司と部下あるある12選", "dur": 1059.31665625, "segs": [], "subs": [{"t": 0.0, "x": "画面の向こうに上司がいます。"}, {"t": 2.033333333333333, "x": "今日も部下の表情が気になっています。"}, {"t": 4.383333333333334, "x": "同じ時間、部下は部下で気になることがあります。"}, {"t": 7.6, "x": "上司の連絡の時間です。"}, {"t": 9.466666666666667, "x": "上司の頭にあるのは、話がちゃんと届いたか\nどうかです。"}, {"t": 13.383333333333333, "x": "届いたかどうかを、うなずき一つで\n確かめたいと思っています。"}, {"t": 17.5, "x": "思っているのに、顔はほとんど動きません。"}, {"t": 20.4, "x": "小さなしかくの中で止まったままです。"}, {"t": 22.833333333333332, "x": "動かない顔を見ていると不安になります。"}, {"t": 25.3, "x": "伝え方を間違えたかと考えます。"}, {"t": 27.683333333333334, "x": "一方の部下の頭にも、気になることがあります。"}, {"t": 30.966666666666665, "x": "前の晩に届いた一件の連絡です。"}, {"t": 33.5, "x": "連絡の中身ではありません。"}, {"t": 35.416666666666664, "x": "届いた時刻のほうが気になっています。"}, {"t": 37.766666666666666, "x": "気になるのは、その時刻まで\n上司が働いていたと分かるからです。"}, {"t": 42.016666666666666, "x": "分かってしまうと、自分のことが気になります。"}, {"t": 45.11666666666667, "x": "終わる時間が早すぎたかと考え始めます。"}, {"t": 47.983333333333334, "x": "実はこの二つの心の声は同じ一日の\n中で起きています。"}, {"t": 51.983333333333334, "x": "朝のオンライン会議で、上司は\n部下の顔を見ていました。"}, {"t": 55.78333333333333, "x": "同じ会議で、部下は前の晩の\n連絡のことを考えていました。"}, {"t": 59.983333333333334, "x": "考えていたことは、どちらも相手には届いていません。"}, {"t": 63.666666666666664, "x": "二人の間にあるのは一枚の画面です。"}, {"t": 66.33333333333333, "x": "だから届かないのです。"}, {"t": 67.8, "x": "画面は声も顔も運びます。"}, {"t": 69.91666666666667, "x": "でも、その裏の気持ちまでは運びません。"}, {"t": 72.86666666666666, "x": "運ばれなかった分を、人は自分の\n想像で埋めていきます。"}, {"t": 76.85, "x": "埋めた想像は少しずつずれていきます。"}, {"t": 79.33333333333333, "x": "本当の相手の姿から離れていくのです。"}, {"t": 82.1, "x": "今日はテレワークで起きやすいあるあるを\n十二個並べます。"}, {"t": 85.5, "x": "並べるのは、上司も部下も一度は\n覚えがありそうな場面です。"}, {"t": 89.61666666666666, "x": "どれも、だれかが悪いという話にはしません。"}, {"t": 93.11666666666666, "x": "画面越しに起きる小さな思い違いの集まりです。"}, {"t": 96.33333333333333, "x": "まずは、会議の始まりの数秒からです。"}, {"t": 99.41666666666667, "x": "時間になりました。"}, {"t": 100.71666666666667, "x": "全員の顔が画面にそろいます。"}, {"t": 102.91666666666667, "x": "そろったのに、だれも口を開きません。"}, {"t": 105.88333333333334, "x": "開かないまま三秒、四秒と過ぎていきます。"}, {"t": 109.31666666666666, "x": "静かな時間です。"}, {"t": 110.73333333333333, "x": "会議室なら、席に着いた順に\n自然と雑談が始まります。"}, {"t": 114.95, "x": "始まった雑談が、そのまま本題への\n入り口になっていました。"}, {"t": 119.1, "x": "画面越しでは、その入り口が\nすっぽり抜け落ちやすいです。"}, {"t": 123.0, "x": "入り口が無い場では、だれもが待つ側に回ります。"}, {"t": 126.56666666666666, "x": "立場が上の人を待つ空気です。"}, {"t": 128.7, "x": "生まれた空気の中で、上司は待っています。"}, {"t": 131.75, "x": "部下から話してほしいのです。"}, {"t": 133.65, "x": "思っているのは、自分から始めると\n場が固くなると感じるからです。"}, {"t": 138.01666666666668, "x": "部下は部下で待っています。"}, {"t": 139.66666666666666, "x": "上司が始めるのが筋だと思っているからです。"}, {"t": 142.6, "x": "待っている同士が、同じ画面を\n見つめたまま黙っています。"}, {"t": 146.51666666666668, "x": "これをここでは始まりの譲り合いと呼んでおきます。"}, {"t": 149.5, "x": "上司側は、部下が話し出さないのを\n遠慮だと受け取りやすいです。"}, {"t": 153.76666666666668, "x": "部下側は、上司が黙っているのを\n様子見だと受け取りやすいです。"}, {"t": 158.01666666666668, "x": "ぼかしの向こうに何があるのか、つい目が行きます。"}, {"t": 161.35, "x": "行くつもりは無くても、輪郭の\n動きが気になるものです。"}, {"t": 164.96666666666667, "x": "在宅の画面では、背景をぼかす人が多いです。"}, {"t": 168.66666666666666, "x": "絵に替える人もいます。"}, {"t": 170.16666666666666, "x": "部屋を見せたくないという自然な気持ちからです。"}, {"t": 173.0, "x": "自然な気持ちです。"}, {"t": 174.38333333333333, "x": "なのに、ぼかしがあると想像のほうが働きます。"}, {"t": 177.78333333333333, "x": "想像は棚の形や窓の明るさを拾います。"}, {"t": 180.9, "x": "そこから部屋を組み立てはじめます。"}, {"t": 183.16666666666666, "x": "組み立てた部屋から、相手の\n暮らしぶりまで考えてしまいます。"}, {"t": 187.16666666666666, "x": "考えてしまうのは、会社なら\n目に入る景色が無いからです。"}, {"t": 191.25, "x": "ぼかした輪郭が揺れることがあります。"}, {"t": 193.56666666666666, "x": "だれか横にいるのかと気になります。"}, {"t": 195.66666666666666, "x": "気になっても口には出しません。"}, {"t": 197.6, "x": "聞くのは失礼だと分かっているからです。"}, {"t": 200.05, "x": "出さないまま、話の中身より\n背景に目が行ってしまいます。"}, {"t": 204.1, "x": "上司が画面の端を見ているのは、\n点検のためとは限りません。"}, {"t": 208.38333333333333, "x": "見る場所が無いだけの場合もあります。"}, {"t": 210.61666666666667, "x": "ただ目が泳いでいるのです。"}, {"t": 212.28333333333333, "x": "部下のほうも、上司の後ろの本棚が気になります。"}, {"t": 215.78333333333333, "x": "気になって話を聞き逃します。"}, {"t": 217.91666666666666, "x": "聞き逃したと気づいて、慌てて\nうなずくのもよくある流れです。"}, {"t": 221.93333333333334, "x": "上司側は、部下の背景が変わるたびに\n少し落ち着かなくなります。"}, {"t": 226.3, "x": "部下側は、背景を見られている気がして\n画面の角度を何度も直します。"}, {"t": 231.05, "x": "上司が話し終わりました。"}, {"t": 232.86666666666667, "x": "口の形が、あとから追いついてきます。"}, {"t": 235.66666666666666, "x": "追いついてくるまでの一瞬が、妙に長く感じられます。"}, {"t": 239.56666666666666, "x": "回線の具合で、声と映像がわずかに\nずれることがあります。"}, {"t": 243.66666666666666, "x": "ずれは一秒にも満たないものです。"}, {"t": 245.8, "x": "それでも会話の呼吸は崩れます。"}, {"t": 248.1, "x": "崩れた呼吸の中で返事をします。"}, {"t": 250.43333333333334, "x": "すると、上司の次の言葉とぶつかります。"}, {"t": 253.43333333333334, "x": "ぶつかった瞬間、どちらも黙って\n相手が話すのを待ちます。"}, {"t": 257.6166666666667, "x": "これが三回続きます。"}, {"t": 259.28333333333336, "x": "部下は返事をする気持ちが少し引いていきます。"}, {"t": 262.18333333333334, "x": "引いた気持ちのまま、うなずきだけで\n済ませるようになります。"}, {"t": 265.9166666666667, "x": "上司から見ると、部下の反応が\n薄くなったように見えます。"}, {"t": 269.76666666666665, "x": "見えたものを、話に興味が無いのかと\n受け取ることもあります。"}, {"t": 273.76666666666665, "x": "けれど実際に起きていたのは、\n声の届く順番のずれです。"}, {"t": 277.68333333333334, "x": "順番がずれると、聞く側は慎重になります。"}, {"t": 281.05, "x": "割り込まないように気をつけるのです。"}, {"t": 283.25, "x": "慎重になった分だけ、口から\n出る言葉の数が減っていきます。"}, {"t": 287.56666666666666, "x": "減った言葉は、気持ちの温度と取り違えられます。"}, {"t": 290.93333333333334, "x": "画面ごしでは特にそうです。"}, {"t": 292.9166666666667, "x": "上司側は、部下の口数が減ったのを\n乗り気でない印と受け取りやすいです。"}, {"t": 297.81666666666666, "x": "部下側は、話がぶつかるのを\n避けたくて、さらに口数を減らします。"}, {"t": 302.68333333333334, "x": "よし、と小さくつぶやきました。"}, {"t": 305.26666666666665, "x": "それが全員に聞こえていました。"}, {"t": 307.3333333333333, "x": "聞こえていたと気づくのは、\n画面の何人かが笑った時です。"}, {"t": 311.21666666666664, "x": "在宅で作業をしていると、独り言が増えます。"}, {"t": 314.6166666666667, "x": "そういう人は少なくありません。"}, {"t": 316.71666666666664, "x": "会議の最中も、音を切ったつもりで気が緩みます。"}, {"t": 320.28333333333336, "x": "緩んだところに、ため息や小さな声が\nそのまま乗ってしまいます。"}, {"t": 324.6333333333333, "x": "乗ってしまった声は、言った本人より\n周りのほうがよく覚えています。"}, {"t": 329.26666666666665, "x": "覚えているのは、ふだんは聞けない\n本音のように聞こえるからです。"}, {"t": 333.31666666666666, "x": "上司のため息が入ったとします。"}, {"t": 335.5, "x": "部下は自分の報告のせいかと身構えます。"}, {"t": 338.21666666666664, "x": "身構えても、実際は家の中の\n物音に向けたため息だったりします。"}, {"t": 342.9, "x": "部下のつぶやきが入ることもあります。"}, {"t": 345.1666666666667, "x": "上司は何か不満があるのかと気にします。"}, {"t": 347.8666666666667, "x": "気にしても、本人は別の作業に\n向かってつぶやいただけです。"}, {"t": 351.93333333333334, "x": "それだけのことです。"}, {"t": 353.26666666666665, "x": "でも聞いた側の頭には、一言だけが\n切り取られて残ります。"}, {"t": 357.3333333333333, "x": "残った一言は、頭の中を回り続けます。"}, {"t": 360.76666666666665, "x": "会議の中身より長く残るのです。"}, {"t": 363.05, "x": "次の会議では、だれもが音の\nボタンを何度も確かめています。"}, {"t": 367.3, "x": "上司側は、部下のつぶやきを\n本音がこぼれたものと受け取りやすいです。"}, {"t": 371.9, "x": "部下側は、上司のため息を自分への\n評価のように受け取りやすいです。"}, {"t": 376.53333333333336, "x": "在宅の日の電話は、なぜか急ぎの用件ばかりです。"}, {"t": 380.31666666666666, "x": "ばかりに感じるのは、細かな\n相談が電話に乗らないからです。"}, {"t": 384.43333333333334, "x": "会社にいれば、ちょっとした確認は\n席まで歩いて済ませていました。"}, {"t": 388.73333333333335, "x": "在宅ではその分が無くなります。"}, {"t": 390.93333333333334, "x": "電話は急ぎの時だけの道具になります。"}, {"t": 393.5, "x": "道具の役目が変わると、着信の\n音を聞いただけで身構えます。"}, {"t": 397.75, "x": "身構えて出てみます。"}, {"t": 399.18333333333334, "x": "すると、思ったより小さな確認だったりもします。"}, {"t": 402.7, "x": "上司は文字で書くより早いと\n思って電話をかけています。"}, {"t": 406.21666666666664, "x": "かけた上司は待ちます。"}, {"t": 407.8333333333333, "x": "相手が出るまでの呼び出し音を長く感じます。"}, {"t": 410.76666666666665, "x": "感じた長さから、席を外していたのかと\n考え始めます。"}, {"t": 414.85, "x": "部下は手が離せない作業の途中です。"}, {"t": 417.35, "x": "そこで着信に気づきます。"}, {"t": 419.15, "x": "気づいた時には、すでに何回か\n鳴ったあとだったりします。"}, {"t": 422.8833333333333, "x": "後から折り返します。"}, {"t": 424.43333333333334, "x": "上司の声が少し急いでいるように聞こえます。"}, {"t": 427.3666666666667, "x": "聞こえた声の速さを、怒っているのかと\n受け取ることもあります。"}, {"t": 431.3333333333333, "x": "実際は、上司も次の会議の前に\n急いでいただけかもしれません。"}, {"t": 435.8, "x": "電話が運ぶのは声の調子だけです。"}, {"t": 438.3666666666667, "x": "急いでいた事情までは乗りません。"}, {"t": 440.5, "x": "上司側は、すぐ出なかった数秒を\n席を外していたと受け取りやすいです。"}, {"t": 445.3833333333333, "x": "部下側は、在宅の日の着信を\n何かが起きた知らせと受け取りやすいです。"}, {"t": 450.31666666666666, "x": "画面の隅に小さな丸があります。"}, {"t": 452.71666666666664, "x": "みどりか黄色かがつい気になります。"}, {"t": 454.8666666666667, "x": "気になるのは、それしか相手の\n様子を知る手がかりが無いからです。"}, {"t": 459.0, "x": "会社なら、席にいるかどうかは\n顔を上げれば分かりました。"}, {"t": 462.85, "x": "分かっていたことが、在宅では\n小さな表示だけになります。"}, {"t": 466.76666666666665, "x": "表示が離席に変わります。"}, {"t": 468.56666666666666, "x": "上司は今どこにいるのかと考えます。"}, {"t": 471.01666666666665, "x": "部下のほうも、表示が変わることを\n意外なほど気にしています。"}, {"t": 474.8833333333333, "x": "飲み物を取りに行くだけでも落ち着きません。"}, {"t": 477.4166666666667, "x": "離席の印が出ないか気になるのです。"}, {"t": 479.78333333333336, "x": "そこで、用もないのに画面を触ります。"}, {"t": 482.81666666666666, "x": "表示を保つためです。"}, {"t": 484.4, "x": "保っている間は、仕事の手がかえって止まっています。"}, {"t": 488.06666666666666, "x": "皮肉なことがあります。"}, {"t": 489.55, "x": "止まっている時間ほど、表示は\n働いているように見えるのです。"}, {"t": 493.56666666666666, "x": "このずれが起きるのは、見る側も見られる側も\n印を頼るからです。"}, {"t": 498.0, "x": "頼りにしている印は、作業の\n中身までは教えてくれません。"}, {"t": 502.0833333333333, "x": "読み取ろうとするほど、互いの想像が膨らみます。"}, {"t": 505.6, "x": "膨らんだ想像をここでは表示の\n読みすぎと呼んでおきます。"}, {"t": 509.23333333333335, "x": "上司側は、離席の印が続くと\n手が止まっていると受け取りやすいです。"}, {"t": 513.95, "x": "部下側は、印を見られていると感じて、\n休むことに気が引けていきます。"}, {"t": 519.1833333333333, "x": "ちょっとした相談を切り出す\n場所が、どこにも見当たりません。"}, {"t": 522.9333333333333, "x": "会社にいた頃は、廊下や給湯室ですれ違いました。"}, {"t": 526.7166666666667, "x": "すれ違うだけで話が始まりました。"}, {"t": 529.1166666666667, "x": "始まった話の中で、困っていることが\nついでに出てきたものです。"}, {"t": 533.4, "x": "在宅になると、そのすれ違いが\n一日に一度もありません。"}, {"t": 537.4, "x": "相談するには予定を入れるしかありません。"}, {"t": 540.1, "x": "会議を開くことになります。"}, {"t": 541.9166666666666, "x": "会議を開くほどの話だろうか。"}, {"t": 544.0666666666667, "x": "そう考えた時点で部下の手が止まります。"}, {"t": 546.6666666666666, "x": "止まった相談は後回しになります。"}, {"t": 549.0, "x": "もう少し自分で考えてから、と思うのです。"}, {"t": 552.2166666666667, "x": "後回しになった相談が、締切の\n近くになってまとめて出てきます。"}, {"t": 556.7, "x": "出てきた時には、もう遅いのです。"}, {"t": 559.25, "x": "上司から見れば、もっと早く聞きたかった話です。"}, {"t": 562.8166666666667, "x": "上司のほうも、声をかけるきっかけを失っています。"}, {"t": 566.5166666666667, "x": "急に会議を開くと、部下は構えます。"}, {"t": 569.4166666666666, "x": "何か問題があるのかと思うからです。"}, {"t": 571.9, "x": "構えさせたくないので、上司も\n様子を聞くのを控えてしまいます。"}, {"t": 576.15, "x": "控えた同士の間で、小さな困りごとが\n少しずつ育っていきます。"}, {"t" : 945.2, "x": "部下から早朝に連絡が来ることもあります。"}, {"t": 947.95, "x": "上司は、無理をしていないかと気にします。"}, {"t": 950.8166666666667, "x": "本人は早く始めただけかもしれません。"}, {"t": 953.4333333333333, "x": "夕方に家の用事を済ませるためです。"}, {"t": 956.0, "x": "時刻だけで働き方を決めつけると、話がこじれます。"}, {"t": 959.8666666666667, "x": "こじれないよう、送る時刻を気にする人もいます。"}, {"t": 963.1, "x": "下書きのまま置いておくのです。"}, {"t": 965.0833333333334, "x": "朝まで待って送るのも、在宅らしい気づかいです。"}, {"t": 968.6333333333333, "x": "気づかいが増えるほど、時刻は\n手がかりとして当てにならなくなります。"}, {"t": 972.8166666666667, "x": "上司側は、部下の早朝の連絡を\n無理をしている印と受け取りやすいです。"}, {"t": 977.8833333333333, "x": "部下側は、上司の夜の連絡を\n同じ時間まで働けと受け取りやすいです。"}, {"t": 982.9166666666666, "x": "十二個のあるあるを並べてきました。"}, {"t": 985.1166666666667, "x": "会議の始まりから一日の終わりまでです。"}, {"t": 987.8, "x": "並べてみると、どれも画面一枚分の\n距離から生まれています。"}, {"t": 992.0666666666667, "x": "生まれた思い違いの多くは、\n相手を気にかけているからこそ起きます。"}, {"t": 996.4833333333333, "x": "上司は、見えない時間の部下を気にかけています。"}, {"t": 999.8333333333334, "x": "だから表示や時刻を見ています。"}, {"t": 1001.9666666666667, "x": "部下は、見られていない時間のことを\n気にしています。"}, {"t": 1005.3, "x": "働いていると伝わるかどうかです。"}, {"t": 1007.5166666666667, "x": "気にかける向きは逆です。"}, {"t": 1009.2, "x": "でも、気にかけている量はよく似ています。"}, {"t": 1012.1, "x": "似ているのに、画面はその量を\n互いに届けてくれません。"}, {"t": 1015.85, "x": "二人とも、届かない分を想像で埋めています。"}, {"t": 1019.2166666666667, "x": "そうして一日を過ごしています。"}, {"t": 1021.35, "x": "一日の終わりにカメラを切ります。"}, {"t": 1023.5166666666667, "x": "そのあとで本音がこぼれます。"}, {"t": 1025.4, "x": "こぼれる本音の中身は、上司と\n部下でそれほど違わないのかもしれません。"}, {"t": 1030.05, "x": "そう思えると、次の会議の始まりの\n数秒が少し軽くなります。"}, {"t": 1034.55, "x": "軽くなった数秒で、だれかが\n先に口を開けるかもしれません。"}, {"t": 1038.8666666666666, "x": "最後に、一つだけ聞かせてください。"}, {"t": 1041.5, "x": "今日の十二個のほかに、\n画面越しならではのあるあるはありますか。"}, {"t": 1045.7666666666667, "x": "上司側でも部下側でも、思い当たるものを\nコメントで教えてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

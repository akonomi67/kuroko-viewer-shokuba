<script>
const D={"name": "円満に退職する人がやらない7つのこと", "file": "023_円満に退職する人がやらない7つのこと", "dur": 1047.9, "segs": [], "subs": [{"t": 0.0, "x": "夕方、会議室を出てきた上司を呼び止めます。"}, {"t": 3.45, "x": "辞めると伝えるのはほんの一分です。"}, {"t": 5.833333333333333, "x": "その一分で最後の数週間の空気が\n決まることがあります。"}, {"t": 9.65, "x": "呼び止めた側は、何日も前から\n言葉を用意してきました。"}, {"t": 13.583333333333334, "x": "用意した言葉は、頭の中では何度も通っています。"}, {"t": 17.383333333333333, "x": "通っていたはずの言葉です。"}, {"t": 19.183333333333334, "x": "なのに廊下に立つと、半分しか出てきません。"}, {"t": 22.3, "x": "出てこなかった半分を、上司は\n表情から読み取ろうとします。"}, {"t": 26.55, "x": "読み取った中身は、伝えたかったことと\n合うとは限りません。"}, {"t": 30.35, "x": "限られた一分では、話の中身より\n先に届くものがあります。"}, {"t": 34.65, "x": "届くのは伝え方です。"}, {"t": 36.266666666666666, "x": "誰にどの順番で、どこで伝えたかです。"}, {"t": 39.25, "x": "伝えた順番は、辞める理由よりも\n長く覚えられやすいです。"}, {"t": 43.516666666666666, "x": "今日は七つのことを並べます。"}, {"t": 45.483333333333334, "x": "円満に職場を離れる人が、やらずにいることです。"}, {"t": 49.083333333333336, "x": "並べるのは、辞めるかどうかを\n決める話ではありません。"}, {"t": 52.68333333333333, "x": "扱うのは決めたあとの話です。"}, {"t": 54.85, "x": "伝え方とはなれ方の段取りだけを見ます。"}, {"t": 57.583333333333336, "x": "段取りの効き方は時期で変わります。"}, {"t": 59.833333333333336, "x": "伝えた日と翌週と最後の週です。"}, {"t": 62.21666666666667, "x": "変わっていく順に一つずつ見ていきます。"}, {"t": 64.68333333333334, "x": "一つ目は、上司より先に同僚に話してしまうことです。"}, {"t": 68.56666666666666, "x": "決めた直後は、気持ちがまだ落ち着いていません。"}, {"t": 71.8, "x": "落ち着かないまま、いちばん話しやすい\n相手に打ち明けます。"}, {"t": 75.75, "x": "相手は隣の席の同僚です。"}, {"t": 77.93333333333334, "x": "毎日のように昼を一緒に食べている人です。"}, {"t": 80.86666666666666, "x": "同僚は誰にも言わないと約束してくれます。"}, {"t": 83.73333333333333, "x": "約束はたいてい本気で守られようとします。"}, {"t": 86.58333333333333, "x": "それでも話は少しずつ漏れていくことがあります。"}, {"t": 89.63333333333334, "x": "きっかけは休憩室での何気ない一言です。"}, {"t": 92.51666666666667, "x": "ふとした表情の変化からも漏れます。"}, {"t": 94.9, "x": "変化に気づいた別の人が、上司に\nそれとなく尋ねます。"}, {"t": 98.7, "x": "尋ねられた上司はそこで初めて話を知ります。"}, {"t": 101.85, "x": "上司から見て引っかかる所は別にあります。"}, {"t": 104.68333333333334, "x": "辞めることそのものではない場合があります。"}, {"t": 107.23333333333333, "x": "引っかかりやすいのは、自分が\n何番目に知らされたかです。"}, {"t": 111.18333333333334, "x": "何番目かという順番は、信頼の順番に見えます。"}, {"t": 115.08333333333333, "x": "そう受け取られることがあるのです。"}, {"t": 117.1, "x": "受け取った上司は待つ立場になります。"}, {"t": 119.45, "x": "本人から話が来るのを待つしかありません。"}, {"t": 122.23333333333333, "x": "知らないふりをして、数日を過ごすこともあります。"}, {"t": 125.68333333333334, "x": "その数日は、上司にとって居心地の\n悪い時間になりやすいです。"}, {"t": 130.2, "x": "一方で、部下にも先に話してしまう事情があります。"}, {"t": 133.86666666666667, "x": "一人で抱えていると、決めたことが\n揺らぎそうになるからです。"}, {"t": 137.8, "x": "誰かに言葉にして聞いてもらうと、\n気持ちが少し軽くなります。"}, {"t": 141.86666666666667, "x": "軽くなりたいという気持ちは、\n責められるものではありません。"}, {"t": 145.53333333333333, "x": "上司に切り出すのが怖いという\n気持ちも、自然なものです。"}, {"t": 149.33333333333334, "x": "時間で追ってみます。"}, {"t": 150.76666666666668, "x": "この一つ目は、伝えた日にはまだ何も起きません。"}, {"t": 154.1, "x": "効いてくるのは翌週です。"}, {"t": 155.86666666666667, "x": "上司と改めて話す場を持った時です。"}, {"t": 158.46666666666667, "x": "話の最初の数分が、いつ誰から\n聞いたかの確認に使われます。"}, {"t": 163.21666666666667, "x": "確認のあいだ、上司の言葉は\n少し固くなりやすいです。"}, {"t": 167.2, "x": "その空気のまま引き継ぎの相談に入ります。"}, {"t": 170.06666666666666, "x": "代わりの形は一つです。"}, {"t": 171.83333333333334, "x": "職場で最初に話す相手を上司にしておくことです。"}, {"t": 175.21666666666667, "x": "気持ちを軽くしたい分は、職場の\n外の人に受け止めてもらえます。"}, {"t": 179.53333333333333, "x": "家族や仕事と関係のない友人に話します。"}, {"t": 182.58333333333334, "x": "それなら職場に届くことはまずありません。"}, {"t": 185.18333333333334, "x": "届かない場所で気持ちを整えてから、\n上司のところへ向かいます。"}, {"t": 189.35, "x": "順番が守られていると上司は落ち着きます。"}, {"t": 192.23333333333332, "x": "話の中身のほうに耳を向けやすくなります。"}, {"t": 195.11666666666667, "x": "二つ目は、会議が終わった直後の廊下です。"}, {"t": 198.41666666666666, "x": "そこで立ったまま切り出すことです。"}, {"t": 200.51666666666668, "x": "冒頭の夕方の場面がちょうどこの形にあたります。"}, {"t": 203.85, "x": "言うと決めた日は、朝からずっと機会を\nうかがっています。"}, {"t": 207.51666666666668, "x": "そのあいだにも、上司の予定は\nどんどん埋まっていきます。"}, {"t": 211.23333333333332, "x": "埋まった予定の切れ目が、会議室から\n出てきた瞬間です。"}, {"t": 215.21666666666667, "x": "逃すと今日はもう言えない気がします。"}, {"t": 217.56666666666666, "x": "それで思わず呼び止めます。"}, {"t": 219.38333333333333, "x": "上司の側から見てみます。"}, {"t": 221.16666666666666, "x": "その時の頭の中は会議の続きでいっぱいです。"}, {"t": 224.31666666666666, "x": "決まった宿題や、次の予定に\n向かう時間を数えています。"}, {"t": 228.38333333333333, "x": "数えている最中に、辞めるという\n重い話が飛び込んできます。"}, {"t": 232.65, "x": "重い話を受け止めるには、廊下は\nあまりに狭い場所です。"}, {"t": 236.61666666666667, "x": "通りかかる人の目もあります。"}, {"t": 238.55, "x": "その場では詳しく聞き返せません。"}, {"t": 240.85, "x": "だから返事は短くなります。"}, {"t": 242.81666666666666, "x": "あとで改めて、とだけ返すことになりやすいです。"}, {"t": 246.23333333333332, "x": "返された側は、軽く扱われたように\n感じることがあります。"}, {"t": 250.33333333333334, "x": "一方で、部下にも立ち話になってしまう\n事情があります。"}, {"t": 254.16666666666666, "x": "わざわざ時間をもらうと、大ごとに\n見えてしまう気がします。"}, {"t": 258.06666666666666, "x": "予定を押さえる連絡を送ること自体に、\n勇気が要ります。"}, {"t": 262.0, "x": "勇気は一回で済ませたいものです。"}, {"t": 264.26666666666665, "x": "それで偶然の機会にかけてしまいます。"}, {"t": 266.8, "x": "これを時間で追います。"}, {"t": 268.35, "x": "この二つ目は、伝えたその日のうちに効いてきます。"}, {"t": 271.6333333333333, "x": "上司はその晩、話の続きを聞けません。"}, {"t": 274.85, "x": "一人で考えることになります。"}, {"t": 276.81666666666666, "x": "考えた材料は、廊下で聞いた短い言葉と\n表情だけです。"}, {"t": 281.1, "x": "材料が少ないと、悪いほうへ\n想像が広がりやすいです。"}, {"t": 285.31666666666666, "x": "翌朝の上司は席で少しよそよそしく見えます。"}, {"t": 288.53333333333336, "x": "そのせいかもしれません。"}, {"t": 290.1166666666667, "x": "代わりの形は、先に時間と場所をもらうことです。"}, {"t": 293.6166666666667, "x": "話の中身はそのあとです。"}, {"t": 295.5833333333333, "x": "短いメールかチャットで、ご相談したいことがあると\n送ります。"}, {"t": 299.6166666666667, "x": "あわせて一行添えます。"}, {"t": 301.26666666666665, "x": "十五分ほど二人で話せる時間を、\n空けてもらえるかどうかです。"}, {"t": 305.46666666666664, "x": "この一行があると上司は身構えて来られます。"}, {"t": 308.48333333333335, "x": "重い話かもしれないと分かるからです。"}, {"t": 311.01666666666665, "x": "身構える時間があることは、\n上司にとってはむしろ助けになります。"}, {"t": 315.3833333333333, "x": "場所は、会議室かドアの閉まる\n小さな部屋が向いています。"}, {"t": 319.3333333333333, "x": "そこで座って話します。"}, {"t": 321.05, "x": "座れば一分で終わらせる必要がなくなります。"}, {"t": 324.1166666666667, "x": "三つ目は、辞める理由を聞かれた時のことです。"}, {"t": 327.3333333333333, "x": "職場への不満を並べてしまうことです。"}, {"t": 329.9166666666667, "x": "上司はたいてい最初に理由を尋ねます。"}, {"t": 332.56666666666666, "x": "尋ねられると、正直に答えなければと\n思うのが自然です。"}, {"t": 336.5833333333333, "x": "自然な流れで、これまで溜めてきたことが\n順に出てきます。"}, {"t": 340.4166666666667, "x": "仕事の割り振りや評価のこと、\nある人との関係のことなどです。"}, {"t": 344.75, "x": "一つずつは小さくても、並べると\n長い一覧になっていきます。"}, {"t": 349.03333333333336, "x": "上司から見ると、その一覧は採点表です。"}, {"t": 352.45, "x": "管理への採点表のように聞こえます。"}, {"t": 354.96666666666664, "x": "直せるところは直したいと考えやすいです。"}, {"t": 357.8, "x": "考えた上司は、では割り振りを\n変えようかと持ちかけます。"}, {"t": 361.75, "x": "この時点で、辞める話は改善の\n相談にすり替わります。"}, {"t": 365.85, "x": "すり替わった話し合いは、長くなりやすいです。"}, {"t": 369.18333333333334, "x": "上司にとっては、引き止めではないこともあります。"}, {"t": 372.4, "x": "誠意のつもりで言っている場合です。"}, {"t": 374.6666666666667, "x": "一方で、部下にも不満を並べてしまう\n事情があります。"}, {"t": 378.46666666666664, "x": "理由をきちんと言わないと、納得してもらえない。"}, {"t": 381.95, "x": "そう考えるからです。"}, {"t": 383.5, "x": "残る人たちのために、言っておくべきだという\n思いもあります。"}, {"t": 387.46666666666664, "x": "気づいてほしかったという気持ちも、\nそこに混ざっています。"}, {"t": 390.98333333333335, "x": "混ざった気持ちが、辞める場面で一度に出ます。"}, {"t": 394.1166666666667, "x": "それは無理もありません。"}, {"t": 395.7, "x": "時間の順に見てみます。"}, {"t": 397.35, "x": "伝えた日は、話が長引くだけのことが多いです。"}, {"t": 400.8666666666667, "x": "効いてくるのは翌週です。"}, {"t": 402.6333333333333, "x": "上司が改善の案を持って戻ってきます。"}, {"t": 405.31666666666666, "x": "その案に、もう決めたことだと\n答えるのは気まずいものです。"}, {"t": 409.18333333333334, "x": "気まずさを避けて曖昧に返します。"}, {"t": 411.51666666666665, "x": "すると話はさらに延びていきます。"}, {"t": 413.76666666666665, "x": "延びるあいだ、周りは分からなくなります。"}, {"t": 416.6, "x": "辞めるのか残るのか見えないのです。"}, {"t": 418.73333333333335, "x": "では代わりの形です。"}, {"t": 420.31666666666666, "x": "伝える理由を、前向きなものに一つだけ絞ることです。"}, {"t": 424.15, "x": "次にやってみたい仕事や、暮らしの\n事情などが当てはまります。"}, {"t": 428.26666666666665, "x": "理由が一つなら上司も説明しやすくなります。"}, {"t": 431.31666666666666, "x": "上の人へそのまま伝えられるからです。"}, {"t": 433.6666666666667, "x": "不満を伝えておきたい場合は、\n辞める話とは切り離します。"}, {"t": 437.9, "x": "別の日に改めて相談として持ち込みます。"}, {"t": 440.78333333333336, "x": "そのほうが届きやすいです。"}, {"t": 442.6333333333333, "x": "届けたい中身が同じでも、置く\n場所で聞こえ方は変わります。"}, {"t": 446.6333333333333, "x": "違いは、相手に直す余地が残っているかどうかです。"}, {"t": 450.3666666666667, "x": "四つ目は、上司の話を聞く前のことです。"}, {"t": 453.65, "x": "こちらの条件を出し切ってしまうことです。"}, {"t": 456.25, "x": "最後に出る日、引き継ぐ範囲、\n残りの日々の働き方などです。"}, {"t": 460.96666666666664, "x": "それらを、最初の数分でまとめて伝えてしまいます。"}, {"t": 464.68333333333334, "x": "伝える側は迷いがないことを示したいのです。"}, {"t": 467.55, "x": "上司から見ると、まだ話し合っていません。"}, {"t": 470.6166666666667, "x": "その前に結論だけを渡されたように感じます。"}, {"t": 473.73333333333335, "x": "自分の言葉を挟む場所が無い。"}, {"t": 475.81666666666666, "x": "上司はそう受け取りやすいです。"}, {"t": 477.8833333333333, "x": "そして、聞く気持ちのほうを\n先に閉じてしまうことがあります。"}, {"t": 481.75, "x": "上司には、一度は引き止めの\n話をするという役目もあります。"}, {"t": 486.05, "x": "話した中身は、さらに上の人へ\n報告しなければなりません。"}, {"t": 490.1666666666667, "x": "報告の材料が条件の一覧だけです。"}, {"t": 492.95, "x": "これでは上司自身も説明に困ります。"}, {"t": 495.6333333333333, "x": "困った上司が、話を少し強めの\n口調で返すことも出てきます。"}, {"t": 500.1, "x": "一方で、部下にも先に固めておきたい\n事情があります。"}, {"t": 503.8333333333333, "x": "引き止められたら、決めたことが\n揺らぎそうで怖いのです。"}, {"t": 507.3833333333333, "x": "怖いからこそ隙を見せたくありません。"}, {"t": 509.76666666666665, "x": "それで一気に話し切ろうとします。"}, {"t": 512.0, "x": "話し切ってしまえば、もう戻れないという\n安心も得られます。"}, {"t": 515.9833333333333, "x": "その安心は大きいものです。"}, {"t": 518.0666666666667, "x": "辞めると決めるまでの迷いが、長かった人ほどです。"}, {"t": 521.5166666666667, "x": "時間で追うとどうでしょう。"}, {"t": 523.1666666666666, "x": "この四つ目は、伝えた日の空気をそのまま決めます。"}, {"t": 526.6833333333333, "x": "条件が先に並ぶと、話し合いは\n交渉のようになりやすいです。"}, {"t": 531.2333333333333, "x": "交渉になると、一つずつの項目で\n押し合いが始まります。"}, {"t": 535.25, "x": "押し合いの記憶は、翌週以降の\n細かな相談にも残っていきます。"}, {"t": 539.9, "x": "残った記憶のせいで、小さな頼みごとも\n言い出しにくくなります。"}, {"t": 544.15, "x": "代わりにできる形があります。"}, {"t": 546.0666666666667, "x": "変わらないことを一つだけ先に伝えることです。"}, {"t": 548.9166666666666, "x": "辞める気持ちは決まっています、と\n最初に一度だけ置きます。"}, {"t": 552.9833333333333, "x": "置いたうえで、上司の話を最後まで\n聞く時間を取ります。"}, {"t": 557.0333333333333, "x": "取った時間の中で、上司の考えや\n職場の都合が見えてきます。"}, {"t": 561.4333333333333, "x": "細かな条件は、その都合に合わせて\n相談として出していきます。"}, {"t": 565.8833333333333, "x": "出す順番を変えるだけです。"}, {"t": 567.8, "x": "同じ条件でも、受け取られ方が変わりやすいです。"}, {"t": 571.3666666666667, "x": "変わった受け取り方は、残りの\n日々の頼みやすさにつながります。"}, {"t": 575.5, "x": "五つ目は、最後に出社する日の決め方です。"}, {"t": 578.7333333333333, "x": "相談せずに一人で決めてしまうことです。"}, {"t": 581.3166666666667, "x": "決める側は、カレンダーを見ながら\n自分なりに逆算しています。"}, {"t": 585.45, "x": "逆算して出した日付を、決まったこととして\n上司に伝えます。"}, {"t": 589.5333333333333, "x": "伝えた日付には、本人なりの\n筋道がちゃんと通っています。"}, {"t": 593.7, "x": "上司の側から見ます。"}, {"t": 595.3, "x": "その日付は職場の段取りと突き合わされていません。"}, {"t": 598.55, "x": "後任を誰にするかも未定です。"}, {"t": 600.7333333333333, "x": "仕事の振り分け先も、まだ白紙です。"}, {"t": 603.65, "x": "白紙のまま日付だけが決まります。"}, {"t": 605.7833333333333, "x": "上司は逆算の起点を奪われた形になります。"}, {"t": 608.9333333333333, "x": "そのうえ上司は、自分の上の\n人への説明にも追われます。"}, {"t": 613.0666666666667, "x": "時期によっては、職場でいちばん忙しい\n週と重なることもあります。"}, {"t": 617.6166666666667, "x": "重なったと分かれば上司は尋ねます。"}, {"t": 620.0333333333333, "x": "日付を動かせないか、という相談です。"}, {"t": 623.0, "x": "尋ねられた側は否定されたように感じやすいです。"}, {"t": 626.15, "x": "一方で、部下にも日付を先に\n決めておきたい事情があります。"}, {"t": 630.2833333333333, "x": "次の職場の始まる日が、すでに決まっている\n場合があります。"}, {"t": 634.3333333333334, "x": "決まっていなくても、区切りは\n早くはっきりさせたいものです。"}, {"t": 638.1333333333333, "x": "区切りが見えないと困ります。"}, {"t": 639.9666666666667, "x": "残りの日々をどう過ごせばいいか分からないからです。"}, {"t": 643.05, "x": "これも時間で追います。"}, {"t": 644.6, "x": "この五つ目が効いてくるのは翌週です。"}, {"t": 647.1166666666667, "x": "翌週、上司が組み直した段取りを持ってきます。"}, {"t": 650.5833333333334, "x": "そこから日付の相談が始まります。"}, {"t": 653.0, "x": "相談のはずでした。"}, {"t": 654.45, "x": "それがどちらの都合を優先するかの\n話になりやすいです。"}, {"t": 658.15, "x": "話がこじれると、最後の数週間の\n頼みごとに角が立ちます。"}, {"t": 662.5833333333334, "x": "立ったかどは、送り出す日まで\n小さく残り続けることがあります。"}, {"t": 666.8, "x": "代わりの形はこうです。"}, {"t": 668.5333333333333, "x": "動かせない日と動かせる日を、分けて伝えることです。"}, {"t": 672.05, "x": "次の職場の都合で、動かせない日があるかも\nしれません。"}, {"t": 675.9333333333333, "x": "あればそれを先に伝えます。"}, {"t": 677.7833333333333, "x": "伝えたうえで、それより前の\nどこで区切るかは相談にします。"}, {"t": 681.8833333333333, "x": "相談の形にしておきます。"}, {"t": 683.85, "x": "すると上司は職場の段取りを重ねて考えられます。"}, {"t": 687.2166666666667, "x": "結果が本人の案と同じ日になることもあります。"}, {"t": 690.3, "x": "それでも受け取られ方は違ってきます。"}, {"t": 692.65, "x": "日付を一緒に決めたという手ざわりが残るからです。"}, {"t": 695.8666666666667, "x": "その手ざわりは、最後の週の\n引き継ぎを進める力になりやすいです。"}, {"t": 700.5666666666667, "x": "六つ目は、最後の週に手順書だけを残すことです。"}, {"t": 704.2833333333333, "x": "判断の理由のほうは残しません。"}, {"t": 706.6, "x": "最後の週は、挨拶や片付けで\n思った以上に時間が足りません。"}, {"t": 711.2833333333333, "x": "足りない時間の中で、引き継ぎの\n資料を急いで仕上げます。"}, {"t": 715.2333333333333, "x": "仕上がった手順書には、作業の\n流れが番号つきで並んでいます。"}, {"t": 719.7166666666667, "x": "並んだ手順は、いつも通りの\n日であれば十分に回ります。"}, {"t": 723.8166666666667, "x": "回らなくなるのは、いつもと違うことが起きた日です。"}, {"t": 727.2666666666667, "x": "上司から見ると、その日は困ります。"}, {"t": 729.9833333333333, "x": "誰へ聞けばいいかが分からなくなります。"}, {"t": 732.3833333333333, "x": "辞めた人に電話をかけてよいものか迷います。"}, {"t": 735.2, "x": "迷ったすえに手探りで判断します。"}, {"t": 737.6833333333333, "x": "あとから食い違いが見つかります。"}, {"t": 739.7666666666667, "x": "原因は手順の裏にあった判断です。"}, {"t": 742.3833333333333, "x": "それが書かれていなかったのです。"}, {"t": 744.3666666666667, "x": "なぜこの順番なのかという部分です。"}, {"t": 746.8, "x": "どんな時に例外にしていたのかという部分です。"}, {"t": 749.7666666666667, "x": "そこが欠けた手順書は、残った人には重荷です。"}, {"t": 753.2333333333333, "x": "少しずつ借りが増える帳面になります。"}, {"t": 755.7833333333333, "x": "一方で、部下にも理由まで書かない事情があります。"}, {"t": 759.3, "x": "判断の理由は、本人の中では\nあまりに当たり前になっています。"}, {"t": 763.7166666666667, "x": "当たり前すぎて、書くべきものだと\n気づきにくいのです。"}, {"t": 767.2333333333333, "x": "気づいても、言葉にするには\n一つずつ思い出す時間が要ります。"}, {"t": 771.4166666666666, "x": "その時間が、最後の週にはどうしても残っていません。"}, {"t": 775.2833333333333, "x": "ここも時間で追います。"}, {"t": 776.85, "x": "この六つ目は、最後の週にはまったく表に出ません。"}, {"t": 780.5666666666667, "x": "効いてくるのは、辞めたあとの一ヶ月ほどです。"}, {"t": 783.7, "x": "その頃には、本人はもう次の\n職場で新しい仕事を覚えています。"}, {"t": 788.5166666666667, "x": "そこへ前の職場から、問い合わせが\n届くこともあります。"}, {"t": 792.3, "x": "届いた問い合わせに答えながら思います。"}, {"t": 794.9166666666666, "x": "書いておけばよかったと思う人は、少なくありません。"}, {"t": 798.45, "x": "代わりの形もあります。"}, {"t": 800.0666666666667, "x": "手順の横に、迷った時に何を\n優先したかを一行ずつ添えることです。"}, {"t": 805.0333333333333, "x": "立派な文章でなくてかまいません。"}, {"t": 807.2333333333333, "x": "急ぎの時はこちらを先に、という程度です。"}, {"t": 810.45, "x": "先方から言われたらここは変えてよい、でも十分です。"}, {"t": 814.4833333333333, "x": "程度の軽い一行でも、残った人の\n判断の手がかりになります。"}, {"t": 818.85, "x": "手がかりになるかを確かめます。"}, {"t": 820.7833333333333, "x": "後任と一緒に、一度だけ通して\n回すのが向いています。"}, {"t": 824.7666666666667, "x": "回してみると、手順書に無い\n質問がいくつも出てきます。"}, {"t": 828.5666666666667, "x": "出てきた質問の答えが、そのまま判断の\n理由として書き足せます。"}, {"t": 833.0166666666667, "x": "七つ目は、送別の場での話です。"}, {"t": 835.8166666666667, "x": "ずっと言わずにいた本音を、まとめて出すことです。"}, {"t": 839.1666666666666, "x": "最後の日の挨拶や、送り出してもらう席です。"}, {"t": 842.6666666666666, "x": "そこがその場になりやすいです。"}, {"t": 844.65, "x": "もう最後だからという気持ちが、\n言葉の重しを外します。"}, {"t": 848.5166666666667, "x": "これまで飲み込んできた思いがそこで出てきます。"}, {"t": 851.2666666666667, "x": "出てくるのは、職場のやり方への疑問です。"}, {"t": 854.35, "x": "ある場面での悔しさも出てきます。"}, {"t": 856.5, "x": "上司から見ると、最後の印象が上書きされます。"}, {"t": 860.05, "x": "その話でまとめて塗り替わるのです。"}, {"t": 862.3333333333334, "x": "上書きされた印象は強く残りやすいです。"}, {"t": 865.25, "x": "それまでの何年分の働きぶりよりもです。"}, {"t": 868.05, "x": "残る人たちも、どんな顔で聞けばいいか\n分かりません。"}, {"t": 871.65, "x": "そのまま黙り込みます。"}, {"t": 873.2333333333333, "x": "黙り込んだ場では、言われたことに\n誰も返事ができません。"}, {"t": 877.0833333333334, "x": "返事ができないまま、本人は\nその日で職場を離れていきます。"}, {"t": 881.3, "x": "離れたあと、残った人たちの\n間で受け止め方が割れることもあります。"}, {"t": 885.8333333333334, "x": "割れた受け止め方は、残る職場の\n空気にしばらく影を落とします。"}, {"t": 890.15, "x": "一方で、部下にも本音を最後に出す事情があります。"}, {"t": 893.8666666666667, "x": "在籍中に言うと、その後の毎日が\n気まずくなりそうだったからです。"}, {"t": 898.35, "x": "気まずくならない時期が、辞める\n日しか無かったとも言えます。"}, {"t": 902.0, "x": "言える時に言っておけば、残る人の役に立つ。"}, {"t": 905.1333333333333, "x": "そんな思いもあります。"}, {"t": 906.6833333333333, "x": "その思いは、職場をよくしたい\n気持ちから来ていることが多いです。"}, {"t": 911.0, "x": "最後も時間で追います。"}, {"t": 912.75, "x": "この七つ目は、最後の週の最後の一日に起きます。"}, {"t": 916.5333333333333, "x": "効いてくるのは、本人が去ったあとの\n職場のほうです。"}, {"t": 920.1, "x": "本人はその効き方を、見ることも\n直すこともできません。"}, {"t": 924.0333333333333, "x": "代わりにどうするかです。"}, {"t": 925.6, "x": "本音を返事ができる時期に、一対一で渡すことです。"}, {"t": 929.4833333333333, "x": "最後の週より前に、上司と二人で\n話す時間をもう一度もらいます。"}, {"t": 934.2166666666667, "x": "その時間の中で、気づいたことを\n相談の形で一つずつ伝えます。"}, {"t": 938.7333333333333, "x": "伝え方が相談なら上司も応じられます。"}, {"t": 941.4833333333333, "x": "その場で問い返したり const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

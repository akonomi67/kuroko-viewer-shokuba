<style>

<script>
const D={"name": "指導とパワハラの境目はどこで変わったのか", "file": "021_指導とパワハラの境目はどこで変わったのか", "dur": 1058.05, "segs": [], "subs": [{"t": 0.0, "x": "火曜の午後、二人だけの部屋に呼ばれます。"}, {"t": 2.9, "x": "呼んだ側は、先週の件を話すつもりでいます。"}, {"t": 6.35, "x": "つもりでいた話は、五分で終わる予定でした。"}, {"t": 9.633333333333333, "x": "予定より長くなったのは、言葉を選んだからです。"}, {"t": 13.0, "x": "選んでいるうちに、伝えたい中身は薄くなります。"}, {"t": 16.316666666666666, "x": "薄くなった話を受け取った側は、\n要点をつかめません。"}, {"t": 20.35, "x": "つかめないまま、部屋を出て席に戻ります。"}, {"t": 23.35, "x": "戻った席で、言われた言葉だけが頭に残ります。"}, {"t": 27.066666666666666, "x": "残ったのは、直し方ではなく雰囲気の方です。"}, {"t": 30.45, "x": "雰囲気だけが残る面談は、めずらしくありません。"}, {"t": 33.95, "x": "ありませんが、どちらかが手を\n抜いたわけでもありません。"}, {"t": 37.55, "x": "手を抜いていないのに、話が\nかみ合わない時があります。"}, {"t": 41.18333333333333, "x": "あるのは、二人が別々の物差しを\n持っているからです。"}, {"t": 44.85, "x": "片方の物差しは、自分が受けてきた\n指導でできています。"}, {"t": 48.75, "x": "もう片方は、その仕事に必要か\nどうかで引かれています。"}, {"t": 52.65, "x": "引かれた線の場所が違えば、\n同じ一言の重さも変わります。"}, {"t": 56.81666666666667, "x": "変わった重さは、言った側には見えにくいものです。"}, {"t": 60.36666666666667, "x": "見えないまま同じ言い方を続けると、\n距離だけが開きます。"}, {"t": 64.3, "x": "開いた距離は、注意の回数を減らす方向に働きます。"}, {"t": 68.46666666666667, "x": "働いた結果、直す機会そのものが\n職場から減っていきます。"}, {"t": 72.71666666666667, "x": "今日は、指導とハラスメントの境目の話をします。"}, {"t": 76.5, "x": "話しますが、これが該当するという判定はしません。"}, {"t": 80.25, "x": "しないのは、受け取り方が人や\n場面で変わるからです。"}, {"t": 83.96666666666667, "x": "変わるものを、誰が悪いかで決めることもしません。"}, {"t": 87.65, "x": "決めずに、線の引かれ方だけを並べ直していきます。"}, {"t": 91.26666666666667, "x": "まず、言葉の重さが動いてきた流れを見ます。"}, {"t": 94.71666666666667, "x": "流れの起点は、二十年ほど前の職場にあります。"}, {"t": 98.3, "x": "当時は、強い言い方が指導として通っていました。"}, {"t": 101.75, "x": "通っていたのは、周りも同じ形で\n育っていたからです。"}, {"t": 105.5, "x": "同じ形で育った人は、その言い方を覚えて渡します。"}, {"t": 109.48333333333333, "x": "渡された側が上に立つ頃には、\nそれが基準になっています。"}, {"t": 114.06666666666666, "x": "基準になったものは、疑われずに使われ続けます。"}, {"t": 117.65, "x": "使われ続けるうちに、外の空気だけが\n先に変わります。"}, {"t": 121.53333333333333, "x": "変わった空気は、職場の中まですぐには届きません。"}, {"t": 125.23333333333333, "x": "届かない間、同じ一言は同じ重さのまま出されます。"}, {"t": 129.2, "x": "出された一言を、若い人は別の重さで受け取ります。"}, {"t": 133.03333333333333, "x": "受け取り方が違うので、反応も昔とは変わります。"}, {"t": 136.66666666666666, "x": "変わった反応を見て、言った側は\n戸惑うことがあります。"}, {"t": 140.53333333333333, "x": "戸惑いは、手加減が足りなかったからとは\n限りません。"}, {"t": 144.1, "x": "限らないのは、物差しの目盛りが\n動いているからです。"}, {"t": 147.58333333333334, "x": "動いた目盛りは、\n誰かが宣言したものではありません。"}, {"t": 151.36666666666667, "x": "少しずつ動いたので、動いた日を\n誰も覚えていません。"}, {"t": 155.16666666666666, "x": "覚えていない分だけ、同じ言い方が\n長く残ってしまいます。"}, {"t": 159.3, "x": "残ってしまった言い方は、悪意とは\n別のところにあります。"}, {"t": 163.23333333333332, "x": "別のところにあるものを、まず分けて見ていきます。"}, {"t": 166.73333333333332, "x": "二つ目は、言う側の物差しの作られ方です。"}, {"t": 170.16666666666666, "x": "作られ方は、たいてい自分が受けた経験からです。"}, {"t": 173.76666666666668, "x": "新人の頃に、大きな声で直された記憶があります。"}, {"t": 177.63333333333333, "x": "締切の前に、手元の資料を投げ返された\n記憶もあります。"}, {"t": 181.83333333333334, "x": "遅くまで残って、やり直しを\n繰り返した記憶もあります。"}, {"t": 185.86666666666667, "x": "そういう記憶は、つらかった分だけ強く残ります。"}, {"t": 189.46666666666667, "x": "残った記憶の中には、うまくいった部分もあります。"}, {"t": 193.1, "x": "うまくいった部分だけが、方法として取り出されます。"}, {"t": 196.66666666666666, "x": "取り出された方法は、本人の\n中で正解の形になります。"}, {"t": 200.85, "x": "正解になった形は、次の世代にそのまま渡されます。"}, {"t": 204.78333333333333, "x": "渡せない前提の中には、周りの環境も入っています。"}, {"t": 208.81666666666666, "x": "環境が違えば、同じ方法が同じようには効きません。"}, {"t": 212.68333333333334, "x": "効かないどころか、別の意味で\n受け取られる場合があります。"}, {"t": 216.31666666666666, "x": "受け取られ方が変わったことは、外からは見えません。"}, {"t": 219.8, "x": "見えないので、効かない理由を\n相手の弱さに置きがちです。"}, {"t": 223.56666666666666, "x": "置いてしまうと、やり方はさらに強い方へ寄ります。"}, {"t": 227.18333333333334, "x": "寄った分だけ、相手との距離は開いていきます。"}, {"t": 230.6, "x": "開いた距離を縮めるには、前提の方を\n見直す必要があります。"}, {"t": 235.08333333333334, "x": "必要と分かっても、自分の経験は\n否定しにくいものです。"}, {"t": 239.15, "x": "しにくいからこそ、反対側の物差しを先に見てみます。"}, {"t": 243.16666666666666, "x": "三つ目は、受け取る側の物差しです。"}, {"t": 245.95, "x": "この物差しは、必要かどうかで目盛りが振られます。"}, {"t": 249.36666666666667, "x": "何を直すのかが分かる指摘は、必要な話に入ります。"}, {"t": 253.43333333333334, "x": "どこで間違えたかを示す指摘も、\n必要な話に入ります。"}, {"t": 257.51666666666665, "x": "次に何をすればよいかの一言も、\n必要な話に入ります。"}, {"t": 261.68333333333334, "x": "そういう指摘は、強い言い方でも\n受け取られやすいです。"}, {"t": 265.46666666666664, "x": "受け取られにくいのは、必要な範囲から\n出た部分です。"}, {"t": 269.03333333333336, "x": "性格に触れる言葉は、直す手がかりになりません。"}, {"t": 272.46666666666664, "x": "過去の失敗を並べ直す話も、\n今日の作業には効きません。"}, {"t": 276.65, "x": "効かない言葉が増えるほど、\n必要な部分は埋もれます。"}, {"t": 280.4, "x": "埋もれた指摘は、聞いていなかった扱いになります。"}, {"t": 283.85, "x": "扱われた側は、また同じ指摘を\n受けることになります。"}, {"t": 287.55, "x": "受けるたびに、必要な話の割合はさらに下がります。"}, {"t": 291.3, "x": "下がった割合を、言う側は量で補おうとします。"}, {"t": 295.03333333333336, "x": "補おうとした量が、受け取る側の\n線を越えることがあります。"}, {"t": 299.1333333333333, "x": "越えたかどうかは、言った側の\n意図では決まりません。"}, {"t": 302.55, "x": "決まらないのは、線が相手の側に\n引かれているからです。"}, {"t": 306.18333333333334, "x": "だからといって、受け取る側だけが\n正しいとも限りません。"}, {"t": 310.1, "x": "限らないのは、必要かどうかの\n判断が人で違うからです。"}, {"t": 314.0833333333333, "x": "違う判断を近づける方法は、それほど多くありません。"}, {"t": 318.15, "x": "多くない中の一つを、次で見ていきます。"}, {"t": 321.06666666666666, "x": "四つ目は、その線を見えるようにする方法です。"}, {"t": 324.6166666666667, "x": "方法は、言い方を柔らかくすることでしょうか。"}, {"t": 328.01666666666665, "x": "柔らかくしても、何のための話かは伝わりません。"}, {"t": 331.6333333333333, "x": "では、時間をかけて長く説明することでしょうか。"}, {"t": 335.2, "x": "長くすると、要点はかえって薄まっていきます。"}, {"t": 338.68333333333334, "x": "残る方法は、目的を先に置くという一手です。"}, {"t": 342.25, "x": "置く目的は、むずかしい言葉である\n必要はありません。"}, {"t": 345.93333333333334, "x": "この直しが誰の手間を減らすのか、で足ります。"}, {"t": 349.15, "x": "どこまで直れば終わりなのか、でも足ります。"}, {"t": 352.1, "x": "今日の作業のどこに関わるのか、でも足ります。"}, {"t": 355.26666666666665, "x": "そういう一行が先にあると、線の内側が見えます。"}, {"t": 359.2, "x": "見えた内側の話は、感情の記憶になりにくいです。"}, {"t": 363.0833333333333, "x": "なりにくいので、翌日の手元に残るのは直し方です。"}, {"t": 367.06666666666666, "x": "直し方が残れば、同じ指摘は二度目が要りません。"}, {"t": 370.6, "x": "要らなくなった分、言う回数そのものが減ります。"}, {"t": 374.06666666666666, "x": "減った回数は、言う側の負担も軽くしていきます。"}, {"t": 377.8, "x": "軽くなると、言い方を選ぶ余裕も生まれてきます。"}, {"t": 381.26666666666665, "x": "生まれた余裕は、そのまま相手にも伝わります。"}, {"t": 384.48333333333335, "x": "伝わった余裕が、次の一言の届き方を変えます。"}, {"t": 388.18333333333334, "x": "変わる届き方の話を、少し前の時代から見ます。"}, {"t": 391.85, "x": "五つ目は、昔の職場に何があったかです。"}, {"t": 395.03333333333336, "x": "あったのは、強い言い方だけではありません。"}, {"t": 398.0833333333333, "x": "仕事の後に、同じ人と長く話す時間がありました。"}, {"t": 401.9166666666667, "x": "飲み会の席で、昼の話を蒸し返す場もありました。"}, {"t": 405.7, "x": "休憩室で、先輩が横から補う機会もありました。"}, {"t": 409.56666666666666, "x": "そういう場が、昼の強さを薄める働きをしていました。"}, {"t": 413.46666666666664, "x": "薄める場がある前提で、言い方は\n強くても回りました。"}, {"t": 417.4166666666667, "x": "回っていたので、効いていたのは\n後の時間かもしれません。"}, {"t": 421.1666666666667, "x": "かもしれない部分は、当時も誰も確かめていません。"}, {"t": 424.73333333333335, "x": "確かめられないまま、強さだけが方法として残ります。"}, {"t": 428.5833333333333, "x": "残った方法が、次の世代へそのまま引き継がれます。"}, {"t": 432.3666666666667, "x": "引き継がれた頃には、後の時間の方が\n先に消えています。"}, {"t": 436.3833333333333, "x": "消えたのは、\n誰かが悪意で無くしたからではありません。"}, {"t": 439.98333333333335, "x": "働き方が変わり、集まる場そのものが減りました。"}, {"t": 443.6333333333333, "x": "減った場の代わりに、連絡は\n文字で済むようになりました。"}, {"t": 447.3833333333333, "x": "なった分だけ、昼の一言を薄める機会は\n消えています。"}, {"t": 451.3333333333333, "x": "消えた機会の穴は、数字にも記録にも出てきません。"}, {"t": 454.8333333333333, "x": "出てこないので、埋め合わせの\n必要にも気づけません。"}, {"t": 458.43333333333334, "x": "気づけないまま、強さだけが昔の形で残っています。"}, {"t": 462.3, "x": "残った強さが、今どう届くのかを次で見ます。"}, {"t": 465.81666666666666, "x": "六つ目は、いまの一日の形です。"}, {"t": 468.55, "x": "朝、席に着いて最初に開くのは画面です。"}, {"t": 472.0, "x": "画面の中で、やり取りの多くが文字になります。"}, {"t": 475.26666666666665, "x": "文字は消えないので、後から何度でも読み返せます。"}, {"t": 478.8, "x": "読み返すたびに、その時の場面がよみがえります。"}, {"t": 482.23333333333335, "x": "よみがえる回数の分だけ、同じ一言が重なります。"}, {"t": 486.1166666666667, "x": "重なった一言は、実際より多く\n言われた感じになります。"}, {"t": 490.21666666666664, "x": "感じになるだけで、\n回数が増えたわけではありません。"}, {"t": 493.85, "x": "ありませんが、受け取る側の記憶では増えています。"}, {"t": 497.43333333333334, "x": "増えた記憶は、席を立っても持ち歩くことになります。"}, {"t": 501.1333333333333, "x": "持ち歩いたまま、在宅の日は一人で読み返します。"}, {"t": 504.85, "x": "一人で読む時間には、和らげてくれる人がいません。"}, {"t": 508.43333333333334, "x": "いない状態で読むと、言葉は\n強い方へ寄って見えます。"}, {"t": 512.2333333333333, "x": "寄って見えたものは、そのまま本人の記録になります。"}, {"t": 515.8333333333334, "x": "記録になったものは、後から書き換えにくいです。"}, {"t": 519.0333333333333, "x": "にくいので、言った側の説明は届きにくくなります。"}, {"t": 522.7333333333333, "x": "届かない状態を、ここでは残り続ける一言と呼びます。"}, {"t": 526.6, "x": "呼んでおくと、文字で渡す時の注意が変わります。"}, {"t": 530.1666666666666, "x": "変わるのは、強さより回数の方に目が向くからです。"}, {"t": 533.8333333333334, "x": "向いた目で見ると、次の論点がはっきりしてきます。"}, {"t": 537.3, "x": "はっきりしてきた回数の話を、次で扱います。"}, {"t": 540.9, "x": "七つ目は、強さと回数の比べ方です。"}, {"t": 544.05, "x": "言う側が気にしているのは、たいてい強さの方です。"}, {"t": 547.5666666666667, "x": "強く言いすぎなかったか、と後から振り返ります。"}, {"t": 551.0333333333333, "x": "声が大きくなかったか、と気にする人もいます。"}, {"t": 554.3, "x": "周りに聞こえていなかったか、と考える人もいます。"}, {"t": 557.8666666666667, "x": "そういう心配は、一度の場面に向いています。"}, {"t": 561.3166666666667, "x": "一方で、受け取る側が数えているのは回数です。"}, {"t": 565.0333333333333, "x": "同じ内容を何度言われたか、が残っていきます。"}, {"t": 568.4166666666666, "x": "別の場面でも同じ扱いだったか、も残っていきます。"}, {"t": 572.2333333333333, "x": "毎朝その調子で始まるのか、も積み上がります。"}, {"t": 575.75, "x": "積み上がった回数は、強さより\n長く効くことがあります。"}, {"t": 579.6333333333333, "x": "効くのは、次を予想させる材料になるからです。"}, {"t": 583.0333333333333, "x": "予想がつくと、先に身構えて中身が入りません。"}, {"t": 586.6333333333333, "x": "入ってこないので、同じ指摘がまた必要になります。"}, {"t": 590.25, "x": "必要になった指摘が、また回数を増やしていきます。"}, {"t": 593.9166666666666, "x": "増える一方の回数を止めるのは、\n強さの調整ではありません。"}, {"t": 598.25, "x": "一度で終わる形に変える方が、近道になります。"}, {"t": 601.8666666666667, "x": "近道の入口は、相手が何を探しているかを\n知ることです。"}, {"t": 606.0833333333334, "x": "知らないまま言葉を足すと、回数だけが増えます。"}, {"t": 609.5833333333334, "x": "増やさないために、探しているものを次で見ます。"}, {"t": 612.9833333333333, "x": "八つ目は、聞いている側の頭の中です。"}, {"t": 616.2, "x": "注意を受けた直後、頭に浮かぶのは何でしょうか。"}, {"t": 619.7666666666667, "x": "まず浮かぶのは、直し方でしょうか。"}, {"t": 622.3333333333334, "x": "直し方は、その場ではまだ浮かんできません。"}, {"t": 625.4666666666667, "x": "では、反省する気持ちの方でしょうか。"}, {"t": 628.3166666666667, "x": "気持ちも、少し時間がたってからになります。"}, {"t": 631.2666666666667, "x": "最初に浮かぶのは、なぜ今それを言われたのかです。"}, {"t": 634.6666666666666, "x": "自分の何が問題だったのか、が先に来ます。"}, {"t": 637.8833333333333, "x": "嫌われたのではないか、という心配も混ざります。"}, {"t": 641.2666666666667, "x": "評価に響くのではないか、という不安も混ざります。"}, {"t": 644.8, "x": "混ざった状態のまま、話の後半を聞いています。"}, {"t": 648.4666666666667, "x": "聞いていても、中身はほとんど通り過ぎます。"}, {"t": 651.6, "x": "通り過ぎた分を、言う側は伝わったと数えます。"}, {"t": 655.15, "x": "数え違いが起きるのは、順番が逆だからです。"}, {"t": 658.5833333333334, "x": "逆というのは、理由が最後に来ているという\n意味です。"}, {"t": 662.1833333333333, "x": "意味の分からない指摘は、人格の話に聞こえます。"}, {"t": 665.7833333333333, "x": "聞こえた時点で、線は相手の中で越えられています。"}, {"t": 669.3666666666667, "x": "越えたと感じさせないためには、\n理由を先に出します。"}, {"t": 672.9666666666667, "x": "先に出す理由は、短い一行で足ります。"}, {"t": 676.2333333333333, "x": "足りる一行を持てるかどうかが、分かれ目になります。"}, {"t": 679.75, "x": "分かれ目に立つ言う側の事情を、次で開きます。"}, {"t": 683.2, "x": "九つ目は、言う側が抱えている不安です。"}, {"t": 686.55, "x": "夕方の席で、明日の面談の順番を考えています。"}, {"t": 690.6666666666666, "x": "考えているのは、伝える中身だけではありません。"}, {"t": 693.9333333333333, "x": "同じ言葉が、去年と同じに受け取られるか\nどうかです。"}, {"t": 697.5833333333334, "x": "受け取られ方が変われば、話は別の方向へ進みます。"}, {"t": 701.5666666666667, "x": "進んだ先で何が起きるかは、予想がつきません。"}, {"t": 705.05, "x": "つかない不安は、言うこと自体を重くします。"}, {"t": 708.2833333333333, "x": "重くなった分、言う場面を選ぶようになります。"}, {"t": 711.7, "x": "選んでいるうちに、伝える機会は後ろへずれます。"}, {"t": 715.0333333333333, "x": "ずれた機会は、そのまま消えることもあります。"}, {"t": 718.05, "x": "消えた回数は、どこにも記録として残りません。"}, {"t": 721.3833333333333, "x": "残らないので、線の引き方は\n個人に任されたままです。"}, {"t": 725.2, "x": "任された人は、手本を探しますが見つかりません。"}, {"t": 728.7166666666667, "x": "見つからないので、自分の経験に\n戻るしかありません。"}, {"t": 732.3833333333333, "x": "戻った経験は、時代がずれている場合があります。"}, {"t": 736.0, "x": "ずれたまま使えば、また同じ心配が繰り返されます。"}, {"t": 739.7166666666667, "x": "繰り返しを止めるのは、個人の\n努力だけではありません。"}, {"t": 743.35, "x": "必要なのは、線をどこに置くかを\n職場で決めることです。"}, {"t": 747.15, "x": "決め方の話を、次で扱っていきます。"}, {"t": 750.1666666666666, "x": "扱うのは、正解を配るという意味ではありません。"}, {"t": 753.65, "x": "十個目は、線がどこで決まるのかです。"}, {"t": 756.4333333333333, "x": "決まる場所は、一人の頭の中ではありません。"}, {"t": 759.6333333333333, "x": "同じ言葉でも、通る職場と通らない職場があります。"}, {"t": 763.4, "x": "違いを作っているのは、これまでの積み上げです。"}, {"t": 766.7333333333333, "x": "研修で何を教えてきたか、が積み上げの一つです。"}, {"t": 770.45, "x": "上の人がどう振る舞ってきたか、も一つです。"}, {"t": 773.5666666666667, "x": "問題が起きた時にどう扱ってきたか、も一つです。"}, {"t": 777.25, "x": "そういう積み重ねが、その職場の目盛りを作ります。"}, {"t": 780.9666666666667, "x": "作られた目盛りは、新しく来た人にも\n引き継がれます。"}, {"t": 784.7166666666667, "x": "引き継がれるので、個人の努力だけでは動きません。"}, {"t": 788.1333333333333, "x": "動かないものを、一人で背負うと苦しくなります。"}, {"t": 791.4, "x": "苦しくなった人は、言わない方を選びがちです。"}, {"t": 794.7333333333333, "x": "選ばれた沈黙は、部下の側には見えていません。"}, {"t": 798.15, "x": "見えないまま、直す機会が来ないことになります。"}, {"t": 801.3333333333334, "x": "来ない機会の分だけ、後で戻す作業が重くなります。"}, {"t": 805.1333333333333, "x": "重くなる前に、目盛りを言葉にしておく手があります。"}, {"t": 808.6666666666666, "x": "どこまでが業務の話か、を一度そろえておきます。"}, {"t": 812.3, "x": "どの場面で言うか、についてもそろえておきます。"}, {"t": 815.6, "x": "そろえた内容は、迷った時の支えになります。"}, {"t": 819.0166666666667, "x": "支えがあると、個人が怖さを抱え込まずに済みます。"}, {"t": 822.8166666666667, "x": "済む形を、次の一つで具体的に見ます。"}, {"t": 826.0166666666667, "x": "十一個目は、言うタイミングそのものの話です。"}, {"t": 829.4666666666667, "x": "腹が立った直後は、言葉に感情が\nいちばん濃く乗ります。"}, {"t": 833.35, "x": "濃く乗った言葉は、内容よりも\n温度の方が先に届きます。"}, {"t": 837.3833333333333, "x": "届いた温度は、後から取り消すことができません。"}, {"t": 840.75, "x": "だから、その場ではなく少し置いてから\n伝える手があります。"}, {"t": 844.5333333333333, "x": "置く時間は、長くする必要はありません。"}, {"t": 847.5333333333333, "x": "一晩でなくても、十分だけで変わることがあります。"}, {"t": 851.25, "x": "時間を置くと、最初に浮かんだ強い言い方は\n薄まります。"}, {"t": 855.1666666666666, "x": "薄まった後に残るのは、直してほしい事実の\n輪郭です。"}, {"t": 859.1833333333333, "x": "輪郭だけになった内容は、\nそのまま言葉にしやすくなります。"}, {"t": 863.2, "x": "言葉にしやすいものは、余計な一言も\n減っていきます。"}, {"t": 866.95, "x": "減った一言の分だけ、受け取る側の\n身構えも減ります。"}, {"t": 870.95, "x": "身構えが減れば、話は最後まで聞いてもらえます。"}, {"t": 874.55, "x": "聞いてもらえた内容は、翌日にも\n覚えていてもらえます。"}, {"t": 878.4166666666666, "x": "覚えている内容は、同じ注意を\n繰り返さずに済みます。"}, {"t": 882.3166666666667, "x": "繰り返さずに済むのは、遅らせた効果でもあります。"}, {"t": 885.85, "x": "効果があるのは、避けているのではなく\n整えているからです。"}, {"t": 889.5666666666667, "x": "整える時間を惜しんで、その場の\n温度で出す必要はありません。"}, {"t": 893.8666666666667, "x": "温度を抜いた後の言葉が残る形を、次でまとめます。"}, {"t": 897.7333333333333, "x": "最後に、今日の話をまとめ直します。"}, {"t": 900.7, "x": "変わったのは、人の我慢強さではありません。"}, {"t": 903.7833333333333, "x": "昔の人が強く、今の人が弱いわけでもありません。"}, {"t": 907.5666666666667, "x": "変わったのは、線が引かれている場所の方です。"}, {"t": 910.75, "x": "その場所は、少しずつ静かに動いてきました。"}, {"t": 913.9666666666667, "x": "動いた理由は、一つには数えられません。"}, {"t": 916.9666666666667, "x": "働き方が変わったことも、理由の一つです。"}, {"t": 920.2666666666667, "x": "集まる場が減ったことも、理由の一つです。"}, {"t": 923.4, "x": "言葉が文字で残るようになったことも、一つです。"}, {"t": 926.6666666666666, "x": "そういう変化が重なって、目盛りが移りました。"}, {"t": 930.0, "x": "移った目盛りは、職場ごとに引き直すことになります。"}, {"t": 933.55, "x": "引き直す作業は、上の側だけの仕事ではありません。"}, {"t": 937.4166666666666, "x": "受け取る側も、何が必要かを言葉にできます。"}, {"t": 940.85, "x": "できる人が増えるほど、線ははっきりしてきます。"}, {"t": 944.1833333333333, "x": "はっきりした線の内側では、強めの話も通ります。"}, {"t": 948.0666666666667, "x": "通る場所があると、注意は減らさずに済みます。"}, {"t": 951.3666666666667, "x": "済めば、直す機会も職場から消えません。"}, {"t": 954.4, "x": "消えないことが、両方の側を守ることになります。"}, {"t": 957.85, "x": "守られる形は、我慢の量では作れません。"}, {"t": 961.1, "x": "作れるのは、線の置き場所を言葉にした時だけです。"}, {"t": 964.6666666666666, "x": "はじめの部屋に、もう一度戻ります。"}, {"t": 967.4, "x": "火曜の午後、二人だけの部屋での五分でした。"}, {"t": 970.55, "x": "呼んだ側は、言い方をずっと選んでいました。"}, {"t": 973.6833333333333, "x": "選んでいたのは、線が見えなかったからです。"}, {"t": 976.6833333333333, "x": "見えない線の手前で止まるうちに、\n中身が薄まりました。"}, {"t": 980.4333333333333, "x": "薄まった話を受け取った側も、線を探していました。"}, {"t": 984.3, "x": "探していたのは、この話が何のためかという\n一行です。"}, {"t": 988.3166666666667, "x": "一行が無いまま終わったので、\n雰囲気だけが残りました。"}, {"t": 992.0833333333334, "x": "残った雰囲気は、その日のうちには消えません。"}, {"t": 995.4166666666666, "x": "消えない雰囲気を、二人とも相手のせいにできます。"}, {"t": 998.7833333333333, "x": "できますが、どちらの物差しも壊れてはいません。"}, {"t": 1002.0833333333334, "x": "壊れていない物差しが、別の\n目盛りで動いているだけです。"}, {"t": 1005.8833333333333, "x": "動いている状態を、ここでは\n線のずれと呼んでおきます。"}, {"t": 1009.6666666666666, "x": "呼んでおくと、同じ部屋の景色が少し変わります。"}, {"t": 1013.1333333333333, "x": "変わった景色では、相手の言い分も\n形が見えてきます。"}, {"t": 1017.0, "x": "言う側は、教わっていない線を一人で引いています。"}, {"t": 1020.5666666666667, "x": "受け取る側は、必要かどうかを\n一人で判断しています。"}, {"t": 1024.3333333333333, "x": "二人とも、手を抜いているわけではありません。"}, {"t": 1027.3166666666666, "x": "抜いていない二人が、同じ部屋で\n別の話をしています。"}, {"t": 1031.0666666666666, "x": "しているだけだと分かると、次の五分は変わります。"}, {"t": 1034.5666666666666, "x": "変わるのは、言葉の強さの方ではありません。"}, {"t": 1037.7, "x": "何のためかという一行が、先に置かれるだけです。"}, {"t": 1041.2333333333333, "x": "置かれた一行の分だけ、部屋の空気は軽くなります。"}, {"t": 1045.0333333333333, "x": "軽くなった部屋で、線はようやく二人の間に現れます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

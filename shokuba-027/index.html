<script>
const D={"name": "苦手な上司ができる心理学の理由6つ", "file": "027_苦手な上司ができる心理学の理由6つ", "dur": 1078.7, "segs": [], "subs": [{"t": 0.0, "x": "職場には、なぜか一人だけ、どうしても\n合わない上司がいることがあります。"}, {"t": 5.116666666666666, "x": "苦手な上司は、なぜ一人だけなのでしょうか。"}, {"t": 8.366666666666667, "x": "一人だけというところに、今日の\n話の入り口があります。"}, {"t": 12.1, "x": "入り口で考えたいのは、相手の\n性格の良し悪しではありません。"}, {"t": 16.433333333333334, "x": "性格だけで決まるとします。"}, {"t": 18.283333333333335, "x": "それなら誰にとっても苦手な人になるはずです。"}, {"t": 21.2, "x": "はずなのに実際は違います。"}, {"t": 23.233333333333334, "x": "同じ上司を平気だと言う同僚もいます。"}, {"t": 25.883333333333333, "x": "同僚と自分とで、見えている上司の姿が違うのです。"}, {"t": 29.85, "x": "違って見える理由は一つではありません。"}, {"t": 32.43333333333333, "x": "その一つに見る側の頭の癖があります。"}, {"t": 35.233333333333334, "x": "癖といっても、わがままや甘えとは別のものです。"}, {"t": 38.65, "x": "別だと言えるわけがあります。"}, {"t": 40.46666666666667, "x": "人の頭が持っているふつうの働きだからです。"}, {"t": 43.416666666666664, "x": "ふつうの働きです。"}, {"t": 44.81666666666667, "x": "だから誰の頭にも同じように起きます。"}, {"t": 47.35, "x": "起きていても本人は気づきません。"}, {"t": 49.5, "x": "自分の見方がまっすぐに思えます。"}, {"t": 51.85, "x": "思えるので、苦手の原因は相手の側にだけあるように\n感じます。"}, {"t": 56.25, "x": "起きる働きには、心理学でそれぞれ名前が\nついています。"}, {"t": 60.3, "x": "名前は便利です。"}, {"t": 61.65, "x": "ぼんやりした苦手さを分けて見られます。"}, {"t": 64.03333333333333, "x": "分けて見てみましょう。"}, {"t": 65.3, "x": "相手の問題と自分の見方の問題を少し切り離せます。"}, {"t": 69.03333333333333, "x": "今日のテーマは、苦手さが強まっていく理由です。"}, {"t": 72.4, "x": "心理学の言葉を六つ使って見ていきます。"}, {"t": 75.26666666666667, "x": "見ていく六つは、部下の頭の\n中だけで働くものではありません。"}, {"t": 79.53333333333333, "x": "上司の頭の中でも同じ癖が働いています。"}, {"t": 82.65, "x": "向かう先は部下です。"}, {"t": 84.1, "x": "働きに気づいても、苦手さが\nすぐに消えるとは限りません。"}, {"t": 88.16666666666667, "x": "それでも近づけるものがあります。"}, {"t": 90.23333333333333, "x": "なぜ一人だけなのか、という問いです。"}, {"t": 92.91666666666667, "x": "近づくための入り口は会議です。"}, {"t": 95.15, "x": "まず週に一度の会議の場面から始めます。"}, {"t": 97.98333333333333, "x": "一つ目の言葉は、確証バイアスです。"}, {"t": 100.83333333333333, "x": "確証バイアスは、もともと持っている\n考えに合う証拠を探す傾向です。"}, {"t": 105.68333333333334, "x": "証拠をそう読んでしまう傾向も含みます。"}, {"t": 108.46666666666667, "x": "探すのも読むのも、\n本人は公平にやっているつもりです。"}, {"t": 112.4, "x": "ところが実際は違います。"}, {"t": 114.28333333333333, "x": "考えに合う証拠だけが手元に集まっていきます。"}, {"t": 117.43333333333334, "x": "集まった証拠はどれも本物です。"}, {"t": 119.73333333333333, "x": "だから疑う理由がありません。"}, {"t": 121.76666666666667, "x": "理由がないまま、外れた証拠のほうは\n目に入らなくなります。"}, {"t": 125.83333333333333, "x": "入らなくなった分は、最初から無かったものとして\n扱われます。"}, {"t": 130.11666666666667, "x": "集まり方を、週に一度の会議で見てみます。"}, {"t": 133.36666666666667, "x": "会議で、上司が資料の一か所を\nきつめに指摘したとします。"}, {"t": 137.5, "x": "指摘された部下は傷つきます。"}, {"t": 139.5, "x": "その日から上司を少し苦手に感じます。"}, {"t": 142.18333333333334, "x": "感じた後の会議では、上司の\n言葉の聞こえ方が変わります。"}, {"t": 146.28333333333333, "x": "変わった耳には、厳しい一言ばかりが\n残りやすくなります。"}, {"t": 150.33333333333334, "x": "残らないのは、同じ会議で上司が\n褒めた別の一言です。"}, {"t": 154.31666666666666, "x": "褒め言葉も耳には入ります。"}, {"t": 156.31666666666666, "x": "でも覚えておく理由がありません。"}, {"t": 158.53333333333333, "x": "理由のない記憶は、\n数日で薄れていくことがあります。"}, {"t": 162.33333333333334, "x": "薄れた分だけ考えが強まります。"}, {"t": 164.7, "x": "やっぱり合わない、という考えです。"}, {"t": 167.38333333333333, "x": "強まった考えが、次の会議の\n聞き方をまた決めていきます。"}, {"t": 171.6, "x": "決まった聞き方のまま一ヶ月たちます。"}, {"t": 174.03333333333333, "x": "証拠はかなりの量になります。"}, {"t": 176.0, "x": "量が増えるほど、自分の見方は\n正しいと感じやすくなります。"}, {"t": 180.16666666666666, "x": "感じている正しさは、集め方が\n偏った結果かもしれません。"}, {"t": 184.38333333333333, "x": "かもしれないという余地は、\n上司の側にも同じだけあります。"}, {"t": 188.36666666666667, "x": "上司の側を見てみます。"}, {"t": 190.05, "x": "部下が最初に出した大きなミスを、\n上司が覚えているとします。"}, {"t": 194.13333333333333, "x": "覚えている上司には、その後の\n小さな遅れが目につきます。"}, {"t": 198.11666666666667, "x": "目につく遅れは証拠になります。"}, {"t": 200.2, "x": "やはり詰めが甘い、という証拠です。"}, {"t": 202.91666666666666, "x": "証拠にならないのは、期限より\n早く出た報告のほうです。"}, {"t": 206.88333333333333, "x": "早く出た報告は当たり前の出来事です。"}, {"t": 209.61666666666667, "x": "そのまま流れていきます。"}, {"t": 211.3, "x": "流れた出来事は、上司の頭の\n中の部下の姿を変えません。"}, {"t": 215.58333333333334, "x": "姿は変わらないままです。"}, {"t": 217.46666666666667, "x": "上司は部下への確認を増やします。"}, {"t": 219.88333333333333, "x": "増えた確認を受けた部下は、\n信用されていないと感じます。"}, {"t": 223.93333333333334, "x": "感じた部下は身を固くします。"}, {"t": 225.96666666666667, "x": "すると、また小さな遅れが出やすくなります。"}, {"t": 229.21666666666667, "x": "出た遅れを、上司はまた証拠の箱に入れていきます。"}, {"t": 232.9, "x": "二人とも、自分の箱には正しいものだけが\n入っているつもりです。"}, {"t": 237.23333333333332, "x": "つもりの箱が二つあります。"}, {"t": 239.08333333333334, "x": "だから話は平行線になりやすいのです。"}, {"t": 241.88333333333333, "x": "平行線のまま、会議の時間だけが\n毎週くり返されていきます。"}, {"t": 246.45, "x": "二つ目の言葉は、ホーン効果です。"}, {"t": 249.1, "x": "先に、よく知られたハロー効果から説明します。"}, {"t": 252.63333333333333, "x": "ハロー効果は、人を一つの全体の\n印象で見てしまう誤りです。"}, {"t": 257.06666666666666, "x": "特徴を一つずつ分けて評価できなくなります。"}, {"t": 259.9166666666667, "x": "百年ほど前の報告です。"}, {"t": 261.9, "x": "評価をつける人が起こす誤りとして示されました。"}, {"t": 265.1666666666667, "x": "よい印象が全体に広がっていくのが、ハロー効果です。"}, {"t": 269.0, "x": "その逆向きもあります。"}, {"t": 270.6166666666667, "x": "悪い印象が全体に広がるもので、\nホーン効果と呼ぶことがあります。"}, {"t": 275.2, "x": "ハローは後光のことです。"}, {"t": 276.8666666666667, "x": "ホーンは、つのを指す呼び名です。"}, {"t": 279.3333333333333, "x": "呼び名は違っても、頭の中で\n起きていることは同じです。"}, {"t": 283.2, "x": "どちらも、一つの特徴がほかの\n特徴の見え方まで決めてしまいます。"}, {"t": 287.75, "x": "決められた見え方は動きません。"}, {"t": 289.78333333333336, "x": "別々に見るはずの点が一つの色にまとまります。"}, {"t": 292.9, "x": "まとまった色は、評価する本人には\n自然な結論に見えます。"}, {"t": 297.21666666666664, "x": "同じことが、席での立ち話で起きる場面を見てみます。"}, {"t": 301.01666666666665, "x": "上司が、席の横を通るたびに\n早口で用件だけ言うとします。"}, {"t": 305.48333333333335, "x": "早口の用件は、部下には冷たい言い方に聞こえます。"}, {"t": 309.3666666666667, "x": "聞こえた冷たさは、言い方だけの話で終わりません。"}, {"t": 313.0, "x": "冷たさは広がります。"}, {"t": 314.6166666666667, "x": "仕事の判断まで冷たいものに見えてきます。"}, {"t": 317.4166666666667, "x": "見えてくると止まりません。"}, {"t": 318.95, "x": "仕事の振り方も評価のつけ方も、\n同じ色に染まります。"}, {"t": 322.95, "x": "染まった後は、上司の筋の通った\n判断まで疑わしく思えます。"}, {"t": 327.65, "x": "欠点が一つだけでも同じです。"}, {"t": 329.75, "x": "そう思えてしまいます。"}, {"t": 331.35, "x": "一つの欠点が、その人の全部の\n説明になってしまうのです。"}, {"t": 335.65, "x": "説明が一本になります。"}, {"t": 337.5, "x": "すると苦手さは上司という人全体に向かいます。"}, {"t": 340.68333333333334, "x": "向かった苦手さは残りやすくなります。"}, {"t": 343.0833333333333, "x": "言い方を直してもらっても残ります。"}, {"t": 345.3333333333333, "x": "残るのは、欠点の置き場所が\n言い方から人柄へ移っているからです。"}, {"t": 349.96666666666664, "x": "移り方は、上司の側から部下を見る時も\n変わりません。"}, {"t": 353.85, "x": "上司が、部下のあいさつの声の\n小ささを気にしているとします。"}, {"t": 358.0, "x": "気にしている上司には、その部下が\n全体に消極的に見えます。"}, {"t": 362.28333333333336, "x": "消極的に見えると困ります。"}, {"t": 364.3833333333333, "x": "大きな仕事を振りにくくなります。"}, {"t": 366.56666666666666, "x": "振られない部下は、力を見せる機会を持てません。"}, {"t": 369.93333333333334, "x": "持てない機会のぶん、上司の\n最初の印象はそのまま残ります。"}, {"t": 374.25, "x": "残った印象の始まりは小さなものです。"}, {"t": 377.01666666666665, "x": "あいさつ一つから始まっています。"}, {"t": 379.1666666666667, "x": "始まりが小さいほど、本人たちは\n広がりに気づきにくいものです。"}, {"t": 383.5833333333333, "x": "気づかないうちに考えが変わります。"}, {"t": 385.85, "x": "二人とも相手の一部分を全部だと思っています。"}, {"t": 389.01666666666665, "x": "三つ目の言葉は、根本的な帰属の誤りです。"}, {"t": 392.55, "x": "帰属とは、出来事の原因をどこに置くかという\n考え方です。"}, {"t": 396.6666666666667, "x": "人は他人の行動を見る時、状況の力を軽く見ます。"}, {"t": 400.8, "x": "そして性格の力を重く見すぎる\n傾向があると言われます。"}, {"t": 404.6166666666667, "x": "この傾向を、心理学では根本的な\n帰属の誤りと呼んでいます。"}, {"t": 409.35, "x": "さらに、自分の行動は状況のせいに\n見えやすいと言われます。"}, {"t": 413.7, "x": "他人の行動は性格のせいに見えやすいのです。"}, {"t": 416.76666666666665, "x": "見え方の差を、一対一で話す\n面談室の場面で見てみます。"}, {"t": 421.1, "x": "月に一度、上司と部下が個室で\n二人だけで話す時間があるとします。"}, {"t": 425.76666666666665, "x": "その時間に、上司がじゅっぷんほど\n遅れて入ってきました。"}, {"t": 429.5833333333333, "x": "部下は遅れた上司を待っています。"}, {"t": 431.78333333333336, "x": "待ちながら、時間を守らない人だと考えます。"}, {"t": 435.1166666666667, "x": "考えた理由は、上司の性格のほうに置かれています。"}, {"t": 438.98333333333335, "x": "置かれていないものもあります。"}, {"t": 440.73333333333335, "x": "直前の打ち合わせが長引いたという事情です。"}, {"t": 443.71666666666664, "x": "事情は部下の席からは見えません。"}, {"t": 446.01666666666665, "x": "だから計算に入りません。"}, {"t": 447.8333333333333, "x": "入らない分だけ、上司の性格の\n印象が濃くなっていきます。"}, {"t": 452.0833333333333, "x": "印象は濃くなったままです。"}, {"t": 453.98333333333335, "x": "その日の話の中身も素直に聞きにくくなります。"}, {"t": 457.06666666666666, "x": "聞きにくいのは、内容より先に\n人を判定しているからです。"}, {"t": 461.0833333333333, "x": "判定は、自分が遅れた時には同じ形で働きません。"}, {"t": 465.25, "x": "別の日に部下が遅れたとします。"}, {"t": 467.3666666666667, "x": "部下の頭には電車の遅れが浮かびます。"}, {"t": 469.93333333333334, "x": "浮かぶのは、自分の事情なら\n全部見えているからです。"}, {"t": 473.53333333333336, "x": "見えている自分の事情と、見えない\n相手の事情が比べられています。"}, {"t": 477.98333333333335, "x": "比べ方が偏っています。"}, {"t": 479.8, "x": "だから相手だけがだらしなく見えるのです。"}, {"t": 482.21666666666664, "x": "見え方は、上司の側でもそのまま裏返しになります。"}, {"t": 485.96666666666664, "x": "上司は部下の報告の抜けに気づきます。"}, {"t": 488.5, "x": "それを注意力の足りない性格と読みがちです。"}, {"t": 491.45, "x": "読む時に入っていないのは、\nその日の部下の仕事の量です。"}, {"t": 495.3333333333333, "x": "量は上司の机からは見えにくいものです。"}, {"t": 498.1666666666667, "x": "だから性格の話が先に立ちます。"}, {"t": 500.56666666666666, "x": "上司自身も報告を抜かすことがあります。"}, {"t": 503.35, "x": "その時は、忙しかったからと考えます。"}, {"t": 506.48333333333335, "x": "考え方の物差しが、相手と自分と\nで別々になっているのです。"}, {"t": 510.8833333333333, "x": "別々の物差しで測ってみます。"}, {"t": 513.05, "x": "苦手な相手の欠点ばかりが固まって見えます。"}, {"t": 516.05, "x": "固まって見えた欠点は、もう変わらないものとして\n扱われます。"}, {"t": 520.2666666666667, "x": "扱われた相手が事情を話したとします。"}, {"t": 522.95, "x": "それは言い訳だと受け取られやすくなります。"}, {"t": 525.55, "x": "受け取られた相手は、やがて事情を\n話すこと自体をやめていきます。"}, {"t": 529.8666666666667, "x": "やめた分だけ、見えない事情は\nさらに見えなくなります。"}, {"t": 533.65, "x": "見えなくなった事情の上に、\n性格の話がまた一つ積み上がります。"}, {"t": 538.2833333333333, "x": "積み上がった性格の話が、苦手な\n上司の輪郭になっていくのです。"}, {"t": 542.8333333333334, "x": "四つ目の言葉は、単純接触効果です。"}, {"t": 546.0833333333334, "x": "単純接触効果は、くり返し目にするだけで\n起きる現象です。"}, {"t": 550.5666666666667, "x": "その相手や物への好ましさが高まります。"}, {"t": 553.3666666666667, "x": "半世紀以上前に、実験をまとめた\n研究として発表されました。"}, {"t": 558.0666666666667, "x": "話をしなくても、見かける回数\nそのものが効くと言われます。"}, {"t": 562.1333333333333, "x": "確かめられたのは人だけではありません。"}, {"t": 564.55, "x": "言葉や形でも確かめられてきました。"}, {"t": 566.9166666666666, "x": "確かめられた中身は、なじみのあるものほど\n好ましく感じやすいという話です。"}, {"t": 571.9666666666667, "x": "効き方を逆から見てみます。"}, {"t": 573.8333333333334, "x": "苦手さが強まる理由が見えてきます。"}, {"t": 576.3, "x": "苦手な上司がいると、人は自然と\n距離を取ろうとします。"}, {"t": 580.2, "x": "距離の取り方を、ふだんの席の行き来で見てみます。"}, {"t": 583.6, "x": "給湯室へ行くとします。"}, {"t": 585.3666666666667, "x": "上司の席の前を通らないよう遠回りします。"}, {"t": 588.4333333333333, "x": "遠回りが続くと、上司の姿を目にする回数が減ります。"}, {"t": 592.6833333333333, "x": "減った回数の分、好ましさが\n育つ機会も減ると考えられます。"}, {"t": 597.15, "x": "機会は減っていきます。"}, {"t": 598.7, "x": "たまに顔を合わせるのは叱られる時だけになります。"}, {"t": 601.7333333333333, "x": "叱られる時だけ会う相手は、\nますます苦手に感じやすくなります。"}, {"t": 606.0833333333334, "x": "感じやすくなると、もっと避けたくなります。"}, {"t": 609.0666666666667, "x": "そういう流れができます。"}, {"t": 610.7666666666667, "x": "流れの中では、上司のふだんの\n姿を知る機会がありません。"}, {"t": 614.9166666666666, "x": "ふだんの姿には、冗談を言う顔も、\n困っている顔も含まれます。"}, {"t": 619.85, "x": "その顔を知らないままです。"}, {"t": 621.7, "x": "上司の像は一つの表情で止まります。"}, {"t": 624.35, "x": "止まった像は、実物より硬く、\n冷たいものになりやすいのです。"}, {"t": 628.9333333333333, "x": "硬い像が残るのは、上司の側から見た\n部下でも同じです。"}, {"t": 632.9166666666666, "x": "上司は、自分を避けている部下を\n見かける回数が減ります。"}, {"t": 636.9833333333333, "x": "減った回数の中で、上司が目にするのは\n報告の時の顔だけです。"}, {"t": 641.6833333333333, "x": "報告の時の顔は、緊張でこわばっていることが\n多いものです。"}, {"t": 645.9333333333333, "x": "上司はこわばった顔だけを見ています。"}, {"t": 648.4166666666666, "x": "すると部下を不機嫌だと思いやすくなります。"}, {"t": 651.15, "x": "思われた部下は、声をかけられる\n回数がさらに減っていきます。"}, {"t": 655.25, "x": "減った回数は、二人のどちらかが\n決めたものではありません。"}, {"t": 659.1333333333333, "x": "決めていないのに形はできます。"}, {"t": 661.15, "x": "避け合う形が少しずつできあがります。"}, {"t": 663.75, "x": "できあがった距離の中で、苦手さだけが\n育っていくのです。"}, {"t": 667.5333333333333, "x": "ただし、回数を増やせば必ず好きになる、という\n話ではありません。"}, {"t": 672.7833333333333, "x": "それでも確かなことがあります。"}, {"t": 674.7166666666667, "x": "避けた分だけ相手を知る材料が減ることです。"}, {"t": 677.7, "x": "確かな材料が減るほど、相手の\n像は想像で埋められやすくなります。"}, {"t": 682.3, "x": "五つ目の言葉は、返報性です。"}, {"t": 684.9666666666667, "x": "返報性は、受けた好意や助けを、\n相手に返そうとする傾向を指します。"}, {"t": 690.5166666666667, "x": "とくに名前のついた傾向があります。"}, {"t": 692.85, "x": "好意を示してくれる相手を好きになりやすい\n傾向で、好意の返報性と呼ばれます。"}, {"t": 698.3833333333333, "x": "あいさつや相づちも小さな好意のしるしです。"}, {"t": 701.3, "x": "目を合わせることも同じです。"}, {"t": 703.1833333333333, "x": "しるしを受け取ると、人は同じくらいの\nしるしを返しやすくなります。"}, {"t": 707.6166666666667, "x": "返しやすさは、しるしが減った\n時にも働くと考えられます。"}, {"t": 711.8166666666667, "x": "考えられる流れを、朝の会議の始まりで見てみます。"}, {"t": 715.6, "x": "苦手な上司が会議室に入ってきます。"}, {"t": 718.2333333333333, "x": "部下は資料に目を落とします。"}, {"t": 720.1666666666666, "x": "目を落とすのは、身構えている体の自然な動きです。"}, {"t": 723.8833333333333, "x": "動きそのものに、上司を拒むつもりはありません。"}, {"t": 727.2166666666667, "x": "でも上司から見ると違います。"}, {"t": 729.1833333333333, "x": "目をそらされた形になります。"}, {"t": 731.1166666666667, "x": "そらされた上司は、部下への\nあいさつを短く切り上げます。"}, {"t": 735.0833333333334, "x": "部下は短いあいさつを受け取ります。"}, {"t": 737.4, "x": "やっぱり冷たい人だと感じます。"}, {"t": 739.6, "x": "感じた部下は、次の会議でもっと深く身構えます。"}, {"t": 743.25, "x": "身構えが深くなるほど、上司に\n届く好意のしるしは減ります。"}, {"t": 747.3833333333333, "x": "減ったしるしに合わせて、上司から\n返るしるしも減っていきます。"}, {"t": 751.5166666666667, "x": "いくら待っても変わりません。"}, {"t": 753.1666666666666, "x": "相手の側から先に温度が上がることは少ないのです。"}, {"t": 756.55, "x": "少ないのは、上司の側も同じ仕組みで\n動いているからです。"}, {"t": 760.5666666666667, "x": "上司が、苦手な部下の発言の\n時だけ腕を組んで聞くとします。"}, {"t": 764.8833333333333, "x": "腕を組んだ姿は、部下には反対のしるしに見えます。"}, {"t": 768.6, "x": "見えた部下は、その上司の前では発言を短くします。"}, {"t": 772.5166666666667, "x": "部下からは短い発言しか出ません。"}, {"t": 774.9666666666667, "x": "上司はそれを意欲が低いと受け取ります。"}, {"t": 777.6, "x": "受け取った上司は、さらに腕を\n組んだまま聞くようになります。"}, {"t": 781.5333333333333, "x": "こうして、二人の身構えが互いに\n返し合われていきます。"}, {"t": 785.3166666666667, "x": "かえしあっているのは態度です。"}, {"t": 787.1833333333333, "x": "二人とも言葉にしていません。"}, {"t": 789.05, "x": "言葉にしていない分、どちらが始めたのかは\n分かりません。"}, {"t": 793.0166666666667, "x": "分からないままです。"}, {"t": 794.3666666666667, "x": "苦手さは二人の間で少しずつ大きくなります。"}, {"t": 797.55, "x": "大きくなった苦手さは、最初の\n小さな身構えから始まっています。"}, {"t": 802.0, "x": "始まりは小さいものです。"}, {"t": 803.8, "x": "だから二人とも自分が渡したものには気づきません。"}, {"t": 806.9, "x": "気づくのは、相手から返ってきた\n冷たさのほうだけです。"}, {"t": 810.5666666666667, "x": "六つ目の言葉は、投影です。"}, {"t": 813.0333333333333, "x": "投影は、心の動きの一つです。"}, {"t": 815.7, "x": "自分の中にある認めにくい気持ちや特徴を、\n相手の側にあるものとして感じます。"}, {"t": 821.05, "x": "もとは精神分析の考え方です。"}, {"t": 823.7166666666667, "x": "心を守る仕組みの一つとして語られてきました。"}, {"t": 826.6666666666666, "x": "ただ、昔の説明どおりの形には、\n研究で十分な裏づけがないとも言われます。"}, {"t": 832.5666666666667, "x": "新しい説明もあります。"}, {"t": 834.4166666666666, "x": "自分の アスです。"}, {"t": 958.1833333333333, "x": "部下の側では、会議で残る厳しい一言として\n働きます。"}, {"t": 962.4333333333333, "x": "上司の側では、早く出た報告が\n記憶に残らない形で働きます。"}, {"t": 967.2833333333333, "x": "次にホーン効果です。"}, {"t": 968.8666666666667, "x": "部下の側では、早口の用件が\n人柄にまで広がる形です。"}, {"t": 973.25, "x": "上司の側では、小さなあいさつの\n声が部下全体の印象になる形です。"}, {"t": 978.3333333333334, "x": "三つ目は根本的な帰属の誤りです。"}, {"t": 981.05, "x": "部下の側では、遅れてきた上司を性格で読む形です。"}, {"t": 985.0666666666667, "x": "上司の側では、報告の抜けを\n注意力の足りなさで読む形です。"}, {"t": 989.5833333333334, "x": "四つ目は単純接触効果です。"}, {"t": 991.9666666666667, "x": "部下の側では、給湯室への遠回りとして現れます。"}, {"t": 996.0166666666667, "x": "上司の側では、緊張した顔しか見ない\n日々として現れます。"}, {"t": 1000.2333333333333, "x": "五つ目は返報性です。"}, {"t": 1002.05, "x": "部下の側では、会議室で資料に目を落とす動きです。"}, {"t": 1005.95, "x": "上司の側では、発言の時だけ腕を組んで聞く姿です。"}, {"t": 1010.0166666666667, "x": "最後は投影です。"}, {"t": 1011.5666666666667, "x": "部下の側では、長い説明だけが\n耳につく感じかたです。"}, {"t": 1015.5166666666667, "x": "上司の側では、手際の悪さにばかり\n目が行く感じかたです。"}, {"t": 1019.6666666666666, "x": "並べ直すと、六つの言葉はどれも\n両方の椅子で働いています。"}, {"t": 1024.05, "x": "働いているのは、相手を見ている側の頭の中です。"}, {"t": 1027.8166666666666, "x": "頭の中の働きです。"}, {"t": 1029.5166666666667, "x": "だから相手が同じでも見え方が変わります。"}, {"t": 1032.2166666666667, "x": "同僚が同じ上司を平気だと言えるのも、\nそのためです。"}, {"t": 1036.0, "x": "そのために、苦手な上司が一人だけということが\n起こります。"}, {"t": 1040.0, "x": "起こる理由が分かっても、苦手な\n人がいなくなるわけではありません。"}, {"t": 1044.2166666666667, "x": "それでも、できることがあります。"}, {"t": 1046.5666666666666, "x": "苦手さの中身を六つに分けて見ることです。"}, {"t": 1049.3166666666666, "x": "一人だけ浮かぶ顔はありますか。"}, {"t": 1051.4166666666667, "x": "あったら、六つのうちどれが\n強く働いているでしょうか。"}, {"t": 1055.1666666666667, "x": "どれが働いていても、相手の\n性格が急に変わったわけではありません。"}, {"t": 1059.7666666666667, "x": "変わったのは、こちらが集めた証拠と、\n相手につけた印象のほうです。"}, {"t": 1064.7, "x": "印象に名前がつくと、苦手さは\n名前のないころより少し小さく見えます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

<script>
const D={"name": "年上の部下に悩む上司から届いた5つの相談", "file": "024_年上の部下に悩む上司から届いた5つの相談", "dur": 966.45, "segs": [], "subs": [{"t": 0.0, "x": "年上の部下に、どんな言葉で\n指示を出せばいいか分かりません。"}, {"t": 4.116666666666666, "x": "今の部署に移って半年ほどがたちました。"}, {"t": 6.916666666666667, "x": "課の中に、自分より十歳以上年上の人が一人います。"}, {"t": 11.2, "x": "前の課長の頃から現場を支えてきた人です。"}, {"t": 14.25, "x": "仕事を頼むたびに、つい敬語が丁寧になりすぎます。"}, {"t": 18.05, "x": "丁寧に言うほど、お願いの形になっていきます。"}, {"t": 21.45, "x": "自分でもそれが分かります。"}, {"t": 23.266666666666666, "x": "お願いの形だと、断られても\n仕方がないように聞こえます。"}, {"t": 27.333333333333332, "x": "聞こえ方を変えたいのです。"}, {"t": 29.066666666666666, "x": "けれど変え方が分からず迷っています。"}, {"t": 31.5, "x": "ここまでが一通目の相談です。"}, {"t": 33.666666666666664, "x": "今日はこうした相談を五つ取り上げます。"}, {"t": 36.21666666666667, "x": "一つずつ考えていきます。"}, {"t": 38.06666666666667, "x": "相談は一通ずつ読み上げてから考えます。"}, {"t": 41.016666666666666, "x": "取り上げる相談は架空のものです。"}, {"t": 43.28333333333333, "x": "よくある悩みをもとに作りました。"}, {"t": 45.45, "x": "五通とも、年上の部下を持つ上司から届いています。"}, {"t": 49.36666666666667, "x": "中身は敬語と指示から始まります。"}, {"t": 51.71666666666667, "x": "そして面談と教育係まで続きます。"}, {"t": 54.45, "x": "どの相談にも二つの順番が重なっています。"}, {"t": 57.45, "x": "一つは年の順です。"}, {"t": 59.11666666666667, "x": "もう一つは役の順です。"}, {"t": 60.95, "x": "ふだんの職場では、この二つは\nたいてい同じ向きに並んでいます。"}, {"t": 65.23333333333333, "x": "並びが逆になると困ります。"}, {"t": 67.2, "x": "言葉の強さが急に決めにくくなるのです。"}, {"t": 69.88333333333334, "x": "決めにくさを抱えるのは上司の側だけとは限りません。"}, {"t": 73.33333333333333, "x": "部下の側も、役の順は受け入れています。"}, {"t": 76.36666666666666, "x": "それでも経験まで消されたくないと感じやすいです。"}, {"t": 79.56666666666666, "x": "その気持ちは、二人とも口に出しにくいものです。"}, {"t": 82.85, "x": "今日は正解を一つに決めることはしません。"}, {"t": 85.58333333333333, "x": "ありそうな答えを二つ外します。"}, {"t": 87.81666666666666, "x": "そのうえで三つ目の考え方を探します。"}, {"t": 90.63333333333334, "x": "探すのは伝え方と順番だけです。"}, {"t": 93.1, "x": "評価の仕組みの正しさには触れません。"}, {"t": 95.53333333333333, "x": "一通目の相談に戻ります。"}, {"t": 97.51666666666667, "x": "読み返すと、悩みの芯は敬語\nそのものにはなさそうです。"}, {"t": 101.7, "x": "芯にあるのは指示の重さです。"}, {"t": 103.83333333333333, "x": "丁寧に言うと、その重さが抜けてしまうのです。"}, {"t": 107.16666666666667, "x": "では敬語をやめれば解決するのでしょうか。"}, {"t": 109.86666666666666, "x": "やめると言葉は短くなります。"}, {"t": 111.91666666666667, "x": "指示らしくは聞こえます。"}, {"t": 113.61666666666666, "x": "ただ、急に口調が変わると相手は驚きます。"}, {"t": 116.98333333333333, "x": "扱いが変わったと受け取られやすいです。"}, {"t": 119.48333333333333, "x": "受け取った側には、役の順を\n見せつけられたような感覚が残ることがあります。"}, {"t": 124.53333333333333, "x": "残った感覚はその後のやり取りにも長く響きます。"}, {"t": 127.86666666666666, "x": "敬語をやめるのは近道に見えます。"}, {"t": 130.23333333333332, "x": "でも実際は遠回りです。"}, {"t": 132.16666666666666, "x": "では、言い方を強くするのはどうでしょうか。"}, {"t": 135.36666666666667, "x": "敬語のまま、語尾だけを固くするやり方です。"}, {"t": 138.65, "x": "固い語尾は怒っているように聞こえる場合があります。"}, {"t": 141.81666666666666, "x": "とくに一対一の場面では響きます。"}, {"t": 144.31666666666666, "x": "語尾の固さが、そのまま表情のように届くのです。"}, {"t": 147.85, "x": "聞いた側は身構えます。"}, {"t": 149.53333333333333, "x": "何か不満があるのかと考えてしまうのです。"}, {"t": 152.38333333333333, "x": "身構えた相手には、中身より口調が先に届きます。"}, {"t": 156.0, "x": "届く順番が逆です。"}, {"t": 157.66666666666666, "x": "これも答えにはなりにくいです。"}, {"t": 159.6, "x": "では三つ目は何でしょうか。"}, {"t": 161.48333333333332, "x": "三つ目は、丁寧さと決定を別々の場所に置くことです。"}, {"t": 165.61666666666667, "x": "置き場所を分けると、敬語は\nそのままで構わなくなります。"}, {"t": 169.45, "x": "決まっていることを先に言うからです。"}, {"t": 171.68333333333334, "x": "たとえば、この資料は金曜までに\nまとめることになりました、と始めます。"}, {"t": 176.68333333333334, "x": "始め方が決定の形なら大丈夫です。"}, {"t": 179.45, "x": "後ろにお願いしますを付けても、\n頼みごとには戻りません。"}, {"t": 183.38333333333333, "x": "戻らないのは選べる部分と選べない\n部分が分かれているからです。"}, {"t": 187.31666666666666, "x": "分かれていないと困ります。"}, {"t": 188.98333333333332, "x": "丁寧な言葉が全部、選べる話に\n聞こえてしまうのです。"}, {"t": 193.15, "x": "つまり問題は言葉の強さではなさそうです。"}, {"t": 196.06666666666666, "x": "選べる範囲の見え方にあります。"}, {"t": 198.2, "x": "見え方を整えるには、選べる部分も\nはっきり渡すのが効きやすいです。"}, {"t": 202.93333333333334, "x": "進め方はお任せします、と言葉にします。"}, {"t": 206.35, "x": "やり方の側を相手に預けるのです。"}, {"t": 208.7, "x": "預けられた側は、経験を使う場所が\n残っていると感じやすくなります。"}, {"t": 213.51666666666668, "x": "そうなれば、決定の部分も受け入れやすくなります。"}, {"t": 217.1, "x": "年の順を軽く扱われたと受け取らずに済むからです。"}, {"t": 220.46666666666667, "x": "受け取り方は上司と部下で少しずれています。"}, {"t": 223.26666666666668, "x": "上司は丁寧に言えば相手を立てられると\n考えやすいです。"}, {"t": 226.98333333333332, "x": "部下は丁寧かどうかを見ていません。"}, {"t": 229.25, "x": "見ているのは、自分の判断が残されているかです。"}, {"t": 232.7, "x": "見ているものが違います。"}, {"t": 234.3, "x": "だから丁寧さを足すほど、すれ違うことがあります。"}, {"t": 237.81666666666666, "x": "すれ違いを止めるのは言葉の\n柔らかさではないのかもしれません。"}, {"t": 241.63333333333333, "x": "止めるのは線のほうです。"}, {"t": 243.3, "x": "何が決まっていて、どこから\n先を任せるのかという線です。"}, {"t": 247.33333333333334, "x": "線がはっきりすれば、敬語は\n相手を立てる役目に戻ります。"}, {"t": 251.45, "x": "戻った敬語は年の順への礼として働き続けます。"}, {"t": 255.01666666666668, "x": "この分け方を、ここでは丁寧さと\n決定の二段と呼んでおきます。"}, {"t": 259.3333333333333, "x": "二通目は仕事の進め方をめぐる相談です。"}, {"t": 262.3666666666667, "x": "相談の中身はこうです。"}, {"t": 264.18333333333334, "x": "新しい手順を決めて伝えました。"}, {"t": 266.43333333333334, "x": "なのに年上の部下だけが、\n前のやり方を続けています。"}, {"t": 270.3833333333333, "x": "前のやり方は、先代の担当の頃から\n使われてきたものです。"}, {"t": 274.71666666666664, "x": "注意すると角が立ちそうです。"}, {"t": 276.75, "x": "それで何度も言い出せずにいます。"}, {"t": 278.81666666666666, "x": "ここまでが二通目の相談です。"}, {"t": 280.93333333333334, "x": "では、年上だから意地を張っているのでしょうか。"}, {"t": 284.26666666666665, "x": "そう見える場面はたしかにあります。"}, {"t": 286.51666666666665, "x": "けれど、意地だけで同じやり方を続ける\n人は多くないと言われます。"}, {"t": 291.1, "x": "続けるほうにも手間がかかるからです。"}, {"t": 293.3666666666667, "x": "手間をかけてまで続けるのです。"}, {"t": 295.25, "x": "別の理由があると考えたほうが自然です。"}, {"t": 298.1333333333333, "x": "では新しい手順の\n意味が伝わっていないのでしょうか。"}, {"t": 301.4, "x": "それなら、説明を足せば変わるはずです。"}, {"t": 304.4, "x": "でも、説明を何度足しても変わらないことがあります。"}, {"t": 308.03333333333336, "x": "変わらないなら理解の問題でもなさそうです。"}, {"t": 310.78333333333336, "x": "三つ目の見方があります。"}, {"t": 312.5, "x": "前のやり方が何かを守っている、というものです。"}, {"t": 316.1, "x": "守っているのは、たいてい紙に\n書かれていない経験です。"}, {"t": 319.85, "x": "たとえば月末に一度だけ起きる取り違えです。"}, {"t": 322.8, "x": "前のやり方なら、それを防げていたのです。"}, {"t": 325.9, "x": "その理由を、本人も\nうまく言葉にできていないことがあります。"}, {"t": 329.93333333333334, "x": "そこへ新しい手順が渡されます。"}, {"t": 332.31666666666666, "x": "本人には穴が見えて、不安になります。"}, {"t": 335.25, "x": "不安を説明すれば、年下の上司への\n反論に聞こえます。"}, {"t": 339.56666666666666, "x": "反論を避けるなら、\n黙って前のやり方を続けるしかありません。"}, {"t": 343.9, "x": "その結果が、変えてくれないという\n見え方なのかもしれません。"}, {"t": 347.9, "x": "裏側を確かめる近道があります。"}, {"t": 350.28333333333336, "x": "何を守っているかを聞くことです。"}, {"t": 352.46666666666664, "x": "前のやり方で一番助かっていた\n所はどこですか、と聞きます。"}, {"t": 356.8333333333333, "x": "この問いは、相手の経験を先に\n認める形になっています。"}, {"t": 360.98333333333335, "x": "認められた側は守りたかったものを\n話しやすくなります。"}, {"t": 364.4, "x": "話してもらった中身を新しい手順に\n足せるか考えます。"}, {"t": 368.0, "x": "足せない場合もあります。"}, {"t": 369.6166666666667, "x": "それでも、聞いたうえで決めたことは伝わります。"}, {"t": 372.8833333333333, "x": "ここでも上司と部下は、受け止める場所が\nずれています。"}, {"t": 376.43333333333334, "x": "上司は決めた手順が守られるかを気にしやすいです。"}, {"t": 379.6666666666667, "x": "部下は自分の経験が手順のどこかに\n残るかを気にしています。"}, {"t": 383.48333333333335, "x": "気にする場所が違います。"}, {"t": 385.1333333333333, "x": "だから決定だけ渡すと、経験を\n捨てろと聞こえやすいのです。"}, {"t": 389.3, "x": "聞こえ方を変えるのは言い方ではありません。"}, {"t": 391.95, "x": "決めるまでの段取りのほうです。"}, {"t": 393.8333333333333, "x": "先に聞いてから決めます。"}, {"t": 395.53333333333336, "x": "すると同じ決定でも重さが変わります。"}, {"t": 398.2, "x": "前のやり方も、手放しやすい荷物になっていきます。"}, {"t": 401.9, "x": "年の順は聞く場面に残します。"}, {"t": 404.1333333333333, "x": "役の順は決める場面に残します。"}, {"t": 406.46666666666664, "x": "残す場所を分ければ、二つの\n順番はぶつかりにくくなります。"}, {"t": 410.6, "x": "三通目は打ち合わせでの出来事です。"}, {"t": 413.06666666666666, "x": "相談の中身はこうです。"}, {"t": 414.8833333333333, "x": "課の打ち合わせで議題を出します。"}, {"t": 416.96666666666664, "x": "すると周りが、先に年上の部下の顔を見ます。"}, {"t": 420.45, "x": "ほかの部署の人まで、まず年上の\n部下に意見を聞きにいきます。"}, {"t": 424.73333333333335, "x": "上司として軽く見られている気がします。"}, {"t": 427.1333333333333, "x": "それで落ち着きません。"}, {"t": 428.6333333333333, "x": "ここまでが三通目の相談です。"}, {"t": 430.8333333333333, "x": "では周りは本当に上司を軽く見ているのでしょうか。"}, {"t": 434.25, "x": "軽く見ているなら、決まったことにも\n従わないはずです。"}, {"t": 437.81666666666666, "x": "ところが決定そのものは、たいてい上司の\n言うとおりに進みます。"}, {"t": 442.06666666666666, "x": "それなら、軽く見られているわけではなさそうです。"}, {"t": 445.43333333333334, "x": "では上司が先に話して、場を\n握り直せばよいのでしょうか。"}, {"t": 449.46666666666664, "x": "そうすると、打ち合わせのたびに\n最初の発言を急ぐことになります。"}, {"t": 454.0, "x": "急いだ発言は中身が薄くなりやすいです。"}, {"t": 456.8666666666667, "x": "そのあとで年上の部下が話します。"}, {"t": 459.28333333333336, "x": "すると、かえって差が目立ちます。"}, {"t": 461.81666666666666, "x": "差を自分から見せる形です。"}, {"t": 463.85, "x": "これも答えにはなりにくいです。"}, {"t": 465.78333333333336, "x": "三つ目の見方は癖です。"}, {"t": 467.55, "x": "周りは年の順の癖で、顔を向けているのかも\nしれません。"}, {"t": 471.5, "x": "長くその職場にいる人に聞けば\n外れにくい、という経験則です。"}, {"t": 476.0, "x": "だから周りは悪気なく、まず長くいる人を見ます。"}, {"t": 479.68333333333334, "x": "経験則で動いているだけです。"}, {"t": 481.78333333333336, "x": "上司を試しているわけではなさそうです。"}, {"t": 484.4, "x": "そう分かれば、取る動きも変わってきます。"}, {"t": 487.3, "x": "変えられるのは打ち合わせの始めかたです。"}, {"t": 489.85, "x": "始めに、今日決めることと決め方を\n上司が先に置きます。"}, {"t": 493.7, "x": "そのうえで、これまでの経緯は\n年上の部下に話してもらいます。"}, {"t": 497.93333333333334, "x": "この役を、上司の側から名指しで\n渡すのがかなめです。"}, {"t": 501.71666666666664, "x": "名指しで渡すと、年上の部下が\n先に話す流れも変わります。"}, {"t": 506.0833333333333, "x": "上司が決めた流れになるのです。"}, {"t": 508.15, "x": "周りの視線は同じ人に向いたままです。"}, {"t": 510.76666666666665, "x": "変わるのは意味だけです。"}, {"t": 512.3, "x": "経験を話す役と決める役が、\n分かれて見えるからです。"}, {"t": 516.2333333333333, "x": "こうなると、年上の部下の側も話しやすくなります。"}, {"t": 519.9833333333333, "x": "理由は部下の側にもあります。"}, {"t": 522.0, "x": "部下は周りから先に顔を向けられます。"}, {"t": 524.5333333333333, "x": "そのことを、居心地悪く感じている場合があります。"}, {"t": 528.0833333333334, "x": "上司を差し置いているように見えるのが嫌なのです。"}, {"t": 531.15, "x": "でも聞かれれば答えないわけにはいきません。"}, {"t": 533.75, "x": "こんな場面が続きます。"}, {"t": 535.4, "x": "本人も、打ち合わせに出るのが重くなっていきます。"}, {"t": 538.9333333333333, "x": "その重さを外せるのは、役を\n渡せる立場にいる上司のほうです。"}, {"t": 543.5333333333333, "x": "上司は視線の向きを取り返そうと考えやすいです。"}, {"t": 546.8666666666667, "x": "部下は視線の向きを背負わされていると\n感じやすいです。"}, {"t": 550.2, "x": "同じ視線を二人は逆の重さで受け取っています。"}, {"t": 553.3833333333333, "x": "そのまま放っておくと、打ち合わせの\nたびに居心地の悪さが続きます。"}, {"t": 558.1166666666667, "x": "受け取り方がそろうのは、役の\n割り振りを口に出した時です。"}, {"t": 562.1, "x": "この割り振りを、ここでは経験の\n役と決定の役と呼んでおきます。"}, {"t": 566.5833333333334, "x": "四通目は二人だけの面談で起きたことです。"}, {"t": 569.4666666666667, "x": "相談の中身はこうです。"}, {"t": 571.2833333333333, "x": "面談室で今期の振り返りをしていました。"}, {"t": 574.0666666666667, "x": "その時、年上の部下が笑いながら言いました。"}, {"t": 577.5166666666667, "x": "年下に評価されるのも、\nなかなか複雑なものですね、という一言です。"}, {"t": 582.6833333333333, "x": "どう返せばよかったのか今も分かりません。"}, {"t": 585.2666666666667, "x": "ここまでが四通目の相談です。"}, {"t": 587.4833333333333, "x": "では、この一言は評価への不満なのでしょうか。"}, {"t": 590.9333333333333, "x": "不満があるなら、評価の中身に\nついて何か言いそうです。"}, {"t": 594.8833333333333, "x": "でも、この部下は中身には何も触れていません。"}, {"t": 598.1833333333333, "x": "不満と決めつけるのは早そうです。"}, {"t": 600.4833333333333, "x": "では聞き流して次の話に進めばよいのでしょうか。"}, {"t": 603.7833333333333, "x": "流された側は、言ったことが\n届かなかったと感じやすいです。"}, {"t": 607.8666666666667, "x": "その気持ちは\n次の面談まで持ち越されることがあります。"}, {"t": 611.2333333333333, "x": "そして次は、もっと言いにくい形で出てきます。"}, {"t": 614.5, "x": "三つ目の見方があります。"}, {"t": 616.2166666666667, "x": "この一言は、自分の位置を確かめる\n問いだというものです。"}, {"t": 620.0666666666667, "x": "役の順は受け入れています。"}, {"t": 621.9166666666666, "x": "そのうえで、経験の重みが残っているかを\n確かめたいのです。"}, {"t": 626.1166666666667, "x": "それを直接聞くのは、年上の側からは\n言い出しにくいです。"}, {"t": 630.3, "x": "だから冗談の形で、年の差の話として出てきます。"}, {"t": 634.0833333333334, "x": "この一言に年の差で返すと、話はそこで止まります。"}, {"t": 637.9, "x": "年は関係ありませんから、という返し方がそうです。"}, {"t": 641.7166666666667, "x": "関係ないと言われた側はどうでしょう。"}, {"t": 644.0666666666667, "x": "気にしている自分のほうが、小さく見えてしまいます。"}, {"t": 647.5833333333334, "x": "効きやすいのは、年の差を消さずに\n受け止めることです。"}, {"t": 651.15, "x": "たとえば、そう感じますよね、と一度受けます。"}, {"t": 654.7166666666667, "x": "それだけで、言った側は届いたことが分かります。"}, {"t": 658.1333333333333, "x": "そのうえで、この一年で助けられた\n場面を具体的に一つ挙げます。"}, {"t": 662.7333333333333, "x": "選ぶのは、経験がなければ乗り切れなかった\n場面です。"}, {"t": 666.4166666666666, "x": "伝わると、評価する役と経験を\n持つ人が同じ部屋に並んでいられます。"}, {"t": 671.3333333333334, "x": "この状態が、相談四の答えに近いものです。"}, {"t": 674.8166666666667, "x": "気をつけたいことが一つあります。"}, {"t": 676.85, "x": "評価の中身を動かして、機嫌を取らないことです。"}, {"t": 680.3, "x": "取ってしまうと役の順のほうが崩れます。"}, {"t": 682.8833333333333, "x": "崩れた順はほかの部下からも見えてしまいます。"}, {"t": 685.7166666666667, "x": "上司は年の差の話をされると、\n立場を試されたと受け取りやすいです。"}, {"t": 690.65, "x": "部下は年の差の話をしたあとで、\n言い過ぎたかと気にしていることがあります。"}, {"t": 695.4166666666666, "x": "二人とも一言のあとで少し身構えています。"}, {"t": 698.2833333333333, "x": "その空気をほどくのは、年の\n差を打ち消す言葉ではなさそうです。"}, {"t": 702.6166666666667, "x": "経験をちゃんと見ていたという事実のほうです。"}, {"t": 705.45, "x": "事実が一つ置かれるだけで十分です。"}, {"t": 708.0166666666667, "x": "面談室の空気は、話を続けられる重さに戻ります。"}, {"t": 712.0333333333333, "x": "その中でなら、年の差の話も隠さずに続けられます。"}, {"t": 715.9166666666666, "x": "この状態を、ここでは年の差の\n置き場と呼んでおきます。"}, {"t": 719.6666666666666, "x": "五通目は新人の教育をめぐる相談です。"}, {"t": 722.7333333333333, "x": "相談の中身はこうです。"}, {"t": 724.55, "x": "春に配属された新人の教育係を\n年上の部下に頼みました。"}, {"t": 728.8, "x": "しばらくして、新人から打ち明けられました。"}, {"t": 731.8833333333333, "x": "教え方が少し古い気がする、という話です。"}, {"t": 735.45, "x": "年上の部下にどう伝えればいいのか分かりません。"}, {"t": 738.4666666666667, "x": "間に立って困っています。"}, {"t": 740.2333333333333, "x": "ここまでが五通目の相談です。"}, {"t": 742.3833333333333, "x": "この相談には年の差が二つ重なっています。"}, {"t": 745.3166666666667, "x": "一つは上司と年上の部下の差です。"}, {"t": 747.8333333333334, "x": "もう一つは年上の部下と新人の差です。"}, {"t": 750.6833333333333, "x": "上司はちょうど、二つの年の\n差の真ん中に立っています。"}, {"t": 754.45, "x": "では新人の言葉をそのまま伝えればよいのでしょうか。"}, {"t": 757.8, "x": "そのまま伝えると、古いという\n言葉だけが強く残りやすいです。"}, {"t": 762.0833333333334, "x": "教え方の話が、年齢の話にすり替わって届くのです。"}, {"t": 766.2166666666667, "x": "届いた側は、若い人たちが自分を\n古い側に置いたと受け取りかねません。"}, {"t": 771.1166666666667, "x": "では何も伝えず、上司が新人を\nなだめればよいのでしょうか。"}, {"t": 775.3166666666667, "x": "なだめるだけでは、新人の違和感は残ります。"}, {"t": 778.6666666666666, "x": "残った違和感は教育係との距離になります。"}, {"t": 781.8, "x": "その距離は少しずつ広がります。"}, {"t": 784.0166666666667, "x": "しかも、教育係の側だけがそれに気づきません。"}, {"t": 787.6333333333333, "x": "三つ目の見方はこうです。"}, {"t": 789.4333333333333, "x": "古いという言葉を、年の差の\n言葉から外して受け止めます。"}, {"t": 793.4833333333333, "x": "新人が古いと言う時、たいてい年齢は\n指していません。"}, {"t": 797.4833333333333, "x": "指しているのは、知っているやり方と\n違うという驚きです。"}, {"t": 801.3166666666667, "x": "その驚きは、年の差の言葉で言うと一番短く済みます。"}, {"t": 805.5833333333334, "x": "短く済む言葉ほど受け取る側には重く響きます。"}, {"t": 808.8833333333333, "x": "響き方を変えるには、まず上司が\n新人に聞き直します。"}, {"t": 812.9, "x": "どの場面で何と違うと感じたのか、という\n中身を聞きます。"}, {"t": 817.0833333333334, "x": "中身が出てくると、古いという一語は\n具体的な違いの話に変わります。"}, {"t": 821.9166666666666, "x": "具体的な話なら、年上の部下にも\n年齢を抜きにして渡せます。"}, {"t": 826.5833333333334, "x": "渡す時は、新人がこういう所で\n迷っているようです、と伝えます。"}, {"t": 831.8833333333333, "x": "これなら、教育係の経験を疑う\n話には聞こえにくくなります。"}, {"t": 836.55, "x": "どう受け止めるかは教育係に預けます。"}, {"t": 839.2666666666667, "x": "任せた役を任せたままにしておくためです。"}, {"t": 842.0333333333333, "x": "年上の部下の側にも、年の差の\n受け止め方があります。"}, {"t": 845.9333333333333, "x": "部下は、年下の上司とさらに若い新人に\n挟まれています。"}, {"t": 850.2, "x": "挟まれた位置にいます。"}, {"t": 851.75, "x": "古いという言葉が、二つの方向から来るように\n感じやすいのです。"}, {"t": 856.2666666666667, "x": "そういう人ほど、年齢で言われることに慣れています。"}, {"t": 859.8333333333334, "x": "でも慣れているのは、平気だという\n意味ではないのかもしれません。"}, {"t": 863.7333333333333, "x": "上司は新人と年上の部下のどちらの\n味方につくかで迷いやすいです。"}, {"t": 868.1666666666666, "x": "迷わずに済む方法があります。"}, {"t": 870.2666666666667, "x": "どちらの年齢にも寄らず、中身だけを\n運ぶ役に回ることです。"}, {"t": 874.65, "x": "そうすれば、間に立つ苦しさは少しだけ軽くなります。"}, {"t": 878.4833333333333, "x": "運ぶ役は、どちらの言葉も相手に\n届く形に置き直します。"}, {"t": 882.7333333333333, "x": "この役を、ここでは年の差の通訳と呼んでおきます。"}, {"t": 886.4166666666666, "x": "最後に、反対の立場から届いた一通を読みます。"}, {"t": 890.1333333333333, "x": "年下の上司のもとで働く年上の部下からです。"}, {"t": 893.4, "x": "上司は十歳以上若い人です。"}, {"t": 895.8, "x": "いつも丁寧に話してくれます。"}, {"t": 897.8333333333334, "x": "ただ丁寧すぎて、本当に頼まれているのか\n分からなくなります。"}, {"t": 901.9833333333333, "x": "打ち合わせでは、周りが先にこちらを見ます。"}, {"t": 905.1333333333333, "x": "それで居心地がよくありません。"}, {"t": 907.15, "x": "口を出せばでしゃばりに見えます。"}, {"t": 909.15, "x": "黙っていれば協力しない人に見えます。"}, {"t": 911.7, "x": "経験は使ってほしいです。"}, {"t": 913.6333333333333, "x": "でも上司の邪魔はしたくありません。"}, {"t": 915.8, "x": "どこまで意見を言っていいのか、\nその線が分からずにいます。"}, {"t": 919.6, "x": "ここまでが逆側から届いた一通です。"}, {"t": 922.2666666666667, "x": "この一通には今日は答えを出しません。"}, {"t": 924.8, "x": "今日の五つの相談の隣に、並べて置いておきます。"}, {"t": 928.55, "x": "並べると見えてきます。"}, {"t": 930.0333333333333, "x": "二つの側が同じ線を探しているのです。"}, {"t": 932.8, "x": "上司の側はどこまで強く言っていいかの\n線を探していました。"}, {"t": 936.55, "x": "部下の側はどこまで意見を言っていいかの\n線を探しています。"}, {"t": 940.2, "x": "二通が探しているのは、同じ一本の\n線のこちら側とあちら側です。"}, {"t": 944.9833333333333, "x": "その線は、年の順と役の順が重なる境目にあります。"}, {"t": 949.2, "x": "境目の場所は職場ごと、二人ごとに\n少しずつ違います。"}, {"t": 953.25, "x": "違うからこそ、片方だけで引ける\n線ではないのかもしれません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>

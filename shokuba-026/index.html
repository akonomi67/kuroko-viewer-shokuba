<script>
const D={"name": "職場の人間関係に疲れていないか数える10のチェック", "file": "026_職場の人間関係に疲れていないか数える10のチェック", "dur": 1068.0, "segs": [], "subs": [{"t": 0.0, "x": "これから十の項目を順に読みます。"}, {"t": 2.4, "x": "当てはまるものはいくつあるでしょうか。"}, {"t": 4.583333333333333, "x": "指で数えながら見てください。"}, {"t": 6.5, "x": "数えるのは、ここ一か月ほどの自分です。"}, {"t": 9.6, "x": "一か月で区切るのは、たまたま忙しかった\n一日を外すためです。"}, {"t": 14.116666666666667, "x": "外した上で残るものを見ていきます。"}, {"t": 16.483333333333334, "x": "それがふだんの気の回し方に近いと言われます。"}, {"t": 19.466666666666665, "x": "項目は、上司の立場でも部下の\n立場でも起こるものを選んであります。"}, {"t": 24.05, "x": "選んだ十個に、大きな出来事は\n一つも入っていません。"}, {"t": 27.916666666666668, "x": "入っているのは、朝礼の前や\nチャットの送信前のような小さな場面です。"}, {"t": 32.983333333333334, "x": "小さな場面ほど、一日に何度も繰り返されます。"}, {"t": 36.65, "x": "繰り返される気の回し方は、\n本人には疲れとして感じにくいものです。"}, {"t": 41.4, "x": "感じにくいまま積み重なると、\n理由の分からない疲れになりやすいです。"}, {"t": 46.15, "x": "疲れの元は、人間関係そのものだとは限りません。"}, {"t": 49.88333333333333, "x": "関係の中で気をどこまで回しているか。"}, {"t": 52.45, "x": "そこが効いていることもあります。"}, {"t": 54.4, "x": "今日は、その回し方を十の場面で数えていきます。"}, {"t": 58.15, "x": "数えた結果で、良い悪いを決めることはしません。"}, {"t": 61.56666666666667, "x": "そのかわり、最後に数ごとの\n受け取り方をお伝えします。"}, {"t": 65.58333333333333, "x": "受け取り方は三つの段に分けてあります。"}, {"t": 68.13333333333334, "x": "ゼロから三つと四つから六つ、そして七つ以上です。"}, {"t": 72.05, "x": "では、指を全部開いた状態から始めます。"}, {"t": 75.5, "x": "一つ目の項目です。"}, {"t": 77.08333333333333, "x": "隣の人の機嫌ひとつで、自分の手が止まる。"}, {"t": 80.33333333333333, "x": "たとえば、隣の席の上司がため息をついたとします。"}, {"t": 84.18333333333334, "x": "ため息のあと、キーボードを\n打つ音が少し強くなります。"}, {"t": 87.93333333333334, "x": "強くなった音が耳に入ります。"}, {"t": 90.13333333333334, "x": "作っていた資料の手がそこで止まります。"}, {"t": 92.63333333333334, "x": "手を止めたまま思い返し始めます。"}, {"t": 94.9, "x": "自分が何かしたのだろうかと考えます。"}, {"t": 97.46666666666667, "x": "思い返しても、心当たりは見つかりません。"}, {"t": 100.55, "x": "見つからないのに、そこから\n三十分は集中が戻りにくくなります。"}, {"t": 105.03333333333333, "x": "当てはまったら、指を一本折ってください。"}, {"t": 107.95, "x": "この項目は疲れにつながりやすいです。"}, {"t": 110.55, "x": "相手の機嫌を自分の持ち物にしているからです。"}, {"t": 113.55, "x": "持ち物にした機嫌は、自分の\n手では片づけられません。"}, {"t": 117.26666666666667, "x": "片づけられない物を抱えたまま、仕事を続けます。"}, {"t": 120.86666666666666, "x": "続けるうちに耳が向く先が変わります。"}, {"t": 123.38333333333334, "x": "自分の作業より、隣の音に向くようになります。"}, {"t": 126.9, "x": "向いた耳は、一日の終わりまで休めません。"}, {"t": 130.13333333333333, "x": "では、疲れにくい人はこの場面を\nどう受け取っているのでしょうか。"}, {"t": 134.3, "x": "疲れにくい人も、ため息には\nちゃんと気づいています。"}, {"t": 137.86666666666667, "x": "気づいた上で受け取り方が違います。"}, {"t": 140.21666666666667, "x": "それは相手の手元の天気だと受け取るのです。"}, {"t": 143.01666666666668, "x": "天気なら、自分が晴らす必要はありません。"}, {"t": 146.2, "x": "必要があるのは、自分に何か頼まれた時だけです。"}, {"t": 149.83333333333334, "x": "だけと決めておくと止まった手もすぐに動き出します。"}, {"t": 152.86666666666667, "x": "これは、部下の側にも上司の側にも起こります。"}, {"t": 156.21666666666667, "x": "部下の機嫌が気になる上司もいます。"}, {"t": 158.55, "x": "気になって、指示を出す手が止まるのです。"}, {"t": 161.28333333333333, "x": "こうした状態を、ここでは機嫌の\n肩代わりと呼んでおきます。"}, {"t": 165.28333333333333, "x": "肩代わりをやめても、相手との\n仲が冷えるわけではありません。"}, {"t": 169.31666666666666, "x": "二つ目です。"}, {"t": 170.35, "x": "断った場面を、帰り道までくり返し思い出す。"}, {"t": 174.03333333333333, "x": "夕方のことです。"}, {"t": 175.35, "x": "部下が上司から急ぎの頼みごとを受けます。"}, {"t": 178.01666666666668, "x": "受けた時点で、手元にはすでに三つの\n仕事があります。"}, {"t": 181.7, "x": "なので、今日は難しいですと伝えて断りました。"}, {"t": 185.18333333333334, "x": "上司はあっさり分かったと言います。"}, {"t": 187.41666666666666, "x": "そして別の人に頼みに行きます。"}, {"t": 189.56666666666666, "x": "あっさりした返事でした。"}, {"t": 191.23333333333332, "x": "相手は気にしていないようです。"}, {"t": 193.15, "x": "それでも、部下の頭の中では\nその場面が止まりません。"}, {"t": 196.93333333333334, "x": "止まらない場面は、駅までの\n道で何度も再生されます。"}, {"t": 200.96666666666667, "x": "当てはまる人は、二本目の指を折ってください。"}, {"t": 204.08333333333334, "x": "これが疲れにつながりやすいのには理由があります。"}, {"t": 207.13333333333333, "x": "終わった場面を何度も裁き直すからです。"}, {"t": 209.78333333333333, "x": "裁き直すたびに、断った自分を\n責める材料が少しずつ増えます。"}, {"t": 214.36666666666667, "x": "増えた材料は次に頼まれた時に働きます。"}, {"t": 217.4, "x": "断れなくなる方へ働くのです。"}, {"t": 219.65, "x": "その結果、手元の仕事が増えます。"}, {"t": 222.51666666666668, "x": "そしてまた疲れる流れになりやすいです。"}, {"t": 225.05, "x": "疲れにくい人は、断った場面を\nその場で閉じています。"}, {"t": 228.88333333333333, "x": "閉じる時に使うのは、今日の\n手元の量という事実です。"}, {"t": 232.58333333333334, "x": "事実で断ったのなら、それで十分です。"}, {"t": 235.76666666666668, "x": "相手の気持ちまで整える必要はありません。"}, {"t": 238.56666666666666, "x": "上司の側にも、同じ形の居残りがあります。"}, {"t": 241.86666666666667, "x": "部下の休日出勤の申し出を断った上司の場合です。"}, {"t": 245.55, "x": "断ったことを夜まで気にしています。"}, {"t": 247.81666666666666, "x": "どちらの側でも同じです。"}, {"t": 249.56666666666666, "x": "断った理由が仕事の量なら、話はそこで終わりです。"}, {"t": 253.51666666666668, "x": "この場面を、ここでは帰り道の\n再放送と呼んでおきます。"}, {"t": 257.6333333333333, "x": "再放送は、何度流しても中身が変わりません。"}, {"t": 261.18333333333334, "x": "変わらないものに使った時間の分だけ、\n夜の休みが短くなります。"}, {"t": 266.0, "x": "三つ目です。"}, {"t": 267.0, "x": "昼休みを一人で過ごすと、悪く思われる気がする。"}, {"t": 270.8, "x": "昼になると、部署の何人かが\n連れ立って外へ出ていきます。"}, {"t": 274.71666666666664, "x": "出ていく背中を見ながら一人で弁当を開きます。"}, {"t": 277.93333333333334, "x": "それがどうにも落ち着きません。"}, {"t": 279.85, "x": "落ち着かないので、本当は休みたい日も\n輪に加わります。"}, {"t": 283.65, "x": "加わった輪では話に合わせて笑います。"}, {"t": 286.3, "x": "笑うことにも力を使います。"}, {"t": 288.3666666666667, "x": "使った力は、午後の仕事のぶんから差し引かれます。"}, {"t": 291.96666666666664, "x": "当てはまったら、三本目の指を折ってください。"}, {"t": 295.1, "x": "この項目も疲れにつながりやすいです。"}, {"t": 297.7, "x": "休み時間が仕事の続きになるからです。"}, {"t": 300.3666666666667, "x": "続きになった休みでは、頭も気持ちも休まりません。"}, {"t": 304.1166666666667, "x": "休まらないまま午後に入ります。"}, {"t": 306.25, "x": "すると夕方の疲れが早く来やすいです。"}, {"t": 309.01666666666665, "x": "疲れにくい人は、昼休みを自分の\n充電の時間と受け取っています。"}, {"t": 313.75, "x": "充電の仕方は人によって違います。"}, {"t": 316.21666666666664, "x": "輪に入る日も一人の日もあります。"}, {"t": 318.3666666666667, "x": "どちらの日もあるのが当たり前です。"}, {"t": 320.51666666666665, "x": "だから一人の日に言い訳を用意しません。"}, {"t": 323.15, "x": "言い訳がなければ、周りも特に気にしないことが\n多いと言われます。"}, {"t": 327.43333333333334, "x": "上司の側では、逆の形で同じことが起こります。"}, {"t": 331.18333333333334, "x": "部下の輪に毎日顔を出さないと不安になる場合です。"}, {"t": 334.48333333333335, "x": "距離ができると考えてしまうのです。"}, {"t": 336.76666666666665, "x": "顔を出すほど、部下の方が気を使います。"}, {"t": 339.78333333333336, "x": "気を使った部下は休めなくなります。"}, {"t": 342.06666666666666, "x": "上司も部下も、昼の一時間を\n互いに差し出している状態です。"}, {"t": 346.3666666666667, "x": "この状態を、ここでは昼休みの\n見張りと呼んでおきます。"}, {"t": 350.26666666666665, "x": "見張りを解くと、昼の一時間は本来の長さに戻ります。"}, {"t": 354.31666666666666, "x": "四つ目です。"}, {"t": 355.4, "x": "チャットの文末を、送る前に何度も書き直す。"}, {"t": 358.6666666666667, "x": "上司に、資料の確認をお願いする一文を打ちます。"}, {"t": 362.51666666666665, "x": "打った一文の最後を、お願いしますで\n終えるか迷います。"}, {"t": 366.46666666666664, "x": "迷った末に、お手すきの際にと前に足します。"}, {"t": 369.71666666666664, "x": "足すと今度は、急ぎに見えないかが気になります。"}, {"t": 372.96666666666664, "x": "気になって消し、また打ち直します。"}, {"t": 375.56666666666666, "x": "気づけば五分が過ぎています。"}, {"t": 377.48333333333335, "x": "当てはまったら、四本目の指を折ってください。"}, {"t": 380.6666666666667, "x": "ここで見るのは、相手がどう返したかではありません。"}, {"t": 384.15, "x": "送る前の自分が何回てを入れたかという回数です。"}, {"t": 387.55, "x": "回数が多いと疲れやすくなります。"}, {"t": 389.8833333333333, "x": "一通ごとに小さな試験を受けているからです。"}, {"t": 392.76666666666665, "x": "試験は、一日に何十通ぶんも繰り返されます。"}, {"t": 396.55, "x": "繰り返すたびに力が吸われていきます。"}, {"t": 399.05, "x": "中身を考える力が、文末に吸われるのです。"}, {"t": 402.53333333333336, "x": "疲れにくい人は、文末を自分の型として\n先に決めています。"}, {"t": 406.73333333333335, "x": "決めた型があれば、毎回悩む場所が一か所減ります。"}, {"t": 410.53333333333336, "x": "減った分は、伝える中身の正確さに回せます。"}, {"t": 414.1166666666667, "x": "上司の側も、部下への一文を\n何度も書き直していることがあります。"}, {"t": 418.6, "x": "きつく見えないかが気になる場合です。"}, {"t": 420.81666666666666, "x": "絵文字を足したり消したりします。"}, {"t": 422.76666666666665, "x": "書き直すほど届く文は長くなります。"}, {"t": 425.21666666666664, "x": "要点も奥に埋もれがちです。"}, {"t": 427.26666666666665, "x": "埋もれた要点は、受け取る側の\n読む手間を増やします。"}, {"t": 431.0833333333333, "x": "増えた手間の分だけ、返事も遅くなりやすいです。"}, {"t": 434.5833333333333, "x": "この流れを、ここでは文末の\n推敲疲れと呼んでおきます。"}, {"t": 438.68333333333334, "x": "推敲する力は文の頭の方に使いましょう。"}, {"t": 441.9166666666667, "x": "その方が相手にも届きやすいです。"}, {"t": 444.21666666666664, "x": "五つ目です。"}, {"t": 445.23333333333335, "x": "頼まれていない用事まで、先回りして片づける。"}, {"t": 448.5833333333333, "x": "会議の前のことです。"}, {"t": 450.1166666666667, "x": "部下が誰にも頼まれずに会議室の机を並べ直します。"}, {"t": 453.8333333333333, "x": "並べ直したついでに、人数分の\n資料も印刷しておきます。"}, {"t": 458.15, "x": "しておいたことには誰も触れません。"}, {"t": 460.3, "x": "そのまま会議が始まります。"}, {"t": 462.18333333333334, "x": "始まってから、自分の発表の\n準備がまだだったと気づきます。"}, {"t": 466.25, "x": "当てはまったら、五本目の指を折ってください。"}, {"t": 469.31666666666666, "x": "先回りは疲れにつながりやすいです。"}, {"t": 471.85, "x": "見返りを待つ気持ちが残りやすいからです。"}, {"t": 474.55, "x": "待つ気持ちは、気づかれない\nたびに少しずつ削られます。"}, {"t": 478.1, "x": "削られた分を、次の先回りで\nまたうめようとしがちです。"}, {"t": 482.0, "x": "埋めるための先回りが増えるほど、\n自分の持ち時間が減っていきます。"}, {"t": 486.5, "x": "減った持ち時間は、\n残業で取り返すことになりがちです。"}, {"t": 490.51666666666665, "x": "疲れにくい人も、先回りはします。"}, {"t": 493.28333333333336, "x": "するのは、自分の仕事が回る範囲までと\n決めています。"}, {"t": 497.06666666666666, "x": "範囲の外の用事は、頼まれてから\n引き受ければ十分だと考えます。"}, {"t": 501.68333333333334, "x": "考え方の差はここです。"}, {"t": 503.48333333333335, "x": "仕事が回る距離で止めるか、\n気持ちの面倒まで抱えるかです。"}, {"t": 507.78333333333336, "x": "上司の側では、部下の仕事を\n黙って直しておく形で現れます。"}, {"t": 512.4, "x": "直した方が早いと思う場合です。"}, {"t": 514.7833333333333, "x": "夜に一人で手を入れます。"}, {"t": 516.4833333333333, "x": "入れた手は部下には見えにくいものです。"}, {"t": 518.8, "x": "感謝の言葉も届きにくくなります。"}, {"t": 521.0, "x": "これを、ここでは先回りの貯金と呼んでおきます。"}, {"t": 524.45, "x": "貯金は、引き出されないまま増えるほど重くなります。"}, {"t": 527.9333333333333, "x": "重くなった貯金箱を、一人で\n持ち歩いている状態に近いと言えます。"}, {"t": 532.6, "x": "六つ目です。"}, {"t": 533.6, "x": "朝礼の前に、今日だれと話すかを組み立てている。"}, {"t": 536.9666666666667, "x": "始業前の通勤電車でのことです。"}, {"t": 539.5333333333333, "x": "今日の段取りを頭の中で並べます。"}, {"t": 541.95, "x": "並べているのは仕事の順番ではありません。"}, {"t": 544.6833333333333, "x": "話しかける相手の順番です。"}, {"t": 546.7666666666667, "x": "朝礼のあと最初に課長へ声をかけます。"}, {"t": 549.5, "x": "昼前には先輩へ報告を入れます。"}, {"t": 552.0833333333334, "x": "入れる時の言い方も決めておきます。"}, {"t": 554.3166666666667, "x": "電車の中で、何通りか試しておくのです。"}, {"t": 557.5, "x": "当てはまったら、六本目の指を折ってください。"}, {"t": 560.6, "x": "これも疲れにつながりやすい項目です。"}, {"t": 563.1166666666667, "x": "一日が始まる前に一日ぶんの\n会話を済ませているからです。"}, {"t": 567.0666666666667, "x": "済ませた会話は、実際の場面で\nもう一度やり直すことになります。"}, {"t": 571.5166666666667, "x": "やり直しになると同じ会話に\n二回ぶんの力を使います。"}, {"t": 575.2333333333333, "x": "しかも本番は予定どおりに進まないことが多いです。"}, {"t": 578.65, "x": "組み立て直しも加わります。"}, {"t": 580.4666666666667, "x": "疲れにくい人は、朝の段取りを\n仕事の中身だけで組んでいます。"}, {"t": 584.7666666666667, "x": "組んだ中身に必要な相手が結果として\n決まるという順番です。"}, {"t": 588.7, "x": "順番が逆になるだけで、人の\n顔色を先読みする時間がなくなります。"}, {"t": 593.4833333333333, "x": "上司の側でも、朝礼で話す言葉に\n前の晩から悩むことがあります。"}, {"t": 598.3333333333334, "x": "悩むのは、部下全員の受け取り方を\n一度に想像しようとするからです。"}, {"t": 603.1166666666667, "x": "想像する相手が増えるほど、\n話す中身は薄くなりがちです。"}, {"t": 607.2833333333333, "x": "角の取れた話ばかりになるのです。"}, {"t": 609.5, "x": "これを、ここでは朝の会話の下書きと呼んでおきます。"}, {"t": 613.1, "x": "下書きは、要点の一行があれば\n足りることが多いです。"}, {"t": 617.1166666666667, "x": "足りる分だけ用意しておきましょう。"}, {"t": 619.2333333333333, "x": "それで朝の電車は本来の休み時間に戻ります。"}, {"t": 622.5666666666667, "x": "七つ目です。"}, {"t": 623.6166666666667, "x": "休みの連絡を入れた後、返事が来るまで\n落ち着かない。"}, {"t": 627.45, "x": "来週の有給休暇の申請を金曜の\n夕方に上司へ送ります。"}, {"t": 631.95, "x": "送ったあとは申請画面を何度も開きます。"}, {"t": 634.9333333333333, "x": "開いて状態を確かめます。"}, {"t": 636.8666666666667, "x": "確かめてもまだ承認の印はついていません。"}, {"t": 639.8333333333334, "x": "ついていないまま夜になります。"}, {"t": 641.75, "x": "休む理由を足して送り直そうかと考えます。"}, {"t": 644.8, "x": "当てはまったら、七本目の指を折ってください。"}, {"t": 647.9666666666667, "x": "ここで数えるのは、返事の中身を\nどう読んだかではありません。"}, {"t": 651.8833333333333, "x": "返事が来るまでの時間を自分がどう過ごしたかです。"}, {"t": 655.0833333333334, "x": "なぜ疲れにつながりやすいのでしょうか。"}, {"t": 657.5333333333333, "x": "休みを取る前から休みの分を\n返し始めているからです。"}, {"t": 661.2666666666667, "x": "返し始めた気持ちは、休みの\n当日にも残りやすいです。"}, {"t": 665.4166666666666, "x": "残ったまま休むとどうなるでしょう。"}, {"t": 667.6, "x": "体は家にいても、頭は職場に置いたままです。"}, {"t": 671.0833333333334, "x": "疲れにくい人は、休みの連絡を\n手続きの一つとして受け取っています。"}, {"t": 675.8166666666667, "x": "手続きなら、\n出した時点で自分の分は終わっています。"}, {"t": 679.5333333333333, "x": "終わった後の承認は、相手の\n手元の順番で進むものだと考えます。"}, {"t": 684.3666666666667, "x": "上司の側では、自分が休む時に\n同じことが起きやすいです。"}, {"t": 688.7666666666667, "x": "部下に迷惑をかけると考える場合です。"}, {"t": 691.5, "x": "休みの間もチャットを開いてしまいます。"}, {"t": 694.1, "x": "開いている上司を見ると部下も休みにくくなります。"}, {"t": 697.2, "x": "その流れが続いていきます。"}, {"t": 699.1166666666667, "x": "この流れを、ここでは休みの前払いと呼んでおきます。"}, {"t": 702.8833333333333, "x": "前払いした分は、どこからも戻ってきません。"}, {"t": 706.0666666666667, "x": "戻らない分を減らすには、出した時点で\n手を離すことです。"}, {"t": 710.0166666666667, "x": "八つ目です。"}, {"t": 710.9666666666667, "x": "褒められた日より、注意された日を長く覚えている。"}, {"t": 714.5, "x": "月曜に上司から企画書の出来を褒められました。"}, {"t": 717.5333333333333, "x": "水曜には同じ上司から誤字を一か所指摘されました。"}, {"t": 721.0166666666667, "x": "金曜の夜に思い出すのは、水曜の一言の方です。"}, {"t": 724.85, "x": "月曜の言葉はもう細かい言い回しまで\n思い出せません。"}, {"t": 728.45, "x": "当てはまったら、八本目の指を折ってください。"}, {"t": 731.5666666666667, "x": "嫌な出来事の方が記憶に残りやすい。"}, {"t": 734.1833333333333, "x": "これは多くの人に見られる傾向だと言われます。"}, {"t": 737.1, "x": "言われる傾向なので、当てはまること自体は\nめずらしくありません。"}, {"t": 741.3166666666667, "x": "ただ、注意の記憶ばかりが積み上がると困ります。"}, {"t": 744.7833333333333, "x": "職場全体が厳しい場所に見えてくるのです。"}, {"t": 747.6833333333333, "x": "そう見えてきた職場では次の一言を\n受ける前から身構えるようになります。"}, {"t": 752.1333333333333, "x": "身構える時間が長いほど、疲れはたまりやすいです。"}, {"t": 755.7666666666667, "x": "疲れにくい人の受け取り方は違います。"}, {"t": 758.35, "x": "注意を出来事ではなく作業の\n情報として受け取っています。"}, {"t": 762.0833333333334, "x": "情報なら、直した時点で役目を終えます。"}, {"t": 765.2666666666667, "x": "終えた情報を週末まで持ち歩く理由はありません。"}, {"t": 768.65, "x": "かわりに、褒められた日のことは\n少しだけ意識して覚えておきます。"}, {"t": 772.9333333333333, "x": "覚えておく量をそろえてみます。"}, {"t": 775.0, "x": "それだけで職場の見え方は少し平らになります。"}, {"t": 778.0666666666667, "x": "上司の側にも、部下から言われた一言を\n長く覚えている人がいます。"}, {"t": 782.6833333333333, "x": "会議で部下に反対された日の場合です。"}, {"t": 785.25, "x": "その日のことを、何か月も思い返します。"}, {"t": 788.3833333333333, "x": "これを、ここでは注意の居残りと呼んでおきます。"}, {"t": 791.6833333333333, "x": "居残った一言は、帰る時間を過ぎても\n机から離れません。"}, {"t": 795.9666666666667, "x": "九つ目です。"}, {"t": 797.1166666666667, "x": "全員と同じくらい親しくしようとしている。"}, {"t": 799.7166666666667, "x": "部署に十二人いれば、十二人と\n同じ温度で話そうとします。"}, {"t": 804.0666666666667, "x": "話す回数や時間に差が出ないようにします。"}, {"t": 806.95, "x": "頭の中で配分をつけているのです。"}, {"t": 809.45, "x": "つけた配分が崩れると落ち着きません。"}, {"t": 811.9333333333333, "x": "誰かを放っておいた気がするからです。"}, {"t": 814.3166666666667, "x": "当てはまったら、九本目の指を折ってください。"}, {"t": 817.5333333333333, "x": "これは今日の十個の中でいちばん元になりやすい\n項目です。"}, {"t": 821.2666666666667, "x": "元になりやすいのは、気を回す先が\n人数の分だけ増え続 の持ち帰りと呼んでおきます。"}, {"t": 958.9333333333333, "x": "持ち帰った言葉の多くは、言った本人が\nもう覚えていないものです。"}, {"t": 963.4333333333333, "x": "覚えていない言葉のために、\n眠る時間を削っている状態です。"}, {"t": 967.7166666666667, "x": "では、折った指の数を見てください。"}, {"t": 970.5, "x": "見るのは数だけです。"}, {"t": 971.9333333333333, "x": "どの項目だったかは後で構いません。"}, {"t": 974.4, "x": "数え間違えても、一つ二つの\n差は気にしなくて大丈夫です。"}, {"t": 978.5666666666667, "x": "数ごとの受け取り方を三つの\n段に分けてお伝えします。"}, {"t": 982.0166666666667, "x": "まずゼロから三つの人です。"}, {"t": 983.9, "x": "気の回し方がおおむね仕事の\n範囲に収まっているようです。"}, {"t": 987.6, "x": "収まっている人も、当てはまった項目だけは\n覚えておくと役に立ちます。"}, {"t": 992.3333333333334, "x": "次に四つから六つの人です。"}, {"t": 994.4333333333333, "x": "仕事の外まで気を回す場面が\nいくつか重なっている状態です。"}, {"t": 998.6, "x": "重なりの中から一つ減らします。"}, {"t": 1000.8, "x": "それだけでも、夕方の疲れ方は変わりやすいです。"}, {"t": 1004.4666666666667, "x": "七つ以上の人は気を回す先が多い状態です。"}, {"t": 1007.8, "x": "休む時間まで使われている可能性があります。"}, {"t": 1010.7833333333333, "x": "ただし可能性の話です。"}, {"t": 1012.6, "x": "この数だけで何かが決まるわけではありません。"}, {"t": 1015.35, "x": "それでも見方を一つ持つことはできます。"}, {"t": 1017.9166666666666, "x": "疲れの元は人ではなく回し方にあるかも\nしれない、という見方です。"}, {"t": 1022.4833333333333, "x": "今日の十個は、上司と部下の\nどちらの席でも起こるものでした。"}, {"t": 1026.5, "x": "ですから、数が多かった人が\n弱いということではありません。"}, {"t": 1030.4166666666667, "x": "気が回る人ほど、数は多くなりやすいと言われます。"}, {"t": 1034.0333333333333, "x": "回る力そのものは職場で頼りにされる力でもあります。"}, {"t": 1037.7666666666667, "x": "大事なのは、その力を仕事が\n回る距離で止めておけるかどうかです。"}, {"t": 1042.3, "x": "止められずにつらさが続く時もあるでしょう。"}, {"t": 1044.9, "x": "その時は、専門の窓口に相談する方法もあります。"}, {"t": 1049.0166666666667, "x": "数はまた一か月ほどたってから\n数え直すことができます。"}, {"t": 1052.5666666666666, "x": "数え直した時に折れた指が一本でも\n減っていたとします。"}, {"t": 1056.2, "x": "それが回し方の変わった目印になります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
